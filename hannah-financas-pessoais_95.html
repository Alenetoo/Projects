const INCOME_KINDS=[['salario','Salário'],['servicos','Serviços'],['rendimentos','Rendimentos'],['reembolso','Reembolso'],['outras','Outras receitas']];
function IncomeForm({income,onClose}){
  const db=useDB();
  const curMk=monthKey(todayISO());
  const [f,setF]=useState(income
    ? {desc:income.desc||'',kind:income.kind||'salario',amount:income.amount,date:income.date||todayISO(),recurring:income.recurring!==false,startMk:income.startMk||monthKey(income.date)||curMk,endMk:income.endMk||'',skip:income.skip||[]}
    : {desc:'',kind:'salario',amount:'',date:todayISO(),recurring:true,startMk:curMk,endMk:'',skip:[]});
  const set=p=>setF(x=>({...x,...p}));
  function save(){
    const val=parseMoney(f.amount)||0;
    if(!val) return db.toast('Informe o valor.','warn');
    if(f.recurring && f.endMk && f.endMk<f.startMk) return db.toast('O mês final não pode ser antes do inicial.','warn');
    const data={desc:f.desc.trim()||INCOME_KINDS.find(k=>k[0]===f.kind)[1],kind:f.kind,amount:val,date:f.date,recurring:f.recurring};
    if(f.recurring){ data.startMk=f.startMk||monthKey(f.date)||curMk; data.endMk=f.endMk||null; data.skip=f.skip||[]; }
    else { data.startMk=null; data.endMk=null; data.skip=[]; }
    if(income&&income.id){ db.updateIncome(income.id,data); db.toast('Receita atualizada.'); }
    else { db.addIncome(data); db.toast('Receita cadastrada.'); }
    onClose();
  }
  const mkPair=(mk,onMk)=><div className="row" style={{gap:6}}>
    <select className="input" style={{width:'auto'}} value={mk.slice(5,7)} onChange={e=>onMk(`${mk.slice(0,4)}-${e.target.value}`)}>
      {MESES_PT.map((nm,i)=>{const mm=String(i+1).padStart(2,'0');return <option key={mm} value={mm}>{nm}</option>;})}</select>
    <select className="input" style={{width:'auto'}} value={mk.slice(0,4)} onChange={e=>onMk(`${e.target.value}-${mk.slice(5,7)}`)}>
      {yearOptions().map(y=><option key={y} value={y}>{y}</option>)}</select>
  </div>;
  return <Modal title={income?'Editar receita':'Cadastrar receita'} onClose={onClose} foot={<React.Fragment>
      <button className="btn" onClick={onClose}>Cancelar</button>
      <button className="btn primary" onClick={save}>Salvar</button></React.Fragment>}>
    <div className="grid" style={{gridTemplateColumns:'1fr 1fr',gap:14}}>
      <div><label className="lbl">Tipo</label><select className="input" value={f.kind} onChange={e=>set({kind:e.target.value})}>
        {INCOME_KINDS.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></div>
      <div><label className="lbl">Valor</label><MoneyInput value={f.amount} onChange={v=>set({amount:v})}/></div>
      <div style={{gridColumn:'1/3'}}><label className="lbl">Descrição (opcional)</label><input className="input" value={f.desc} onChange={e=>set({desc:e.target.value})}/></div>
      <div><label className="lbl">Data{f.recurring?' do registro':''}</label><input type="date" className="input" value={f.date} onChange={e=>set({date:e.target.value})}/></div>
      <div style={{display:'flex',alignItems:'flex-end'}}><label style={{display:'flex',gap:7,alignItems:'center'}}>
        <input type="checkbox" checked={f.recurring} onChange={e=>set({recurring:e.target.checked})}/> Receita recorrente (mensal)</label></div>
      {f.recurring && <div style={{gridColumn:'1/3',display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,paddingTop:10,borderTop:'1px solid var(--line)'}}>
        <div><label className="lbl">A partir de</label>{mkPair(f.startMk,v=>set({startMk:v}))}</div>
        <div>
          <label className="lbl" style={{display:'flex',gap:8,alignItems:'center'}}>Até
            <span className="muted" style={{fontWeight:400,fontSize:11.5,display:'inline-flex',gap:5,alignItems:'center'}}>
              <input type="checkbox" checked={!f.endMk} onChange={e=>set({endMk:e.target.checked?'':(f.startMk||curMk)})} style={{accentColor:'var(--accent)'}}/> sem fim</span></label>
          {f.endMk ? mkPair(f.endMk,v=>set({endMk:v}))
                   : <div className="muted" style={{fontSize:12,padding:'8px 0'}}>Continua indefinidamente.</div>}
        </div>
        <div style={{gridColumn:'1/3'}} className="muted">
          <span style={{fontSize:11.5}}>Esta receita conta no faturamento de <b style={{color:'var(--ink)'}}>{monthLong(f.startMk)}</b>{f.endMk?<> até <b style={{color:'var(--ink)'}}>{monthLong(f.endMk)}</b></>:' em diante'}. Para um aumento, use <b style={{color:'var(--ink)'}}>Reajustar</b> na lista — preserva os meses anteriores com o valor antigo.</span>
        </div>
      </div>}
    </div>
  </Modal>;
}
// Reajuste salarial/de receita a partir de um mês: encerra o registro atual no mês anterior
// e cria um novo a partir do mês escolhido com o novo valor (degrau no faturamento).
function IncomeRaiseForm({income,onClose}){
  const db=useDB();
  const curMk=monthKey(todayISO());
  const start=income.startMk||monthKey(income.date)||curMk;
  const [mk,setMk]=useState(curMk>start?curMk:addMonthKey(start,1));
  const [amount,setAmount]=useState('');
  function save(){
    const val=parseMoney(amount)||0;
    if(!val) return db.toast('Informe o novo valor.','warn');
    if(mk<=start) return db.toast('O reajuste deve ser depois do mês inicial da receita. Para corrigir o valor de tudo, use Editar.','warn');
    db.scopeIncome(income.id,'edit','forward',mk,{amount:val});
    db.toast(`Reajuste aplicado a partir de ${monthLong(mk)}.`); onClose();
  }
  const mkPair=(v,on)=><div className="row" style={{gap:6}}>
    <select className="input" style={{width:'auto'}} value={v.slice(5,7)} onChange={e=>on(`${v.slice(0,4)}-${e.target.value}`)}>
      {MESES_PT.map((nm,i)=>{const mm=String(i+1).padStart(2,'0');return <option key={mm} value={mm}>{nm}</option>;})}</select>
    <select className="input" style={{width:'auto'}} value={v.slice(0,4)} onChange={e=>on(`${e.target.value}-${v.slice(5,7)}`)}>
      {yearOptions().map(y=><option key={y} value={y}>{y}</option>)}</select>
  </div>;
  return <Modal title="Reajustar receita" onClose={onClose} foot={<React.Fragment>
      <button className="btn" onClick={onClose}>Cancelar</button>
      <button className="btn primary" onClick={save}>Aplicar reajuste</button></React.Fragment>}>
    <p className="muted" style={{marginTop:0,fontSize:13}}>"<b style={{color:'var(--ink)'}}>{income.desc||income.kind}</b>" vale hoje <b style={{color:'var(--ink)'}}>{BRL(income.amount)}</b>/mês desde {monthLong(start)}. O reajuste mantém esse valor até o mês anterior e passa a valer o novo a partir do mês escolhido.</p>
    <div className="grid" style={{gridTemplateColumns:'1fr 1fr',gap:14}}>
      <div><label className="lbl">A partir de</label>{mkPair(mk,setMk)}</div>
      <div><label className="lbl">Novo valor mensal</label><MoneyInput value={amount} onChange={setAmount}/></div>
    </div>
  </Modal>;
}
const AUDIT_STATUS=[['pendente','Pendente','warn'],['conferido','Conferido','pos'],['divergente','Divergente','neg'],['duplicado','Duplicado','muted'],['ignorado','Ignorado','muted']];
function Receitas({nav}){
  const db=useDB();
  const [add,setAdd]=useState(false);
  const [editInc,setEditInc]=useState(null);
  const [raiseInc,setRaiseInc]=useState(null);
  const [tab,setTab]=useState('manuais');
  const [fMes,setFMes]=useState('todos');
  const [fAno,setFAno]=useState('todos');
  // §1.2 — abertura a partir do Faturamento do Dashboard / Centro de eventos
  useEffect(()=>{ if(!nav) return; if(nav.tab) setTab(nav.tab); if(nav.ano) setFAno(nav.ano); setFMes(nav.mes||'todos'); },[nav]);
  const {rowProps}=useRowFocus(nav&&nav.focusId);
  const incomes=db.incomes||[];
  const audit=db.auditIncomes||[];

  const anosList=useMemo(()=>{
    const ys=new Set([String(new Date().getFullYear())]);
    incomes.forEach(i=>{ if(i.date) ys.add(i.date.slice(0,4)); });
    audit.forEach(a=>{ if(a.date) ys.add(a.date.slice(0,4)); });
    return [...ys].sort().reverse();
  },[incomes,audit]);

  // filtro por mês/ano (Todos = sem restrição). Recorrente respeita a vigência (início/fim).
  const inFilter=(d,recurring)=>{
    if(fMes==='todos'&&fAno==='todos') return true;
    if(recurring) return true;
    if(!d) return false;
    if(fAno!=='todos' && d.slice(0,4)!==fAno) return false;
    if(fMes!=='todos' && d.slice(5,7)!==fMes) return false;
    return true;
  };
  const incInPeriod=i=>{
    if(fMes==='todos'&&fAno==='todos') return true;
    if(i.recurring!==false){
      if(fAno!=='todos'&&fMes!=='todos') return incomeVigente(i,`${fAno}-${fMes}`);
      if(fAno!=='todos') return Array.from({length:12},(_,k)=>`${fAno}-${String(k+1).padStart(2,'0')}`).some(m=>incomeVigente(i,m));
      return true; // só mês, sem ano: não há como cravar a vigência → mostra
    }
    return inFilter(i.date,false);
  };
  const fIncomes=incomes.filter(incInPeriod);
  const fAudit=audit.filter(a=>inFilter(a.date,false));

  const pendentes=audit.filter(a=>a.status==='pendente').length;
  const recurring=round2(fIncomes.filter(i=>i.recurring!==false).reduce((s,i)=>s+(i.amount||0),0));
  const byKind={}; fIncomes.forEach(i=>byKind[i.kind]=round2((byKind[i.kind]||0)+(i.amount||0)));

  const periodTxt = (fMes==='todos'&&fAno==='todos')?'todos os períodos'
    : `${fMes==='todos'?'todos os meses':MESES_PT[+fMes-1]}${fAno==='todos'?'':' de '+fAno}`;

  function exportCSV(){
    let L;
    if(tab==='manuais'){
      L=[['Receitas manuais — '+periodTxt],[],['Descrição','Tipo','Data','Recorrência','Valor']];
      fIncomes.forEach(i=>L.push([i.desc,(INCOME_KINDS.find(k=>k[0]===i.kind)||[,'—'])[1],ptDate(i.date),i.recurring!==false?'mensal':'única',NUM(i.amount)]));
      L.push(['TOTAL','','','',NUM(round2(fIncomes.reduce((s,i)=>s+(i.amount||0),0)))]);
    } else {
      L=[['Auditoria de receitas importadas — '+periodTxt],[],['Data','Banco','Descrição','Valor','Status']];
      fAudit.forEach(a=>L.push([ptDate(a.date),a.banco||'',a.descOrig,NUM(a.amount),(AUDIT_STATUS.find(s=>s[0]===a.status)||[,'—'])[1]]));
      L.push(['TOTAL','','',NUM(round2(fAudit.reduce((s,a)=>s+(a.amount||0),0))),'']);
    }
    const csv=L.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`receitas_${tab}_${fAno}_${fMes}.csv`;a.click();
    db.toast('Receitas exportadas em CSV.');
  }
  function printPDF(){ window.print(); }

  // conciliação automática: receita manual com mesmo valor e data próxima (±7 dias) ou mesmo mês
  function matchFor(a){
    const cand=incomes.find(i=>{
      if(Math.abs((i.amount||0)-(a.amount||0))>Math.max(0.01,a.amount*0.005)) return false;
      if(i.date&&a.date){ const d=Math.abs((new Date(i.date)-new Date(a.date))/86400000); return d<=7 || monthKey(i.date)===monthKey(a.date); }
      return true; // receita recorrente sem data exata: casa pelo valor
    });
    return cand||null;
  }

  return <div>
    <div className="page-head"><div><h1>Receitas</h1>
      <p className="muted">Salário, serviços, rendimentos, reembolsos e outras entradas — e a auditoria das receitas importadas do extrato.</p></div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn" onClick={exportCSV}><Icon name="download" size={15}/> CSV</button>
        <button className="btn" onClick={printPDF}><Icon name="report" size={15}/> Gerar PDF</button>
        {tab==='manuais'&&<button className="btn primary" onClick={()=>setAdd(true)}><Icon name="plus" size={15}/> Nova receita</button>}
      </div></div>

    <div className="card pad no-print" style={{marginBottom:16}}>
      <div className="row" style={{gap:12,alignItems:'flex-end',flexWrap:'wrap'}}>
        <div><label className="lbl">Mês</label>
          <select className="input" style={{width:'auto'}} value={fMes} onChange={e=>setFMes(e.target.value)}>
            <option value="todos">Todos</option>
            {MESES_PT.map((nm,i)=>{const mm=String(i+1).padStart(2,'0');return <option key={mm} value={mm}>{nm}</option>;})}</select></div>
        <div><label className="lbl">Ano</label>
          <select className="input" style={{width:'auto'}} value={fAno} onChange={e=>setFAno(e.target.value)}>
            <option value="todos">Todos</option>
            {anosList.map(y=><option key={y} value={y}>{y}</option>)}</select></div>
        {(fMes!=='todos'||fAno!=='todos')&&<button className="btn" onClick={()=>{setFMes('todos');setFAno('todos');}}>Limpar</button>}
        <span className="muted" style={{fontSize:12.5,marginLeft:'auto'}}>Período: <b style={{color:'var(--ink)'}}>{periodTxt}</b></span>
      </div>
    </div>

    <div className="seg" style={{marginBottom:16}}>
      <button className={tab==='manuais'?'on':''} onClick={()=>setTab('manuais')}>Receitas manuais</button>
      <button className={tab==='auditoria'?'on':''} onClick={()=>setTab('auditoria')}>Auditoria de receitas importadas{pendentes>0?` (${pendentes})`:''}</button>
    </div>

    {tab==='manuais' ? <React.Fragment>
      <div className="kpi-row">
        <div className="kpi pos"><span>Receita recorrente mensal</span><b>{BRL(recurring)}</b></div>
        <div className="kpi"><span>Receitas no período</span><b>{fIncomes.length}</b></div>
        {INCOME_KINDS.filter(k=>byKind[k[0]]).slice(0,2).map(([k,l])=>
          <div className="kpi" key={k}><span>{l}</span><b>{BRL(byKind[k])}</b></div>)}
      </div>
      <div className="card"><div className="tbl-wrap"><table className="tbl"><thead><tr>
        <th>Descrição</th><th>Tipo</th><th>Data</th><th>Recorrência</th><th className="r">Valor</th><th></th>
      </tr></thead><tbody>
        {fIncomes.map(i=>{const st=i.startMk||monthKey(i.date); return <tr key={i.id} {...rowProps(i.id)}>
          <td><b>{i.desc}</b></td>
          <td>{(INCOME_KINDS.find(k=>k[0]===i.kind)||[,'—'])[1]}</td>
          <td className="num">{ptDate(i.date)}</td>
          <td>{i.recurring!==false
            ? <span className="chip pos" title={`Vigente ${monthLong(st)}${i.endMk?` até ${monthLong(i.endMk)}`:' em diante'}`}>mensal · {ptMonth(st)}{i.endMk?`–${ptMonth(i.endMk)}`:'→'}</span>
            : <span className="chip muted">única</span>}</td>
          <td className="r num pos">{BRL(i.amount)}</td>
          <td className="r" style={{whiteSpace:'nowrap'}}>
            {i.recurring!==false&&<button className="btn ghost sm" title="Reajustar a partir de um mês" onClick={()=>setRaiseInc(i)}><Icon name="inst" size={14}/></button>}
            <button className="btn ghost sm" title="Editar" onClick={()=>setEditInc(i)}><Icon name="edit" size={14}/></button>
            <button className="btn ghost sm" title="Excluir" onClick={()=>{if(confirmDialog('Excluir esta receita?'))db.deleteIncome(i.id);}}><Icon name="trash" size={14}/></button></td>
        </tr>;})}
        {!fIncomes.length&&<tr><td colSpan="6" className="empty">Nenhuma receita neste período.</td></tr>}
      </tbody></table></div></div>
    </React.Fragment> : <React.Fragment>
      <div className="kpi-row">
        <div className="kpi pos"><span>Total importado</span><b>{BRL(round2(fAudit.reduce((s,a)=>s+(a.amount||0),0)))}</b></div>
        <div className="kpi"><span>Movimentações</span><b>{fAudit.length}</b></div>
        <div className={"kpi "+(pendentes>0?'warn':'')}><span>Pendentes de conferência</span><b>{pendentes}</b></div>
        <div className="kpi pos"><span>Conferidas</span><b>{fAudit.filter(a=>a.status==='conferido').length}</b></div>
      </div>
      <div className="card pad" style={{marginBottom:14}}>
        <p className="muted" style={{fontSize:13,lineHeight:1.6,margin:0}}>
          Estas são as <b>receitas que entraram na sua conta</b> (PIX, TED, depósitos, salário) importadas do extrato. Elas <b>não entram nos relatórios</b> — servem para você conferir e conciliar com as receitas que cadastrou manualmente, evitando duplicidade e esquecimentos. Quando o sistema encontra uma receita manual parecida, sugere a correspondência.
        </p>
      </div>
      {!fAudit.length
        ? <div className="card"><div className="empty">{audit.length?'Nenhuma receita importada neste período.':'Nenhuma receita importada ainda. Use '}{!audit.length&&<b>Importar extrato</b>}{!audit.length&&' para trazer as movimentações da sua conta.'}</div></div>
        : <div className="card"><div className="tbl-wrap"><table className="tbl"><thead><tr>
            <th>Data</th><th>Banco</th><th>Descrição</th><th className="r">Valor</th><th>Origem</th><th>Conciliação</th><th style={{minWidth:150}}>Status</th><th></th>
          </tr></thead><tbody>
            {fAudit.map(a=>{
              const m=(a.status==='pendente')?matchFor(a):null;
              const sc=(AUDIT_STATUS.find(s=>s[0]===a.status)||[,,'muted'])[2];
              return <tr key={a.id} {...rowProps(a.id)}>
                <td className="num">{ptDate(a.date)}</td>
                <td>{a.banco||'—'}</td>
                <td>{a.descOrig}</td>
                <td className="r num pos">{BRL(a.amount)}</td>
                <td><span className="tag">extrato</span></td>
                <td style={{maxWidth:240}}>
                  {m? <div style={{fontSize:12}}><span className="chip pos" style={{marginBottom:4}}>possível correspondência</span><br/>
                        <span className="muted">{m.desc} · {BRL(m.amount)}</span><br/>
                        <button className="btn sm" style={{marginTop:4}} onClick={()=>db.setAuditStatus(a.id,'conferido',m.id)}>Confirmar</button>
                        <button className="btn ghost sm" style={{marginTop:4,marginLeft:4}} onClick={()=>db.setAuditStatus(a.id,'duplicado',m.id)}>Duplicado</button></div>
                    : a.status==='pendente'? <span className="muted" style={{fontSize:12}}>sem correspondência</span>
                    : a.matchedIncomeId? <span className="muted" style={{fontSize:12}}>conciliada</span> : <span className="muted" style={{fontSize:12}}>—</span>}
                </td>
                <td><select className="input" style={{minWidth:130}} value={a.status} onChange={e=>db.setAuditStatus(a.id,e.target.value,a.matchedIncomeId)}>
                  {AUDIT_STATUS.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></td>
                <td className="r"><button className="btn ghost sm" onClick={()=>{if(confirmDialog('Remover esta receita da auditoria?'))db.deleteAuditIncome(a.id);}}><Icon name="trash" size={14}/></button></td>
              </tr>;
            })}
          </tbody></table></div></div>}
    </React.Fragment>}
    {add&&<IncomeForm onClose={()=>setAdd(false)}/>}
    {editInc&&<IncomeForm income={editInc} onClose={()=>setEditInc(null)}/>}
    {raiseInc&&<IncomeRaiseForm income={raiseInc} onClose={()=>setRaiseInc(null)}/>}
  </div>;
}

/* =========================================================================
   18. ORÇAMENTOS
   ========================================================================= */
function Orcamentos({go}){
  const db=useDB();
  const cur=monthKey(todayISO());
  const [my,setMy]=useStickyState('orc.my',{m:cur.slice(5,7),y:cur.slice(0,4)});
  const refMk=`${my.y}-${my.m}`;
  const [fCat,setFCat]=useStickyState('orc.cat','all');
  const [fStatus,setFStatus]=useStickyState('orc.status','ativos'); // ativos | pausados | all
  const [fRec,setFRec]=useStickyState('orc.rec','all'); // all | rec | unico
  const showPaused = fStatus!=='ativos';
  const [add,setAdd]=useState(false);
  const [edit,setEdit]=useState(null);
  const [scopeAsk,setScopeAsk]=useState(null); // §9 {id,op,catName,full?,fwd?}

  const monthTx=useMemo(()=>db.allTx.filter(t=>billMonth(t)===refMk),[db.allTx,refMk]);
  const A=useMemo(()=>aggregate(monthTx,db.categories),[monthTx,db.categories]);

  // versão efetiva por categoria no mês de referência (mais recente vence). Opcionalmente inclui pausados.
  const monthMap=useMemo(()=>{
    const map={};
    (db.budgets||[]).forEach(b=>{
      const dateVig = (b.recorrente===false) ? b.startMk===refMk
        : (!(b.startMk&&refMk<b.startMk) && !(b.endMk&&refMk>b.endMk) && !(Array.isArray(b.skip)&&b.skip.includes(refMk)));
      if(!dateVig) return;
      if(b.status==='pausado' && !showPaused) return;
      const c=map[b.categoryId];
      if(!c || (b.startMk||'0000-00')>=(c.startMk||'0000-00')) map[b.categoryId]=b;
    });
    return map;
  },[db.budgets,refMk,showPaused]);

  let rows=Object.values(monthMap).map(b=>{
    const real=A.byCat[b.categoryId]||0;
    const lim=b.amount||0; const active=b.status!=='pausado';
    const pct=lim>0?round2(real/lim*100):0;
    return {b,cid:b.categoryId,lim,real,active,pct,rest:round2(lim-real)};
  });
  if(fCat!=='all') rows=rows.filter(r=>r.cid===fCat);
  if(fStatus==='pausados') rows=rows.filter(r=>!r.active);
  else if(fStatus==='ativos') rows=rows.filter(r=>r.active);
  if(fRec==='rec') rows=rows.filter(r=>r.b.recorrente!==false);
  else if(fRec==='unico') rows=rows.filter(r=>r.b.recorrente===false);
  rows.sort((a,b)=>b.pct-a.pct);

  const live=rows.filter(r=>r.active);
  const totalOrc=round2(live.reduce((s,r)=>s+r.lim,0));
  const totalReal=round2(live.reduce((s,r)=>s+r.real,0));
  const catsComOrc=new Set(Object.keys(monthMap));

  const scopeRef=refMk;
  const runScope=scope=>{ if(!scopeAsk)return;
    if(scopeAsk.op==='delete'){
      db.scopeBudget(scopeAsk.id,'delete',scope,scopeRef);
      db.toast(scope==='all'?'Orçamento removido.':scope==='forward'?`Orçamento encerrado a partir de ${monthLong(scopeRef)}.`:`Orçamento removido em ${monthLong(scopeRef)}.`);
    } else {
      if(scope==='all') db.updateBudget(scopeAsk.id,scopeAsk.full);
      else db.scopeBudget(scopeAsk.id,'edit',scope,scopeRef,scopeAsk.fwd);
      db.toast(scope==='all'?'Orçamento atualizado em todos os meses.':scope==='forward'?`Novo valor a partir de ${monthLong(scopeRef)} (histórico preservado).`:`Ajuste aplicado só em ${monthLong(scopeRef)}.`);
    }
    setScopeAsk(null);
  };

  function askDelete(r){
    const b=r.b, prog = b.recorrente!==false && (!b.startMk || b.startMk<refMk);
    if(prog) setScopeAsk({id:b.id,op:'delete',catName:db.catName(r.cid)});
    else if(confirmDialog('Remover este orçamento?')){ db.deleteBudget(b.id); db.toast('Orçamento removido.'); }
  }

  return <div>
    <div className="page-head">
      <div><h1>Orçamentos</h1>
        <p className="muted">Limites por categoria — referência: {monthLong(refMk)}. Alterar o valor a partir de um mês não muda o histórico.</p></div>
      <button className="btn primary" onClick={()=>setAdd(true)}><Icon name="plus" size={15}/> Novo orçamento</button>
    </div>

    <div className="card pad" style={{marginBottom:16}}>
      <div className="row" style={{gap:10,alignItems:'flex-end',flexWrap:'wrap'}}>
        <Fld label="Mês"><select className="input" style={{width:140}} value={my.m} onChange={e=>setMy(s=>({...s,m:e.target.value}))}>
          {MESES_PT.map((nm,i)=>{const mm=String(i+1).padStart(2,'0');return <option key={mm} value={mm}>{nm}</option>;})}</select></Fld>
        <Fld label="Ano"><select className="input" style={{width:110}} value={my.y} onChange={e=>setMy(s=>({...s,y:e.target.value}))}>
          {yearOptions().map(y=><option key={y} value={y}>{y}</option>)}</select></Fld>
        <Fld label="Categoria"><select className="input" style={{width:200}} value={fCat} onChange={e=>setFCat(e.target.value)}>
          <option value="all">Todas</option>
          {[...catsComOrc].map(cid=><option key={cid} value={cid}>{db.catName(cid)}</option>)}</select></Fld>
        <Fld label="Tipo"><select className="input" style={{width:160}} value={fRec} onChange={e=>setFRec(e.target.value)}>
          <option value="all">Todos</option>
          <option value="rec">Mensal recorrente</option>
          <option value="unico">Mensal único</option></select></Fld>
        <Fld label="Status"><select className="input" style={{width:140}} value={fStatus} onChange={e=>setFStatus(e.target.value)}>
          <option value="ativos">Ativos</option>
          <option value="pausados">Pausados</option>
          <option value="all">Todos</option></select></Fld>
        {(fCat!=='all'||fRec!=='all'||fStatus!=='ativos') && <div style={{marginLeft:'auto',display:'flex',gap:8,alignItems:'center'}}>
          <span className="chip pos"><Icon name="check" size={12}/> {(fCat!=='all'?1:0)+(fRec!=='all'?1:0)+(fStatus!=='ativos'?1:0)} filtro{((fCat!=='all'?1:0)+(fRec!=='all'?1:0)+(fStatus!=='ativos'?1:0))>1?'s':''}</span>
          <button className="btn ghost sm" onClick={()=>{setFCat('all');setFRec('all');setFStatus('ativos');}}><Icon name="x" size={13}/> Limpar</button></div>}
      </div>
    </div>

    <div className="kpi-row">
      <div className="kpi"><span>Total orçado</span><b>{BRL(totalOrc)}</b></div>
      <div className="kpi"><span>Total realizado</span><b>{BRL(totalReal)}</b></div>
      <div className={"kpi "+(totalOrc-totalReal<0?'neg':'pos')}><span>Saldo do orçamento</span><b>{BRL(round2(totalOrc-totalReal))}</b></div>
    </div>

    <div className="card" style={{marginTop:18}}><div className="tbl-wrap"><table className="tbl"><thead><tr>
      <th>Categoria</th><th>Vigência</th><th className="r">Orçado</th><th className="r">Realizado</th><th className="r">Restante</th>
      <th style={{width:'24%'}}>Consumido</th><th>Status</th><th></th>
    </tr></thead><tbody>
      {rows.map(r=>{
        const b=r.b;
        const col=!r.active?'var(--muted)':r.pct>=100?'var(--neg)':r.pct>=80?'var(--warn)':'var(--pos)';
        const status=!r.active?{t:'pausado',c:''}:r.pct>=100?{t:'ultrapassado',c:'neg'}:r.pct>=80?{t:'atenção',c:'warn'}:{t:'ok',c:'pos'};
        const vig = b.recorrente===false ? `só ${ptMonth(b.startMk)}`
          : `${b.startMk?ptMonth(b.startMk):'desde sempre'}${b.endMk?` até ${ptMonth(b.endMk)}`:''}`;
        return <tr key={b.id} style={!r.active?{opacity:.6}:undefined}>
        <td><span className="chip" style={{background:db.catColor(r.cid)+'22',color:db.catColor(r.cid)}}>{db.catName(r.cid)}</span>
          {b.obs?<div className="muted" style={{fontSize:11,marginTop:2}}>{b.obs}</div>:null}</td>
        <td className="muted" style={{fontSize:12}}>{b.recorrente===false?'mensal único':'mensal'} · {vig}</td>
        <td className="r num">{BRL(r.lim)}</td>
        <td className="r num" style={{cursor:'pointer'}} onClick={()=>go('lancamentos',{categoryId:r.cid,period:{mode:'month',mk:refMk}})}>{BRL(r.real)}</td>
        <td className={"r num "+(r.rest<0?'neg':'')}>{BRL(r.rest)}</td>
        <td><div style={{display:'flex',alignItems:'center',gap:8}}>
          <div className="progress" style={{flex:1}}><i style={{width:Math.min(100,r.pct)+'%',background:col}}/></div>
          <span className="num" style={{fontSize:12,width:46,textAlign:'right',color:col}}>{PCT(r.pct)}</span></div></td>
        <td><span className={"chip "+status.c}>{status.t}</span></td>
        <td className="r" style={{whiteSpace:'nowrap'}}>
          <button className="btn ghost sm" title="Editar" onClick={()=>setEdit(b)}><Icon name="edit" size={13}/></button>
          <button className="btn ghost sm" title="Remover" onClick={()=>askDelete(r)}><Icon name="trash" size={13}/></button></td>
      </tr>;})}
      {!rows.length&&<tr><td colSpan="8" className="empty">Nenhum orçamento {fCat!=='all'?'para esta categoria ':''}em {monthLong(refMk)}. Clique em “Novo orçamento”.</td></tr>}
    </tbody></table></div></div>

    {add&&<BudgetForm refMk={refMk} onClose={()=>setAdd(false)}/>}
    {edit&&<BudgetForm budget={edit} refMk={refMk} onClose={()=>setEdit(null)}
      onScopedEdit={({full,fwd})=>setScopeAsk({id:edit.id,op:'edit',catName:db.catName(edit.categoryId),full,fwd})}/>}
    {scopeAsk&&<Modal title={scopeAsk.op==='delete'?'Remover orçamento':'Alterar orçamento'} onClose={()=>setScopeAsk(null)}>
      <p style={{marginTop:0}}>Orçamento de <b>{scopeAsk.catName}</b>. A alteração deve valer para quais meses?</p>
      <p className="muted" style={{fontSize:13}}>Meses anteriores a {monthLong(scopeRef)} nunca são alterados.</p>
      <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:14}}>
        <button className="btn" onClick={()=>runScope('one')}>Somente em {monthLong(scopeRef)}</button>
        <button className="btn" onClick={()=>runScope('forward')}>De {monthLong(scopeRef)} em diante <span className="muted" style={{fontSize:12}}>(preserva o histórico)</span></button>
        <button className={"btn "+(scopeAsk.op==='delete'?'danger':'')} onClick={()=>runScope('all')}>{scopeAsk.op==='delete'?'Remover de todos os meses':'Em todos os meses'}</button>
        <button className="btn ghost" onClick={()=>setScopeAsk(null)}>Cancelar</button>
      </div>
    </Modal>}
  </div>;
}

function BudgetForm({budget,refMk,onClose,onScopedEdit}){
  const db=useDB();
  const editing=!!(budget&&budget.id);
  const seed=(budget&&budget.startMk)||refMk;
  const [f,setF]=useState(()=>({
    categoryId: editing?budget.categoryId:((db.categories[0]||{}).id||''),
    amount: editing?String(budget.amount??''):'',
    recorrente: editing?(budget.recorrente!==false):true,
    semInicio: editing? !budget.startMk : false,
    startY: seed.slice(0,4), startM: seed.slice(5,7),
    hasEnd: !!(editing&&budget.endMk),
    endY: (editing&&budget.endMk?budget.endMk:refMk).slice(0,4),
    endM: (editing&&budget.endMk?budget.endMk:refMk).slice(5,7),
    obs: editing?(budget.obs||''):'',
    status: editing?(budget.status||'ativo'):'ativo',
  }));
  const set=p=>setF(x=>({...x,...p}));
  // edição "em curso": recorrente e já vigente em meses anteriores ao de referência -> oferece escopo
  const inProgress = editing && budget.recorrente!==false && (!budget.startMk || budget.startMk<refMk);

  function save(){
    if(!f.categoryId) return db.toast('Selecione a categoria.','warn');
    const amount=parseMoney(f.amount); if(!(amount>0)) return db.toast('Informe um valor válido.','warn');
    const startMk = f.recorrente ? (f.semInicio?null:`${f.startY}-${f.startM}`) : `${f.startY}-${f.startM}`;
    const endMk = (f.recorrente && f.hasEnd) ? `${f.endY}-${f.endM}` : null;
    if(endMk && startMk && endMk<startMk) return db.toast('O fim da vigência é anterior ao início.','warn');
    const data={categoryId:f.categoryId,amount,recorrente:f.recorrente,startMk,endMk,obs:f.obs.trim(),status:f.status};
    if(editing){
      if(inProgress && onScopedEdit){
        const fwd={categoryId:data.categoryId,amount:data.amount,obs:data.obs,status:data.status,recorrente:true};
        onScopedEdit({full:data,fwd}); onClose(); return;
      }
      db.updateBudget(budget.id,data); db.toast('Orçamento atualizado.');
    } else { db.addBudget(data); db.toast('Orçamento criado.'); }
    onClose();
  }

  const monthSel=(mv,yv,onM,onY)=><div className="row" style={{gap:6}}>
    <select className="input" style={{width:130}} value={mv} onChange={e=>onM(e.target.value)}>
      {MESES_PT.map((nm,i)=>{const mm=String(i+1).padStart(2,'0');return <option key={mm} value={mm}>{nm}</option>;})}</select>
    <select className="input" style={{width:100}} value={yv} onChange={e=>onY(e.target.value)}>
      {yearOptions().map(y=><option key={y} value={y}>{y}</option>)}</select></div>;

  return <Modal title={editing?'Editar orçamento':'Novo orçamento'} onClose={onClose}
    foot={<><button className="btn ghost" onClick={onClose}>Cancelar</button><button className="btn primary" onClick={save}>Salvar</button></>}>
    <div className="grid" style={{gridTemplateColumns:'1fr 1fr',gap:14}}>
      <Fld label="Categoria" style={{gridColumn:'1/3'}}>
        <select className="input" value={f.categoryId} onChange={e=>set({categoryId:e.target.value})}>
          {db.categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Fld>
      <Fld label="Limite mensal"><MoneyInput value={f.amount} onChange={v=>set({amount:v})}/></Fld>
      <Fld label="Recorrência">
        <select className="input" value={f.recorrente?'rec':'uni'} onChange={e=>set({recorrente:e.target.value==='rec'})}>
          <option value="rec">Mensal (recorrente)</option><option value="uni">Apenas um mês</option></select></Fld>

      <Fld label={f.recorrente?'Início da vigência':'Mês de referência'} style={{gridColumn:'1/3'}}>
        {f.recorrente && f.semInicio
          ? <div className="muted" style={{fontSize:13,padding:'6px 0'}}>Vale desde sempre (sem mês de início).</div>
          : monthSel(f.startM,f.startY,m=>set({startM:m}),y=>set({startY:y}))}
        {f.recorrente && <label className="row" style={{gap:6,alignItems:'center',fontSize:12.5,marginTop:6,cursor:'pointer'}}>
          <input type="checkbox" checked={f.semInicio} onChange={e=>set({semInicio:e.target.checked})}/> Sem mês de início (vale desde sempre)</label>}</Fld>

      {f.recorrente && <Fld label="Fim da vigência (opcional)" style={{gridColumn:'1/3'}}>
        <label className="row" style={{gap:6,alignItems:'center',fontSize:12.5,marginBottom:6,cursor:'pointer'}}>
          <input type="checkbox" checked={f.hasEnd} onChange={e=>set({hasEnd:e.target.checked})}/> Definir mês final</label>
        {f.hasEnd && monthSel(f.endM,f.endY,m=>set({endM:m}),y=>set({endY:y}))}</Fld>}

      <Fld label="Status"><select className="input" value={f.status} onChange={e=>set({status:e.target.value})}>
        <option value="ativo">Ativo</option><option value="pausado">Pausado</option></select></Fld>
      <Fld label="Observação (opcional)"><input className="input" value={f.obs} onChange={e=>set({obs:e.target.value})} placeholder="ex.: meta de economia"/></Fld>

      {inProgress && <div className="chip warn" style={{gridColumn:'1/3',fontSize:11.5,alignSelf:'start'}}>
        <Icon name="alert" size={12}/> Orçamento já vigente: ao salvar, você escolhe se o novo valor vale só neste mês, daqui para frente (preservando o histórico) ou em todos os meses.</div>}
    </div>
  </Modal>;
}

/* =========================================================================
   19. CARTÕES E CONTAS
   ========================================================================= */
const BRANDS=['Visa','Mastercard','Elo','American Express','Hipercard','Outro'];
const CARD_COLORS=['#0E9F8E','#3B82F6','#8B5CF6','#EC4899','#F59E0B','#10B981','#EF4444','#6366F1','#0EA5E9','#475569'];
const PAY_TYPES=[['credito','Cartão de crédito'],['debito','Cartão de débito'],['pix','Pix'],['conta','Conta / débito automático'],['dinheiro','Dinheiro']];
function CardForm({card,onClose}){
  const db=useDB();
  const [f,setF]=useState(card||{name:'',bank:'',brand:'Visa',last:'',limit:'',closeDay:'',dueDay:'',color:CARD_COLORS[0],active:true,type:'credito'});
  const set=p=>setF(x=>({...x,...p}));
  const isCredit=(f.type||'credito')==='credito';
  function save(){
    if(!f.name.trim()) return db.toast('Informe o nome da forma de pagamento.','warn');
    const data={name:f.name.trim(),bank:f.bank.trim(),brand:f.brand,last:String(f.last||'').slice(-4),
      limit:isCredit?(parseMoney(f.limit)||0):0,closeDay:isCredit?(+f.closeDay||null):null,dueDay:+f.dueDay||null,
      color:f.color,active:f.active,type:f.type||'credito'};
    if(card){db.updateCard(card.id,data);db.toast('Forma de pagamento atualizada.');}
    else{db.addCard(data);db.toast('Forma de pagamento cadastrada.');}
    onClose();
  }
  const typeLabel=(PAY_TYPES.find(t=>t[0]===(f.type||'credito'))||[])[1]||'';
  return <Modal title={card?'Editar forma de pagamento':'Nova forma de pagamento'} onClose={onClose} foot={<React.Fragment>
      <button className="btn" onClick={onClose}>Cancelar</button>
      <button className="btn primary" onClick={save}>Salvar</button></React.Fragment>}>
    <div className="grid" style={{gridTemplateColumns:'1fr 1fr',gap:14}}>
      <div style={{gridColumn:'1/3'}}><label className="lbl">Tipo</label>
        <select className="input" value={f.type||'credito'} onChange={e=>set({type:e.target.value})}>
          {PAY_TYPES.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></div>
      <div style={{gridColumn:'1/3'}}><label className="lbl">Nome</label><input className="input" value={f.name} onChange={e=>set({name:e.target.value})} placeholder={isCredit?'Ex.: Nubank Ultravioleta':'Ex.: Pix Itaú, Débito Bradesco'}/></div>
      <div><label className="lbl">Banco / instituição</label><input className="input" value={f.bank} onChange={e=>set({bank:e.target.value})}/></div>
      {isCredit
        ? <div><label className="lbl">Bandeira</label><select className="input" value={f.brand} onChange={e=>set({brand:e.target.value})}>
            {BRANDS.map(b=><option key={b} value={b}>{b}</option>)}</select></div>
        : <div><label className="lbl">Tipo selecionado</label><input className="input" value={typeLabel} disabled/></div>}
      <div><label className="lbl">Final (4 dígitos)</label><input className="input num" maxLength="4" value={f.last} onChange={e=>set({last:e.target.value.replace(/\D/g,'')})}/></div>
      {isCredit && <React.Fragment>
        <div><label className="lbl">Limite</label><MoneyInput value={f.limit} onChange={v=>set({limit:v})}/></div>
        <div><label className="lbl">Dia de fechamento</label><input className="input num" type="number" min="1" max="31" value={f.closeDay} onChange={e=>set({closeDay:e.target.value})}/></div>
      </React.Fragment>}
      <div><label className="lbl">Dia de vencimento</label><input className="input num" type="number" min="1" max="31" value={f.dueDay} onChange={e=>set({dueDay:e.target.value})}/></div>
      <div style={{gridColumn:'1/3'}}><label className="lbl">Cor de identificação</label>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
          {CARD_COLORS.map(c=><button key={c} onClick={()=>set({color:c})} style={{width:28,height:28,borderRadius:8,background:c,
            border:f.color===c?'3px solid var(--ink)':'2px solid var(--line)',cursor:'pointer'}}/>)}</div></div>
      <div style={{gridColumn:'1/3'}}><label style={{display:'flex',gap:7,alignItems:'center'}}>
        <input type="checkbox" checked={f.active} onChange={e=>set({active:e.target.checked})}/> Ativo</label></div>
    </div>
  </Modal>;
}
function CartoesContas({go,nav}){
  const db=useDB();
  const {isOn}=useRowFocus(nav&&nav.focusId);
  const [edit,setEdit]=useState(null);
  const [add,setAdd]=useState(false);
  const groups=useMemo(()=>projectInstallments(db.transactions, (db.settings&&db.settings.installmentSettled)||{}),[db.transactions,db.settings]);
  const curMonth=monthKey(todayISO());

  const pays=db.settings?.payments||{};
  function cardStats(card){
    const tx=db.transactions.filter(t=>t.cardId===card.id);
    const thisInvoice=round2(tx.filter(t=>billMonth(t)===curMonth).reduce((s,t)=>s+spendOf(t),0));
    const thisInvoicePaid=!!pays[`card:${card.id}:${curMonth}`];
    const futureInst=round2(groups.filter(g=>g.cardId===card.id)
      .reduce((s,g)=>s+Object.values(g.future).reduce((a,b)=>a+b,0),0));
    const used=round2(tx.filter(t=>t.type==='despesa').reduce((s,t)=>s+t.amount,0));
    // Limite comprometido = faturas ainda em aberto + parcelas futuras. Uma fatura quitada
    // em Pagamentos (card:<id>:<mês>) devolve o limite — deixa de pesar no disponível.
    const invByMonth={};
    tx.forEach(t=>{ const m=billMonth(t); if(!m) return; invByMonth[m]=round2((invByMonth[m]||0)+spendOf(t)); });
    const openInvoices=round2(Object.entries(invByMonth)
      .filter(([m,v])=>v>0 && !pays[`card:${card.id}:${m}`])
      .reduce((s,[,v])=>s+v,0));
    const committed=round2(openInvoices+futureInst);
    const months=[...new Set(tx.map(t=>billMonth(t)))].sort().slice(-6);
    const series=months.map(m=>round2(tx.filter(t=>billMonth(t)===m).reduce((s,t)=>s+spendOf(t),0)));
    return {thisInvoice,thisInvoicePaid,futureInst,openInvoices,committed,used,
      avail:card.limit?round2(card.limit-committed):null,months,series,count:tx.length};
  }
  const totalLimit=round2(db.cards.reduce((s,c)=>s+(c.limit||0),0));

  return <div>
    <div className="page-head"><div><h1>Cartões e contas</h1>
      <p className="muted">Cartões de crédito, débito, Pix e contas. Limites e parcelas futuras aparecem nos cartões de crédito.</p></div>
      <button className="btn primary" onClick={()=>setAdd(true)}><Icon name="plus" size={15}/> Forma de pagamento</button></div>

    <div className="kpi-row">
      <div className="kpi"><span>Formas cadastradas</span><b>{db.cards.length}</b></div>
      <div className="kpi"><span>Limite total (crédito)</span><b>{BRL(totalLimit)}</b></div>
      <div className="kpi"><span>Ativos</span><b>{db.cards.filter(c=>c.active).length}</b></div>
    </div>

    <div className="cards-grid">
      {db.cards.map(card=>{const s=cardStats(card);const isCredit=(card.type||'credito')==='credito';const usePct=card.limit?Math.min(100,round2(s.committed/card.limit*100)):0;
        const typeLabel=(PAY_TYPES.find(t=>t[0]===(card.type||'credito'))||[])[1]||'';
        return <div className="cc-card" key={card.id} data-focus={String(card.id)} style={{borderTop:'4px solid '+card.color, ...(isOn(card.id)?{boxShadow:'0 0 0 2px var(--accent)',background:'rgba(25,195,125,.10)',transition:'background .3s'}:{})}}>
        <div className="cc-head">
          <div><b>{card.name}</b><div className="muted" style={{fontSize:12}}>{isCredit?`${card.bank} · ${card.brand} · final ${card.last||'----'}`:`${typeLabel}${card.bank?' · '+card.bank:''}${card.last?' · final '+card.last:''}`}</div></div>
          <div style={{display:'flex',gap:4}}>
            <button className="btn ghost sm" onClick={()=>setEdit(card)}><Icon name="edit" size={14}/></button>
            <button className="btn ghost sm" onClick={()=>{if(confirmDialog('Excluir esta forma de pagamento? Os lançamentos não serão apagados.'))db.deleteCard(card.id);}}><Icon name="trash" size={14}/></button>
          </div>
        </div>
        {!card.active&&<span className="chip muted" style={{marginBottom:8,display:'inline-block'}}>inativo</span>}
        {!isCredit && <span className="chip" style={{marginBottom:8,display:'inline-block'}}>{typeLabel}</span>}
        {isCredit && <React.Fragment>
          <div className="cc-row"><span>Próxima fatura ({monthLong(curMonth)})</span><b className="num">{BRL(s.thisInvoice)}{s.thisInvoice>0&&s.thisInvoicePaid&&<span className="chip pos" style={{marginLeft:6,fontSize:10,verticalAlign:'middle'}}>paga</span>}</b></div>
          <div className="cc-row"><span>Parcelas futuras</span><b className="num">{BRL(s.futureInst)}</b></div>
        </React.Fragment>}
        {isCredit && card.limit>0 && <React.Fragment>
          <div className="cc-row"><span>Limite</span><b className="num">{BRL(card.limit)}</b></div>
          <div className="cc-row"><span>Disponível</span><b className={"num "+(s.avail<0?'neg':'pos')}>{BRL(s.avail)}</b></div>
          <div className="progress" style={{margin:'8px 0'}}><i style={{width:usePct+'%',background:usePct>=80?'var(--neg)':card.color}}/></div>
          <div className="muted" style={{fontSize:11}}>{PCT(usePct)} comprometido</div>
        </React.Fragment>}
        {(card.closeDay||card.dueDay)&&<div className="muted" style={{fontSize:11,marginTop:8}}>
          {isCredit&&card.closeDay?`Fecha dia ${card.closeDay} · `:''}vence dia {card.dueDay||'—'}</div>}
        {isCredit && s.series.length>1 && <div style={{marginTop:10}}><ChartJS type="line" height={90} options={{plugins:{legend:{display:false}}}}
          data={{labels:s.months.map(m=>ptMonth(m)),datasets:[{data:s.series,borderColor:card.color,
            backgroundColor:card.color+'22',fill:true,tension:.35,pointRadius:0}]}}/></div>}
        <button className="btn ghost sm" style={{marginTop:8}} onClick={()=>go('lancamentos',{cardId:card.id})}>Ver lançamentos</button>
      </div>;})}
      {!db.cards.length&&<div className="empty card pad">Nenhuma forma de pagamento cadastrada.</div>}
    </div>
    {add&&<CardForm onClose={()=>setAdd(false)}/>}
    {edit&&<CardForm card={edit} onClose={()=>setEdit(null)}/>}
  </div>;
}

   20. VISÃO COMPARATIVA (meses × categorias) + acumulado
   ========================================================================= */
/* §10 — Análise avançada: período flexível + critérios, com estatísticas e gráfico.
   Opera sobre lançamentos REAIS (db.allTx). Não projeta templates de gastos fixos: as métricas
   aqui são de transações (nº de lançamentos, ticket médio), então nunca soma o planejado — o que
   mantém a coerência com o §14 (não reintroduz a divergência que o Desenho 1 resolveu). */
function AnaliseAvancada({go}){
  const db=useDB();
  const cur=monthKey(todayISO());
  const [period,setPeriod]=useStickyState('analise.period',{mode:'ultimos',n:6,groupBy:'mes',
    m:cur.slice(5,7),y:cur.slice(0,4), fm:cur.slice(5,7),fy:cur.slice(0,4), tm:cur.slice(5,7),ty:cur.slice(0,4)});
  const setP=p=>setPeriod(x=>({...x,...p}));
  const [type,setType]=useStickyState('analise.type','despesa');
  const [categoryId,setCategoryId]=useStickyState('analise.cat','all');
  const [subcategory,setSubcategory]=useStickyState('analise.sub','all');
  const [origin,setOrigin]=useStickyState('analise.origin','all');
  const [cardId,setCardId]=useStickyState('analise.card','all');
  const [paymentType,setPaymentType]=useStickyState('analise.pay','all');
  const [confStatus,setConfStatus]=useStickyState('analise.conf','all');
  const [merchant,setMerchant]=useStickyState('analise.merchant','');

  const ORIGS=[['all','Todas'],['manual','Manual'],['fatura','Fatura'],['extrato','Extrato'],['reneg','Renegociação'],['demo','Demonstração']];
  const subsOf=(db.categories.find(c=>c.id===categoryId)||{}).subs||[];

  const monthsRange=useMemo(()=>{
    if(period.mode==='mes') return [`${period.y}-${period.m}`];
    if(period.mode==='ultimos'){ const N=period.n; return Array.from({length:N},(_,i)=>addMonthKey(cur,-(N-1-i))); }
    if(period.mode==='intervalo'){ let a=`${period.fy}-${period.fm}`,b=`${period.ty}-${period.tm}`; if(a>b)[a,b]=[b,a];
      const out=[]; let c2=a,g=0; while(c2<=b && g<600){ out.push(c2); c2=addMonthKey(c2,1); g++; } return out; }
    const set=new Set((db.allTx||[]).map(t=>billMonth(t)).filter(Boolean)); return [...set].sort();
  },[period,cur,db.allTx]);

  const groupBy = period.mode==='mes' ? 'mes' : period.groupBy;
  const buckets = useMemo(()=> groupBy==='ano' ? [...new Set(monthsRange.map(m=>m.slice(0,4)))].sort() : monthsRange, [monthsRange,groupBy]);
  const keyOf = groupBy==='ano' ? (t=>billMonth(t).slice(0,4)) : (t=>billMonth(t));
  const bucketLabel = b=> groupBy==='ano' ? b : ptMonth(b);

  // Receitas não são lançamentos: vivem em db.incomes. Para a análise de receita, projetamos
  // cada fonte nos meses da janela respeitando a vigência (início/fim) — recorrente conta de
  // startMk até endMk; avulsa só no mês da data. Espelha "Receitas por fonte" da Visão comparativa.
  const incomeTx=useMemo(()=>{
    if(type!=='receita') return [];
    const out=[];
    (db.incomes||[]).forEach(i=>{
      monthsRange.forEach(m=>{
        const val=incomeOccurrencesForMonth(m,[i]).reduce((s,o)=>s+Number(o.amount||0),0);
        if(!val) return;
        out.push({ id:`inc:${i.id}:${m}`, date:`${m}-15`, compMk:m, descOrig:i.desc||i.kind||'Receita',
          descPad:i.desc||'', amount:val, type:'receita', categoryId:'', subcategory:'', origin:'manual',
          cardId:null, accountId:null, paymentType:'', confStatus:'ok' });
      });
    });
    return out;
  },[type,db.incomes,monthsRange]);

  // Receita só carrega tipo + estabelecimento (as demais dimensões não existem numa receita).
  const crit = type==='receita'
    ? {type, merchant:merchant.trim()}
    : {type,categoryId,subcategory,origin,cardId,paymentType,confStatus,merchant:merchant.trim()};
  const inWindow=useMemo(()=>{ const lo=monthsRange[0], hi=monthsRange[monthsRange.length-1];
    const base = type==='receita' ? incomeTx : (db.allTx||[]);
    return base.filter(t=>{ const mk=billMonth(t); return mk>=lo && mk<=hi; }); },[db.allTx,incomeTx,type,monthsRange]);
  const fTx=useMemo(()=>inWindow.filter(t=>txMatches(t,crit)),[inWindow,type,categoryId,subcategory,origin,cardId,paymentType,confStatus,merchant]);
  const valOf = t=> type==='receita' ? (t.amount||0) : spendOf(t);
  const R=useMemo(()=>analyzeBuckets(fTx,buckets,keyOf,valOf),[fTx,buckets,groupBy,type]);

  // quebra por estabelecimento (top) e por categoria — ajuda quando o filtro é amplo
  const byMerchant=useMemo(()=>{ const m={};
    fTx.forEach(t=>{ const k=(t.descOrig||t.descPad||'—').trim()||'—'; if(!m[k])m[k]={total:0,count:0}; m[k].total=round2(m[k].total+valOf(t)); m[k].count++; });
    return Object.entries(m).map(([name,v])=>({name,...v})).sort((a,b)=>b.total-a.total).slice(0,8);
  },[fTx,type]);

  function exportCSV(){
    const L=[['Análise avançada'],['Critério','Estabelecimento contém',merchant||'(todos)'],
      ['Tipo',type],['Categoria',categoryId==='all'?'todas':db.catName(categoryId)],[],
      [groupBy==='ano'?'Ano':'Mês','Total','Nº lançamentos','Ticket médio']];
    buckets.forEach(b=>L.push([bucketLabel(b),NUM(R.byB[b].total),R.byB[b].count,NUM(R.byB[b].count?round2(R.byB[b].total/R.byB[b].count):0)]));
    L.push(['Total',NUM(R.total),R.count,NUM(R.ticket)]);
    const csv=L.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='analise_avancada.csv';a.click(); db.toast('CSV exportado.');
  }

  const periodPresets=[['mes','Mês específico'],['ultimos','Últimos N meses'],['intervalo','Intervalo'],['tudo','Todo o período']];
  const fActive=(type!=='despesa'?1:0)+(categoryId!=='all'?1:0)+(subcategory!=='all'?1:0)+(origin!=='all'?1:0)+(cardId!=='all'?1:0)+(paymentType!=='all'?1:0)+(confStatus!=='all'?1:0)+(merchant.trim()?1:0);
  function clearFilters(){ setType('despesa'); setCategoryId('all'); setSubcategory('all'); setOrigin('all'); setCardId('all'); setPaymentType('all'); setConfStatus('all'); setMerchant(''); }
  const monthPair=(mv,yv,onM,onY)=><div className="row" style={{gap:6}}>
    <select className="input" style={{width:128}} value={mv} onChange={e=>onM(e.target.value)}>
      {MESES_PT.map((nm,i)=>{const mm=String(i+1).padStart(2,'0');return <option key={mm} value={mm}>{nm}</option>;})}</select>
    <select className="input" style={{width:96}} value={yv} onChange={e=>onY(e.target.value)}>
      {yearOptions().map(y=><option key={y} value={y}>{y}</option>)}</select></div>;

  return <div>
    <div className="card pad" style={{marginBottom:16}}>
      <div className="row" style={{gap:12,alignItems:'flex-end',flexWrap:'wrap'}}>
        <Fld label="Período"><select className="input" style={{width:170}} value={period.mode} onChange={e=>setP({mode:e.target.value})}>
          {periodPresets.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></Fld>
        {period.mode==='mes' && <Fld label="Mês/ano">{monthPair(period.m,period.y,m=>setP({m}),y=>setP({y}))}</Fld>}
        {period.mode==='ultimos' && <Fld label="Quantidade"><select className="input" style={{width:120}} value={period.n} onChange={e=>setP({n:+e.target.value})}>
          {[3,4,6,12].map(n=><option key={n} value={n}>{n} meses</option>)}</select></Fld>}
        {period.mode==='intervalo' && <Fld label="De">{monthPair(period.fm,period.fy,m=>setP({fm:m}),y=>setP({fy:y}))}</Fld>}
        {period.mode==='intervalo' && <Fld label="Até">{monthPair(period.tm,period.ty,m=>setP({tm:m}),y=>setP({ty:y}))}</Fld>}
        {period.mode!=='mes' && <Fld label="Agrupar por"><div className="seg">
          <button className={groupBy==='mes'?'on':''} onClick={()=>setP({groupBy:'mes'})}>Mês</button>
          <button className={groupBy==='ano'?'on':''} onClick={()=>setP({groupBy:'ano'})}>Ano</button></div></Fld>}
      </div>
      <div className="row" style={{gap:12,alignItems:'flex-end',flexWrap:'wrap',marginTop:12}}>
        <Fld label="Estabelecimento"><input className="input" style={{width:180}} value={merchant} onChange={e=>setMerchant(e.target.value)} placeholder="ex.: Amazon"/></Fld>
        <Fld label="Tipo"><select className="input" style={{width:130}} value={type} onChange={e=>setType(e.target.value)}>
          <option value="despesa">Despesas</option><option value="receita">Receitas</option><option value="estorno">Estornos</option><option value="all">Todos</option></select></Fld>
        <Fld label="Categoria"><select className="input" style={{width:160}} value={categoryId} onChange={e=>{setCategoryId(e.target.value);setSubcategory('all');}}>
          <option value="all">Todas</option>{db.categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Fld>
        {subsOf.length>0 && <Fld label="Subcategoria"><select className="input" style={{width:150}} value={subcategory} onChange={e=>setSubcategory(e.target.value)}>
          <option value="all">Todas</option>{subsOf.map(s=><option key={s} value={s}>{s}</option>)}</select></Fld>}
        <Fld label="Origem"><select className="input" style={{width:140}} value={origin} onChange={e=>setOrigin(e.target.value)}>
          {ORIGS.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></Fld>
        <Fld label="Cartão/conta"><select className="input" style={{width:150}} value={cardId} onChange={e=>setCardId(e.target.value)}>
          <option value="all">Todos</option>{(db.cards||[]).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Fld>
        <Fld label="Forma de pagto"><select className="input" style={{width:160}} value={paymentType} onChange={e=>setPaymentType(e.target.value)}>
          <option value="all">Todas</option>{PAY_TYPES.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></Fld>
        <Fld label="Situação"><select className="input" style={{width:130}} value={confStatus} onChange={e=>setConfStatus(e.target.value)}>
          <option value="all">Todas</option><option value="ok">Confirmado</option><option value="revisar">A revisar</option></select></Fld>
        <button className="btn" onClick={exportCSV}><Icon name="download" size={15}/> CSV</button>
        <button className="btn ghost" onClick={clearFilters} disabled={!fActive}><Icon name="x" size={14}/> Limpar filtros{fActive>0?` (${fActive})`:''}</button>
      </div>
      {type==='receita' && <div className="muted" style={{fontSize:11.5,marginTop:8}}>As receitas vêm do seu cadastro em <b>Receitas</b> (recorrentes contam em todo mês da janela; avulsas, no mês da data). Filtros de categoria, cartão e forma de pagamento não se aplicam a receitas.</div>}
    </div>

    <div className="kpi-row">
      <div className={"kpi clickable "+(type==='receita'?'pos':'neg')} style={{cursor:R.total>0?'pointer':'default'}}
        title="Abrir no Centro de eventos" onClick={()=>R.total>0&&openAggregate(go,{natureza:type==='receita'?'entrada':'saida'})}><span>Total</span><b>{BRL(R.total)}</b></div>
      <div className="kpi"><span>Nº de lançamentos</span><b>{R.count}</b></div>
      <div className="kpi"><span>Ticket médio</span><b>{BRL(R.ticket)}</b></div>
      <div className="kpi"><span>Média por {groupBy==='ano'?'ano':'mês'} ativo</span><b>{BRL(R.avgPerBucket)}</b></div>
      <div className={"kpi "+(R.variation==null?'':R.variation<0?'pos':'neg')}><span>Variação (último vs. anterior)</span>
        <b>{R.variation==null?'—':(R.variation>0?'+':'')+PCT(R.variation)}</b></div>
    </div>

    <div className="card"><div className="card-head"><h3>{type==='receita'?'Receitas':'Despesas'} por {groupBy==='ano'?'ano':'mês'}{merchant?` · "${merchant}"`:''}</h3></div>
      <ChartJS type="bar" height={230} options={{plugins:{legend:{display:false}}}}
        data={{labels:buckets.map(bucketLabel),datasets:[{data:R.series,
          backgroundColor:(type==='receita'?cssVar('--accent'):cssVar('--neg'))+'cc',borderRadius:5}]}}/></div>

    <div className="grid" style={{gridTemplateColumns:'1.3fr 1fr',gap:16,marginTop:18}}>
      <div className="card"><div className="card-head"><h3>Detalhe por {groupBy==='ano'?'ano':'mês'}</h3></div>
        <div className="tbl-wrap" style={{maxHeight:420,overflow:'auto'}}><table className="tbl"><thead><tr>
          <th>{groupBy==='ano'?'Ano':'Mês'}</th><th className="r">Total</th><th className="r">Nº</th><th className="r">Ticket</th>
        </tr></thead><tbody>
          {buckets.map(b=>{const d=R.byB[b];const tk=d.count?round2(d.total/d.count):0;
            return <tr key={b}>
              <td>{bucketLabel(b)}</td>
              <td className="r num" style={{cursor:groupBy==='mes'&&d.total?'pointer':'default'}}
                onClick={()=>{ if(groupBy==='mes'&&d.total) go('lancamentos',{period:{mode:'month',mk:b},...(categoryId!=='all'?{categoryId}:{}),...(merchant?{q:merchant}:{})}); }}>{d.total?NUM(d.total):'·'}</td>
              <td className="r num muted">{d.count||'·'}</td>
              <td className="r num muted">{tk?NUM(tk):'·'}</td></tr>;})}
          <tr style={{borderTop:'2px solid var(--line)',fontWeight:700}}>
            <td>Total</td><td className="r num">{BRL(R.total)}</td><td className="r num">{R.count}</td><td className="r num">{BRL(R.ticket)}</td></tr>
          {!R.count&&<tr><td colSpan="4" className="empty">Nenhum lançamento com esses critérios no período.</td></tr>}
        </tbody></table></div></div>

      <div className="card"><div className="card-head"><h3>Top estabelecimentos</h3></div>
        <div className="tbl-wrap" style={{maxHeight:420,overflow:'auto'}}><table className="tbl"><thead><tr>
          <th>Estabelecimento</th><th className="r">Total</th><th className="r">Nº</th>
        </tr></thead><tbody>
          {byMerchant.map((m,i)=><tr key={i}><td>{m.name}</td><td className="r num">{NUM(m.total)}</td><td className="r num muted">{m.count}</td></tr>)}
          {!byMerchant.length&&<tr><td colSpan="3" className="empty">—</td></tr>}
        </tbody></table></div></div>
    </div>
  </div>;
}

function Comparativo({go}){
  const db=useDB();
  const [report,setReport]=useStickyState('comp.report','balanco'); // despesas | receitas | balanco | analise
  const [view,setView]=useStickyState('comp.view','mensal');      // mensal | acumulado (para despesas/receitas)
  const [year,setYear]=useStickyState('comp.year',(todayISO()).slice(0,4));
  const years=Array.from({length:51},(_,i)=>String(2000+i)).reverse();
  const months=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`);
  const cats=db.categories;

  // matriz categoria x mês (despesas)
  const matrix={}; const monthTotals={}; let grand=0;
  cats.forEach(c=>matrix[c.id]={});
  db.allTx.filter(t=>t.date.slice(0,4)===year && isSpend(t)).forEach(t=>{
    const mk=billMonth(t), v=spendOf(t);
    matrix[t.categoryId]=matrix[t.categoryId]||{};
    matrix[t.categoryId][mk]=round2((matrix[t.categoryId][mk]||0)+v);
    monthTotals[mk]=round2((monthTotals[mk]||0)+v); grand=round2(grand+v);
  });
  // gastos fixos/variáveis/parcelados cadastrados, projetados em cada mês — §14 Desenho 1:
  // só entram nos meses em que NÃO há transação real equivalente (o realizado manda).
  const fmC=db.settings?.fixedMonthly||{};
  const suppC=suppressedFixedOccurrences(db,months);
  (db.fixed||[]).forEach(f=>{
    if(!cats.find(c=>c.id===f.categoryId)) return; // só conta se a categoria existir
    months.forEach(m=>{
      if(!fixedVigente(f,m)) return;
      if(suppC.has(`${f.id}:${m}`)) return;
      const v=fixedAmount(f,m,fmC); if(!v) return;
      matrix[f.categoryId][m]=round2((matrix[f.categoryId][m]||0)+v);
      monthTotals[m]=round2((monthTotals[m]||0)+v); grand=round2(grand+v);
    });
  });
  const catRows=cats.map(c=>{
    const total=round2(months.reduce((s,m)=>s+(matrix[c.id][m]||0),0));
    const active=months.filter(m=>matrix[c.id][m]).length;
    return {c,total,avg:active?round2(total/active):0};
  }).filter(r=>r.total>0).sort((a,b)=>b.total-a.total);

  // receitas por fonte x mês (recorrente conta de startMk a endMk; avulsa só no mês da data)
  const incSources={}; const incMonthTotals={}; let incGrand=0;
  (db.incomes||[]).forEach(i=>{
    const name=i.desc||i.kind||'Receita';
    incSources[name]=incSources[name]||{};
    months.forEach(m=>{
      const val=incomeOccurrencesForMonth(m,[i]).reduce((s,o)=>s+Number(o.amount||0),0);
      if(val){ incSources[name][m]=round2((incSources[name][m]||0)+val); incMonthTotals[m]=round2((incMonthTotals[m]||0)+val); incGrand=round2(incGrand+val); }
    });
  });
  const incRows=Object.entries(incSources).map(([name,byM])=>{
    const total=round2(months.reduce((s,m)=>s+(byM[m]||0),0));
    return {name,byM,total};
  }).filter(r=>r.total>0).sort((a,b)=>b.total-a.total);

  // acumulado por mês (despesas) p/ gráfico
  let acc=0; const accSeries=months.map(m=>{acc=round2(acc+(monthTotals[m]||0));return acc;});

  // balanço mensal
  const saldoMes=months.map(m=>round2((incMonthTotals[m]||0)-(monthTotals[m]||0)));
  const totIncome=incGrand, totSaldo=round2(totIncome-grand);

  // insights (despesas)
  const activeMonths=months.filter(m=>monthTotals[m]>0);
  const maxMonth=[...activeMonths].sort((a,b)=>monthTotals[b]-monthTotals[a])[0];
  const minMonth=[...activeMonths].sort((a,b)=>monthTotals[a]-monthTotals[b])[0];
  const avgMonth=activeMonths.length?round2(grand/activeMonths.length):0;
  const futureInst=round2(instGroups(db).reduce((s,g)=>s+g.balance,0));

  function cellVal(cid,m){ return view==='acumulado'
    ? round2(months.slice(0,months.indexOf(m)+1).reduce((s,x)=>s+(matrix[cid][x]||0),0))
    : (matrix[cid][m]||0); }
  function incCell(byM,m){ return view==='acumulado'
    ? round2(months.slice(0,months.indexOf(m)+1).reduce((s,x)=>s+(byM[x]||0),0))
    : (byM[m]||0); }

  function exportCSV(){
    let L=[];
    if(report==='balanco'){
      L=[['Balanço mensal',year],[],['Mês','Receitas','Despesas','Saldo']];
      months.forEach((m,i)=>L.push([ptMonth(m),NUM(incMonthTotals[m]||0),NUM(monthTotals[m]||0),NUM(saldoMes[i])]));
      L.push(['Total',NUM(totIncome),NUM(grand),NUM(totSaldo)]);
    } else if(report==='receitas'){
      L=[['Receitas por fonte',year],[],['Fonte',...months.map(ptMonth),'Total']];
      incRows.forEach(r=>L.push([r.name,...months.map(m=>NUM(r.byM[m]||0)),NUM(r.total)]));
      L.push(['Total',...months.map(m=>NUM(incMonthTotals[m]||0)),NUM(totIncome)]);
    } else {
      L=[['Despesas por categoria',year],[],['Categoria',...months.map(ptMonth),'Total']];
      catRows.forEach(({c,total})=>L.push([c.name,...months.map(m=>NUM(matrix[c.id][m]||0)),NUM(total)]));
      L.push(['Total',...months.map(m=>NUM(monthTotals[m]||0)),NUM(grand)]);
    }
    const csv=L.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`comparativo_${report}_${year}.csv`;a.click();
    db.toast('CSV exportado.');
  }

  const REPORTS=[['balanco','Balanço (entradas, saídas e saldo)'],['despesas','Despesas por categoria'],['receitas','Receitas por fonte'],['analise','Análise avançada (filtros e período)']];

  return <div>

      <p className="muted">Escolha a visão e o ano. Clique em valores de despesa para ver os lançamentos.</p></div>
      <div style={{display:'flex',gap:8}} className="no-print">
        {report!=='analise' && <button className="btn" onClick={exportCSV}><Icon name="download" size={15}/> CSV</button>}
        <button className="btn primary" onClick={()=>window.print()}><Icon name="report" size={15}/> Gerar PDF</button></div></div>

    <div className="row no-print" style={{alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}}>

          {REPORTS.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></div>
      {report!=='analise' && <div><label className="lbl">Ano</label>
        <select className="input" style={{width:'auto'}} value={year} onChange={e=>setYear(e.target.value)}>
          {(years.length?years:[year]).map(y=><option key={y} value={y}>{y}</option>)}</select></div>}
      {report!=='balanco' && report!=='analise' && <div><label className="lbl">Modo</label><div className="seg">
        <button className={view==='mensal'?'on':''} onClick={()=>setView('mensal')}>Mensal</button>
        <button className={view==='acumulado'?'on':''} onClick={()=>setView('acumulado')}>Acumulado</button>

    </div>

    {report==='analise' && <AnaliseAvancada go={go}/>}

    {report!=='analise' && <div className="kpi-row">
      <div className="kpi pos clickable" style={{cursor:totIncome>0?'pointer':'default'}} title="Ver eventos de receita do ano"
        onClick={()=>totIncome>0&&openAggregate(go,{ano:year,mes:'all',natureza:'entrada'})}><span>Receitas no ano</span><b>{BRL(totIncome)}</b></div>
      <div className="kpi neg clickable" style={{cursor:grand>0?'pointer':'default'}} title="Ver eventos de despesa do ano"
        onClick={()=>grand>0&&openAggregate(go,{ano:year,mes:'all',natureza:'saida'})}><span>Despesas no ano</span><b>{BRL(grand)}</b></div>
      <div className={"kpi clickable "+(totSaldo<0?'neg':'pos')} style={{cursor:'pointer'}} title="Ver todos os eventos do ano"
        onClick={()=>openAggregate(go,{ano:year,mes:'all'})}><span>Saldo no ano</span><b>{BRL(totSaldo)}</b></div>
      <div className="kpi"><span>Média de despesa/mês</span><b>{BRL(avgMonth)}</b></div>
      <div className="kpi clickable" style={{cursor:futureInst>0?'pointer':'default'}} title="Ver eventos de parcelamento"
        onClick={()=>futureInst>0&&openAggregate(go,{origem:'parcelamento'})}><span>Comprometido (parcelas futuras)</span><b>{BRL(futureInst)}</b></div>

    {report==='balanco' && <React.Fragment>

        <ChartJS type="bar" height={240} data={{labels:months.map(ptMonth),datasets:[

          {label:'Despesas',data:months.map(m=>monthTotals[m]||0),backgroundColor:cssVar('--neg-soft')||'rgba(224,90,122,.25)',borderColor:cssVar('--neg'),borderWidth:1,borderRadius:5,order:2},
          {type:'line',label:'Saldo',data:saldoMes,borderColor:cssVar('--accent-2'),borderWidth:2.5,tension:.4,pointRadius:3,pointBackgroundColor:'#fff',pointBorderColor:cssVar('--accent-2'),pointBorderWidth:2,fill:false,order:1},
        ]}} options={{plugins:{legend:{display:true}}}}/></div>

      <div className="card" style={{marginTop:18}}><div className="card-head"><h3>Balanço mês a mês</h3></div>
        <div className="tbl-wrap" style={{maxHeight:560,overflow:'auto'}}><table className="tbl comp"><thead><tr>

              onClick={()=>v&&go('lancamentos',{categoryId:c.id,period:{mode:'month',mk:m}})}>{v?NUM(v):'·'}</td>;})}

    {report==='receitas' && <div className="card">
