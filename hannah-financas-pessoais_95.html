const RULE_TYPES=[['contains','Descrição contém'],['startsWith','Descrição começa com'],['amountGt','Valor maior que'],['amountLt','Valor menor que'],['card','Cartão é']];
function RuleForm({rule,onClose}){
  const db=useDB();
  const [f,setF]=useState(rule||{type:'contains',value:'',categoryId:db.categories[0]?.id||'',subcategory:'',markFixed:false,markSubscription:false});
  const set=p=>setF(x=>({...x,...p}));
  const subs=(db.categories.find(c=>c.id===f.categoryId)||{}).subs||[];
  function save(){
    const value=(f.type==='amountGt'||f.type==='amountLt')?parseMoney(f.value):f.value;
    if(!value && value!==0) return db.toast('Informe o valor da regra.','warn');
    const data={type:f.type,value,categoryId:f.categoryId,subcategory:f.subcategory||null,markFixed:f.markFixed,markSubscription:f.markSubscription};
    if(rule){db.updateRule(rule.id,data);db.toast('Regra atualizada.');}else{db.addRule(data);db.toast('Regra criada.');}
    onClose();
  }
  return <Modal title={rule?'Editar regra':'Nova regra'} onClose={onClose} foot={<React.Fragment>
      <button className="btn" onClick={onClose}>Cancelar</button>
      <button className="btn primary" onClick={save}>Salvar</button></React.Fragment>}>
    <div className="grid" style={{gridTemplateColumns:'1fr 1fr',gap:14}}>
      <div><label className="lbl">Condição</label><select className="input" value={f.type} onChange={e=>set({type:e.target.value})}>
        {RULE_TYPES.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></div>
      <div><label className="lbl">Valor</label>
        {f.type==='card'
          ? <select className="input" value={f.value} onChange={e=>set({value:e.target.value})}>
              <option value="">—</option>{db.cards.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
          : (f.type==='amountGt'||f.type==='amountLt')
            ? <MoneyInput value={f.value} onChange={v=>set({value:v})}/>
            : <input className="input" value={f.value} onChange={e=>set({value:e.target.value})} placeholder="Ex.: IFOOD"/>}</div>
      <div><label className="lbl">Categoria</label><select className="input" value={f.categoryId} onChange={e=>set({categoryId:e.target.value,subcategory:''})}>
        {db.categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
      <div><label className="lbl">Subcategoria</label><select className="input" value={f.subcategory||''} onChange={e=>set({subcategory:e.target.value})}>
        <option value="">—</option>{subs.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
      <div style={{gridColumn:'1/3',display:'flex',gap:18}}>
        <label style={{display:'flex',gap:7,alignItems:'center'}}><input type="checkbox" checked={f.markFixed} onChange={e=>set({markFixed:e.target.checked})}/> Marcar como fixo</label>
        <label style={{display:'flex',gap:7,alignItems:'center'}}><input type="checkbox" checked={f.markSubscription} onChange={e=>set({markSubscription:e.target.checked})}/> Marcar como assinatura</label>
      </div>
    </div>
  </Modal>;
}
function CategoryForm({cat,onClose}){
  const db=useDB();
  const [f,setF]=useState(cat||{name:'',color:'#0E9F8E',subs:[]});
  const [subsText,setSubsText]=useState((cat&&cat.subs?cat.subs.join(', '):''));
  const set=p=>setF(x=>({...x,...p}));
  const PALETTE=['#0E9F8E','#E0823F','#7C6FE0','#2F9BE0','#E05A7A','#3FB6A0','#9A5FE0','#E0A53F','#E0683F','#5C7080','#B0464B','#2FA36B','#6B7CE0','#94A3B2'];
  function save(){
    if(!f.name.trim()) return db.toast('Informe o nome da categoria.','warn');
    const dupe=db.categories.find(c=>normName(c.name)===normName(f.name) && (!cat||c.id!==cat.id));
    if(dupe) return db.toast(`Já existe a categoria "${dupe.name}".`,'warn');
    const subs=[...new Set(subsText.split(',').map(s=>s.trim()).filter(Boolean))];
    const data={name:f.name.trim(),color:f.color||'#94A3B2',subs};
    if(cat&&cat.id){ db.updateCat(cat.id,data); db.toast('Categoria atualizada.'); }
    else { db.addCat(data); db.toast('Categoria criada.'); }
    onClose();
  }
  return <Modal title={cat&&cat.id?'Editar categoria':'Nova categoria'} onClose={onClose} foot={<React.Fragment>
      <button className="btn" onClick={onClose}>Cancelar</button>
      <button className="btn primary" onClick={save}>Salvar</button></React.Fragment>}>
    <div className="grid" style={{gridTemplateColumns:'1fr',gap:14}}>
      <div><label className="lbl">Nome</label><input className="input" value={f.name} onChange={e=>set({name:e.target.value})} placeholder="Ex.: Pets, Filhos, Doações"/></div>
      <div><label className="lbl">Cor</label>
        <div className="row" style={{gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <input type="color" value={f.color} onChange={e=>set({color:e.target.value})} style={{width:42,height:34,border:'1px solid var(--line)',borderRadius:8,background:'none',cursor:'pointer'}}/>
          {PALETTE.map(c=><button key={c} type="button" onClick={()=>set({color:c})} title={c}
            style={{width:22,height:22,borderRadius:6,background:c,border:f.color===c?'2px solid var(--ink)':'1px solid var(--line)',cursor:'pointer'}}/>)}
        </div>
      </div>
      <div><label className="lbl">Subcategorias (separadas por vírgula)</label>
        <input className="input" value={subsText} onChange={e=>setSubsText(e.target.value)} placeholder="Ex.: Supermercado, Delivery, Restaurantes"/>
        <div className="muted" style={{fontSize:11.5,marginTop:5}}>Use nas regras para detalhar os gastos (ex.: Alimentação › Supermercado).</div>
      </div>
    </div>
  </Modal>;
}
function Regras(){
  const db=useDB();
  const [edit,setEdit]=useState(null);
  const [add,setAdd]=useState(false);
  const [catEdit,setCatEdit]=useState(null);
  const [catAdd,setCatAdd]=useState(false);
  const rules=db.rules||[];
  const learned=rules.filter(r=>r.learned), manual=rules.filter(r=>!r.learned);
  function applyAll(){
    let n=0;
    db.transactions.forEach(t=>{
      const r=db.applyRules({descOrig:t.descOrig,amount:t.amount,cardId:t.cardId});
      if(r.categoryId && r.categoryId!==t.categoryId){db.updateTx(t.id,{categoryId:r.categoryId,subcategory:r.subcategory||t.subcategory});n++;}
    });
    db.toast(n?`${n} lançamentos recategorizados.`:'Nenhuma alteração necessária.');
  }
  const ruleLabel=r=>{const t=RULE_TYPES.find(x=>x[0]===r.type);
    const v=r.type==='card'?(db.cardById(r.value)||{}).name||r.value:(r.type==='amountGt'||r.type==='amountLt')?BRL(r.value):`"${r.value}"`;
    return `${(t||[,r.type])[1]} ${v}`;};
  const RuleTable=({list})=><div className="tbl-wrap"><table className="tbl"><thead><tr>
      <th>Condição</th><th>Categoria</th><th>Marcadores</th><th></th></tr></thead><tbody>
      {list.map(r=><tr key={r.id}>
        <td>{ruleLabel(r)}</td>
        <td><span className="chip" style={{background:db.catColor(r.categoryId)+'22',color:db.catColor(r.categoryId)}}>{db.catName(r.categoryId)}</span>
          {r.subcategory&&<span className="muted" style={{marginLeft:6,fontSize:12}}>› {r.subcategory}</span>}</td>
        <td>{r.markFixed&&<span className="tag">fixo</span>} {r.markSubscription&&<span className="tag">assinatura</span>} {r.learned&&<span className="tag" style={{color:'var(--accent)'}}>aprendida</span>}</td>
        <td className="r"><button className="btn ghost sm" onClick={()=>setEdit(r)}><Icon name="edit" size={14}/></button>
          <button className="btn ghost sm" onClick={()=>{if(confirmDialog('Excluir esta regra?'))db.deleteRule(r.id);}}><Icon name="trash" size={14}/></button></td>
      </tr>)}
      {!list.length&&<tr><td colSpan="4" className="empty">Nenhuma regra.</td></tr>}
    </tbody></table></div>;

  return <div>
    <div className="page-head"><div><h1>Regras de categorização</h1>
      <p className="muted">Categorizam automaticamente os lançamentos importados. As "aprendidas" vêm das suas edições manuais.</p></div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn" onClick={applyAll}><Icon name="check" size={15}/> Aplicar a todos</button>
        <button className="btn primary" onClick={()=>setAdd(true)}><Icon name="plus" size={15}/> Nova regra</button></div></div>

    <div className="kpi-row">
      <div className="kpi"><span>Categorias</span><b>{db.categories.length}</b></div>
      <div className="kpi"><span>Regras manuais</span><b>{manual.length}</b></div>
      <div className="kpi"><span>Regras aprendidas</span><b>{learned.length}</b></div>
    </div>

    <div className="card"><div className="card-head"><h3>Categorias</h3>
      <button className="btn primary sm" onClick={()=>setCatAdd(true)}><Icon name="plus" size={14}/> Nova categoria</button></div>
      <div className="tbl-wrap"><table className="tbl"><thead><tr>
        <th>Categoria</th><th>Subcategorias</th><th className="num">Regras</th><th></th></tr></thead><tbody>
        {db.categories.map(c=>{const nRules=rules.filter(r=>r.categoryId===c.id).length; return <tr key={c.id}>
          <td><span className="chip" style={{background:c.color+'22',color:c.color}}>{c.name}</span></td>
          <td className="muted" style={{fontSize:12.5}}>{(c.subs&&c.subs.length)?c.subs.join(' · '):'—'}</td>
          <td className="num">{nRules}</td>
          <td className="r"><button className="btn ghost sm" onClick={()=>setCatEdit(c)}><Icon name="edit" size={14}/></button>
            <button className="btn ghost sm" onClick={()=>{
              if(nRules>0) return db.toast('Há regras usando esta categoria. Edite-as antes de excluir.','warn');
              if(confirmDialog(`Excluir a categoria "${c.name}"?`))db.deleteCat(c.id);
            }}><Icon name="trash" size={14}/></button></td>
        </tr>;})}
      </tbody></table></div>
    </div>

    <div className="card" style={{marginTop:18}}><div className="card-head"><h3>Regras manuais</h3></div><RuleTable list={manual}/></div>
    {learned.length>0 && <div className="card" style={{marginTop:18}}><div className="card-head"><h3>Regras aprendidas automaticamente</h3></div><RuleTable list={learned}/></div>}
    {add&&<RuleForm onClose={()=>setAdd(false)}/>}
    {edit&&<RuleForm rule={edit} onClose={()=>setEdit(null)}/>}
    {catAdd&&<CategoryForm onClose={()=>setCatAdd(false)}/>}
    {catEdit&&<CategoryForm cat={catEdit} onClose={()=>setCatEdit(null)}/>}
  </div>;
}

/* =========================================================================
   22. RELATÓRIOS
   ========================================================================= */
function Relatorios({go}){
  const db=useDB();
  const dataYears=[...new Set(db.transactions.map(t=>t.date&&t.date.slice(0,4)).filter(Boolean))];
  const anosList=[...new Set([...Array.from({length:51},(_,i)=>String(2000+i)),...dataYears])].sort();
  const months=[...new Set(db.transactions.map(t=>billMonth(t)).filter(Boolean))].sort().reverse();
  const cur=months[0]||monthKey(todayISO());
  // ---- filtros (formulário) ----
  const [scope,setScope]=useState('mensal'); // mensal | anual | intervalo
  const [mes,setMes]=useState(cur.slice(5,7));
  const [ano,setAno]=useState(cur.slice(0,4));
  const [range,setRange]=useState({from:'',to:''});
  const [q,setQ]=useState('');
  const [fCat,setFCat]=useState('');
  const [fType,setFType]=useState('');
  const [groupBy,setGroupBy]=useState('categoria');
  const [showDetail,setShowDetail]=useState(true);
  const [applied,setApplied]=useState(null); // snapshot dos filtros no momento de gerar

  const TYPE_LABEL={cartao:'Cartão',conta:'Débito em conta',fixo:'Despesa fixa',variavel:'Despesa variável',parcelado:'Parcelado',renegociacao:'Renegociação'};
  const GROUP_LABEL={categoria:'Categoria',tipo:'Tipo',mes:'Mês',desc:'Descrição'};

  function monthsBetween(from,to){ if(!from||!to) return [];
    const out=[]; let [y,m]=from.slice(0,7).split('-').map(Number); const end=to.slice(0,7);
    while(out.length<120){ const k=`${y}-${String(m).padStart(2,'0')}`; out.push(k); if(k>=end) break; m++; if(m>12){m=1;y++;} } return out; }

  function gerar(){
    if(scope==='intervalo' && (!range.from||!range.to)) return db.toast('Informe as datas "De" e "Até" do intervalo.','warn');
    setApplied({scope,mes,ano,range:{...range},q:q.trim(),fCat,fType,groupBy});
  }
  function limparFiltros(){ setQ(''); setFCat(''); setFType(''); }

  // ---- cálculo do relatório (somente após "Gerar relatório") ----
  const report=useMemo(()=>{
    if(!applied) return null;
    const {scope,mes,ano,range,q,fCat,fType,groupBy}=applied;
    const mk=`${ano}-${mes}`;
    const inScope=d=> scope==='mensal'? monthKey(d)===mk : scope==='anual'? String(d||'').slice(0,4)===ano : ((!range.from||d>=range.from)&&(!range.to||d<=range.to));
    const scopeMonths= scope==='mensal'?[mk] : scope==='anual'?Array.from({length:12},(_,i)=>`${ano}-${String(i+1).padStart(2,'0')}`) : monthsBetween(range.from,range.to);
    const ev=[];
    db.allTx.filter(t=>isSpend(t)&&inScope(billDate(t))).forEach(t=>{
      const type=t._reneg?'renegociacao':(t.installmentTotal>1?'parcelado':(t.cardId?'cartao':'conta'));
      ev.push({date:billDate(t),mk:billMonth(t),desc:(t.descPad||t.descOrig||'—'),amount:spendOf(t),categoryId:t.categoryId||null,type,qty:1,id:t.id});
    });
    const fmR=db.settings?.fixedMonthly||{};
    const suppR=suppressedFixedOccurrences(db,scopeMonths);
    (db.fixed||[]).forEach(f=>{ scopeMonths.forEach(m=>{
      if(!fixedVigente(f,m)) return;
      if(suppR.has(`${f.id}:${m}`)) return; // §14 Desenho 1: já há realizado equivalente
      const isVar=f.kind==='variavel'; const isParc=(+f.parcelas||1)>1||f.kind==='parcelado';
      const type=isVar?'variavel':(isParc?'parcelado':'fixo');
      const date=`${m}-${String(f.dom||1).padStart(2,'0')}`;
      const mAmt=fixedAmount(f,m,fmR);
      if(isVar&&(f.qtd||1)>1&&f.valorUnit){ for(let k=0;k<(f.qtd||1);k++) ev.push({date,mk:m,desc:f.desc,amount:round2(f.valorUnit),categoryId:f.categoryId||null,type,qty:1}); }
      else ev.push({date,mk:m,desc:f.desc,amount:mAmt,categoryId:f.categoryId||null,type,qty:(isVar?(f.qtd||1):1)});
    }); });
    const qn=normDesc(q);
    const filtered=ev.filter(e=>(!qn||normDesc(e.desc).includes(qn))&&(!fCat||e.categoryId===fCat)&&(!fType||e.type===fType));
    const total=round2(filtered.reduce((s,e)=>s+e.amount,0));
    const count=filtered.reduce((s,e)=>s+(e.qty||1),0);
    const avg=count?round2(total/count):0;
    const keyOf=e=> groupBy==='categoria'?(db.catName(e.categoryId)||'(sem categoria)'):groupBy==='tipo'?(TYPE_LABEL[e.type]||e.type):groupBy==='mes'?e.mk:(e.desc||'—').trim();
    const gm={}; filtered.forEach(e=>{const k=keyOf(e);(gm[k]=gm[k]||{key:k,count:0,total:0});gm[k].count+=(e.qty||1);gm[k].total=round2(gm[k].total+e.amount);});
    const grouped=Object.values(gm).map(g=>({...g,avg:g.count?round2(g.total/g.count):0}));
    grouped.sort(groupBy==='mes'?((a,b)=>a.key<b.key?-1:1):((a,b)=>b.total-a.total));
    const detail=[...filtered].sort((a,b)=>a.date<b.date?-1:1);
    const periodLabel= scope==='mensal'?monthLong(mk):scope==='anual'?('Ano de '+ano):`${ptDate(range.from)} a ${ptDate(range.to)}`;
    const periodSlug= scope==='mensal'?mk:scope==='anual'?ano:`${range.from}_${range.to}`;
    const filtersDesc=[ q?`busca: "${q}"`:null, fCat?`categoria: ${db.catName(fCat)}`:null, fType?`tipo: ${TYPE_LABEL[fType]}`:null ].filter(Boolean);
    return {total,count,avg,grouped,detail,periodLabel,periodSlug,groupBy,filtersDesc};
  },[applied,db.allTx,db.fixed,db.categories]);

  function exportCSV(){
    if(!report) return;
    const L=[['Relatório',report.periodLabel],['Filtros',...(report.filtersDesc.length?report.filtersDesc:['nenhum'])],
      ['Total',NUM(report.total)],['Ocorrências',report.count],['Valor médio',NUM(report.avg)],[],
      ['Agrupado por '+GROUP_LABEL[report.groupBy],'Ocorrências','Total','Média']];
    report.grouped.forEach(g=>L.push([report.groupBy==='mes'?monthLong(g.key):g.key,g.count,NUM(g.total),NUM(g.avg)]));
    L.push(['TOTAL GERAL',report.count,NUM(report.total),NUM(report.avg)]);
    L.push([],['Lançamentos detalhados'],['Data','Descrição','Categoria','Tipo','Valor']);
    report.detail.forEach(e=>L.push([ptDate(e.date),e.desc,db.catName(e.categoryId)||'(sem categoria)',TYPE_LABEL[e.type]||e.type,NUM(e.amount)]));
    const csv=L.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`relatorio_${report.periodSlug}.csv`;a.click();
    db.toast('Relatório exportado em CSV.');
  }
  function printPDF(){
    if(!report) return;
    const wide=applied&&applied.scope!=='mensal'; let st=null;
    if(wide){ st=document.createElement('style'); st.textContent='@page{size:A4 landscape;margin:8mm}'; document.head.appendChild(st); }
    const cleanup=()=>{ if(st)st.remove(); window.removeEventListener('afterprint',cleanup); };
    window.addEventListener('afterprint',cleanup); window.print(); setTimeout(cleanup,1500);
  }
  // ETAPA 2: o "total" de um relatório é um agregado; abrir sua origem = abrir o
  // conjunto de eventos que o compõem (relatórios cobrem saídas/despesas).
  function presetFromApplied(){
    if(!applied) return {natureza:'saida'};
    if(applied.scope==='mensal') return {ano:applied.ano,mes:applied.mes,natureza:'saida'};
    if(applied.scope==='anual') return {ano:applied.ano,mes:'all',natureza:'saida'};
    return {ano:'all',mes:'all',natureza:'saida'};
  }
  const openReportRow=e=>{ if(e&&e.id) go('lancamentos',{focusTx:e.id}); else openAggregate(go,presetFromApplied()); };

  return <div>
    <div className="page-head"><div><h1>Relatórios</h1>
      <p className="muted">Central de análise: defina os filtros e gere relatórios claros por categoria, tipo, mês, prestador ou palavra-chave.</p></div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn" disabled={!report} onClick={exportCSV}><Icon name="download" size={15}/> CSV</button>
        <button className="btn primary" disabled={!report} onClick={printPDF}><Icon name="report" size={15}/> Gerar PDF</button></div></div>

    {/* ---- PAINEL DE FILTROS (único lugar) ---- */}
    <div className="card pad no-print" style={{marginBottom:16}}>
      <div className="row" style={{gap:12,alignItems:'flex-end',flexWrap:'wrap'}}>
        <div><label className="lbl">Período</label>
          <div className="seg">
            <button className={scope==='mensal'?'on':''} onClick={()=>setScope('mensal')}>Mensal</button>
            <button className={scope==='anual'?'on':''} onClick={()=>setScope('anual')}>Anual</button>
            <button className={scope==='intervalo'?'on':''} onClick={()=>setScope('intervalo')}>Intervalo</button>
          </div></div>
        {scope==='mensal' && <React.Fragment>
          <div><label className="lbl">Mês</label>
            <select className="input" style={{width:'auto'}} value={mes} onChange={e=>setMes(e.target.value)}>
              {MESES_PT.map((nm,i)=>{const mm=String(i+1).padStart(2,'0');return <option key={mm} value={mm}>{nm}</option>;})}</select></div>
          <div><label className="lbl">Ano</label>
            <select className="input" style={{width:'auto'}} value={ano} onChange={e=>setAno(e.target.value)}>
              {anosList.map(y=><option key={y} value={y}>{y}</option>)}</select></div>
        </React.Fragment>}
        {scope==='anual' && <div><label className="lbl">Ano</label>
          <select className="input" style={{width:'auto'}} value={ano} onChange={e=>setAno(e.target.value)}>
            {anosList.map(y=><option key={y} value={y}>{y}</option>)}</select></div>}
        {scope==='intervalo' && <React.Fragment>
          <div><label className="lbl">De</label><input className="input" type="date" value={range.from} onChange={e=>setRange(r=>({...r,from:e.target.value}))}/></div>
          <div><label className="lbl">Até</label><input className="input" type="date" value={range.to} onChange={e=>setRange(r=>({...r,to:e.target.value}))}/></div>
        </React.Fragment>}
      </div>

      <div className="row" style={{gap:12,alignItems:'flex-end',flexWrap:'wrap',marginTop:12}}>
        <div style={{flex:'1 1 240px'}}><label className="lbl">Buscar (descrição / prestador / palavra-chave)</label>
          <input className="input" value={q} onChange={e=>setQ(e.target.value)} placeholder="Ex.: diarista, Amazon, energia…" onKeyDown={e=>{if(e.key==='Enter')gerar();}}/></div>
        <div><label className="lbl">Categoria</label>
          <select className="input" style={{width:'auto'}} value={fCat} onChange={e=>setFCat(e.target.value)}>
            <option value="">Todas</option>{db.categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
        <div><label className="lbl">Tipo de despesa</label>
          <select className="input" style={{width:'auto'}} value={fType} onChange={e=>setFType(e.target.value)}>
            <option value="">Todos</option>
            <option value="fixo">Despesa fixa</option><option value="variavel">Despesa variável</option>
            <option value="parcelado">Parcelado</option><option value="cartao">Cartão</option>
            <option value="conta">Débito em conta</option><option value="renegociacao">Renegociação</option></select></div>
        <div><label className="lbl">Agrupar por</label>
          <select className="input" style={{width:'auto'}} value={groupBy} onChange={e=>setGroupBy(e.target.value)}>
            <option value="categoria">Categoria</option><option value="tipo">Tipo</option>
            <option value="mes">Mês</option><option value="desc">Descrição</option></select></div>
      </div>

      <div className="row" style={{gap:8,marginTop:14}}>
        <button className="btn primary" onClick={gerar}><Icon name="search" size={15}/> Gerar relatório</button>
        {(q||fCat||fType)&&<button className="btn" onClick={limparFiltros}>Limpar filtros</button>}
        {applied&&<button className="btn ghost" onClick={()=>setApplied(null)}>Nova consulta</button>}
      </div>
    </div>

    {/* ---- RESULTADO ---- */}
    {!report
      ? <div className="card pad" style={{textAlign:'center',padding:'48px 24px'}}>
          <div style={{display:'flex',justifyContent:'center',marginBottom:12,opacity:.7}}><Icon name="report" size={34}/></div>
          <p style={{fontWeight:700,margin:'0 0 4px'}}>Defina os filtros acima e clique em <span style={{color:'var(--accent)'}}>Gerar relatório</span></p>
          <p className="muted" style={{fontSize:13,margin:0}}>O sistema busca em todos os seus lançamentos — cartões, contas, gastos fixos e variáveis, parcelamentos e renegociações — e monta uma análise organizada.</p>
        </div>
      : <div className="card pad" id="report-out">
          <div className="report-title" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,marginBottom:6,flexWrap:'wrap'}}>
            <div><h2 style={{fontSize:19,margin:0}}>Relatório · {report.periodLabel}</h2>
              {report.filtersDesc.length>0 && <p className="muted" style={{fontSize:12.5,margin:'4px 0 0'}}>Filtros — {report.filtersDesc.join(' · ')}</p>}</div>
          </div>

          <div className="kpi-row" style={{margin:'14px 0'}}>
            <div className="kpi neg clickable" style={{cursor:report.total>0?'pointer':'default'}} title="Abrir os eventos que compõem este total"
              onClick={()=>report.total>0&&openAggregate(go,presetFromApplied())}><span>Total no período</span><b>{BRL(report.total)}</b></div>
            <div className="kpi"><span>Ocorrências</span><b>{report.count}</b></div>
            <div className="kpi"><span>Valor médio</span><b>{BRL(report.avg)}</b></div>
          </div>

          <h3 style={{fontSize:15,margin:'8px 0 8px'}}>Resumo por {GROUP_LABEL[report.groupBy].toLowerCase()}</h3>
          {report.grouped.length===0
            ? <div className="empty">Nenhum lançamento encontrado com esses filtros no período.</div>
            : <div className="tbl-wrap"><table className="tbl"><thead><tr>
                <th>{GROUP_LABEL[report.groupBy]}</th><th className="r">Ocorrências</th><th className="r">Total</th><th className="r">Média</th></tr></thead><tbody>
                {report.grouped.map(g=><tr key={g.key} style={{cursor:'pointer'}} title="Abrir a origem deste grupo"
                  onClick={()=>report.groupBy==='mes'?go('lancamentos',{period:{mode:'month',mk:g.key}}):openAggregate(go,presetFromApplied())}>
                  <td><b>{report.groupBy==='mes'?monthLong(g.key):g.key}</b></td>
                  <td className="r num">{g.count}</td><td className="r num">{BRL(g.total)}</td><td className="r num">{BRL(g.avg)}</td></tr>)}
                <tr style={{borderTop:'2px solid var(--line)',fontWeight:800}}>
                  <td>Total geral</td><td className="r num">{report.count}</td><td className="r num">{BRL(report.total)}</td><td className="r num">{BRL(report.avg)}</td></tr>
              </tbody></table></div>}

          {report.detail.length>0 && <React.Fragment>
            <div className="row" style={{justifyContent:'space-between',alignItems:'center',margin:'18px 0 6px'}}>
              <h3 style={{margin:0,fontSize:15}}>Lançamentos detalhados ({report.detail.length})</h3>
              <button className="btn ghost sm no-print" onClick={()=>setShowDetail(v=>!v)}>{showDetail?'Ocultar':'Mostrar'}</button>
            </div>
            {showDetail && <div className="tbl-wrap"><table className="tbl"><thead><tr>
                <th className="num">Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th className="r">Valor</th></tr></thead><tbody>
                {report.detail.slice(0,500).map((e,i)=><tr key={i} style={{cursor:'pointer'}} title={e.id?'Abrir este lançamento':'Abrir no Centro de eventos'}
                  onClick={()=>openReportRow(e)}>
                  <td className="num">{ptDate(e.date)}</td><td>{e.desc}</td>
                  <td>{db.catName(e.categoryId)||'—'}</td>
                  <td><span className="tag">{TYPE_LABEL[e.type]||e.type}</span></td>
                  <td className="r num">{BRL(e.amount)}</td></tr>)}
              </tbody></table>
              {report.detail.length>500&&<p className="muted" style={{fontSize:12,marginTop:8}}>Mostrando os primeiros 500 lançamentos. Exporte em CSV para a lista completa.</p>}
            </div>}
          </React.Fragment>}
        </div>}
  </div>;
}


/* =========================================================================
   23. CONFIGURAÇÕES
   ========================================================================= */
function Configuracoes({go}){
  const db=useDB();
  const fileRef=useRef();
  const theme=db.settings?.theme||'light';
  const [gKey,setGKey]=useState(db.settings?.geminiKey||'');
  const [gModel,setGModel]=useState(db.settings?.geminiModel||'gemini-2.5-flash');
  const [gTesting,setGTesting]=useState(false);
  const [showKey,setShowKey]=useState(false);
  const [cKey,setCKey]=useState(db.settings?.anthropicKey||'');
  const [cModel,setCModel]=useState(db.settings?.anthropicModel||'claude-sonnet-4-6');
  const [cTesting,setCTesting]=useState(false);
  const [showCKey,setShowCKey]=useState(false);
  function saveGemini(){
    db.setSettings({geminiKey:gKey.trim(),geminiModel:gModel.trim()||'gemini-2.5-flash'});
    db.toast(gKey.trim()?'Integração com Gemini salva.':'Chave do Gemini removida.');
  }
  function saveClaude(){
    db.setSettings({anthropicKey:cKey.trim(),anthropicModel:cModel.trim()||'claude-sonnet-4-6'});
    db.toast(cKey.trim()?'Integração com Claude (Anthropic) salva.':'Chave da Anthropic removida.');
  }
  async function testClaude(){
    if(!cKey.trim()) return db.toast('Cole a chave da Anthropic primeiro.','warn');
    setCTesting(true);
    try{
      await claudeTest(cKey.trim(), cModel.trim());
      db.setSettings({anthropicKey:cKey.trim(),anthropicModel:cModel.trim()||'claude-sonnet-4-6'});
      db.toast('Conexão OK! Claude configurado com '+(cModel.trim()||'claude-sonnet-4-6')+'.');
    }catch(e){
      const msg=/504|tempo-limite|aborted/i.test(e.message)
        ? 'A conexão demorou demais. Tente novamente em instantes.'
        : /429|rate|overloaded|529/i.test(e.message)
          ? 'Limite/sobrecarga temporária (429/529). Aguarde alguns instantes e tente de novo.'
        : /401|authentication|invalid x-api-key|invalid api/i.test(e.message)
          ? 'Chave inválida. Gere uma nova em console.anthropic.com (API Keys).'
        : /403|permission|credit balance|billing/i.test(e.message)
          ? 'Sem créditos/permissão. Verifique o saldo e o faturamento em console.anthropic.com.'
        : /404|model/i.test(e.message)
          ? 'Modelo indisponível. Use claude-sonnet-4-6, claude-haiku-4-5-20251001 ou claude-opus-4-8.'
        : /Failed to fetch|CORS/i.test(e.message)
          ? 'Não foi possível conectar (Failed to fetch). Verifique sua internet.'
          : 'Falha: '+e.message.replace('CLAUDE ','');
      db.toast(msg,'err');
    }
    setCTesting(false);
  }
  async function testGemini(){
    if(!gKey.trim()) return db.toast('Cole a chave do Gemini primeiro.','warn');
    setGTesting(true);
    try{
      const working=await geminiFindModel(gKey.trim(), gModel.trim());
      setGModel(working);
      db.setSettings({geminiKey:gKey.trim(),geminiModel:working});
      db.toast('Conexão OK! Modelo em uso: '+working+'. Configuração salva.');
    }catch(e){
      const msg=/504|tempo-limite|aborted/i.test(e.message)
        ? 'A conexão demorou demais e foi interrompida. Verifique sua internet e tente novamente — costuma funcionar na 2ª tentativa.'
        : /prepayment|credits are depleted|billing|cr[eé]ditos/i.test(e.message)
        ? 'Seus créditos pré-pagos do Google acabaram. Adicione créditos / ajuste o faturamento em ai.studio/projects (ou use o OCR local enquanto isso). Não é problema do app.'
        : /503|500|overload|UNAVAILABLE|high demand/i.test(e.message)
        ? 'Os servidores do Gemini estão temporariamente sobrecarregados (erro 503). Tente novamente em alguns instantes.'
        : /429|RESOURCE_EXHAUSTED|limit: 0/i.test(e.message)
          ? 'Limite de uso atingido (429). Pode ser cota esgotada ou créditos pré-pagos zerados — verifique em ai.studio/projects.'
        : /API_KEY_INVALID|API key not valid|400|403/i.test(e.message)
          ? 'Chave inválida. Gere uma nova em aistudio.google.com/apikey.'
        : /Failed to fetch/i.test(e.message)
          ? 'Não foi possível conectar (Failed to fetch). Verifique sua internet.'
          : 'Falha: '+e.message.replace('GEMINI ','');
      db.toast(msg,'err');
    }
    setGTesting(false);
  }
  function backup(){
    const data={_app:'meu-controle-financeiro',_version:38,_exportedAt:new Date().toISOString()};
    KEYS.forEach(k=>data[k]=db[k]);
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`backup_mcf_${todayISO()}.json`;a.click();
    db.toast('Backup completo exportado.');
  }
  async function restore(e){
    const file=e.target.files[0]; if(!file) return;
    try{ const data=JSON.parse(await file.text());
      for(const k of KEYS){ if(data[k]!==undefined) await store.set('mcf:'+k,data[k]); }
      db.toast('Backup restaurado. Recarregando…'); setTimeout(()=>location.reload(),800);
    }catch(err){ db.toast('Arquivo inválido.','err'); }
  }
  return <div>
    <div className="page-head"><div><h1>Configurações</h1>
      <p className="muted">Perfil, aparência, backup e gerenciamento de dados.</p></div></div>

    <div className="card pad"><h3>Seu nome</h3>
      <p className="muted" style={{fontSize:13,margin:'6px 0 10px'}}>Aparece no rodapé do menu, acima do seu e-mail (ex.: "Controle financeiro de João Pedro").</p>
      <input className="input" style={{maxWidth:420}} defaultValue={db.settings?.userName||''} placeholder="Ex.: João Pedro"
        onBlur={e=>{ db.setSettings({userName:e.target.value.trim()}); db.toast('Nome salvo.'); }}/>
    </div>

    <div className="card pad" style={{marginTop:18}}><h3>Aparência</h3>
      <div className="row" style={{gap:10,marginTop:10}}>
        <button className={"btn "+(theme==='light'?'primary':'')} onClick={()=>db.setTheme('light')}><Icon name="sun" size={15}/> Claro</button>
        <button className={"btn "+(theme!=='light'?'primary':'')} onClick={()=>db.setTheme(db.settings?.darkTheme||'dark')}><Icon name="moon" size={15}/> Escuro</button>
      </div>
      {theme!=='light' && <div style={{marginTop:12}}>
        <label className="lbl">Base do tema escuro</label>
        <div className="seg" style={{marginTop:6,maxWidth:240}}>
          <button className={theme==='dark'?'on':''} onClick={()=>db.setSettings({theme:'dark',darkTheme:'dark'})}>Verde</button>
          <button className={theme==='dark-blue'?'on':''} onClick={()=>db.setSettings({theme:'dark-blue',darkTheme:'dark-blue'})}>Azul</button>
        </div>
        <p className="muted" style={{fontSize:12,margin:'6px 0 0'}}>Alterna o fundo do modo escuro entre verde (HANNAH) e azul-escuro, conforme a marca.</p>
      </div>}
      <p className="muted" style={{fontSize:13,margin:'14px 0 10px',lineHeight:1.6}}>
        Quer mudar as <b>cores da marca</b> (acento da sidebar, botões, cards e gráficos)? Escolha entre os temas
        <b> HANNAH Padrão</b>, <b>AC DEV</b> ou um tema personalizado. A tela de login não é afetada.</p>
      {go && <button className="btn" onClick={()=>go('aparencia')}><Icon name="spark" size={15}/> Personalizar cores da marca</button>}
    </div>

    <div className="card pad" style={{marginTop:18}}><h3>Dashboard</h3>
      <p className="muted" style={{fontSize:13,margin:'6px 0 12px',lineHeight:1.6}}>
        Escolha quais blocos aparecem no painel inicial. Você também pode ocultar cada um direto no Dashboard.</p>
      <div className="grid" style={{gap:10}}>
        <label className="row" style={{gap:10,alignItems:'center',cursor:'pointer',fontWeight:600}}>
          <input type="checkbox" checked={db.settings?.dashShowHero!==false} onChange={e=>db.setSettings({dashShowHero:e.target.checked})} style={{width:18,height:18,accentColor:'var(--accent)'}}/>
          Resumo do período (cards interativos)
        </label>
        <label className="row" style={{gap:10,alignItems:'center',cursor:'pointer',fontWeight:600}}>
          <input type="checkbox" checked={!!db.settings?.dashShowTotals} onChange={e=>db.setSettings({dashShowTotals:e.target.checked})} style={{width:18,height:18,accentColor:'var(--accent)'}}/>
          Totais (grade detalhada de indicadores)
        </label>
        <label className="row" style={{gap:10,alignItems:'center',cursor:'pointer',fontWeight:600}}>
          <input type="checkbox" checked={db.settings?.dashShowInsights!==false} onChange={e=>db.setSettings({dashShowInsights:e.target.checked})} style={{width:18,height:18,accentColor:'var(--accent)'}}/>
          Insights (observações automáticas)
        </label>
        <label className="row" style={{gap:10,alignItems:'center',cursor:'pointer',fontWeight:600}}>
          <input type="checkbox" checked={db.settings?.dashShowCharts!==false} onChange={e=>db.setSettings({dashShowCharts:e.target.checked})} style={{width:18,height:18,accentColor:'var(--accent)'}}/>
          Gráficos
        </label>
      </div>
    </div>

    <div className="card pad" style={{marginTop:18,borderColor:'var(--accent)'}}><h3>Integração com IA — Claude (Anthropic) · principal</h3>
      <p className="muted" style={{fontSize:13,margin:'6px 0 12px',lineHeight:1.6}}>
        Provedor principal de leitura das faturas. Usa sua chave da Anthropic (paga) — o custo por fatura costuma ser de
        poucos centavos (são só algumas imagens por fatura). Gere sua chave em{' '}
        <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noreferrer" style={{color:'var(--accent)'}}>console.anthropic.com</a> (API Keys).
        A chave fica salva apenas no seu navegador.</p>
      <div className="grid" style={{gridTemplateColumns:'2fr 1fr',gap:12,alignItems:'end'}}>
        <div><label className="lbl">Chave de API (API key)</label>
          <div style={{display:'flex',gap:6}}>
            <input className="input" type={showCKey?'text':'password'} value={cKey} onChange={e=>setCKey(e.target.value)} placeholder="sk-ant-…" autoComplete="off"/>
            <button className="btn ghost sm" onClick={()=>setShowCKey(s=>!s)} title="Mostrar/ocultar">{showCKey?'Ocultar':'Mostrar'}</button>
          </div></div>
        <div><label className="lbl">Modelo</label>
          <input className="input" value={cModel} onChange={e=>setCModel(e.target.value)} placeholder="claude-sonnet-4-6"/></div>
      </div>
      <div className="row" style={{gap:10,marginTop:12}}>
        <button className="btn primary" onClick={saveClaude}>Salvar</button>
        <button className="btn" disabled={cTesting} onClick={testClaude}>{cTesting?<span className="spin"/>:<Icon name="spark" size={15}/>} Testar conexão</button>
        {db.settings?.anthropicKey&&<span className="chip pos" style={{alignSelf:'center'}}>● Claude configurado</span>}
      </div>
      <p className="muted" style={{fontSize:11.5,marginTop:10}}>Modelos: <code>claude-sonnet-4-6</code> (recomendado — ótima precisão em faturas) ou <code>claude-haiku-4-5-20251001</code> (mais barato e rápido). <code>claude-opus-4-8</code> é o mais capaz (e mais caro). Na importação, a ordem é: <b>Claude → Gemini → OCR local</b>.</p>
    </div>

    <div className="card pad" style={{marginTop:18}}><h3>Integração com IA — Google Gemini (segundo plano)</h3>
      <p className="muted" style={{fontSize:13,margin:'6px 0 12px',lineHeight:1.6}}>
        Reserva automática: se o Claude falhar (sem créditos/instabilidade), a leitura usa o Gemini. Funciona com chave
        gratuita ou paga — o nível é definido pela própria chave que você gera no Google. Gere em{' '}
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer" style={{color:'var(--accent)'}}>aistudio.google.com/apikey</a>.
        A chave fica salva apenas no seu navegador.</p>
      <div className="grid" style={{gridTemplateColumns:'2fr 1fr',gap:12,alignItems:'end'}}>
        <div><label className="lbl">Chave de API (API key)</label>
          <div style={{display:'flex',gap:6}}>
            <input className="input" type={showKey?'text':'password'} value={gKey} onChange={e=>setGKey(e.target.value)} placeholder="AIza…" autoComplete="off"/>
            <button className="btn ghost sm" onClick={()=>setShowKey(s=>!s)} title="Mostrar/ocultar">{showKey?'Ocultar':'Mostrar'}</button>
          </div></div>
        <div><label className="lbl">Modelo</label>
          <input className="input" value={gModel} onChange={e=>setGModel(e.target.value)} placeholder="gemini-2.5-flash"/></div>
      </div>
      <div className="row" style={{gap:10,marginTop:12}}>
        <button className="btn primary" onClick={saveGemini}>Salvar</button>
        <button className="btn" disabled={gTesting} onClick={testGemini}>{gTesting?<span className="spin"/>:<Icon name="spark" size={15}/>} Testar conexão</button>
        {db.settings?.geminiKey&&<span className="chip pos" style={{alignSelf:'center'}}>● Gemini configurado</span>}
      </div>
      <p className="muted" style={{fontSize:11.5,marginTop:10}}>Ao clicar em <b>"Testar conexão"</b>, o sistema consulta sua chave e seleciona automaticamente o melhor modelo disponível. Modelos atuais (2026): <code>gemini-3.5-flash</code> (mais inteligente, ótimo custo-benefício), <code>gemini-3-flash</code>, <code>gemini-2.5-flash</code> e <code>gemini-2.5-flash-lite</code> (mais barato). Os modelos 1.5 e 2.0 foram descontinuados pelo Google. Deixe o campo "Modelo" em branco para detecção automática.</p>
    </div>

    <div className="card pad" style={{marginTop:18}}><h3>Backup e restauração</h3>
      <p className="muted" style={{fontSize:13,margin:'6px 0 10px'}}>Exporte <b>todos</b> os seus dados (lançamentos, cartões, gastos fixos, renegociações, divisão, anotações, regras e configurações) para um arquivo JSON, ou restaure de um backup anterior.</p>
      <div className="chip" style={{marginBottom:12,fontSize:12.5,padding:'8px 12px',alignItems:'flex-start',lineHeight:1.45,display:'block'}}>
        {store.mode()==='local'
          ? <span><b>Onde seus dados ficam:</b> salvos neste navegador, no seu dispositivo (localStorage). Eles permanecem ao fechar e reabrir. Atenção: são específicos deste navegador/dispositivo e podem ser apagados se você limpar os dados de navegação — por isso exporte um backup de tempos em tempos.</span>
          : store.mode()==='app'
          ? <span><b>Onde seus dados ficam:</b> no armazenamento do aplicativo. Para usar em outro lugar ou guardar uma cópia de segurança, exporte um backup.</span>
          : <span><b>Atenção:</b> este navegador não permitiu salvar dados de forma permanente — eles podem se perder ao recarregar. Exporte um backup com frequência.</span>}
      </div>
      <div className="row" style={{gap:10}}>
        <button className="btn" onClick={backup}><Icon name="download" size={15}/> Exportar backup (JSON)</button>
        <button className="btn" onClick={()=>fileRef.current.click()}><Icon name="import" size={15}/> Restaurar backup</button>
        <input ref={fileRef} type="file" accept="application/json,.json" style={{display:'none'}} onChange={restore}/>
      </div>
    </div>

    <div className="card pad" style={{marginTop:18,borderColor:'var(--warn)'}}><h3>Gerenciamento de dados</h3>
      <div className="row" style={{gap:10,marginTop:10,flexWrap:'wrap'}}>
        <button className="btn" onClick={()=>{if(confirmDialog('Recarregar os dados de demonstração? Seus dados atuais serão substituídos.'))db.resetDemo();}}>Recarregar demonstração</button>
        <button className="btn danger" onClick={()=>{if(confirmDialog('Apagar TODOS os dados? Esta ação não pode ser desfeita.'))db.wipe();}}><Icon name="trash" size={15}/> Apagar todos os dados</button>
      </div>
    </div>

    <div className="card pad" style={{marginTop:18}}><h3>Sobre</h3>
      <p className="muted" style={{fontSize:13,lineHeight:1.6}}>
        <b>HANNAH — Finanças Pessoais</b> — sistema completo de finanças pessoais com importação automática de faturas
        (PDF com texto, PDF escaneado, imagem, CSV e XLSX), leitor híbrido com extração direta + OCR/IA, validação matemática
        (soma × total da fatura), categorização automática com aprendizado, detecção de gastos fixos, controle de parcelamentos,
        orçamentos, receitas e relatórios. Os dados ficam salvos localmente no seu navegador.</p>
    </div>
  </div>;
}

/* =========================================================================
   23b. CENTRO DE EVENTOS FINANCEIROS — tela
   Lista única e rastreável de todos os valores do sistema. Cada linha abre
   EXATAMENTE o registro de origem (openOrigin), nunca um filtro genérico.
   ========================================================================= */
function CentroEventos({go,nav}){
  const db=useDB();
  const events=useMemo(()=>buildFinancialEvents(db),[db.transactions,db.incomes,db.auditIncomes,db.fixed,db.renegotiations,db.cards,db.files,db.settings,db.categories]);

  const [fMod,setFMod]=useStickyState('ev.mod','');
  const [fOri,setFOri]=useStickyState('ev.ori','');
  const [fCls,setFCls]=useStickyState('ev.cls','');
  const [fNat,setFNat]=useStickyState('ev.nat','');
  const [fAno,setFAno]=useStickyState('ev.ano','all');
  const [fMes,setFMes]=useStickyState('ev.mes','all');
  const [busca,setBusca]=useState('');

  // ETAPA 2: quando chega um agregado clicado de outra tela, aplica o filtro exato.
  const presetKey=nav&&nav.preset?JSON.stringify(nav.preset):'';
  useEffect(()=>{
    if(!nav||!nav.preset) return;
    const p=nav.preset;
    setFMod(p.modulo||''); setFOri(p.origem||''); setFCls(p.classe||'');
    setFNat(p.natureza||''); setFAno(p.ano||'all'); setFMes(p.mes||'all');
    setBusca(p.busca||'');
  },[presetKey]);

  const anosList=useMemo(()=>yearOptions(events.map(e=>(e.data_evento||e._mk||'').slice(0,4))),[events]);
  const origensPresentes=useMemo(()=>[...new Set(events.map(e=>e.origem))],[events]);
  const modulosPresentes=useMemo(()=>[...new Set(events.map(e=>e.modulo_origem))],[events]);
  const classesPresentes=useMemo(()=>[...new Set(events.map(e=>e.classe))],[events]);

  const entradaTipos=new Set(['receita','receita_importada']);
  const filtered=events.filter(e=>{
    if(fMod && e.modulo_origem!==fMod) return false;
    if(fOri && e.origem!==fOri) return false;
    if(fCls && e.classe!==fCls) return false;
    if(fNat==='entrada' && !entradaTipos.has(e.tipo_evento)) return false;
    if(fNat==='saida' && (entradaTipos.has(e.tipo_evento)||e.modulo_origem==='cartao'||e.modulo_origem==='importacao')) return false;
    const ymk=e.data_evento?e.data_evento.slice(0,7):(e._mk||'');
    if(fAno!=='all' && ymk.slice(0,4)!==fAno) return false;
    if(fMes!=='all' && ymk.slice(5,7)!==fMes) return false;
    if(busca){ const q=normDesc(busca); if(!normDesc((e._desc||'')+' '+e.origem+' '+e.modulo_origem).includes(q)) return false; }
    return true;
  });
  const fActive=(fMod?1:0)+(fOri?1:0)+(fCls?1:0)+(fNat?1:0)+(fAno!=='all'?1:0)+(fMes!=='all'?1:0)+(busca?1:0);
  const clear=()=>{setFMod('');setFOri('');setFCls('');setFNat('');setFAno('all');setFMes('all');setBusca('');};

  // soma por natureza (entradas vs. saídas) — só para orientação, não substitui o Dashboard
  const somaEntradas=round2(filtered.filter(e=>entradaTipos.has(e.tipo_evento)).reduce((s,e)=>s+(e.valor||0),0));
  const somaSaidas=round2(filtered.filter(e=>['despesa','despesa_fixa','despesa_variavel','renegociacao','pagamento'].includes(e.tipo_evento)).reduce((s,e)=>s+(e.valor||0),0));

  const pg=usePagination(filtered.length,25);

  const statusChip=e=>{
    const s=(e.status||'').toLowerCase();
    const cls=/(pago|conferido|recorrente|ativo|ativa|ok)/.test(s)?'pos'
      :/(pendente|revisar|avulsa)/.test(s)?'warn'
      :/(divergente|inativo)/.test(s)?'neg':'muted';
    return <span className={"chip "+cls}>{e.status||'—'}</span>;
  };

  return <div>
    <div className="page-head"><div><h1>Centro de eventos financeiros</h1>
      <p className="muted">Todo valor do sistema vira um evento aqui. Clique em <b>Abrir origem</b> em qualquer linha para ir direto ao registro que gerou o valor — receita, despesa, fatura, pagamento, renegociação ou importação — sem passar por Lançamentos.</p></div></div>

    <div className="kpi-row">
      <div className="kpi"><span>Eventos no filtro</span><b>{filtered.length}</b></div>
      <div className="kpi pos"><span>Entradas somadas</span><b>{BRL(somaEntradas)}</b></div>
      <div className="kpi neg"><span>Saídas somadas</span><b>{BRL(somaSaidas)}</b></div>
      <div className="kpi"><span>Total de eventos</span><b>{events.length}</b></div>
    </div>

    <div className="card pad" style={{marginBottom:14}}>
      <div className="row" style={{gap:10,alignItems:'flex-end',flexWrap:'wrap'}}>
        <Fld label="Buscar"><div className="search-wrap"><Icon name="search" size={15} className="search-ic"/>
          <input className="input" style={{paddingLeft:30,width:200}} placeholder="descrição, origem…" value={busca} onChange={e=>setBusca(e.target.value)}/></div></Fld>
        <Fld label="Módulo"><select className="input" style={{width:170}} value={fMod} onChange={e=>setFMod(e.target.value)}>
          <option value="">Todos</option>{modulosPresentes.map(m=><option key={m} value={m}>{MODULO_LABELS[m]||m}</option>)}</select></Fld>
        <Fld label="Origem"><select className="input" style={{width:180}} value={fOri} onChange={e=>setFOri(e.target.value)}>
          <option value="">Todas</option>{origensPresentes.map(o=><option key={o} value={o}>{ORIGEM_LABELS[o]||o}</option>)}</select></Fld>
        <Fld label="Classe"><select className="input" style={{width:150}} value={fCls} onChange={e=>setFCls(e.target.value)}>
          <option value="">Todas</option>{classesPresentes.map(c=><option key={c} value={c}>{CLASSE_LABELS[c]||c}</option>)}</select></Fld>
        <Fld label="Natureza"><select className="input" style={{width:130}} value={fNat} onChange={e=>setFNat(e.target.value)}>
          <option value="">Todas</option><option value="entrada">Entradas</option><option value="saida">Saídas</option></select></Fld>
        <Fld label="Ano"><AnoSelect value={fAno} onChange={setFAno} years={anosList}/></Fld>
        <Fld label="Mês"><MesSelect value={fMes} onChange={setFMes}/></Fld>
        {fActive>0 && <div style={{marginLeft:'auto',display:'flex',gap:8,alignItems:'center'}}>
          <span className="chip pos"><Icon name="check" size={12}/> {fActive} filtro{fActive>1?'s':''}</span>
          <button className="btn ghost sm" onClick={clear}><Icon name="x" size={13}/> Limpar filtros</button></div>}
      </div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:12,paddingTop:12,borderTop:'1px solid var(--line)'}}>
        <span className="muted" style={{fontSize:11.5,alignSelf:'center',marginRight:2}}>Classificação:</span>
        {Object.keys(CLASSE_LABELS).map(c=>{
          const on=classesPresentes.includes(c);
          return <span key={c} onClick={()=>on&&setFCls(fCls===c?'':c)}
            style={{cursor:on?'pointer':'default',opacity:on?1:.4}}><ClasseBadge classe={c} small/></span>;
        })}
      </div>
    </div>

    {filtered.length===0
      ? <div className="card pad"><div className="empty">Nenhum evento para os filtros selecionados.</div></div>
      : <div className="card"><div className="tbl-wrap"><table className="tbl"><thead><tr>
          <th>Data</th><th>Módulo</th><th>Classe</th><th>Origem</th><th>Descrição</th><th className="r">Valor</th><th>Status</th><th></th>
        </tr></thead><tbody>
          {filtered.slice(pg.start,pg.end).map(e=>{
            const ent=entradaTipos.has(e.tipo_evento);
            return <tr key={e.evento_id}>
              <td className="num">{e.data_evento?ptDate(e.data_evento):(e._mk?ptMonth(e._mk):'—')}</td>
              <td><span className="tag">{MODULO_LABELS[e.modulo_origem]||e.modulo_origem}</span></td>
              <td><ClasseBadge classe={e.classe}/></td>
              <td className="muted" style={{fontSize:12.5}}>{ORIGEM_LABELS[e.origem]||e.origem}</td>
              <td><b style={{fontWeight:600}}>{e._desc}</b></td>
              <td className={"r num "+(ent?'pos':'')}>{ent?'+':''}{BRL(e.valor)}</td>
              <td>{statusChip(e)}</td>
              <td className="r"><button className="btn ghost sm" title="Abrir o registro de origem" onClick={()=>openOrigin(go,e)}><Icon name="search" size={13}/> Abrir origem</button></td>
            </tr>;
          })}
        </tbody></table></div></div>}
    {filtered.length>0 && <Pagination pg={pg} total={filtered.length} label="eventos"/>}
  </div>;
}

/* -------------------------------------------------------------------------
   NAV — nova arquitetura de menus (ETAPA 1)
   Cada entrada de topo é um MENU PRINCIPAL. Pode ser:
     • folha  -> tem `route` e navega direto (ex.: Dashboard);

function LoginScreen(){
  const db=useDB();

  const [email,setEmail]=useState(''); const [pw,setPw]=useState(''); const [pw2,setPw2]=useState('');
  const [busy,setBusy]=useState(false);
  const errMsg=e=>{ const m=(e&&e.message||'').toLowerCase();
    if(/invalid login/.test(m)) return 'E-mail ou senha incorretos.';
    if(/email not confirmed/.test(m)) return 'Confirme seu e-mail antes de entrar (verifique sua caixa de entrada).';
    if(/already registered|already been registered/.test(m)) return 'Este e-mail já tem conta. Faça login.';
    if(/password should be at least/.test(m)) return 'A senha deve ter ao menos 6 caracteres.';
    if(/rate limit|too many/.test(m)) return 'Muitas tentativas. Aguarde um pouco e tente de novo.';
    return e&&e.message || 'Não foi possível concluir. Tente novamente.'; };
  async function doLogin(){ if(!email||!pw) return db.toast('Informe e-mail e senha.','warn');
    setBusy(true); try{ await db.signIn(email.trim(),pw); }catch(e){ db.toast(errMsg(e),'err'); } setBusy(false); }
  async function doSignup(){ if(!email||!pw) return db.toast('Informe e-mail e senha.','warn');

    if(pw!==pw2) return db.toast('As senhas não conferem.','warn');
    setBusy(true); try{ await db.signUp(email.trim(),pw); db.toast('Conta criada! Se for solicitado, confirme seu e-mail e depois faça login.'); setTab('login'); }catch(e){ db.toast(errMsg(e),'err'); } setBusy(false); }
  async function doReset(){ if(!email) return db.toast('Digite seu e-mail no campo acima primeiro.','warn');
    try{ await db.resetPassword(email.trim()); db.toast('Se houver conta com esse e-mail, enviamos um link de redefinição.'); }catch(e){ db.toast(errMsg(e),'err'); } }
  return <AuthScreenShell>
    <div className="seg" style={{width:'100%',marginBottom:16}}>
      <button className={tab==='login'?'on':''} style={{flex:1}} onClick={()=>setTab('login')}>Entrar</button>

      {tab==='signup' && <div><label className="lbl">Confirmar senha</label><input className="input" type="password" autoComplete="new-password" value={pw2} onChange={e=>setPw2(e.target.value)} placeholder="••••••••"/></div>}
      {tab==='login'

  useEffect(()=>{ const t=setTimeout(()=>setStage(s=>s==='loading'?'welcome':s),2500); return ()=>clearTimeout(t); },[]);

function AuthGate(){
  const db=useDB();
  if(!db.cloudOn) return <App/>;
  const boot=<div className="boot"><BrandIcon size={60}/><p style={{marginTop:14}}>Carregando…</p></div>;
  if(db.recovery) return <NewPasswordScreen/>;
  if(db.session===undefined) return boot;
  if(db.session===null) return <LoginScreen/>;
  if(!db.ready) return boot; // espera carregar perfil + dados antes de decidir o acesso
  const p=db.profile;
  // ACESSO BLOQUEADO POR PADRÃO: só entra quem está explicitamente autorizado.
  const trialOk = p && p.status==='trial' && (!p.trial_ends_at || new Date(p.trial_ends_at) >= new Date());
  const allowed = p && (p.status==='ativo' || trialOk);
  if(allowed) return <AuthedApp/>;
  if(!p || p.status==='pendente') return <PendingApproval/>;
  return <AccessEnded/>;  // cancelado, expirado, trial vencido, ou status desconhecido
}

/* =========================================================================
   ETAPA 3 — CONTAS, PATRIMÔNIO E GESTÃO DE FATURAS
   -------------------------------------------------------------------------
   Princípios herdados das etapas anteriores: SEM dupla fonte de verdade.
   • Saldo de conta = saldo inicial + Σ movimentos + Σ transferências (derivado).
   • Patrimônio líquido = Σ (valor atual − saldo devedor) dos bens (derivado).
   • Faturas = projeção das transações por cartão/mês (mesma regra de Pagamentos).
   • Juros/multa/IOF de cartão são SIMULAÇÕES (estimativas), nunca lançam dados.
   Tudo reaproveita os componentes existentes (Modal, MoneyInput, ChartJS…).
   ========================================================================= */

/* ---- saldo de conta bancária — delega a calcAccountBalance (fonte oficial: bankMovements) (v93) */
function accountBalance(db, acc){
  if(!acc) return 0;
  return calcAccountBalance(acc.id, db.accounts, db.bankMovements);
}
/* Extrato bancário — usa bankMovements como fonte oficial (v93).
   Cada linha exibe: data, descrição, tipo, entrada/saída, saldo acumulado, origem, status. */
function accountLedger(db, acc){
  if(!acc) return [];
  const initial = Number(acc.openingBalance||acc.initialBalance||0);
  const rows = [];
  // linha de saldo inicial
  rows.push({id:'open',date:acc.openingDate||'',desc:'Saldo inicial',amount:initial,
    entrada:initial>=0?initial:0, saida:initial<0?Math.abs(initial):0,
    kind:'inicial', movementType:'initial', reconciliationStatus:'reconciled', ref:null});
  // linhas dos bankMovements vinculados a esta conta
  (db.bankMovements||[]).filter(m=>m.accountId===acc.id).forEach(m=>{
    const delta = m.direction==='entrada' ? Number(m.amount||0) : -Number(m.amount||0);
    const typeLabel = {
      'expense':'saída','income':'entrada','transfer_out':'transf. enviada',
      'transfer_in':'transf. recebida','card_bill_payment':'pgto fatura',
      'reversal':'estorno','fee':'tarifa','withdrawal':'saque',
      'deposit':'depósito','adjustment':'ajuste','yield':'rendimento','unclassified':'não classificado',
    }[m.movementType]||m.movementType||'movimento';
    rows.push({id:m.id,date:m.date||'',desc:m.description||typeLabel,amount:delta,
      entrada:delta>=0?delta:0, saida:delta<0?Math.abs(delta):0,
      kind:typeLabel, movementType:m.movementType, reconciliationStatus:m.reconciliationStatus||'pending',
      source:m.source, transactionId:m.transactionId, transferId:m.transferId,
      importId:m.importId, createdAt:m.createdAt, ref:m});
  });
  // ordenar por data → createdAt → id
  rows.sort((a,b)=>{
    const da=a.date||'', db2=b.date||'';
    if(da!==db2) return da<db2?-1:1;
    if(a.kind==='inicial') return -1;
    if(b.kind==='inicial') return 1;
    const ca=a.createdAt||'', cb=b.createdAt||'';
    if(ca!==cb) return ca<cb?-1:1;
    return (a.id||'') < (b.id||'') ? -1 : 1;
  });
  let running=0;
  rows.forEach(r=>{ running=round2(running+r.amount); r.saldo=running; });
  return rows.reverse();
}
/* gasto mensal médio (saída) dos últimos N meses com atividade — base da sobrevivência financeira */
function monthlyBurn(db, n=6){
  const cur=monthKey(todayISO());
  let sum=0,cnt=0;
  for(let i=0;i<n;i++){ const mk=addMonthKey(cur,-i);
    const t=consolidatedSpend(db,[mk],(db.allTx||[]).filter(x=>billMonth(x)===mk)).total;
    if(t>0){ sum=round2(sum+t); cnt++; } }
  return cnt?round2(sum/cnt):0;
}

/* ---- formulário de transferência ---- */
function TransferForm({onClose}){
  const db=useDB();
  const accounts=(db.accounts||[]).filter(a=>a.active!==false);
  const [f,setF]=useState({date:todayISO(),fromId:accounts[0]?.id||'',toId:accounts[1]?.id||'',valor:0,desc:''});
  const set=p=>setF(x=>({...x,...p}));
  function save(){
    const v=round2(+f.valor||0);
    if(!f.fromId||!f.toId) return db.toast('Escolha as contas de origem e destino.','warn');
    if(f.fromId===f.toId) return db.toast('Origem e destino devem ser contas diferentes.','warn');
    if(!(v>0)) return db.toast('Informe um valor maior que zero.','warn');
    db.addTransfer({date:f.date,fromId:f.fromId,toId:f.toId,amount:v,desc:f.desc.trim()});
    db.toast('Transferência registrada.'); onClose();
  }
  return <Modal title="Nova transferência" onClose={onClose} foot={<React.Fragment>
      <button className="btn" onClick={onClose}>Cancelar</button>
      <button className="btn primary" onClick={save}>Salvar</button></React.Fragment>}>
    <div className="grid" style={{gridTemplateColumns:'1fr 1fr',gap:14}}>
      <div><label className="lbl">De (origem)</label><select className="input" value={f.fromId} onChange={e=>set({fromId:e.target.value})}>

      <div><label className="lbl">Para (destino)</label><select className="input" value={f.toId} onChange={e=>set({toId:e.target.value})}>
        <option value="">—</option>{accounts.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select></div>
      <div><label className="lbl">Data</label><input className="input" type="date" value={f.date} onChange={e=>set({date:e.target.value})}/></div>
      <div><label className="lbl">Valor</label><MoneyInput value={f.valor} onChange={v=>set({valor:v})}/></div>

/* ---- 4. CONCILIAÇÃO (saldo real × saldo do sistema) ---- */
function Conciliacao({go,nav}){
  const db=useDB();
  const accounts=db.accounts||[];
  const [real,setReal]=useState({});     // accountId -> saldo real informado
  const setR=(id,v)=>setReal(x=>({...x,[id]:v}));
  function ajustar(acc,diff){
    db.addAcctMove({accountId:acc.id,date:todayISO(),desc:'Ajuste de conciliação',amount:round2(diff),kind:'ajuste'});
    db.toast(`Saldo de "${acc.name}" conciliado com um ajuste de ${BRL(diff)}.`);
    setReal(x=>{ const n={...x}; delete n[acc.id]; return n; });
  }
  if(!accounts.length) return <div className="empty card pad"><div className="big">✅</div>Cadastre uma conta em <a style={{cursor:'pointer'}} onClick={()=>go('contas')}>Contas bancárias</a> para conciliar saldos.</div>;
  const rows=accounts.map(acc=>{ const sys=calcAccountBalance(acc.id,db.accounts,db.bankMovements);
    const has=real[acc.id]!==undefined && real[acc.id]!=='' ; const realV=round2(+real[acc.id]||0);
    const diff=has?round2(realV-sys):0; const status=!has?'neutral':Math.abs(diff)<0.005?'ok':'bad';
    return {acc,sys,has,realV,diff,status}; });
  const totSys=round2(rows.reduce((s,r)=>s+r.sys,0));
  const divergentes=rows.filter(r=>r.status==='bad').length;
  return <div>
    <div className="page-head"><div><h1>Conciliação</h1>
      <p className="muted">Compare o saldo do app com o saldo real do banco. Onde houver divergência, gere um ajuste com um clique.</p></div></div>

    <div className="kpi-row">
      <div className="kpi"><span>Saldo do sistema (total)</span><b className="num">{BRL(totSys)}</b></div>
      <div className={"kpi "+(divergentes?'warn':'pos')}><span>Contas divergentes</span><b>{divergentes}</b></div>
      <div className="kpi"><span>Contas</span><b>{accounts.length}</b></div>
    </div>

    <div className="grid" style={{gap:14}}>
      {rows.map(({acc,sys,has,diff,status})=><div key={acc.id} className={"reconcile "+status} style={{flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,minWidth:200,flex:'1 1 220px'}}>
          <i style={{width:12,height:12,borderRadius:4,background:acc.color||'#94A3B2',display:'inline-block',flex:'0 0 auto'}}/>
          <div><b>{acc.name}</b><div className="muted" style={{fontSize:12}}>Sistema: <b className="num" style={{color:'var(--ink)'}}>{BRL(sys)}</b></div></div>
        </div>
        <div style={{display:'flex',alignItems:'flex-end',gap:10,flexWrap:'wrap'}}>
          <div><label className="lbl">Saldo real no banco</label>
            <MoneyInput value={real[acc.id]??''} onChange={v=>setR(acc.id,v)} style={{width:150}}/></div>
          {has && <div style={{minWidth:150}}>
            <div className="lbl">Diferença</div>
            <b className={"num "+(Math.abs(diff)<0.005?'pos':'neg')} style={{fontSize:18}}>{Math.abs(diff)<0.005?'Conciliado ✓':(diff>0?'+':'')+BRL(diff)}</b>
          </div>}
          {status==='bad' && <button className="btn primary" onClick={()=>ajustar(acc,diff)} title="Cria um movimento de ajuste para igualar o saldo do sistema ao real">
            <Icon name="check" size={14}/> Ajustar ({diff>0?'+':''}{BRL(diff)})</button>}
        </div>
      </div>)}
    </div>
    <p className="muted" style={{fontSize:12,marginTop:14,lineHeight:1.5}}>O ajuste registra um movimento de conciliação na conta — assim o extrato em <a style={{cursor:'pointer'}} onClick={()=>go('contas-saldos')}>Saldos</a> continua explicando cada centavo do saldo.</p>
  </div>;
}

const ASSET_KINDS=[['carro','Carro','🚗'],['moto','Moto','🏍️'],['imovel','Imóvel','🏠'],['equipamento','Equipamento','🛠️'],['investimento','Investimento','📈'],['outro','Outro','📦']];
const LIQUIDEZ=[['alta','Alta'],['media','Média'],['baixa','Baixa']];
const assetKind=k=>ASSET_KINDS.find(x=>x[0]===k)||['outro','Outro','📦'];
const assetNet=a=>round2((+a.currentValue||0)-(+a.debtBalance||0)); // valor líquido (patrimônio do bem)

/* ---- formulário de bem ---- */
function AssetForm({asset,onClose}){
  const db=useDB();
  const [f,setF]=useState(asset||{name:'',kind:'carro',buyValue:0,currentValue:0,debtBalance:0,liquidity:'media',monthlyPayment:0,note:'',color:CARD_COLORS[0]});
  const set=p=>setF(x=>({...x,...p}));
  function save(){
    if(!f.name.trim()) return db.toast('Informe o nome do bem.','warn');
    const data={name:f.name.trim(),kind:f.kind,buyValue:round2(+f.buyValue||0),currentValue:round2(+f.currentValue||0),
      debtBalance:round2(+f.debtBalance||0),liquidity:f.liquidity,monthlyPayment:round2(+f.monthlyPayment||0),note:(f.note||'').trim(),color:f.color};
    if(asset){ db.updateAsset(asset.id,data); db.toast('Bem atualizado.'); }
    else{ db.addAsset(data); db.toast('Bem cadastrado.'); }
    onClose();
  }
  const net=assetNet(f);
  return <Modal title={asset?'Editar bem':'Novo bem'} onClose={onClose} foot={<React.Fragment>
      <button className="btn" onClick={onClose}>Cancelar</button>
      <button className="btn primary" onClick={save}>Salvar</button></React.Fragment>}>

      <div style={{gridColumn:'1/3'}}><label className="lbl">Nome / descrição</label><input className="input" value={f.name} onChange={e=>set({name:e.target.value})} placeholder="Ex.: Honda Civic 2020, Apartamento Centro"/></div>
      <div><label className="lbl">Tipo</label><select className="input" value={f.kind} onChange={e=>set({kind:e.target.value})}>
        {ASSET_KINDS.map(([v,l,e])=><option key={v} value={v}>{e} {l}</option>)}</select></div>
      <div><label className="lbl">Liquidez (facilidade de venda)</label><select className="input" value={f.liquidity} onChange={e=>set({liquidity:e.target.value})}>
        {LIQUIDEZ.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></div>
      <div><label className="lbl">Valor de compra</label><MoneyInput value={f.buyValue} onChange={v=>set({buyValue:v})}/></div>
      <div><label className="lbl">Valor atual estimado</label><MoneyInput value={f.currentValue} onChange={v=>set({currentValue:v})}/></div>
      <div><label className="lbl">Saldo devedor (financiamento)</label><MoneyInput value={f.debtBalance} onChange={v=>set({debtBalance:v})}/></div>
      <div><label className="lbl">Parcela mensal (se financiado)</label><MoneyInput value={f.monthlyPayment} onChange={v=>set({monthlyPayment:v})}/></div>
      <div style={{gridColumn:'1/3'}}><label className="lbl">Observações</label><input className="input" value={f.note} onChange={e=>set({note:e.target.value})} placeholder="Ex.: quitado em 2027, alienado ao banco X"/></div>
      <div style={{gridColumn:'1/3'}}><label className="lbl">Cor</label>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
          {CARD_COLORS.map(c=><button key={c} onClick={()=>set({color:c})} style={{width:28,height:28,borderRadius:8,background:c,
            border:f.color===c?'3px solid var(--ink)':'2px solid var(--line)',cursor:'pointer'}}/>)}</div></div>
      <div style={{gridColumn:'1/3',background:'var(--surface-2)',borderRadius:10,padding:'10px 12px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span className="muted" style={{fontSize:12.5}}>Valor líquido (atual − dívida)</span>
        <b className={"num "+(net<0?'neg':'pos')} style={{fontSize:18}}>{BRL(net)}</b></div>
    </div>
  </Modal>;
}

/* ---- 5. BENS ---- */
function PatrimonioBens({go}){
  const db=useDB();

      <div className="kpi pos"><span>Patrimônio líquido</span><b className="num">{BRL(totLiq)}</b></div>

        const valorizou=(+a.currentValue||0)-(+a.buyValue||0);
        return <div className="cc-card" key={a.id} style={{borderTop:'4px solid '+(a.color||'#94A3B2')}}>
        <div className="cc-head">
          <div><b>{k[2]} {a.name}</b><div className="muted" style={{fontSize:12}}>{k[1]} · liquidez {lq.toLowerCase()}</div></div>

            <button className="btn ghost sm" onClick={()=>setEdit(a)}><Icon name="edit" size={14}/></button>

          </div>
        </div>
        <div className="cc-row"><span>Valor atual</span><b className="num">{BRL(a.currentValue||0)}</b></div>
        {(+a.debtBalance||0)>0 && <div className="cc-row"><span>Saldo devedor</span><b className="num neg">{BRL(a.debtBalance)}</b></div>}
        <div className="cc-row"><span>Valor líquido</span><b className={"num "+(net<0?'neg':'pos')}>{BRL(net)}</b></div>
        {(+a.buyValue||0)>0 && <div className="cc-row"><span>Vs. compra</span><b className={"num "+(valorizou>=0?'pos':'neg')}>{valorizou>=0?'+':''}{BRL(valorizou)}</b></div>}
        {(+a.monthlyPayment||0)>0 && <div className="cc-row"><span>Parcela mensal</span><b className="num">{BRL(a.monthlyPayment)}</b></div>}
        {a.note&&<div className="muted" style={{fontSize:11.5,marginTop:8}}>{a.note}</div>}
      </div>;})}
      {!assets.length&&<div className="empty card pad"><div className="big">🏠</div>Nenhum bem cadastrado.<br/>Cadastre carros, imóveis e investimentos para acompanhar seu patrimônio.</div>}
    </div>
    {add&&<AssetForm onClose={()=>setAdd(false)}/>}
    {edit&&<AssetForm asset={edit} onClose={()=>setEdit(null)}/>}
  </div>;
}

/* ---- 7. VALOR PATRIMONIAL ---- */
function ValorPatrimonial({go}){
  const db=useDB();
  const assets=db.assets||[];
  const accounts=db.accounts||[];
  const totSaldoContas=round2(accounts.filter(a=>a.active!==false).reduce((s,a)=>s+accountBalance(db,a),0));
  const totBruto=round2(assets.reduce((s,a)=>s+(+a.currentValue||0),0));
  const totDivida=round2(assets.reduce((s,a)=>s+(+a.debtBalance||0),0));
  const totLiqBens=round2(totBruto-totDivida);
  const patrimonioLiquido=round2(totLiqBens+totSaldoContas);
  // composição por tipo de bem (valor líquido)
  const porTipo={}; assets.forEach(a=>{ const k=assetKind(a.kind); porTipo[k[1]]=round2((porTipo[k[1]]||0)+assetNet(a)); });
  const tipoArr=Object.entries(porTipo).filter(([,v])=>v!==0);
  return <div>
    <div className="page-head"><div><h1>Valor patrimonial</h1>
      <p className="muted">Visão consolidada: bens líquidos + saldo em contas. É a sua riqueza líquida estimada.</p></div></div>

    <div className="hero-row" style={{marginBottom:18}}>
      <div className="hero-card"><div className="hero-top"><Icon name="budget" size={14}/> Patrimônio líquido</div>

        <div className="hero-foot">bens líquidos + contas</div></div>
      <div className="hero-card"><div className="hero-top"><Icon name="card" size={14}/> Saldo em contas</div>
        <div className="hero-val num">{BRL(totSaldoContas)}</div>
        <div className="hero-foot">{accounts.length} conta(s)</div></div>
      <div className="hero-card"><div className="hero-top"><Icon name="report" size={14}/> Bens (valor atual)</div>
        <div className="hero-val num">{BRL(totBruto)}</div>
        <div className="hero-foot">bruto, antes das dívidas</div></div>
      <div className="hero-card"><div className="hero-top"><Icon name="alert" size={14}/> Dívidas dos bens</div>
        <div className="hero-val neg num">{BRL(totDivida)}</div>
        <div className="hero-foot">saldo devedor total</div></div>
    </div>

    <div className="grid" style={{gridTemplateColumns:'1fr 1fr',gap:16}}>
      <div className="card pad">
        <div className="card-head" style={{borderBottom:0,padding:'0 0 8px'}}><h3>Como o patrimônio líquido é formado</h3></div>
        <table className="tbl" style={{border:0}}><tbody>
          <tr><td>Valor atual dos bens</td><td className="r num">{BRL(totBruto)}</td></tr>
          <tr><td>(−) Dívidas dos bens</td><td className="r num neg">−{BRL(totDivida)}</td></tr>
          <tr><td><b>= Bens líquidos</b></td><td className="r num"><b>{BRL(totLiqBens)}</b></td></tr>
          <tr><td>(+) Saldo em contas</td><td className="r num pos">+{BRL(totSaldoContas)}</td></tr>
          <tr style={{background:'var(--surface-2)'}}><td><b>= Patrimônio líquido</b></td><td className={"r num "+(patrimonioLiquido<0?'neg':'pos')}><b>{BRL(patrimonioLiquido)}</b></td></tr>
        </tbody></table>
      </div>

        <div className="card-head" style={{borderBottom:0,padding:'0 0 8px'}}><h3>Bens por tipo (valor líquido)</h3></div>
        {tipoArr.length?<ChartJS type="doughnut" height={240}
          data={{labels:tipoArr.map(([k])=>k),datasets:[{data:tipoArr.map(([,v])=>v),backgroundColor:['#2F9BE0','#E0823F','#7C6FE0','#3FB6A0','#E05A7A','#94A3B2'],borderWidth:0}]}}/>
          :<div className="empty">Cadastre bens em <a style={{cursor:'pointer'}} onClick={()=>go('patrimonio')}>Bens</a> para ver a composição.</div>}
