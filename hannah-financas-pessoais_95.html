/* ---- 8. SIMULAÇÃO DE LIQUIDAÇÃO ---- */
function SimulacaoLiquidacao({go}){
  const db=useDB();
  const assets=db.assets||[];
  const accounts=db.accounts||[];
  const [sel,setSel]=useState({}); // assetId -> bool
  const burn=useMemo(()=>monthlyBurn(db,6),[db.allTx,db.fixed,db.settings]);
  const caixaAtual=round2(accounts.filter(a=>a.active!==false).reduce((s,a)=>s+accountBalance(db,a),0));
  const toggle=id=>setSel(s=>({...s,[id]:!s[id]}));
  const selAll=()=>setSel(Object.fromEntries(assets.map(a=>[a.id,true])));
  const selNone=()=>setSel({});

  const selectedAssets=assets.filter(a=>sel[a.id]);
  const venda=useMemo(()=>{
    const bruto=round2(selectedAssets.reduce((s,a)=>s+(+a.currentValue||0),0));
    const dividas=round2(selectedAssets.reduce((s,a)=>s+(+a.debtBalance||0),0));
    const liquido=round2(bruto-dividas);
    const parcelasLivres=round2(selectedAssets.reduce((s,a)=>s+(+a.monthlyPayment||0),0));
    return {bruto,dividas,liquido,parcelasLivres};
  },[selectedAssets]);

  const caixaPos=round2(caixaAtual+venda.liquido);
  const burnAjustado=round2(Math.max(0,burn-venda.parcelasLivres)); // vender quita parcelas → reduz a queima mensal
  const mesesBase=burn>0?round2(caixaAtual/burn):null;
  const mesesPos=burnAjustado>0?round2(caixaPos/burnAjustado):null;

  // impacto no Score e no fluxo de caixa (pedido da ETAPA 5)
  const snapBase=useMemo(()=>financialSnapshot(db),[db.accounts,db.bankMovements,db.assets,db.transactions,db.incomes,db.fixed,db.renegotiations,db.cards,db.settings]);
  const scoreBase=useMemo(()=>scoreFromSnapshot(snapBase),[snapBase]);
  const snapAfter=useMemo(()=>{
    const bensBruto=round2(snapBase.bensBruto - selectedAssets.reduce((s,a)=>s+(+a.currentValue||0),0));
    const bensDivida=round2(snapBase.bensDivida - venda.dividas);
    return {...snapBase, caixa:caixaPos, bensBruto, bensDivida,
      comprometimento:round2(Math.max(0,snapBase.comprometimento - venda.parcelasLivres)),
      dividaTotal:round2(Math.max(0,snapBase.dividaTotal - venda.dividas)),
      patrimonioLiquido:round2(bensBruto - bensDivida + caixaPos)};
  },[snapBase,selectedAssets,venda,caixaPos]);
  const scoreAfter=useMemo(()=>scoreFromSnapshot(snapAfter),[snapAfter]);
  const fcBase=useMemo(()=>projectCashFlow(db,90,'realista'),[db]);
  const fcAfter=useMemo(()=>projectCashFlow(db,90,'realista',{events:venda.liquido>0?[{date:todayISO(),desc:'Venda de bens',amount:venda.liquido,kind:'decisao'}]:[]}),[db,venda.liquido]);
  const dScore=scoreAfter.score-scoreBase.score;

  // cenários rápidos pré-montados (carro / moto / tudo)
  function cenario(filterFn){
    const list=assets.filter(filterFn);
    const bruto=round2(list.reduce((s,a)=>s+(+a.currentValue||0),0));
    const dividas=round2(list.reduce((s,a)=>s+(+a.debtBalance||0),0));
    const liquido=round2(bruto-dividas);
    const parcelas=round2(list.reduce((s,a)=>s+(+a.monthlyPayment||0),0));
    const caixa=round2(caixaAtual+liquido);
    const bAj=round2(Math.max(0,burn-parcelas));
    const meses=bAj>0?round2(caixa/bAj):null;
    return {n:list.length,liquido,dividas,meses,caixa};
  }
  const cCarro=cenario(a=>a.kind==='carro');
  const cMoto=cenario(a=>a.kind==='moto');
  const cTudo=cenario(()=>true);

  const fmtMeses=m=>m==null?'∞':m>=600?'∞':`${NUM(m)} ${m===1?'mês':'meses'}`;

  if(!assets.length) return <div className="empty card pad"><div className="big">💰</div>Cadastre bens em <a style={{cursor:'pointer'}} onClick={()=>go('patrimonio')}>Bens</a> para simular uma liquidação.</div>;

  return <div>
    <div className="page-head"><div><h1>Simulação de liquidação</h1>
      <p className="muted">"E se eu vender?" — veja quanto sobra após quitar as dívidas e por quantos meses esse caixa sustentaria seus gastos.</p></div></div>

    <div className="card pad" style={{marginBottom:16}}>
      <div className="row" style={{gap:14,flexWrap:'wrap'}}>
        <div><div className="muted" style={{fontSize:11.5}}>Caixa atual (contas)</div><b className="num" style={{fontSize:18}}>{BRL(caixaAtual)}</b></div>
        <div><div className="muted" style={{fontSize:11.5}}>Gasto mensal médio (6m)</div><b className="num" style={{fontSize:18}}>{BRL(burn)}</b></div>
        <div><div className="muted" style={{fontSize:11.5}}>Sobrevivência só com o caixa</div><b className="num" style={{fontSize:18}}>{fmtMeses(mesesBase)}</b></div>
      </div>
    </div>

    <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:14,marginBottom:18}}>
      {[['🚗 Vender os carros',cCarro],['🏍️ Vender as motos',cMoto],['📦 Vender tudo',cTudo]].map(([titulo,c])=>
        <div key={titulo} className="card pad" style={{opacity:c.n?1:.55}}>
          <b style={{fontSize:14}}>{titulo}</b>
          <div className="muted" style={{fontSize:12,marginBottom:8}}>{c.n} {c.n===1?'bem':'bens'}</div>
          <div className="cc-row"><span>Líquido obtido</span><b className="num pos">{BRL(c.liquido)}</b></div>
          <div className="cc-row"><span>Dívidas quitadas</span><b className="num">{BRL(c.dividas)}</b></div>
          <div className="cc-row"><span>Caixa após venda</span><b className="num">{BRL(c.caixa)}</b></div>
          <div className="cc-row"><span>Sobrevivência</span><b className="num">{fmtMeses(c.meses)}</b></div>
        </div>)}
    </div>

    <div className="card">
      <div className="card-head"><h3>Simulação personalizada</h3>
        <div style={{display:'flex',gap:6}}><button className="btn ghost sm" onClick={selAll}>Marcar tudo</button><button className="btn ghost sm" onClick={selNone}>Limpar</button></div></div>
      <div className="tbl-wrap"><table className="tbl"><thead><tr>
        <th style={{width:40}}></th><th>Bem</th><th className="r">Valor atual</th><th className="r">Saldo devedor</th><th className="r">Líquido</th>
      </tr></thead><tbody>
      {assets.map(a=>{ const k=assetKind(a.kind); return <tr key={a.id} onClick={()=>toggle(a.id)} style={{cursor:'pointer',background:sel[a.id]?'var(--accent-soft)':''}}>
        <td><input type="checkbox" checked={!!sel[a.id]} onChange={()=>toggle(a.id)} onClick={e=>e.stopPropagation()}/></td>
        <td><b>{k[2]} {a.name}</b></td>
        <td className="r num">{BRL(a.currentValue||0)}</td>
        <td className="r num neg">{(+a.debtBalance||0)>0?BRL(a.debtBalance):'—'}</td>
        <td className={"r num "+(assetNet(a)<0?'neg':'pos')}>{BRL(assetNet(a))}</td>
      </tr>;})}
      </tbody></table></div>
    </div>

    {selectedAssets.length>0 && <div className="card pad" style={{marginTop:16,borderColor:'var(--accent)'}}>
      <div className="card-head" style={{borderBottom:0,padding:'0 0 10px'}}><h3>Resultado — vendendo {selectedAssets.length} {selectedAssets.length===1?'bem':'bens'}</h3></div>
      <div className="kpi-row" style={{marginBottom:0}}>
        <div className="kpi pos"><span>Valor líquido obtido</span><b className="num">{BRL(venda.liquido)}</b><div className="k-foot">venda {BRL(venda.bruto)} − dívidas {BRL(venda.dividas)}</div></div>
        <div className="kpi"><span>Dívidas quitadas</span><b className="num">{BRL(venda.dividas)}</b></div>
        <div className="kpi"><span>Caixa após a venda</span><b className="num">{BRL(caixaPos)}</b></div>
        <div className="kpi warn"><span>Meses de sobrevivência</span><b className="num">{fmtMeses(mesesPos)}</b><div className="k-foot">queima {BRL(burnAjustado)}/mês</div></div>
      </div>
      {venda.parcelasLivres>0 && <p className="muted" style={{fontSize:12,marginTop:12,marginBottom:0}}>Vender estes bens elimina <b style={{color:'var(--ink)'}}>{BRL(venda.parcelasLivres)}</b> em parcelas mensais, reduzindo sua queima de caixa de {BRL(burn)} para {BRL(burnAjustado)} por mês.</p>}

      <div className="grid" style={{gridTemplateColumns:'1.1fr .9fr',gap:16,marginTop:16}}>
        <div>
          <div className="lbl" style={{marginBottom:8}}>Impacto no fluxo de caixa (90 dias)</div>
          <table className="tbl" style={{border:0}}><thead><tr><th>Indicador</th><th className="r">Antes</th><th className="r">Depois</th></tr></thead><tbody>
            <tr><td>Caixa hoje</td><td className="r num">{BRL(fcBase.caixaInicial)}</td><td className="r num">{BRL(round2(fcBase.caixaInicial+venda.liquido))}</td></tr>
            <tr><td>Menor saldo (90d)</td><td className={"r num "+(fcBase.menor.saldo<0?'neg':'')}>{BRL(fcBase.menor.saldo)}</td><td className={"r num "+(fcAfter.menor.saldo<0?'neg':'pos')}>{BRL(fcAfter.menor.saldo)}</td></tr>
            <tr><td>Dívida total</td><td className="r num">{BRL(snapBase.dividaTotal)}</td><td className="r num pos">{BRL(snapAfter.dividaTotal)}</td></tr>
          </tbody></table>
        </div>
        <div style={{textAlign:'center'}}>
          <div className="lbl" style={{marginBottom:8}}>Impacto no Score Hannah</div>
          <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:14,flexWrap:'wrap'}}>
            <div><div className="muted" style={{fontSize:11,marginBottom:2}}>Antes</div><ScoreGauge score={scoreBase.score} color={scoreBase.grade.color} size={104}/></div>

          </div>

            {dScore>0?'+':''}{dScore} pontos · {scoreAfter.grade.label}</span>
        </div>
      </div>
    </div>}
    <p className="muted" style={{fontSize:11.5,marginTop:14,lineHeight:1.5}}>Estimativa. O gasto mensal médio vem dos últimos 6 meses; o valor de venda é o que você informou em cada bem. Valores reais de venda variam.</p>
  </div>;
}

/* =========================================================================
   💳 CARTÕES E FATURAS — gestão, juros/rotativo, histórico
   -------------------------------------------------------------------------
   Faturas são DERIVADAS das transações (mesma regra de Pagamentos): nenhuma
   fatura é gravada. Os cálculos de juros/multa/IOF são SIMULAÇÕES editáveis.
   ========================================================================= */
const DEFAULT_RATES={rotativo:14,parcelamento:8,multa:2,mora:1,minPct:15,iofFixo:0.38,iofDia:0.0082};
function getRates(db){ return {...DEFAULT_RATES,...((db.settings&&db.settings.cardRates)||{})}; }
// PMT (Tabela Price): parcela fixa para financiar `principal` em `n` meses à taxa `i` (decimal)
function pmt(principal,i,n){ if(!n) return 0; if(!i) return round2(principal/n); const f=Math.pow(1+i,n); return round2(principal*i*f/(f-1)); }

// lista de faturas (cartão × mês) derivada das transações
function buildInvoices(db){
  const pays=(db.settings&&db.settings.payments)||{};
  const out=[];
  (db.cards||[]).filter(c=>(c.type||'credito')==='credito').forEach(c=>{
    const byM={}; (db.transactions||[]).filter(t=>t.cardId===c.id).forEach(t=>{ const m=billMonth(t); if(!m) return; byM[m]=round2((byM[m]||0)+spendOf(t)); (byM['_n:'+m]=(byM['_n:'+m]||0)+1); });
    Object.keys(byM).filter(m=>!m.startsWith('_n:')).forEach(m=>{ const total=byM[m]; if(!(total>0)) return;
      const key=`card:${c.id}:${m}`;
      out.push({card:c,mk:m,total:round2(total),count:byM['_n:'+m]||0,paid:!!pays[key],payKey:key,payAt:pays[key]&&pays[key].at});
    });
  });
  out.sort((a,b)=>{ if(a.mk!==b.mk) return a.mk<b.mk?1:-1; return b.total-a.total; });
  return out;
}

// simulação de pagamento de uma fatura de valor V (em aberto)
function simulateInvoice(V, rates, opts){
  V=round2(+V||0); const {rotativo,parcelamento,multa,mora,minPct,iofFixo,iofDia}=rates;
  const iRot=rotativo/100, iFin=parcelamento/100;
  const iof=p=>round2(Math.max(0,p)*(iofFixo/100 + (iofDia/100)*30)); // ~30 dias
  const minimo=round2(V*minPct/100);
  // 1) Integral
  const integral={id:'integral',label:'Pagar total',pago:V,restante:0,juros:0,multa:0,iof:0,custo:0,impacto:0,
    nota:'Sem juros. Encerra a fatura.'};
  // 2) Mínimo (paga o mínimo, resto vai ao rotativo por ~30 dias)
  const restoMin=round2(V-minimo);
  const jurosMin=round2(restoMin*iRot); const iofMin=iof(restoMin);
  const minScen={id:'minimo',label:'Pagar o mínimo',pago:minimo,restante:restoMin,juros:jurosMin,multa:0,iof:iofMin,
    custo:round2(jurosMin+iofMin),impacto:round2(restoMin+jurosMin+iofMin),
    nota:`Mínimo de ${minPct}%. O restante entra no rotativo (~${rotativo}%/mês) e volta na próxima fatura.`};
  // 3) Parcial (informado)
  const parcial=round2(Math.min(V,Math.max(0,+(opts&&opts.parcial||0))));
  const restoParc=round2(V-parcial);
  const atraso=parcial<minimo; // abaixo do mínimo = atraso (multa + mora)
  const multaP=atraso?round2(V*multa/100):0;
  const jurosP=round2(restoParc*(iRot+(atraso?mora/100:0)));
  const iofP=iof(restoParc);
  const parcialScen={id:'parcial',label:'Pagar parcial',pago:parcial,restante:restoParc,juros:jurosP,multa:multaP,iof:iofP,
    custo:round2(jurosP+multaP+iofP),impacto:round2(restoParc+jurosP+multaP+iofP),
    nota:atraso?`Abaixo do mínimo: incide multa de ${multa}% + mora. Evite.`:`Acima do mínimo. O restante entra no rotativo (~${rotativo}%/mês).`};
  // 4) Parcelar a fatura em N vezes
  const n=clamp(Math.round(+(opts&&opts.parcelas||12)),2,24);
  const parcela=pmt(V,iFin,n); const totalPg=round2(parcela*n); const jurosFin=round2(totalPg-V); const iofFin=iof(V);
  const parcelarScen={id:'parcelar',label:`Parcelar em ${n}x`,pago:parcela,restante:round2(V-parcela),juros:jurosFin,multa:0,iof:iofFin,
    custo:round2(jurosFin+iofFin),impacto:round2(totalPg+iofFin-parcela),parcela,n,totalPg:round2(totalPg+iofFin),
    nota:`${n} parcelas de ${BRL(parcela)} a ~${parcelamento}%/mês. Custo previsível, sem surpresa do rotativo.`};
  return {V,minimo,scenarios:[integral,minScen,parcialScen,parcelarScen]};
}

/* ---- editor de taxas (reutilizado em Gestão e em Juros) ---- */
function RatesEditor({compact}){
  const db=useDB(); const rates=getRates(db);
  const upd=(k,v)=>db.setSettings({cardRates:{...rates,[k]:round2(+v||0)}});

    <div style={{display:'flex',alignItems:'center',gap:6}}>
      <input className="input num" type="number" step="0.01" value={rates[k]} onChange={e=>upd(k,e.target.value)} style={{width:90}}/>
      <span className="muted" style={{fontSize:12}}>{suffix}</span></div></div>;
  return <div className="row" style={{gap:12,flexWrap:'wrap',alignItems:'flex-end'}}>
    {F('rotativo','Juros do rotativo','%/mês')}
    {F('parcelamento','Juros do parcelamento','%/mês')}
    {!compact && F('multa','Multa por atraso','%')}
    {!compact && F('mora','Mora por atraso','%/mês')}
    {F('minPct','Pagamento mínimo','% da fatura')}
    {!compact && F('iofFixo','IOF fixo','%')}

}

/* ---- 10. GESTÃO DE FATURAS + SIMULADOR ---- */
function GestaoFaturas({go,nav}){
  const db=useDB();
  const rates=getRates(db);
  const invoices=useMemo(()=>buildInvoices(db),[db.transactions,db.cards,db.settings]);
  const credCards=(db.cards||[]).filter(c=>(c.type||'credito')==='credito');
  const open=invoices.filter(iv=>!iv.paid);
  const [pick,setPick]=useState(()=>{
    if(nav&&nav.cardId&&nav.mk) return nav.cardId+'|'+nav.mk;
    return open[0]?(open[0].card.id+'|'+open[0].mk):(invoices[0]?invoices[0].card.id+'|'+invoices[0].mk:'');
  });
  useEffect(()=>{ if(nav&&nav.cardId&&nav.mk) setPick(nav.cardId+'|'+nav.mk); },[nav]);
  const [parcial,setParcial]=useState(0);
  const [parcelas,setParcelas]=useState(12);
  const [showRates,setShowRates]=useState(false);

  const cur=invoices.find(iv=>(iv.card.id+'|'+iv.mk)===pick);
  const sim=cur?simulateInvoice(cur.total,rates,{parcial,parcelas}):null;
  // melhor cenário entre as alternativas (excluindo integral, que é sempre o ideal quando se pode pagar)
  const alt=sim?sim.scenarios.filter(s=>s.id!=='integral'):[];
  const melhorAlt=alt.length?alt.reduce((a,b)=>b.custo<a.custo?b:a):null;

  function marcarPaga(){ if(!cur) return; db.setPayment(cur.payKey,true); db.toast(`Fatura ${cur.card.name} · ${ptMonth(cur.mk)} marcada como paga.`); }

  return <div>
    <div className="page-head"><div><h1>Gestão de faturas</h1>
      <p className="muted">Escolha uma fatura e simule como pagá-la: integral, parcial, mínimo ou parcelado — com juros, multa e IOF estimados.</p></div>
      <button className="btn ghost" onClick={()=>setShowRates(s=>!s)}><Icon name="settings" size={15}/> Taxas</button></div>

    {showRates && <div className="card pad" style={{marginBottom:16}}>
      <div className="card-head" style={{borderBottom:0,padding:'0 0 8px'}}><h3>Taxas usadas na simulação</h3></div>
      <RatesEditor/>
      <p className="muted" style={{fontSize:11.5,marginTop:10,marginBottom:0}}>Valores padrão são estimativas do mercado brasileiro. Ajuste conforme o contrato do seu cartão.</p>
    </div>}

    <div className="card pad" style={{marginBottom:16}}>
      <div className="row" style={{gap:12,alignItems:'flex-end',flexWrap:'wrap'}}>
        <Fld label="Fatura"><select className="input" style={{minWidth:280}} value={pick} onChange={e=>setPick(e.target.value)}>
          {!invoices.length&&<option value="">Nenhuma fatura</option>}
          {invoices.map(iv=><option key={iv.payKey} value={iv.card.id+'|'+iv.mk}>{iv.card.name} · {monthLong(iv.mk)} · {BRL(iv.total)}{iv.paid?' (paga)':''}</option>)}
        </select></Fld>
        {cur && <div style={{marginLeft:'auto',textAlign:'right'}}><div className="muted" style={{fontSize:11.5}}>Total da fatura</div><b className="num" style={{fontSize:22}}>{BRL(cur.total)}</b></div>}
      </div>
    </div>

    {!cur && <div className="empty card pad"><div className="big">💳</div>Nenhuma fatura para gerir. Cadastre cartões e lançamentos primeiro.</div>}

    {cur && <React.Fragment>
      {cur.paid && <div className="reconcile ok" style={{marginBottom:16}}><Icon name="check" size={18}/><div>Esta fatura já está marcada como <b>paga</b>. A simulação abaixo é apenas ilustrativa.</div></div>}

      <div className="card pad" style={{marginBottom:16}}>
        <div className="row" style={{gap:18,flexWrap:'wrap',alignItems:'flex-end'}}>
          <Fld label="Valor do pagamento parcial"><MoneyInput value={parcial} onChange={setParcial} style={{width:160}}/></Fld>
          <Fld label="Parcelar em (vezes)"><select className="input" style={{width:100}} value={parcelas} onChange={e=>setParcelas(+e.target.value)}>
            {[2,3,4,5,6,8,10,12,15,18,24].map(n=><option key={n} value={n}>{n}x</option>)}</select></Fld>
          <div className="muted" style={{fontSize:12}}>Mínimo ({rates.minPct}%): <b style={{color:'var(--ink)'}}>{BRL(sim.minimo)}</b></div>
        </div>
      </div>

      <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(250px,1fr))',gap:14}}>
        {sim.scenarios.map(s=>{ const best=melhorAlt&&s.id===melhorAlt.id; const ideal=s.id==='integral';
          return <div key={s.id} className="card pad" style={{borderColor:ideal?'var(--pos)':best?'var(--accent)':'var(--line)',borderWidth:ideal||best?2:1,position:'relative'}}>
          {ideal && <span className="chip pos" style={{position:'absolute',top:12,right:12}}>ideal</span>}
          {best && <span className="chip" style={{position:'absolute',top:12,right:12,background:'var(--accent)',color:'#fff'}}>melhor alternativa</span>}
          <b style={{fontSize:14.5}}>{s.label}</b>
          <div className="cc-row" style={{marginTop:8}}><span>{s.id==='parcelar'?'Parcela':'Você paga agora'}</span><b className="num">{BRL(s.pago)}{s.id==='parcelar'?`  (${s.n}x)`:''}</b></div>
          {s.restante>0 && <div className="cc-row"><span>Fica devendo</span><b className="num neg">{BRL(s.restante)}</b></div>}
          {s.juros>0 && <div className="cc-row"><span>Juros</span><b className="num neg">{BRL(s.juros)}</b></div>}
          {s.multa>0 && <div className="cc-row"><span>Multa</span><b className="num neg">{BRL(s.multa)}</b></div>}
          {s.iof>0 && <div className="cc-row"><span>IOF</span><b className="num neg">{BRL(s.iof)}</b></div>}
          <div className="cc-row" style={{borderTop:'1px solid var(--line)',marginTop:4,paddingTop:6}}><span><b>Custo extra</b></span><b className={"num "+(s.custo>0?'neg':'pos')}>{s.custo>0?BRL(s.custo):'R$ 0,00'}</b></div>
          {s.id==='parcelar' && <div className="cc-row"><span>Total ao final</span><b className="num">{BRL(s.totalPg)}</b></div>}
          {(s.id==='minimo'||s.id==='parcial') && s.impacto>0 && <div className="cc-row"><span>Volta na próxima fatura</span><b className="num neg">{BRL(s.impacto)}</b></div>}
          <p className="muted" style={{fontSize:11.5,marginTop:8,marginBottom:0,lineHeight:1.45}}>{s.nota}</p>
        </div>;})}
      </div>

      <div className="card pad" style={{marginTop:16,background:'var(--surface-2)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <div><b style={{fontSize:14}}>Melhor cenário</b>
            <p className="muted" style={{margin:'4px 0 0',fontSize:12.5}}>Pagar <b style={{color:'var(--ink)'}}>integral</b> é sempre o mais barato (custo zero). Entre as alternativas, {melhorAlt?<span><b style={{color:'var(--ink)'}}>{melhorAlt.label.toLowerCase()}</b> tem o menor custo extra ({BRL(melhorAlt.custo)}).</span>:'avalie conforme seu caixa.'}</p></div>
          {!cur.paid && <button className="btn primary" onClick={marcarPaga}><Icon name="check" size={15}/> Marcar fatura como paga</button>}
        </div>
      </div>
      <p className="muted" style={{fontSize:11.5,marginTop:14,lineHeight:1.5}}>Simulação estimada (não é oferta de crédito). Juros, multa e IOF reais dependem do contrato do seu cartão e das datas exatas de pagamento.</p>
    </React.Fragment>}
  </div>;
}

/* ---- 11. JUROS E ROTATIVO ---- */
function JurosRotativo({go}){
  const db=useDB();
  const rates=getRates(db);
  const [saldo,setSaldo]=useState(1000);
  const [taxa,setTaxa]=useState(rates.rotativo);
  const [meses,setMeses]=useState(12);
  useEffect(()=>{ setTaxa(rates.rotativo); },[rates.rotativo]);
  const proj=useMemo(()=>{ const i=(+taxa||0)/100; const out=[]; let v=round2(+saldo||0);
    for(let k=1;k<=clamp(+meses||1,1,36);k++){ const juros=round2(v*i); v=round2(v+juros); out.push({mes:k,juros,total:v}); } return out; },[saldo,taxa,meses]);
  const final=proj.length?proj[proj.length-1].total:round2(+saldo||0);
  const totalJuros=round2(final-(+saldo||0));
  return <div>
    <div className="page-head"><div><h1>Juros e rotativo</h1>
      <p className="muted">Entenda o custo de não pagar a fatura inteira. O rotativo é um dos créditos mais caros que existem.</p></div></div>

    <div className="card pad" style={{marginBottom:16}}>
      <div className="card-head" style={{borderBottom:0,padding:'0 0 8px'}}><h3>Como funciona</h3></div>
      <p className="muted" style={{fontSize:13,lineHeight:1.6,margin:0}}>
        Ao pagar menos que o total da fatura, o saldo restante entra no <b style={{color:'var(--ink)'}}>crédito rotativo</b> e passa a render juros altos (no Brasil, frequentemente acima de {rates.rotativo}% ao mês). Sobre esse valor ainda incide <b style={{color:'var(--ink)'}}>IOF</b>. Pela regra do Banco Central, o rotativo dura só um ciclo: depois disso o banco deve oferecer o <b style={{color:'var(--ink)'}}>parcelamento da fatura</b>, em geral com juros menores que o rotativo. Pagar abaixo do mínimo gera ainda <b style={{color:'var(--ink)'}}>multa</b> e <b style={{color:'var(--ink)'}}>mora</b>.
      </p>
    </div>

    <div className="card pad" style={{marginBottom:16}}>
      <div className="card-head" style={{borderBottom:0,padding:'0 0 10px'}}><h3>Simulador de bola de neve</h3></div>
      <div className="row" style={{gap:16,flexWrap:'wrap',alignItems:'flex-end',marginBottom:12}}>
        <Fld label="Saldo não pago"><MoneyInput value={saldo} onChange={setSaldo} style={{width:150}}/></Fld>
        <Fld label="Juros ao mês"><div style={{display:'flex',alignItems:'center',gap:6}}>
          <input className="input num" type="number" step="0.1" value={taxa} onChange={e=>setTaxa(e.target.value)} style={{width:90}}/><span className="muted">%</span></div></Fld>
        <Fld label="Meses"><input className="input num" type="number" min="1" max="36" value={meses} onChange={e=>setMeses(e.target.value)} style={{width:80}}/></Fld>
        <div style={{marginLeft:'auto',textAlign:'right'}}><div className="muted" style={{fontSize:11.5}}>Dívida após {clamp(+meses||1,1,36)} meses</div><b className="num neg" style={{fontSize:22}}>{BRL(final)}</b></div>
      </div>
      <ChartJS type="line" height={220}
        data={{labels:proj.map(p=>'Mês '+p.mes),datasets:[{label:'Dívida acumulada',data:proj.map(p=>p.total),borderColor:'var(--neg)',backgroundColor:'rgba(214,69,69,.12)',fill:true,tension:.3,pointRadius:0}]}}/>
      <div className="kpi-row" style={{marginTop:14,marginBottom:0}}>
        <div className="kpi"><span>Saldo inicial</span><b className="num">{BRL(+saldo||0)}</b></div>
        <div className="kpi neg"><span>Só de juros</span><b className="num">{BRL(totalJuros)}</b></div>
        <div className="kpi neg"><span>Total ao final</span><b className="num">{BRL(final)}</b></div>
        <div className="kpi warn"><span>Crescimento</span><b className="num">{(+saldo||0)>0?PCT(totalJuros/(+saldo)*100):'—'}</b></div>
      </div>
    </div>
    <div className="card pad">
      <div className="card-head" style={{borderBottom:0,padding:'0 0 8px'}}><h3>Taxas de referência</h3>
        <button className="btn ghost sm" onClick={()=>go('gestao-faturas')}><Icon name="pay" size={13}/> Simular uma fatura</button></div>
      <RatesEditor/>
    </div>
  </div>;
}

/* =========================================================================
   ETAPA 4 — PLANEJAMENTO FINANCEIRO
   -------------------------------------------------------------------------
   Tudo aqui é PROJEÇÃO derivada dos registros canônicos (mesma filosofia das
   etapas 2 e 3): nenhuma linha de futuro é gravada. O Score Hannah, o fluxo de
   caixa, as projeções e o simulador leem o estado atual e respondem "e se?".
   Única fatia nova persistida: `goals` (metas financeiras).
   ========================================================================= */

/* receita mensal média (últimos N meses com receita) — espelha monthlyBurn */
function monthlyIncome(db,n=6){
  const cur=monthKey(todayISO()); let sum=0,cnt=0;
  for(let k=0;k<n;k++){ const m=addMonthKey(cur,-k); let v=0;
    v=round2(v+getIncomeTotalForMonth(m,db.incomes||[]));
    if(v>0){ sum=round2(sum+v); cnt++; } }
  if(!cnt){ return getIncomeTotalForMonth(cur,db.incomes||[]); }
  return round2(sum/cnt);
}

/* retrato financeiro do momento — base do Score e do simulador. Função pura. */
/* ETAPA 6 — status de pagamento das faturas: vencidas (não pagas e já passou o
   vencimento) e pagas em atraso (pagas depois do vencimento). Segue a mesma
   convenção do resto do app: fatura da competência `mk` vence em `mk`-dueDay. */
function paymentStatus(db, mesesJanela){
  const today=todayISO();
  const limMk = mesesJanela ? addMonthKey(monthKey(today), -mesesJanela) : null;
  let overdue=0, late=0, onTime=0, paid=0, overdueAmount=0;
  const vencidas=[];
  buildInvoices(db).forEach(iv=>{
    if(limMk && iv.mk<limMk) return;
    const due=`${iv.mk}-${String(iv.card.dueDay||10).padStart(2,'0')}`;
    if(!iv.paid){ if(due<today){ overdue++; overdueAmount=round2(overdueAmount+iv.total); vencidas.push({...iv,due}); } }
    else { paid++; const at=(iv.payAt||'').slice(0,10); if(at && at>due) late++; else onTime++; }
  });
  return {overdue,late,onTime,paid,overdueAmount,vencidas};
}

function financialSnapshot(db){
  const cur=monthKey(todayISO());
  const fm=(db.settings&&db.settings.fixedMonthly)||{};
  const renegCatId=db.renegCatId;
  const caixa=round2((db.accounts||[]).filter(a=>a.active!==false).reduce((s,a)=>s+accountBalance(db,a),0));
  const burn=monthlyBurn(db,6);
  const renda=monthlyIncome(db,6);
  const bensBruto=round2((db.assets||[]).reduce((s,a)=>s+(+a.currentValue||0),0));
  const bensDivida=round2((db.assets||[]).reduce((s,a)=>s+(+a.debtBalance||0),0));
  const patrimonioLiquido=round2(bensBruto-bensDivida+caixa);
  const fixosMensais=round2((db.fixed||[]).filter(f=>fixedVigente(f,cur)&&(f.kind||'fixo')!=='variavel').reduce((s,f)=>s+fixedAmount(f,cur,fm),0));
  const renegMensal=round2((db.renegotiations||[]).reduce((s,r)=>{ const tx=renegToTxs(r,renegCatId).find(x=>monthKey(x.date)===cur); return s+((tx&&tx.amount>0)?tx.amount:0); },0));
  const assetMensal=round2((db.assets||[]).reduce((s,a)=>s+(+a.monthlyPayment||0),0));
  const comprometimento=round2(fixosMensais+renegMensal+assetMensal);
  const faturasAbertas=round2(buildInvoices(db).filter(iv=>!iv.paid).reduce((s,iv)=>s+iv.total,0));
  const parcelasFuturas=round2(instGroups(db).reduce((s,g)=>s+(g.balance||0),0)); // inclui saldo de renegociações
  const dividaTotal=round2(bensDivida+faturasAbertas+parcelasFuturas);
  const limiteTotal=round2((db.cards||[]).filter(c=>(c.type||'credito')==='credito').reduce((s,c)=>s+(+c.limit||0),0));
  const usoLimite=limiteTotal>0?round2(faturasAbertas/limiteTotal):0;
  const ps=paymentStatus(db,12);
  const atrasos=ps.overdue+ps.late;
  return {caixa,burn,renda,bensBruto,bensDivida,patrimonioLiquido,fixosMensais,renegMensal,assetMensal,comprometimento,faturasAbertas,parcelasFuturas,dividaTotal,limiteTotal,usoLimite,atrasos,paymentStatus:ps};
}

/* SCORE HANNAH (ETAPA 6) — saúde financeira de 0 a 100, média ponderada de
   cinco pilares (0–100 cada): endividamento, uso do limite de crédito, atrasos
   de pagamento, reserva de emergência e comprometimento da renda. Heurística
   transparente, função pura sobre um snapshot (permite simular). Termômetro
   interno do HANNAH — não é nota de crédito de mercado (Serasa/SPC). */
const SCORE_WEIGHTS={endividamento:0.25,usoLimite:0.20,atrasos:0.20,reserva:0.20,comprometimento:0.15};
function scoreFromSnapshot(s){
  const ativos = (s.bensBruto||0) + (s.caixa||0);
  const ratio = ativos>0 ? (s.dividaTotal||0)/ativos : ((s.dividaTotal||0)>0?1:0);
  const endividamento = clamp(1 - ratio/0.8,0,1)*100;          // dívida 80%+ dos ativos = 0

  const temCartao = (s.limiteTotal||0)>0;
  const uso = temCartao ? (s.faturasAbertas||0)/s.limiteTotal : 0;
  const usoLimite = temCartao ? clamp(1 - uso/0.8,0,1)*100 : 100; // usar 80%+ do limite = 0

  const nAtr = s.atrasos||0;
  const atrasos = clamp(1 - nAtr/4,0,1)*100;                   // 4+ atrasos (12 meses) = 0

  const meses = s.burn>0 ? s.caixa/s.burn : (s.caixa>0?12:0);
  const reserva = clamp(meses/6,0,1)*100;                      // 6 meses de reserva = 100

  const comp = s.renda>0 ? (s.comprometimento||0)/s.renda : ((s.comprometimento||0)>0?1:0);
  const comprometimento = clamp((0.5-comp)/0.5,0,1)*100;       // 0% = 100; 50%+ = 0

  const parts=[
    {key:'endividamento',label:'Endividamento',score:round2(endividamento),weight:SCORE_WEIGHTS.endividamento,detail:`Dívidas são ${PCT(ratio*100)} dos seus ativos`},
    {key:'usoLimite',label:'Uso do limite',score:round2(usoLimite),weight:SCORE_WEIGHTS.usoLimite,detail:temCartao?`${PCT(uso*100)} do limite de crédito em uso`:'Sem cartão de crédito cadastrado'},
    {key:'atrasos',label:'Pagamentos em dia',score:round2(atrasos),weight:SCORE_WEIGHTS.atrasos,detail:nAtr>0?`${nAtr} fatura(s) vencida(s) ou paga(s) em atraso nos últimos 12 meses`:'Nenhum atraso nos últimos 12 meses'},
    {key:'reserva',label:'Reserva de emergência',score:round2(reserva),weight:SCORE_WEIGHTS.reserva,detail:`${NUM(meses)} ${meses===1?'mês':'meses'} de despesas em caixa`},
    {key:'comprometimento',label:'Comprometimento de renda',score:round2(comprometimento),weight:SCORE_WEIGHTS.comprometimento,detail:s.renda>0?`${PCT(comp*100)} da renda em obrigações fixas`:'Sem renda cadastrada'},
  ];
  const score=Math.round(parts.reduce((a,p)=>a+p.score*p.weight,0));
  const grade = score>=80?{label:'Excelente',color:'var(--pos)'}
    : score>=65?{label:'Bom',color:'var(--accent)'}
    : score>=50?{label:'Regular',color:'var(--accent-2)'}
    : score>=35?{label:'Atenção',color:'var(--warn)'}
    : {label:'Crítico',color:'var(--neg)'};
  return {score,grade,parts,snapshot:s};
}
function scoreHannah(db){ return scoreFromSnapshot(financialSnapshot(db)); }

/* CENÁRIOS — multiplicadores aplicados a entradas e saídas projetadas. */
const SCENARIOS={
  pessimista:{key:'pessimista',label:'Pessimista',inMul:0.9,outMul:1.12,color:'var(--neg)'},
  realista:{key:'realista',label:'Realista',inMul:1,outMul:1,color:'var(--accent)'},
  otimista:{key:'otimista',label:'Otimista',inMul:1.05,outMul:0.9,color:'var(--accent-2)'},
};

/* FLUXO DE CAIXA FUTURO — timeline diária com saldo acumulado, a partir do caixa
   atual. Junta receitas, gastos fixos, renegociações, faturas em aberto e
   parcelas futuras nas suas datas. `extra.events` injeta uma decisão simulada. */
function projectCashFlow(db, days, scenKey, extra){
  const scen=SCENARIOS[scenKey]||SCENARIOS.realista;
  const start=todayISO(); const startD=new Date(start+'T00:00:00');
  const endD=new Date(startD); endD.setDate(endD.getDate()+days);
  const endISO=endD.toISOString().slice(0,10);
  const inRange=iso=> iso>=start && iso<=endISO;
  const caixaInicial=round2((db.accounts||[]).filter(a=>a.active!==false).reduce((s,a)=>s+accountBalance(db,a),0));
  const fm=(db.settings&&db.settings.fixedMonthly)||{};
  const pays=(db.settings&&db.settings.payments)||{};
  const renegCatId=db.renegCatId;
  const months=[]; { let cmk=monthKey(start); const endMk=monthKey(endISO); let g=0; while(cmk<=endMk&&g<24){ months.push(cmk); cmk=addMonthKey(cmk,1); g++; } }
  const ev=[];
  // receitas no fluxo de caixa — usa occurrences por mês (v93)
  months.forEach(m=>{ const occs=incomeOccurrencesForMonth(m,db.incomes||[]); occs.forEach(occ=>{ const v=occ.amount; if(!(v>0)) return; const day=((occ.date||'').slice(8,10))||'05'; const iso=`${m}-${day}`; if(inRange(iso)) ev.push({date:iso,desc:occ.name||'Receita',amount:round2(v*scen.inMul),kind:'receita'}); }); });
  (db.fixed||[]).forEach(f=>{ months.forEach(m=>{ if(!fixedVigente(f,m)) return; const v=fixedAmount(f,m,fm); if(!(v>0)) return;
    const day=String(f.dom||5).padStart(2,'0'); const iso=`${m}-${day}`;
    if(inRange(iso)) ev.push({date:iso,desc:f.desc||'Gasto fixo',amount:-round2(v*scen.outMul),kind:'fixo'}); }); });
  (db.renegotiations||[]).forEach(r=>{ renegToTxs(r,renegCatId).forEach(tx=>{ if(inRange(tx.date)&&tx.amount>0)
    ev.push({date:tx.date,desc:tx.descOrig||'Renegociação',amount:-round2(tx.amount*scen.outMul),kind:'reneg'}); }); });
  (db.cards||[]).filter(c=>(c.type||'credito')==='credito').forEach(c=>{ months.forEach(m=>{
    const total=round2((db.transactions||[]).filter(t=>t.cardId===c.id&&billMonth(t)===m).reduce((s,t)=>s+spendOf(t),0));
    if(!(total>0)||pays[`card:${c.id}:${m}`]) return;
    const day=String(c.dueDay||10).padStart(2,'0'); const iso=`${m}-${day}`;
    if(inRange(iso)) ev.push({date:iso,desc:'Fatura '+c.name,amount:-round2(total*scen.outMul),kind:'fatura'}); }); });
  instGroups(db).forEach(g=>{ if(!g.future) return; Object.entries(g.future).forEach(([m,val])=>{
    const iso=`${m}-10`; if(inRange(iso)&&val>0) ev.push({date:iso,desc:'Parcela '+(g.desc||''),amount:-round2(val*scen.outMul),kind:'parcela'}); }); });
  if(extra&&extra.events) extra.events.forEach(e=>{ if(inRange(e.date)) ev.push({...e}); });
  ev.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  let saldo=caixaInicial, totalIn=0, totalOut=0, menor={saldo:caixaInicial,date:start};
  ev.forEach(e=>{ saldo=round2(saldo+e.amount); e.saldo=saldo;
    if(e.amount>0) totalIn=round2(totalIn+e.amount); else totalOut=round2(totalOut-e.amount);
    if(saldo<menor.saldo) menor={saldo,date:e.date}; });
  const daily=[]; { let ds=new Date(startD), bal=caixaInicial, ei=0;
    for(let d=0; d<=days; d++){ const iso=ds.toISOString().slice(0,10);
      while(ei<ev.length && ev[ei].date<=iso){ bal=ev[ei].saldo; ei++; }
      daily.push({date:iso,saldo:bal}); ds.setDate(ds.getDate()+1); } }
  return {caixaInicial,caixaFinal:saldo,totalIn,totalOut,menor,events:ev,daily,scen,days};
}

/* PROJEÇÃO MENSAL — tendência de renda, despesa, caixa e patrimônio ao longo de
   N meses, sob um cenário. Modelo simples e honesto: mantém a renda e o gasto
   médios, e o patrimônio cresce pelo que é poupado (ativos sem valorização). */
function projectMonthly(db, monthsN, scenKey){
  const scen=SCENARIOS[scenKey]||SCENARIOS.realista;
  const cur=monthKey(todayISO());
  const snap=financialSnapshot(db);
  const inc=round2(snap.renda*scen.inMul), exp=round2(snap.burn*scen.outMul);
  const net=round2(inc-exp);
  const rows=[]; let cum=0;
  for(let k=0;k<monthsN;k++){ const m=addMonthKey(cur,k); cum=round2(cum+net);
    rows.push({mk:m,inc,exp,net,caixa:round2(snap.caixa+cum),pl:round2(snap.patrimonioLiquido+cum)}); }
  return {scen,rows,inc,exp,net,snap};
}

/* METAS */
const GOAL_KINDS=[['viagem','Viagem','✈️'],['reserva','Reserva de emergência','🛟'],['carro','Carro','🚗'],['imovel','Imóvel','🏠'],['outro','Outro','🎯']];
const goalKind=k=>GOAL_KINDS.find(x=>x[0]===k)||['outro','Outro','🎯'];
function goalProgress(g){
  const t=round2(+g.target||0), s=round2(+g.saved||0);
  const pct=t>0?clamp(s/t*100,0,100):0; const falta=round2(Math.max(0,t-s));
  const monthly=round2(+g.monthly||0); const meses=monthly>0?Math.ceil(falta/monthly):null;
  // exigido p/ bater o prazo (se houver)
  let exigido=null, atrasada=false;
  if(g.deadline){ const dlMk=g.deadline.slice(0,7); const cur=monthKey(todayISO());
    let restantes=0,c2=cur,gg=0; while(c2<dlMk&&gg<600){ restantes++; c2=addMonthKey(c2,1); gg++; }
    if(restantes>0){ exigido=round2(falta/restantes); atrasada=monthly>0&&monthly<exigido; }
    else if(falta>0){ exigido=falta; atrasada=true; } }
  return {pct,falta,meses,monthly,exigido,atrasada,saved:s,target:t};
}

/* =========================================================================
   🚨 ETAPA 5 — MODO CRISE — motores
   Nada é gravado. Todo o diagnóstico é derivado do estado atual: o fluxo de
   caixa real (projectCashFlow), a reserva (contas de poupança/investimento) e
   os gastos médios por categoria. As alavancas seguem uma ordem de prioridade:
   renda extra → cortes → renegociação → reserva → venda de patrimônio.
   ========================================================================= */

/* reserva = saldo blindado em contas de poupança e investimento (o cofre que
   queremos preservar). O caixa "operacional" é todo o resto. */
function reserveBalance(db){
  return round2((db.accounts||[]).filter(a=>a.active!==false && (a.kind==='poupanca'||a.kind==='investimento'))
    .reduce((s,a)=>s+accountBalance(db,a),0));
}

/* média mensal de gasto por NOME de categoria nos últimos n meses — base dos
   cortes. Reúne lançamentos realizados + gastos fixos/variáveis vigentes. */
function avgSpendByCategory(db, n=3){
  const cur=monthKey(todayISO());
  const byName={}; let months=0;
  for(let i=0;i<n;i++){ const mk=addMonthKey(cur,-i);
    const tx=(db.allTx||[]).filter(x=>billMonth(x)===mk);
    const cs=consolidatedSpend(db,[mk],tx);
    let any=false;
    Object.entries(cs.byCat||{}).forEach(([cid,v])=>{ if(!(v>0)) return; any=true;
      const name=((db.categories||[]).find(c=>c.id===cid)||{}).name||'Sem categoria';
      byName[name]=round2((byName[name]||0)+v); });
    if(any) months++;
  }
  const div=months||1; const out={};
  Object.entries(byName).forEach(([k,v])=>{ out[k]=round2(v/div); });
  return out;
}

/* assinaturas elimináveis: compromissos recorrentes que dá para cancelar.
   Vêm dos gastos fixos na categoria "Assinaturas" ou cujo nome casa com um
   serviço de streaming/app conhecido. Cada um traz seu valor mensal. */
const STREAMING_RE=/netflix|spotify|deezer|amazon\s*prime|prime\s*video|disney|hbo|max\b|globoplay|paramount|youtube|apple\s*(tv|music|one|icloud)|crunchyroll|star\+|telecine|premiere/i;
function eliminableSubscriptions(db){
  const cur=monthKey(todayISO()); const fm=(db.settings&&db.settings.fixedMonthly)||{};
  return (db.fixed||[]).filter(f=>{
      if(!fixedVigente(f,cur)) return false;
      if((f.kind||'fixo')==='variavel') return false;
      const cat=((db.categories||[]).find(c=>c.id===f.categoryId)||{}).name||'';
      return /assinatura/i.test(cat) || f.isSubscription || STREAMING_RE.test(f.desc||'');
    }).map(f=>({ id:f.id, name:f.desc||'Assinatura', monthly:round2(fixedAmount(f,cur,fm)) }))
    .filter(s=>s.monthly>0);
}

/* total líquido que poderia ser obtido vendendo bens (apenas valor positivo). */
function liquidableValue(db){
  return round2((db.assets||[]).reduce((s,a)=>s+Math.max(0,assetNet(a)),0));
}

/* NÚCLEO — função pura testada (26/26). Recebe o retrato já calculado e
   devolve déficit, sobrevivência, cenários A–E e a recomendação automática. */
function crisisPlan(inp){
  const menorSaldo  = round2(inp.menorSaldo||0);
  const reserva     = round2(Math.max(0,inp.reserva||0));
  const caixaOper   = round2(inp.caixaOperacional||0);
  const burnDiario  = round2(Math.max(0,inp.burnDiario||0));
  const dias        = Math.max(1, inp.diasHorizonte||30);
  const elim        = round2(Math.max(0,inp.economiaElim||0));
  const red         = round2(Math.max(0,inp.economiaRed||0));
  const liquidavel  = round2(Math.max(0,inp.liquidavel||0));
  const rendaDiaria = round2(Math.max(0,inp.rendaDiariaAtual||0));

  const troughOper = round2(menorSaldo - reserva);          // pior saldo operacional
  const deficit    = round2(Math.max(0, -troughOper));      // necessidade de caixa
  const economia   = round2(elim + red);
  const diasSobrevivencia = burnDiario>0 ? Math.floor(Math.max(0,caixaOper)/burnDiario) : null;

  const metaDiaria  = round2(deficit/dias);
  const metaSemanal = round2(metaDiaria*7);

  const cortesAplicados   = round2(Math.min(economia, deficit));
  const deficitAposCortes = round2(Math.max(0, deficit - economia));
  const folgaCortes       = round2(Math.max(0, economia - deficit));

  const rendaExtraD = deficitAposCortes;
  const metaDiariaD = round2(rendaExtraD/dias);
  const sobraVenda  = round2(liquidavel - deficit);

  const cenarios = [
    { id:'A', titulo:'Sem mudanças', deficit, resultado:round2(-deficit) },
    { id:'B', titulo:'Renda extra', meta:deficit, metaDiaria, metaSemanal, resultado:0 },
    { id:'C', titulo:'Cortes de gastos', economia, reducaoAplicada:cortesAplicados,
      deficitRestante:deficitAposCortes, resultado: economia>=deficit ? folgaCortes : round2(-deficitAposCortes) },
    { id:'D', titulo:'Renda extra + cortes', economia:cortesAplicados, rendaExtra:rendaExtraD,
      metaDiaria:metaDiariaD, resultado: economia>=deficit ? folgaCortes : 0 },
    { id:'E', titulo:'Venda de patrimônio', liquidavel, resultado:sobraVenda },
  ];

  const rendaAgressiva = rendaDiaria>0 && metaDiariaD > rendaDiaria*0.5;

  let rec;
  if(deficit<=0)              rec={ id:'OK', titulo:'Sem crise neste horizonte' };
  else if(economia>=deficit)  rec={ id:'C', titulo:'Cortes de gastos resolvem o mês' };
  else                        rec={ id:'D', titulo:'Cortes + renda extra' };

  const reservaCobre = reserva>0 && reserva>=deficit;
  const usoReservaSugerido = round2(Math.min(reserva, deficit));

  return { deficit, economia, troughOper, diasSobrevivencia, metaDiaria, metaSemanal,
           cenarios, rec, rendaAgressiva, reservaCobre, usoReservaSugerido,
           deficitAposCortes, cortesAplicados, folgaCortes };
}

/* orquestrador: lê o `db`, monta o fluxo de caixa do horizonte e devolve as
   peças que a tela compõe (a tela ajusta os cortes e recalcula o plano). */
function crisisInputs(db, dias, scen){
  const R=projectCashFlow(db, dias, scen);
  const reserva=reserveBalance(db);
  const caixaOperacional=round2(R.caixaInicial - reserva);
  const burn=monthlyBurn(db,6); const burnDiario=round2(burn/30);
  const renda=monthlyIncome(db,6); const rendaDiaria=round2(renda/30);
  const subs=eliminableSubscriptions(db);
  const avg=avgSpendByCategory(db,3);
  const REDUTIVEIS=[['Alimentação',0.25],['Lazer',0.60],['Compras',0.50]];
  const reducibles=REDUTIVEIS.filter(([nm])=>avg[nm]>0).map(([nm,cut])=>({name:nm,monthly:avg[nm],cut}));
  const liquidavel=liquidableValue(db);
  return {R,reserva,caixaOperacional,burn,burnDiario,renda,rendaDiaria,subs,reducibles,liquidavel,dias,scen};
}

/* gasto por NOME de categoria num mês (realizado + templates vigentes). */
function catSpendMap(db, mk){
  const tx=(db.allTx||[]).filter(x=>billMonth(x)===mk);
  const cs=consolidatedSpend(db,[mk],tx); const out={};
  Object.entries(cs.byCat||{}).forEach(([cid,v])=>{ if(v>0){
    const nm=((db.categories||[]).find(c=>c.id===cid)||{}).name||'Sem categoria';
    out[nm]=round2((out[nm]||0)+v); } });
  return out;
}

/* comparador puro: classifica categorias em aumento/redução (testado). */
function diffCategories(atual, mediaAnterior, opts){
  const minAbs=(opts&&opts.minAbs)||50, minPct=(opts&&opts.minPct)||0.2;
  const aumentos=[], reducoes=[];
  const names=new Set([...Object.keys(atual),...Object.keys(mediaAnterior)]);
  names.forEach(n=>{
    const a=round2(atual[n]||0), b=round2(mediaAnterior[n]||0);
    const delta=round2(a-b); const pct=b>0?delta/b:(a>0?1:0);
    if(delta>=minAbs && pct>=minPct) aumentos.push({name:n,atual:a,media:b,delta,pct});
    else if(-delta>=minAbs && (-pct)>=minPct) reducoes.push({name:n,atual:a,media:b,delta,pct});
  });
  aumentos.sort((x,y)=>y.delta-x.delta); reducoes.sort((x,y)=>x.delta-y.delta);
  return {aumentos,reducoes};
}

/* DIAGNÓSTICO FINANCEIRO — compara o último mês fechado com a média dos 3
   anteriores e reúne assinaturas e categorias problemáticas. */
function financialDiagnosis(db){
  const cur=monthKey(todayISO());
  const refMk=addMonthKey(cur,-1);                 // último mês completo
  const refSpend=catSpendMap(db, refMk);
  const prevMaps=[1,2,3].map(k=>catSpendMap(db, addMonthKey(refMk,-k)));
  const media={}; const names=new Set(prevMaps.flatMap(m=>Object.keys(m)));
  names.forEach(n=>{ const vals=prevMaps.map(m=>m[n]||0); media[n]=round2(vals.reduce((a,b)=>a+b,0)/prevMaps.length); });
  const {aumentos,reducoes}=diffCategories(refSpend, media, {minAbs:50,minPct:0.2});
  const subs=eliminableSubscriptions(db); const subsTotal=round2(subs.reduce((a,s)=>a+s.monthly,0));
  const totalRef=round2(Object.values(refSpend).reduce((a,b)=>a+b,0));
  const problem=[];
  (db.budgets||[]).forEach(b=>{ const nm=db.catName(b.categoryId); const sp=refSpend[nm]||0;
    if((+b.amount||0)>0 && sp>b.amount) problem.push({name:nm,reason:'orçamento estourado',spent:round2(sp),limit:round2(b.amount)}); });
  Object.entries(refSpend).forEach(([nm,v])=>{ if(totalRef>0 && v/totalRef>=0.3 && !problem.some(p=>p.name===nm))
    problem.push({name:nm,reason:'concentra 30%+ do gasto do mês',spent:round2(v),share:v/totalRef}); });
  return {refMk,refSpend,media,aumentos,reducoes,subs,subsTotal,problem,totalRef};
}

/* HANNAH IA — perguntas em linguagem natural sobre os seus gastos. Matcher
   determinístico (privado, instantâneo, offline). */
const IA_SYNONYMS={
  'supermercado':['supermercado','mercado','pao de acucar','carrefour','assai','atacadao'],
  'mercado':['supermercado','mercado','pao de acucar','carrefour','assai','atacadao'],
  'ifood':['ifood'],'uber':['uber'],'99':['99'],
  'delivery':['ifood','rappi','uber eats','delivery'],
  'farmacia':['farmacia','droga','pague menos'],
  'combustivel':['posto','ipiranga','shell','combustivel','gasolina'],
  'gasolina':['posto','ipiranga','shell','combustivel','gasolina'],
};
function iaExpand(term){
  const t=normDesc(term).toLowerCase().trim();
  for(const k in IA_SYNONYMS){ if(t===k || IA_SYNONYMS[k].includes(t)) return IA_SYNONYMS[k]; }
  return [t];
}
function iaMatches(t, terms){
  const hay=normDesc((t.descOrig||'')+' '+(t.descPad||'')+' '+(t._cat||'')+' '+(t._sub||'')).toLowerCase();
  return terms.some(x=>x && hay.includes(x));
}
function answerSpendQuery(txs, term){
  const terms=iaExpand(term);
  const hits=txs.filter(t=>iaMatches(t,terms));
  const total=round2(hits.reduce((s,t)=>s+(t._spend||0),0));
  return {total,count:hits.length,hits};
}
function iaWindow(Q){
  const cur=monthKey(todayISO());
  if(/MES PASSADO|MES ANTERIOR/.test(Q)){ const mk=addMonthKey(cur,-1); return {label:'no mês passado', test:iso=>monthKey(iso)===mk}; }
  if(/ESTE ANO|NESTE ANO|NO ANO|ANO ATUAL/.test(Q)){ const y=cur.slice(0,4); return {label:'neste ano', test:iso=>(iso||'').slice(0,4)===y}; }
  const m=Q.match(/ULTIMOS?\s+(\d+)\s+MES/); if(m){ const n=+m[1]; const lim=addMonthKey(cur,-(n-1)); return {label:`nos últimos ${n} meses`, test:iso=>monthKey(iso)>=lim}; }
  if(/SEMPRE|TOTAL GERAL|DESDE O INICIO|HISTORICO|TODO PERIODO/.test(Q)) return {label:'no total', test:()=>true};
  if(/ESTE MES|NESTE MES|MES ATUAL|DESTE MES/.test(Q)) return {label:'neste mês', test:iso=>monthKey(iso)===cur};
  return {label:'neste mês', test:iso=>monthKey(iso)===cur, isDefault:true};
}
function hannahQuery(db, question){
  const Q=normDesc(question);
  const win=iaWindow(Q);
  const txs=(db.allTx||[]).filter(t=>isSpend(t) && win.test(billDate(t)||t.date))
    .map(t=>({...t,_spend:spendOf(t),_cat:db.catName(t.categoryId)||'',_sub:t.subcategory||''}));
  const totalGeral=round2(txs.reduce((s,t)=>s+t._spend,0));

  if(/MAIOR GASTO|MAIOR DESPESA|MAIS CARO|GASTEI MAIS|MAIOR COMPRA|ONDE.*MAIS/.test(Q)){
    let max=null; txs.forEach(t=>{ if(t._spend>0&&(!max||t._spend>max._spend)) max=t; });
    const byCat={}; txs.forEach(t=>{ if(t._spend>0) byCat[t._cat]=round2((byCat[t._cat]||0)+t._spend); });
    const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
    return {kind:'maior', win, max, topCat:top?{name:top[0],value:top[1]}:null, totalGeral, count:txs.length};
  }
  let term=null;
  let m=Q.match(/(?:GASTEI|GASTO|GASTOS|DESPESA|DESPESAS|PAGUEI|COMPREI|TORREI)\s+(?:COM|EM|NO|NA|DE|NOS|NAS|PARA)\s+(.+)/);
  if(m) term=m[1];
  else { m=Q.match(/(?:COM|EM|NO|NA|DE)\s+([A-Z0-9 ]+?)\s*$/); if(m) term=m[1]; }
  if(term) term=term.replace(/[?.!]+$/,'').replace(/\b(ESTE|NESTE|DESTE|MES|ANO|PASSADO|ATUAL|NO TOTAL|SEMPRE|ULTIMOS?|\d+\s*MESES?)\b/g,'').trim();
  if(!term){ return {kind:'total', win, totalGeral, count:txs.length}; }
  const r=answerSpendQuery(txs, term);
  return {kind:'termo', win, term, total:r.total, count:r.count, hits:r.hits.slice(0,8), totalGeral};
}

/* INSIGHTS AUTOMÁTICOS — recomendações da semana (gastos 7d vs 7d, diagnóstico,
   score, faturas). */
function weeklyInsights(db){
  const out=[];
  const today=new Date(todayISO()+'T00:00:00');
  const bucket=(iso,a,b)=>{ const d=new Date((iso||'').slice(0,10)+'T00:00:00'); const diff=Math.floor((today-d)/86400000); return diff>=a&&diff<b; };
  const tx=(db.allTx||[]).filter(isSpend);
  const w0=round2(tx.filter(t=>bucket(billDate(t)||t.date,0,7)).reduce((s,t)=>s+spendOf(t),0));
  const w1=round2(tx.filter(t=>bucket(billDate(t)||t.date,7,14)).reduce((s,t)=>s+spendOf(t),0));
  if(w1>0){ const d=round2(w0-w1); const pct=d/w1;
    if(d>0&&pct>=0.15) out.push({tone:'warn',title:'Gastos subiram nesta semana',body:`Você gastou ${BRL(w0)} nos últimos 7 dias, ${PCT(pct*100)} a mais que na semana anterior (${BRL(w1)}).`});
    else if(d<0&&-pct>=0.15) out.push({tone:'pos',title:'Bom ritmo: gastos caíram',body:`${BRL(w0)} nos últimos 7 dias, ${PCT(-pct*100)} abaixo da semana anterior. Continue assim.`}); }
  const snap=financialSnapshot(db);
  if(snap.paymentStatus && snap.paymentStatus.overdue>0) out.push({tone:'neg',title:'Fatura vencida',body:`${snap.paymentStatus.overdue} fatura(s) vencida(s) somando ${BRL(snap.paymentStatus.overdueAmount)}. Regularize para evitar juros e atraso no score.`});
  if(snap.usoLimite>=0.5) out.push({tone:'warn',title:'Uso alto do limite',body:`Suas faturas em aberto usam ${PCT(snap.usoLimite*100)} do limite total. Acima de 80% pesa no score e some com o seu fôlego.`});
  const diag=financialDiagnosis(db);
  diag.aumentos.slice(0,1).forEach(a=>out.push({tone:'warn',title:`${a.name} cresceu`,body:`${BRL(a.atual)} no último mês fechado, ${PCT(a.pct*100)} acima da sua média (${BRL(a.media)}).`}));
  if(diag.subsTotal>0) out.push({tone:'',title:'Assinaturas recorrentes',body:`${diag.subs.length} assinatura(s) somando ${BRL(diag.subsTotal)}/mês (${BRL(round2(diag.subsTotal*12))}/ano). Vale revisar o que ainda usa.`});
  const meses = snap.burn>0?snap.caixa/snap.burn:0;
  if(meses<3) out.push({tone:'',title:'Reserva abaixo do ideal',body:`Seu caixa cobre ~${NUM(meses)} ${meses===1?'mês':'meses'} de despesa; a meta saudável é 6. Um aporte mensal automático ajuda a chegar lá.`});
  return out;
}

/* RECOMENDAÇÕES INTELIGENTES — ações com a economia em R$, ranqueadas. */
function intelligentRecommendations(db){
  const out=[]; const rates=getRates(db);
  buildInvoices(db).filter(iv=>!iv.paid && iv.total>0).forEach(iv=>{
    const sim=simulateInvoice(iv.total, rates, {parcelas:12});

    if(min&&parc){ const econ=round2(min.custo - parc.custo);
      if(econ>0) out.push({tone:'pos', valor:econ, route:'gestao-faturas',
        title:`Fatura ${iv.card.name}: troque o mínimo pelo parcelamento`,
        body:`Pagar o mínimo joga ${BRL(min.restante)} no rotativo (~${rates.rotativo}%/mês), custando ${BRL(min.custo)}. Parcelar em ${parc.n}x custa ${BRL(parc.custo)}. Você economiza ${BRL(econ)}.`}); }
  });
  const snap=financialSnapshot(db);
  if(snap.paymentStatus && snap.paymentStatus.overdueAmount>0){ const j=round2(snap.paymentStatus.overdueAmount*rates.rotativo/100);
    out.push({tone:'neg', valor:j, route:'gestao-faturas', title:'Regularize a fatura vencida primeiro',
      body:`Os ${BRL(snap.paymentStatus.overdueAmount)} vencidos rendem ~${BRL(j)}/mês de juros de rotativo — é a sua dívida mais cara. Priorize-a antes de qualquer outra.`}); }
  const subs=eliminableSubscriptions(db); const subsTotal=round2(subs.reduce((a,s)=>a+s.monthly,0));
  if(subsTotal>0) out.push({tone:'', valor:round2(subsTotal*12), route:'fixos', title:'Revise assinaturas pouco usadas',
    body:`Cancelar o que não usa entre suas ${subs.length} assinatura(s) libera até ${BRL(subsTotal)}/mês — ${BRL(round2(subsTotal*12))} no ano.`});
  if(snap.usoLimite>=0.6) out.push({tone:'warn', valor:0, route:'cartoes', title:'Reduza o uso do limite',
    body:`Você usa ${PCT(snap.usoLimite*100)} do limite. Quitar parte das faturas ou pedir aumento de limite tira pressão do score de uso do crédito.`});
  out.sort((a,b)=>(b.valor||0)-(a.valor||0));
  return out;
}

/* ---- medidor circular do Score ---- */
function ScoreGauge({score,color,size=180}){
  const pct=clamp((+score||0)/100,0,1);
  const r=(size-20)/2, c=2*Math.PI*r, off=c*(1-pct);
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--surface-3)" strokeWidth="13"/>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="13" strokeLinecap="round"
      strokeDasharray={c} strokeDashoffset={off} transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:'stroke-dashoffset .5s ease'}}/>
    <text x="50%" y="47%" textAnchor="middle" dominantBaseline="middle" fontSize={size*0.27} fontWeight="800" fill="var(--ink)" fontFamily="'Space Grotesk',sans-serif">{score}</text>
    <text x="50%" y="64%" textAnchor="middle" fontSize={size*0.085} fill="var(--muted)">de 100</text>
  </svg>;
}

/* ---- formulário de meta ---- */
function GoalForm({goal,onClose}){
  const db=useDB();
  const suggestReserva=round2(monthlyBurn(db,6)*6);
  const [f,setF]=useState(goal||{name:'',kind:'reserva',target:0,saved:0,monthly:0,deadline:'',color:CARD_COLORS[0],note:''});
  const set=p=>setF(x=>({...x,...p}));
  function save(){
    if(!f.name.trim()) return db.toast('Dê um nome à meta.','warn');
    const data={name:f.name.trim(),kind:f.kind,target:round2(+f.target||0),saved:round2(+f.saved||0),
      monthly:round2(+f.monthly||0),deadline:f.deadline||'',color:f.color,note:(f.note||'').trim()};
    if(goal){ db.updateGoal(goal.id,data); db.toast('Meta atualizada.'); }
    else{ db.addGoal(data); db.toast('Meta criada.'); }
    onClose();
  }
  return <Modal title={goal?'Editar meta':'Nova meta financeira'} onClose={onClose} foot={<React.Fragment>
      <button className="btn" onClick={onClose}>Cancelar</button>
      <button className="btn primary" onClick={save}>Salvar</button></React.Fragment>}>
    <div className="grid" style={{gridTemplateColumns:'1fr 1fr',gap:14}}>
      <div><label className="lbl">Tipo</label><select className="input" value={f.kind} onChange={e=>set({kind:e.target.value})}>
        {GOAL_KINDS.map(([v,l,e])=><option key={v} value={v}>{e} {l}</option>)}</select></div>
      <div><label className="lbl">Nome</label><input className="input" value={f.name} onChange={e=>set({name:e.target.value})} placeholder="Ex.: Viagem ao Chile"/></div>
      <div><label className="lbl">Valor da meta</label><MoneyInput value={f.target} onChange={v=>set({target:v})}/></div>
      <div><label className="lbl">Já guardado</label><MoneyInput value={f.saved} onChange={v=>set({saved:v})}/></div>
      <div><label className="lbl">Aporte mensal</label><MoneyInput value={f.monthly} onChange={v=>set({monthly:v})}/></div>
      <div><label className="lbl">Prazo (opcional)</label><input className="input" type="month" value={(f.deadline||'').slice(0,7)} onChange={e=>set({deadline:e.target.value})}/></div>
      {f.kind==='reserva' && suggestReserva>0 && <div style={{gridColumn:'1/3'}}>
        <button className="btn ghost sm" onClick={()=>set({target:suggestReserva})}>Sugerir {BRL(suggestReserva)} (6 meses de despesas)</button></div>}
      <div style={{gridColumn:'1/3'}}><label className="lbl">Observação</label><input className="input" value={f.note} onChange={e=>set({note:e.target.value})}/></div>
      <div style={{gridColumn:'1/3'}}><label className="lbl">Cor</label>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:4}}>
          {CARD_COLORS.map(c=><button key={c} onClick={()=>set({color:c})} style={{width:28,height:28,borderRadius:8,background:c,
            border:f.color===c?'3px solid var(--ink)':'2px solid var(--line)',cursor:'pointer'}}/>)}</div></div>
    </div>
  </Modal>;
}
