function fileToBase64(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
}

function ImportPage(){
  const db=useDB();
  const [drag,setDrag]=useState(false);
  const [busy,setBusy]=useState(false);
  const [prog,setProg]=useState('');
  const review=db.pendingReview, setReview=db.setPendingReview; // persiste entre telas
  // (§2) filtros da lista de faturas importadas
  const [fAno,setFAno]=useState('all'); const [fMes,setFMes]=useState('all');
  const [fBanco,setFBanco]=useState(''); const [fBusca,setFBusca]=useState('');
  const [fCard,setFCard]=useState(''); const [fStatus,setFStatus]=useState('');
  const [pwAsk,setPwAsk]=useState(null); // {file} aguardando senha
  // abre um anexo já salvo (data URL) numa nova aba, via Blob (robusto p/ PDFs grandes)
  function openSavedFile(f){
    if(!f||!f.dataUrl){ db.toast('Este arquivo não tem anexo salvo.','warn'); return; }
    try{
      const [meta,b64]=f.dataUrl.split(',');
      const mime=(meta.match(/data:(.*?);base64/)||[])[1]||f.mime||'application/octet-stream';
      const bin=atob(b64), len=bin.length, arr=new Uint8Array(len);
      for(let i=0;i<len;i++) arr[i]=bin.charCodeAt(i);
      const url=URL.createObjectURL(new Blob([arr],{type:mime}));
      window.open(url,'_blank');
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }catch(e){ try{ window.open(f.dataUrl,'_blank'); }catch(_){ db.toast('Não foi possível abrir o anexo.','err'); } }
  }
  const [pw,setPw]=useState('');
  const inputRef=useRef();
  const cancelRef=useRef(false);

  function cancelImport(){
    cancelRef.current=true;
    terminateOCR();
    setBusy(false); setProg('');
    db.toast('Importação cancelada.','warn');
  }

  async function handleFile(file, password){
    if(!file) return;
    cancelRef.current=false;
    setBusy(true); setReview(null); setProg('Recebendo arquivo…');
    const chk=()=>{ if(cancelRef.current) throw new Error('CANCELADO'); };
    const gKey=(db.settings?.geminiKey||'').trim();
    const gModel=db.settings?.geminiModel;
    const cKey=(db.settings?.anthropicKey||'').trim();
    const cModel=db.settings?.anthropicModel;
    try{
      const name=file.name.toLowerCase();
      let rows=[], rawText='', images=[], meta={bank:'Desconhecido',final:null,total:null,venc:null,fech:null};
      let method='';

      // extrai a partir de imagens: Claude (principal) -> Gemini (reserva) -> OCR local
      async function tryGeminiImages(imgs){
        try{ return await geminiExtractFromImages(imgs,gKey,gModel); }
        catch(e){
          if(/limit: 0|404|not found/i.test(e.message)){
            const wm=await geminiFindModel(gKey,gModel);
            if(wm!==gModel){ db.setSettings({geminiModel:wm}); return await geminiExtractFromImages(imgs,gKey,wm); }
          }
          throw e;
        }
      }
      async function extractFromImages(imgs){
        if(cKey){
          setProg('Lendo a fatura com o Claude (Anthropic)…');
          try{ const r=await aiExtractFromImages(imgs,cKey,cModel); if(r.length) return {rows:r,method:'IA Claude (Anthropic)'}; }
          catch(e){ console.warn('Claude:',e.message); db.toast('Claude: '+e.message.replace('CLAUDE ','')+(gKey?'. Tentando Gemini…':'. Tentando OCR local…'),'warn'); }
        }
        if(gKey){
          setProg('Lendo a fatura com o Google Gemini…');
          try{ const r=await tryGeminiImages(imgs); if(r.length) return {rows:r,method:'IA Google Gemini'}; }
          catch(e){ console.warn('Gemini:',e.message); db.toast('Gemini: '+e.message.replace('GEMINI ','')+'. Tentando OCR local…','warn'); }
        }
        setProg('Usando OCR local (pode levar alguns segundos)…');
        const ocrText=await ocrImagesToText(imgs,setProg);
        rawText=ocrText; Object.assign(meta,{bank:detectBank(ocrText),final:detectFinal(ocrText)},detectTotals(ocrText));
        return {rows:parseTextLayout(ocrText),method:'OCR local (Tesseract)'};
      }

      if(name.endsWith('.pdf')||file.type==='application/pdf'){
        const r=await readPDF(file,setProg,password); chk();
        rawText=r.fullText;
        Object.assign(meta,{bank:detectBank(rawText),final:detectFinal(rawText)}, detectTotals(rawText));
        if(r.hasText){
          setProg('Identificando layout '+meta.bank+'…');
          rows=parseTextLayout(rawText); method='Extração direta (camada de texto)';
        }
        // poucas linhas reconhecidas (ou PDF digitalizado) -> tenta IA/visão e OCR sobre as imagens das páginas
        if(rows.length<3){
          setProg('Texto insuficiente — lendo as páginas com IA/OCR…');
          const imgs = r.pageImgs.length? r.pageImgs : await r.renderPages(4); chk();
          images=imgs;
          const out=await extractFromImages(imgs); chk();
          if(out.rows.length>rows.length){ rows=out.rows; method=out.method; }
        }
        if(!rows.length) throw new Error('OCR_SEM_LINHAS');
      } else if(/\.(jpe?g|png|webp)$/.test(name)||file.type.startsWith('image/')){
        setProg('Lendo imagem…');
        const data=await fileToBase64(file);
        images=[{media_type:file.type||'image/jpeg',data}];
        const out=await extractFromImages(images); chk(); rows=out.rows; method=out.method;
        if(!rows.length) throw new Error('OCR_SEM_LINHAS');
      } else if(name.endsWith('.csv')||file.type==='text/csv'){
        method='Importação CSV';
        rows=await readCSV(file);
      } else if(name.endsWith('.xlsx')||name.endsWith('.xls')){
        method='Importação Excel';
        rows=await readXLSX(file);
      } else { throw new Error('Formato não suportado: '+name); }

      if(!rows.length){ db.toast('Nenhuma transação reconhecida no arquivo.','warn'); setBusy(false); return; }

      // cartão automático: 1º pelo final; 2º pelo banco detectado (nome/instituição do cartão)
      const matchCard = meta.final? db.cards.find(c=>c.last===meta.final): null;
      const bankNorm = normDesc(meta.bank||'');
      const bankCard = (bankNorm && bankNorm!=='desconhecido')
        ? db.cards.find(c=>{const n=normDesc((c.name||'')+' '+(c.bank||'')); return n.includes(bankNorm)||bankNorm.includes(normDesc(c.bank||'__nada__'));})
        : null;

      // categorização + cartão + dedup
      const enriched=rows.map(r=>{
        const cat=db.applyRules(r);
        // v92: sem fallback automático em cards[0] — exige correspondência confiável
        const byHint = r._card ? db.cards.find(c=>(c.lastDigits||c.last||'')===String(r._card)||c.name.toLowerCase().includes(String(r._card).toLowerCase())) : null;
        const autoMatch = matchCard || bankCard || byHint;
        const cardId = autoMatch?.id || null; // null = "Cartão não identificado" → usuário confirma
        return {...r, ...cat, cardId, descPad:r.descOrig, _include:true, _dupAction:'importar'};
      });
      const withDup=findDuplicates(enriched, db.transactions).map(({tx,dup})=>({...tx, _dup:dup, _dupAction:dup?'ignorar':'importar', _include: dup?false:true}));

      setReview({rows:withDup, meta:{...meta,method}, fileName:file.name, fileType:method, raw:rawText, images, file, fileURL:URL.createObjectURL(file)});
      setPwAsk(null); setPw('');
    }catch(e){
      if(e.message==='CANCELADO'){ setBusy(false); setProg(''); return; }
      if(e.message==='PDF_PASSWORD'){ setPwAsk({file}); setPw(''); setBusy(false); setProg(''); return; }
      if(e.message==='PDF_PASSWORD_WRONG'){ setPwAsk({file,error:'Senha incorreta. Verifique e tente novamente.'}); setPw(''); setBusy(false); setProg(''); return; }
      console.error(e);
      let msg;
      if(e.message==='OCR_INDISPONIVEL')
        msg='Não foi possível ler este PDF digitalizado. A leitura por IA online não está disponível ao abrir o arquivo localmente, e o OCR local (Tesseract) não carregou. Dica: tente um PDF com texto selecionável, ou exporte a fatura em CSV/Excel pelo app do banco.';
      else if(e.message==='OCR_SEM_LINHAS')
        msg='Não foram reconhecidas transações neste arquivo. Se você configurou o Gemini, ele pode ter ficado sobrecarregado (erro 503) — tente importar novamente em alguns instantes. Alternativas: usar um PDF com texto selecionável, uma imagem de maior resolução, ou importar via CSV/Excel do app do banco.';
      else if(/Failed to fetch|NetworkError|fetch/i.test(e.message))
        msg='A leitura por IA online não funciona com o arquivo aberto localmente. Para faturas digitalizadas, o sistema usa OCR local automaticamente — se não funcionou, tente um PDF com texto selecionável ou CSV/Excel.';
      else msg='Falha ao processar: '+e.message;
      db.toast(msg,'err');
    }
    setBusy(false); setProg('');
  }

  return <div className="grid" style={{gap:18}}>
    {!review && <React.Fragment>
      <div className="card pad">
        <div className={'dropzone'+(drag?' drag':'')}
          onDragOver={e=>{e.preventDefault();setDrag(true);}}
          onDragLeave={()=>setDrag(false)}
          onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0]);}}
          onClick={()=>!busy&&inputRef.current.click()}>
          {busy? <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
              <div><span className="spin"/> <b style={{marginLeft:8}}>{prog||'Processando…'}</b></div>
              <button className="btn sm" onClick={e=>{e.stopPropagation();cancelImport();}}><Icon name="x" size={14}/> Cancelar</button>
            </div>
            : <React.Fragment>
              <div style={{fontSize:34}}><Icon name="import" size={34}/></div>
              <h3 style={{margin:'10px 0 4px'}}>Arraste a fatura aqui ou clique para selecionar</h3>
              <div className="muted">PDF (texto ou digitalizado), imagem JPG/PNG, CSV ou Excel XLSX</div>
            </React.Fragment>}
          <input ref={inputRef} type="file" hidden accept=".pdf,.csv,.xlsx,.xls,.jpg,.jpeg,.png,.webp,image/*"
            onChange={e=>{const f=e.target.files[0]; e.target.value=''; handleFile(f);}}/>
        </div>
        <div className="row" style={{marginTop:14,fontSize:12.5}}>
          <div className="chip"><Icon name="check" size={13}/> Extração direta de PDF com texto</div>
          <div className="chip"><Icon name="check" size={13}/> OCR/IA para digitalizados e imagens</div>
          <div className="chip"><Icon name="check" size={13}/> Detecção de banco e layout</div>
          <div className="chip"><Icon name="check" size={13}/> Validação soma × total</div>
          <div className="chip"><Icon name="check" size={13}/> Conferência antes de salvar</div>
        </div>
      </div>
      {(()=>{
        const fatFiles=db.files.filter(f=>f.kind!=='extrato');
        if(!fatFiles.length) return null;
        const bancos=[...new Set(fatFiles.map(f=>f.bank).filter(Boolean))].sort((a,b)=>collatorPT.compare(a,b));
        const fileD=f=>(f.importedAt||'').slice(0,10);
        // cartões e status da importação derivados dos lançamentos de cada arquivo
        const cardsOf=f=>[...new Set(db.transactions.filter(t=>t.fileId===f.id&&t.cardId).map(t=>t.cardId))];
        const statusOf=f=>{ const tx=db.transactions.filter(t=>t.fileId===f.id); if(!tx.length) return 'vazio'; return tx.some(t=>t.confStatus==='revisar')?'revisar':'ok'; };
        const cardOpts=db.cards.filter(c=>fatFiles.some(f=>cardsOf(f).includes(c.id)));
        const filtered=fatFiles.filter(f=>{
          const iso=fileD(f);
          if(fAno!=='all' && iso.slice(0,4)!==fAno) return false;
          if(fMes!=='all' && iso.slice(5,7)!==fMes) return false;
          if(fBanco && (f.bank||'')!==fBanco) return false;
          if(fCard && !cardsOf(f).includes(fCard)) return false;
          if(fStatus && statusOf(f)!==fStatus) return false;
          if(fBusca && !(f.name||'').toLowerCase().includes(fBusca.toLowerCase())) return false;
          return true;
        });
        const active=(fAno!=='all'?1:0)+(fMes!=='all'?1:0)+(fBanco?1:0)+(fCard?1:0)+(fStatus?1:0)+(fBusca?1:0);
        const groups=groupByYM(filtered, fileD);
        const fatRow=f=>{
          const ftx=db.transactions.filter(t=>t.fileId===f.id);
          const ftotal=round2(ftx.reduce((s,t)=>s+spendOf(t),0));
          return <tr key={f.id}>
            <td>{f.dataUrl
              ? <a onClick={()=>openSavedFile(f)} style={{cursor:'pointer',color:'var(--accent)',fontWeight:600,display:'inline-flex',alignItems:'center',gap:5}} title="Abrir o arquivo em uma nova aba">{f.name} <Icon name="eye" size={13}/></a>
              : f.name}</td>
            <td>{f.bank||'—'}</td><td><span className="tag">{f.type||'—'}</span></td>
            <td className="r num">{f.count}</td>
            <td className="r num">{ftx.length?BRL(ftotal):'—'}</td>
            <td>{(()=>{const s=statusOf(f);return s==='revisar'?<span className="chip warn">a revisar</span>:s==='ok'?<span className="chip pos">conferido</span>:<span className="muted">—</span>;})()}</td>
            <td className="muted">{new Date(f.importedAt).toLocaleString('pt-BR')}</td>
            <td className="r"><span style={{display:'inline-flex',gap:6,justifyContent:'flex-end'}}>
              {f.dataUrl&&<button className="btn ghost sm" onClick={()=>openSavedFile(f)} title="Abrir anexo em nova aba"><Icon name="eye" size={13}/></button>}
              {f.type!=='demo'&&<button className="btn danger sm" onClick={()=>{if(confirmDialog('Excluir este arquivo e todos os seus lançamentos?'))db.deleteFile(f.id);}}><Icon name="trash" size={13}/></button>}
            </span></td>
          </tr>;
        };
        const head=<thead><tr><th>Arquivo</th><th>Banco</th><th>Origem</th><th className="r">Lançamentos</th><th className="r">Total</th><th>Status</th><th>Importado em</th><th></th></tr></thead>;
        return <div className="card pad">
          <div className="row" style={{justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
            <b>Arquivos importados</b>
            <span className="muted" style={{fontSize:12}}>{filtered.length} de {fatFiles.length}</span>
          </div>
          <div className="row" style={{gap:10,alignItems:'flex-end',flexWrap:'wrap',marginTop:12}}>
            <Fld label="Ano"><AnoSelect value={fAno} onChange={setFAno} years={yearOptions(fatFiles.map(f=>fileD(f).slice(0,4)))}/></Fld>
            <Fld label="Mês"><MesSelect value={fMes} onChange={setFMes}/></Fld>
            <Fld label="Instituição"><select className="input" style={{width:150}} value={fBanco} onChange={e=>setFBanco(e.target.value)}><option value="">Todas</option>{bancos.map(b=><option key={b} value={b}>{b}</option>)}</select></Fld>
            {cardOpts.length>0 && <Fld label="Cartão"><select className="input" style={{width:150}} value={fCard} onChange={e=>setFCard(e.target.value)}><option value="">Todos</option>{cardOpts.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Fld>}
            <Fld label="Status"><select className="input" style={{width:140}} value={fStatus} onChange={e=>setFStatus(e.target.value)}><option value="">Todos</option><option value="ok">Conferido</option><option value="revisar">A revisar</option></select></Fld>
            <Fld label="Buscar arquivo"><input className="input" style={{width:170}} value={fBusca} onChange={e=>setFBusca(e.target.value)} placeholder="nome do arquivo"/></Fld>
            {active>0 && <div style={{marginLeft:'auto',display:'flex',gap:8,alignItems:'center'}}>
              <span className="chip pos"><Icon name="check" size={12}/> {active} filtro{active>1?'s':''}</span>
              <button className="btn ghost sm" onClick={()=>{setFAno('all');setFMes('all');setFBanco('');setFCard('');setFStatus('');setFBusca('');}}><Icon name="x" size={13}/> Limpar</button></div>}
          </div>
          {groups.length===0
            ? <div className="muted" style={{padding:'18px 0'}}>Nenhum arquivo para os filtros selecionados.</div>
            : groups.map(g=>g.months.map(mo=><div key={mo.mk}>
                <GroupHead title={mo.label} count={mo.items.length}/>
                <div className="tbl-wrap"><table className="tbl">{head}<tbody>{mo.items.map(fatRow)}</tbody></table></div>
              </div>))}
        </div>;
      })()}
    </React.Fragment>}

    {review && <ReviewScreen review={review} setReview={setReview}/>}

    {pwAsk && <Modal title="PDF protegido por senha" onClose={()=>setPwAsk(null)} foot={<React.Fragment>
        <button className="btn" onClick={()=>setPwAsk(null)}>Cancelar</button>
        <button className="btn primary" onClick={()=>{const f=pwAsk.file; setPwAsk(null); handleFile(f,pw);}}>Abrir</button>
      </React.Fragment>}>
      <p className="muted" style={{fontSize:13,marginBottom:12}}>O arquivo <b>{pwAsk.file?.name}</b> está protegido. Informe a senha para abri-lo (geralmente os dígitos do CPF, data de nascimento ou os 4 primeiros dígitos do cartão — varia por banco).</p>
      {pwAsk.error && <div className="reconcile bad" style={{marginBottom:12,padding:'8px 12px'}}><Icon name="alert" size={16}/> <span>{pwAsk.error}</span></div>}
      <label className="lbl">Senha do PDF</label>
      <input className="input" type="password" autoFocus value={pw} onChange={e=>setPw(e.target.value)}
        onKeyDown={e=>{if(e.key==='Enter'){const f=pwAsk.file;setPwAsk(null);handleFile(f,pw);}}} placeholder="Digite a senha"/>
    </Modal>}
  </div>;
}

function ImportarExtrato({go}){
  const db=useDB();
  const [busy,setBusy]=useState(false);
  const [prog,setProg]=useState('');
  const [drag,setDrag]=useState(false);
  const [data,setData]=useState(null);
  const [acctId,setAcctId]=useState('');
  const [forceComp,setForceComp]=useState(false);
  const [compMk,setCompMk]=useState(monthKey(todayISO()));
  const fileRef=useRef(null);
  const extFiles=(db.files||[]).filter(f=>f.kind==='extrato');
  const [xAno,setXAno]=useState('all'); const [xMes,setXMes]=useState('all');
  const [xBanco,setXBanco]=useState(''); const [xBusca,setXBusca]=useState('');
  const [xTipo,setXTipo]=useState(''); const [xStatus,setXStatus]=useState('');

  async function handle(file){
    if(!file) return;
    setBusy(true); setProg('Recebendo arquivo…');
    const aiKeys={cKey:(db.settings?.anthropicKey||'').trim(),cModel:db.settings?.anthropicModel,
                  gKey:(db.settings?.geminiKey||'').trim(),gModel:db.settings?.geminiModel};
    try{
      const {rows,meta}=await readStatement(file,setProg,aiKeys);
      if(!rows.length){db.toast('Não encontrei movimentações. Tente o PDF do extrato, um OFX (mais preciso) ou CSV do seu banco.','warn');setBusy(false);setProg('');return;}
      // v94: classificar cada linha individualmente
      const enriched=rows.map(r=>{
        const cat=r.type==='despesa'?db.applyRules({descOrig:r.descOrig,amount:r.amount}):{};
        const cls=classifyMovement(r.descOrig||'',r.type);
        const mt=MOV_TYPES[cls.movType]||MOV_TYPES.nao_classificado;
        // detectar match com gasto fixo
        const mk=monthKey(r.date);
        const fm=db.settings?.fixedMonthly||{};
        const fx=(db.fixed||[]).find(f=>fixedVigente(f,mk)&&Math.abs(fixedAmount(f,mk,fm)-r.amount)<=Math.max(1,0.05*r.amount));
        return {...r,
          categoryId:cat.categoryId||null,
          _movType:cls.movType,
          _movConf:cls.confidence,
          _impactaSaldo:mt.impactaSaldo,
          _criaDespesa:mt.criaDespesa,
          _fixedMatch:fx?(fx.name||db.catName(fx.categoryId)||'gasto fixo'):null,
          _include:true,
        };
      });
      // detectar duplicatas
      const desp=enriched.filter(r=>r.type==='despesa');
      const rec=enriched.filter(r=>r.type==='receita');
      findDuplicates(desp,db.transactions).forEach((x,i)=>{desp[i]._dup=x.dup;});
      findDuplicates(rec,(db.auditIncomes||[])).forEach((x,i)=>{rec[i]._dup=x.dup;});
      // marcar duplicatas como não incluir por padrão
      enriched.forEach(r=>{if(r._dup)r._include=false;});
      const acc=(db.accounts||[]).find(a=>a.active!==false)||(db.accounts||[])[0];
      setAcctId(acc?acc.id:'');
      const ms=enriched.map(r=>r.date&&monthKey(r.date)).filter(Boolean).sort();
      setCompMk(ms.length?ms[ms.length-1]:monthKey(todayISO()));setForceComp(false);
      setData({rows:enriched,meta:meta||{},fileName:file.name,file});
      const needReview=enriched.filter(r=>r._movConf!=='high'||r._movType==='nao_classificado').length;
      db.toast(needReview?`${rows.length} movimentação(ões) — ${needReview} precisam de revisão de classificação.`:`${rows.length} movimentação(ões) lida(s) e classificada(s).`,needReview?'warn':undefined);
    }catch(e){
      if(e.message==='PDF_PASSWORD'||e.message==='PDF_PASSWORD_WRONG')db.toast('Este PDF está protegido por senha.','err');
      else db.toast('Erro ao ler o arquivo: '+(e.message||e),'err');
    }
    setBusy(false);setProg('');
  }
  const onDrop=e=>{e.preventDefault();setDrag(false);const f=e.dataTransfer.files?.[0];if(f)handle(f);};
  const setRow=(i,patch)=>setData(d=>({...d,rows:d.rows.map((r,k)=>k===i?{...r,...patch}:r)}));

  // Atualizar criaDespesa quando movType muda
  function changeMovType(i,newMovType){
    const mt=MOV_TYPES[newMovType]||MOV_TYPES.nao_classificado;
    setRow(i,{_movType:newMovType,_criaDespesa:mt.criaDespesa,_impactaSaldo:mt.impactaSaldo});
  }

  const included=data?data.rows.filter(r=>r._include):[];
  const comDespesa=included.filter(r=>r._criaDespesa&&r.type!=='receita');
  const semDespesa=included.filter(r=>!r._criaDespesa&&r.type!=='receita');
  const faturas=included.filter(r=>r._movType==='pagamento_fatura');
  const transferencias=included.filter(r=>r._movType==='transferencia_propria');
  const naoClass=included.filter(r=>r._movType==='nao_classificado');
  const receitas=included.filter(r=>r.type==='receita');
  const needReview=included.filter(r=>r._movConf!=='high'||r._movType==='nao_classificado');

  async function confirm(){
    if(!included.length) return db.toast('Selecione ao menos uma movimentação.','warn');
    // v95: alertas obrigatórios antes de confirmar
    const baixaConf=included.filter(r=>r._movType==='pagamento_fatura'&&r._movConf==='low');
    const mediaConf=included.filter(r=>r._movType==='pagamento_fatura'&&r._movConf==='medium'&&!r._billConfirmed);
    const trfSemDest=transferencias.filter(r=>!r._destAcctId);
    if(mediaConf.length){
      return db.toast(`${mediaConf.length} pagamento(s) de fatura com média confiança precisam de confirmação manual antes de importar. Clique em "Confirmar" em cada linha.`,'warn');
    }
    if(baixaConf.length||trfSemDest.length||naoClass.length){
      const msgs=[];
      if(baixaConf.length) msgs.push(`${baixaConf.length} pagamento(s) de fatura com baixa confiança`);
      if(trfSemDest.length) msgs.push(`${trfSemDest.length} transferência(s) sem conta de destino`);
      if(naoClass.length) msgs.push(`${naoClass.length} movimentação(ões) não classificada(s) — afetarão o saldo sem criar despesa`);
      if(!window.confirm(`Atenção:\n${msgs.join('\n')}\n\nDeseja continuar mesmo assim?`)) return;
    }
    const banco=data.meta.banco||'';
    const acct=db.accountById(acctId);
    const fileId=db.uid?db.uid('file'):('file_'+Math.random().toString(36).slice(2));
    const now=new Date().toISOString();
    let fileMeta={name:data.fileName,bank:banco,type:banco?('extrato · '+banco):'extrato',account:acct?acct.name:''};
    try{if(data.file&&data.file.size<=6*1024*1024){
      const dataUrl=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(data.file);});
      fileMeta.dataUrl=dataUrl;fileMeta.mime=data.file.type||'';fileMeta.size=data.file.size;
    }}catch(e){}
    // Separar por tipo e chamar o handler correto
    const despPayload=included.filter(r=>r._criaDespesa&&r.type!=='receita').map(r=>({
      date:r.date,descOrig:r.descOrig,amount:r.amount,type:'despesa',
      categoryId:r.categoryId||null,subcategory:r.subcategory||null,banco,
      confidence:r.confidence||0.9,accountId:acctId||null,cardId:null,
      paymentType:r._movType==='debito_automatico'?'debito_automatico':r._movType==='boleto'?'boleto':r._movType==='pix_terceiro'?'pix':'conta',
      movementType:r._movType,...(forceComp?{compMk}:{}),
    }));
    const billPayload=included.filter(r=>r._movType==='pagamento_fatura').map(r=>({
      date:r.date,descOrig:r.descOrig,amount:r.amount,banco,
      accountId:acctId||null,confidence:r._movConf,
    }));
    const recPayload=receitas.map(r=>({date:r.date,descOrig:r.descOrig,amount:r.amount,banco,accountId:acctId||null,source:'import'}));
    // v95: patrimonial inclui aplicacao, saque, estorno, ajuste e nao_classificado
    const patrimonialPayload=included.filter(r=>['aplicacao','saque','estorno','ajuste_saldo','nao_classificado'].includes(r._movType)).map(r=>({
      date:r.date,descOrig:r.descOrig,amount:r.amount,banco,movementType:r._movType,accountId:acctId||null,
      direction:r.type==='receita'?'entrada':'saida',destAcctId:r._destAcctId||null,
    }));
    // v95: transferencias proprias geram par de bankMovements + registro em transfers
    const trfPayload=transferencias.map(r=>({
      date:r.date,descOrig:r.descOrig,amount:r.amount,banco,
      fromAccountId:acctId||null,toAccountId:r._destAcctId||null,
    }));
    db.addStatement({despesas:despPayload,billPayments:billPayload,receitas:recPayload,patrimonial:patrimonialPayload,transferencias:trfPayload,fileMeta});
    const tot=despPayload.length+billPayload.length+recPayload.length+patrimonialPayload.length+trfPayload.length;
    db.toast(`✓ Extrato importado! ${despPayload.length} despesa(s), ${billPayload.length} pag. fatura, ${recPayload.length} receita(s), ${trfPayload.length} transferência(s).`);
    setData(null);
    if(go&&despPayload.length) go('lancamentos',{origin:'extrato',clear:true});
  }

  const CONF_LABELS={'high':'Alta','medium':'Média','low':'Baixa'};
  const CONF_COLORS={'high':'var(--pos)','medium':'var(--warn)','low':'var(--neg)'};

  if(data) return <div>
    <div className="page-head"><div><h1>Conferir extrato</h1>
      <p className="muted">{data.fileName}{data.meta.banco?` · ${data.meta.banco}`:''}</p></div>
      <div className="row" style={{gap:8}}>
        <button className="btn" onClick={()=>setData(null)}>Cancelar</button>
        <button className="btn primary" onClick={confirm}>Importar {included.length}</button>
      </div>
    </div>

    {/* Resumo v95 */}
    <div className="kpi-row">
      <div className="kpi neg"><span>Criam despesa</span><b>{comDespesa.length}</b></div>
      <div className="kpi"><span>Pag. fatura</span><b>{faturas.length}</b></div>
      <div className="kpi"><span>Transferências</span><b>{transferencias.length}</b></div>
      <div className="kpi pos"><span>Receitas</span><b>{receitas.length}</b></div>
      <div className="kpi"><span>Não classificadas</span><b>{naoClass.length}</b></div>
      <div className="kpi muted"><span>Ignoradas</span><b>{data?data.rows.filter(r=>!r._include).length:0}</b></div>
      <div className="kpi" style={{borderLeft:'2px solid var(--warn)'}}><span>Precisam revisão</span><b>{needReview.length}</b></div>
    </div>

    {naoClass.length>0&&<div className="card pad" style={{marginBottom:14,borderLeft:'3px solid var(--neg)'}}>
      <span style={{fontSize:13}}><Icon name="alert" size={14}/> <b>{naoClass.length} movimentação(ões) não classificada(s)</b> — defina o tipo antes de importar. Não criarão despesa.</span>
    </div>}

    <div className="card pad" style={{marginBottom:14}}>
      <div className="row" style={{gap:16,alignItems:'flex-start',flexWrap:'wrap'}}>
        <div style={{flex:'1 1 240px'}}>
          <label className="lbl">Conta de destino</label>
          <select className="input" style={{width:'100%',maxWidth:300}} value={acctId} onChange={e=>setAcctId(e.target.value)}>
            <option value="">— não vincular a uma conta —</option>
            {(db.accounts||[]).filter(a=>a.active!==false).map(a=><option key={a.id} value={a.id}>{a.name}{a.bank?` · ${a.bank}`:''}</option>)}
          </select>
        </div>
        <div style={{flex:'1 1 240px'}}>
          <label style={{display:'flex',gap:7,alignItems:'center',marginBottom:6}} className="lbl">
            <input type="checkbox" checked={forceComp} onChange={e=>setForceComp(e.target.checked)} style={{accentColor:'var(--accent)'}}/> Forçar mês de competência</label>
          {forceComp&&<div className="row" style={{gap:8}}>
            <select className="input" style={{width:'auto'}} value={compMk.slice(5,7)} onChange={e=>setCompMk(`${compMk.slice(0,4)}-${e.target.value}`)}>
              {MESES_PT.map((nm,i)=>{const mm=String(i+1).padStart(2,'0');return <option key={mm} value={mm}>{nm}</option>;})}</select>
            <select className="input" style={{width:'auto'}} value={compMk.slice(0,4)} onChange={e=>setCompMk(`${e.target.value}-${compMk.slice(5,7)}`)}>
              {yearOptions(data.rows.map(r=>r.date&&r.date.slice(0,4))).map(y=><option key={y} value={y}>{y}</option>)}</select>
          </div>}
        </div>
      </div>
    </div>

    {/* Tabela principal v94 */}
    <div className="card"><div className="tbl-wrap"><table className="tbl">
      <thead><tr>
        <th style={{width:36}}></th>
        <th>Movimentação</th>
        <th>Classificação (v94)</th>
        <th style={{width:90,textAlign:'center'}}>Impacta saldo</th>
        <th style={{width:90,textAlign:'center'}}>Cria despesa</th>
        <th>Categoria</th>
        <th style={{width:80,textAlign:'center'}}>Confiança</th>
      </tr></thead>
      <tbody>
        {data.rows.map((r,i)=>{
          const mt=MOV_TYPES[r._movType]||MOV_TYPES.nao_classificado;
          const confColor=CONF_COLORS[r._movConf]||'var(--ink)';
          const isFatura=r._movType==='pagamento_fatura';
          const isReceita=r.type==='receita';
          return <tr key={i} style={{opacity:r._include?1:.45}}>
            <td><input type="checkbox" checked={!!r._include} onChange={e=>setRow(i,{_include:e.target.checked})} style={{width:16,height:16,accentColor:'var(--accent)'}}/></td>
            <td>
              <div style={{fontWeight:500}}>{r.descOrig}</div>
              <div className="muted" style={{fontSize:11.5,marginTop:2}}>{ptDate(r.date)} · {BRL(r.amount)} · {isReceita?<span style={{color:'var(--pos)'}}>entrada</span>:<span style={{color:'var(--neg)'}}>saída</span>}</div>
              {r._dup&&<div className="muted" style={{fontSize:11,marginTop:2,color:'var(--warn)'}}>↔ possível duplicata: {ptDate(r._dup.date)} · {BRL(r._dup.amount)}</div>}
              {r._fixedMatch&&<div className="muted" style={{fontSize:11,marginTop:2}}>≈ gasto fixo: {r._fixedMatch}</div>}
              {r._movType==='nao_classificado'&&<div style={{fontSize:11,marginTop:2,color:'var(--warn)'}}>⚠ Afeta saldo · não cria despesa · aguardando classificação</div>}
              {r._movType==='pagamento_fatura'&&r._movConf==='medium'&&!r._billConfirmed&&<button className="btn sm warn" style={{marginTop:4,fontSize:11}} onClick={()=>setRow(i,{_billConfirmed:true})}>Confirmar como fatura (média confiança)</button>}
              {r._movType==='pagamento_fatura'&&r._movConf==='medium'&&r._billConfirmed&&<span style={{fontSize:11,color:'var(--pos)',marginTop:4,display:'block'}}>✓ Confirmado pelo usuário</span>}
              {r._movType==='transferencia_propria'&&<div style={{marginTop:4}}><label className="muted" style={{fontSize:11}}>Conta destino: </label><select className="input" style={{fontSize:12,padding:'2px 4px'}} value={r._destAcctId||''} onChange={e=>setRow(i,{_destAcctId:e.target.value})}><option value="">— selecionar —</option>{(db.accounts||[]).filter(a=>a.active!==false&&a.id!==acctId).map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select>{!r._destAcctId&&<span className="chip neg" style={{marginLeft:4,fontSize:10}}>obrigatório</span>}</div>}
              {r._movType==='saque'&&<div style={{marginTop:4}}><label className="muted" style={{fontSize:11}}>Carteira/destino: </label><select className="input" style={{fontSize:12,padding:'2px 4px'}} value={r._destAcctId||''} onChange={e=>setRow(i,{_destAcctId:e.target.value})}><option value="">— deixar pendente —</option>{(db.accounts||[]).filter(a=>a.active!==false&&a.id!==acctId).map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select></div>}
              {r._movType==='aplicacao'&&<div style={{marginTop:4}}><label className="muted" style={{fontSize:11}}>Investimento/ativo: </label><select className="input" style={{fontSize:12,padding:'2px 4px'}} value={r._destAssetId||''} onChange={e=>setRow(i,{_destAssetId:e.target.value})}><option value="">— deixar pendente —</option>{(db.assets||[]).map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select></div>}
            </td>
            <td>
              {isReceita
                ? <span className="chip pos" style={{fontSize:12}}>Entrada / receita</span>
                : <select className="input" style={{fontSize:12,padding:'4px 6px',minWidth:180}}
                    value={r._movType} onChange={e=>changeMovType(i,e.target.value)}>
                    {Object.entries(MOV_TYPES).filter(([k])=>k!=='entrada').map(([k,v])=>
                      <option key={k} value={k}>{v.label}</option>)}
                  </select>}
            </td>
            <td style={{textAlign:'center'}}>
              <span style={{color:'var(--pos)',fontWeight:600,fontSize:13}}>✓</span>
            </td>
            <td style={{textAlign:'center'}}>
              {isReceita
                ? <span className="muted" style={{fontSize:12}}>—</span>
                : r._criaDespesa
                  ? <span style={{color:'var(--pos)',fontWeight:600,fontSize:13}}>✓</span>
                  : <span style={{color:'var(--neg)',fontWeight:600,fontSize:13}}>✗</span>}
              {isFatura&&<div style={{fontSize:10,color:'var(--accent)',marginTop:2}}>somente saída bancária</div>}
            </td>
            <td>
              {(r._criaDespesa&&!isReceita)
                ? <select className="input" style={{minWidth:140,fontSize:12}} value={r.categoryId||''} onChange={e=>setRow(i,{categoryId:e.target.value||null})}>
                    <option value="">— sem categoria —</option>
                    {db.categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                : <span className="muted" style={{fontSize:12}}>{isFatura?'vinculada à fatura':isReceita?'auditoria de receitas':'sem despesa'}</span>}
            </td>
            <td style={{textAlign:'center'}}>
              <span style={{fontSize:11,fontWeight:600,color:confColor}}>{CONF_LABELS[r._movConf]||'—'}</span>
            </td>
          </tr>;
        })}
      </tbody>
    </table></div></div>
  </div>;

  return <div className="grid" style={{gap:18}}>
    <div className="page-head" style={{marginBottom:0}}><div><h1>Importar extrato bancário</h1>
      <p className="muted">Movimentações da conta. Cada linha é classificada individualmente — pagamento de fatura não gera nova despesa (v94).</p></div></div>

    <div className="card pad">
      <div className={'dropzone'+(drag?' drag':'')}
        onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={onDrop}
        onClick={()=>!busy&&fileRef.current&&fileRef.current.click()}>
        {busy?<div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
            <div><span className="spin"/> <b style={{marginLeft:8}}>{prog||'Lendo arquivo…'}</b></div></div>
          :<React.Fragment>
            <div style={{fontSize:34}}><Icon name="import" size={34}/></div>
            <h3 style={{margin:'10px 0 4px'}}>Arraste o extrato aqui ou clique para selecionar</h3>
            <div className="muted">PDF do extrato, OFX (mais preciso) ou CSV — baixe no app/site do seu banco</div>
          </React.Fragment>}
        <input ref={fileRef} type="file" hidden accept=".pdf,.ofx,.qfx,.csv,.txt" onChange={e=>{const f=e.target.files[0];e.target.value='';handle(f);}}/>
      </div>
      <div className="row" style={{marginTop:14,fontSize:12.5,flexWrap:'wrap',gap:6}}>
        <div className="chip"><Icon name="check" size={13}/> 13 tipos de movimentação</div>
        <div className="chip"><Icon name="check" size={13}/> Pag. fatura ≠ despesa (v94)</div>
        <div className="chip"><Icon name="check" size={13}/> Classificação por linha</div>
        <div className="chip"><Icon name="check" size={13}/> Confiança da detecção</div>
        <div className="chip"><Icon name="check" size={13}/> Conferência antes de salvar</div>
      </div>
    </div>

    {extFiles.length>0 && (()=>{
      const fileD=f=>(f.importedAt||'').slice(0,10);
      const bancos=[...new Set(extFiles.map(f=>f.bank).filter(Boolean))].sort((a,b)=>collatorPT.compare(a,b));
      const nDesp=f=>db.transactions.filter(t=>t.fileId===f.id).length;
      const nRec=f=>(db.auditIncomes||[]).filter(a=>a.fileId===f.id).length;
      const statusOf=f=>{const tx=db.transactions.filter(t=>t.fileId===f.id);if(!tx.length)return 'vazio';return tx.some(t=>t.confStatus==='revisar')?'revisar':'ok';};
      const filtered=extFiles.filter(f=>{
        const iso=fileD(f);
        if(xAno!=='all'&&iso.slice(0,4)!==xAno) return false;
        if(xMes!=='all'&&iso.slice(5,7)!==xMes) return false;
        if(xBanco&&(f.bank||'')!==xBanco) return false;
        if(xTipo==='despesa'&&nDesp(f)===0) return false;
        if(xTipo==='receita'&&nRec(f)===0) return false;
        if(xStatus&&statusOf(f)!==xStatus) return false;
        if(xBusca&&!(f.name||'').toLowerCase().includes(xBusca.toLowerCase())) return false;
        return true;
      });
      const active=(xAno!=='all'?1:0)+(xMes!=='all'?1:0)+(xBanco?1:0)+(xTipo?1:0)+(xStatus?1:0)+(xBusca?1:0);
      const groups=groupByYM(filtered,fileD);
      const extRow=f=>{
        const fileAcct=()=>{const cs=[...new Set(db.transactions.filter(t=>t.fileId===f.id).map(t=>t.accountId||''))];return cs.length===1?cs[0]:'';};
        const assignAccount=acctId=>{
          const ids=db.transactions.filter(t=>t.fileId===f.id).map(t=>t.id);
          if(!ids.length){db.toast('Este extrato não tem despesas para vincular.','warn');return;}
          const acct=db.accountById(acctId);
          db.bulkUpdate(ids,{accountId:acctId||null,cardId:null,paymentType:'conta'});
          db.toast(acctId?`${ids.length} lançamento(s) vinculado(s) a "${acct?acct.name:''}".`:`Vínculo de conta removido (${ids.length} lançamento(s)).`);
        };
        const ftx=db.transactions.filter(t=>t.fileId===f.id);
        const frec=(db.auditIncomes||[]).filter(a=>a.fileId===f.id);
        const ftotal=round2(ftx.reduce((s,t)=>s+spendOf(t),0));
        return <tr key={f.id}>
          <td>{f.dataUrl
            ?<a onClick={()=>openSavedFile(f)} style={{cursor:'pointer',color:'var(--accent)',fontWeight:600,display:'inline-flex',alignItems:'center',gap:5}} title="Abrir o arquivo em uma nova aba">{f.name} <Icon name="eye" size={13}/></a>
            :f.name}</td>
          <td>{f.bank||'—'}</td>
          <td><select className="input" style={{width:150,padding:'5px 7px'}} value={fileAcct()} disabled={!ftx.length}
            onChange={e=>assignAccount(e.target.value)}>
            <option value="">— sem conta —</option>
            {(db.accounts||[]).filter(a=>a.active!==false).map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
          </select></td>
          <td><span className="tag">extrato</span></td>
          <td className="r num">{ftx.length}</td>
          <td className="r num">{frec.length}</td>
          <td className="r num">{ftx.length?BRL(ftotal):'—'}</td>
          <td>{(()=>{const s=statusOf(f);return s==='revisar'?<span className="chip warn">a revisar</span>:s==='ok'?<span className="chip pos">conferido</span>:<span className="muted">—</span>;})()}</td>
          <td className="muted">{new Date(f.importedAt).toLocaleString('pt-BR')}</td>
          <td className="r"><span style={{display:'inline-flex',gap:6,justifyContent:'flex-end'}}>
            {f.dataUrl&&<button className="btn ghost sm" onClick={()=>openSavedFile(f)} title="Abrir anexo em nova aba"><Icon name="eye" size={13}/></button>}
            <button className="btn danger sm" onClick={()=>{if(confirmDialog('Excluir este arquivo, seus lançamentos e as receitas importadas dele?'))db.deleteFile(f.id);}}><Icon name="trash" size={13}/></button>
          </span></td>
        </tr>;
      };
      const head=<thead><tr><th>Arquivo</th><th>Banco / instituição</th><th>Conta vinculada</th><th>Origem</th><th className="r">Despesas</th><th className="r">Receitas</th><th className="r">Total despesas</th><th>Status</th><th>Importado em</th><th></th></tr></thead>;
      return <div className="card pad">
        <div className="row" style={{justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
          <b>Arquivos importados</b>
          <span className="muted" style={{fontSize:12}}>{filtered.length} de {extFiles.length}</span>
        </div>
        <div className="row" style={{gap:10,alignItems:'flex-end',flexWrap:'wrap',marginTop:12}}>
          <Fld label="Ano"><AnoSelect value={xAno} onChange={setXAno} years={yearOptions(extFiles.map(f=>fileD(f).slice(0,4)))}/></Fld>
          <Fld label="Mês"><MesSelect value={xMes} onChange={setXMes}/></Fld>
          <Fld label="Instituição"><select className="input" style={{width:150}} value={xBanco} onChange={e=>setXBanco(e.target.value)}><option value="">Todas</option>{bancos.map(b=><option key={b} value={b}>{b}</option>)}</select></Fld>
          <Fld label="Tipo"><select className="input" style={{width:150}} value={xTipo} onChange={e=>setXTipo(e.target.value)}><option value="">Todas</option><option value="despesa">Com despesas</option><option value="receita">Com receitas</option></select></Fld>
          <Fld label="Status"><select className="input" style={{width:130}} value={xStatus} onChange={e=>setXStatus(e.target.value)}><option value="">Todos</option><option value="ok">Conferido</option><option value="revisar">A revisar</option></select></Fld>
          <Fld label="Buscar"><input className="input" style={{width:160}} value={xBusca} onChange={e=>setXBusca(e.target.value)} placeholder="nome do arquivo"/></Fld>
          {active>0&&<div style={{marginLeft:'auto',display:'flex',gap:8,alignItems:'center'}}>
            <span className="chip pos"><Icon name="check" size={12}/> {active} filtro{active>1?'s':''}</span>
            <button className="btn ghost sm" onClick={()=>{setXAno('all');setXMes('all');setXBanco('');setXTipo('');setXStatus('');setXBusca('');}}><Icon name="x" size={13}/> Limpar</button></div>}
        </div>
        {groups.length===0
          ?<div className="muted" style={{padding:'18px 0'}}>Nenhum extrato para os filtros selecionados.</div>
          :groups.map(g=>g.months.map(mo=><div key={mo.mk}>
              <GroupHead title={mo.label} count={mo.items.length}/>
              <div className="tbl-wrap"><table className="tbl">{head}<tbody>{mo.items.map(extRow)}</tbody></table></div>
            </div>))}
      </div>;
    })()}

    <div className="card pad">
      <h3 style={{marginTop:0}}>Como funciona (v94)</h3>
      <p className="muted" style={{fontSize:13,lineHeight:1.6,margin:0}}>
        Cada linha é classificada individualmente em 13 tipos. <b>Pagamento de fatura</b> impacta o saldo mas <b>não cria nova despesa</b> — as compras já entraram item a item na fatura. <b>Compra no débito</b>, PIX, boleto e débitos automáticos criam despesa normalmente. <b>Transferência entre contas próprias</b> afeta saldo das duas contas, sem criar despesa ou receita. <b>Aplicações</b> são movimentações patrimoniais. Você pode alterar a classificação sugerida antes de confirmar.
      </p>
    </div>
  </div>;
}
function ReviewScreen({review,setReview}){
  const db=useDB();
  const [rows,setRows]=useState(review.rows);
  const [aiBusy,setAiBusy]=useState(false);
  // competência (mês da fatura) — todo o conteúdo importado é contabilizado neste mês
  const compDefault=useMemo(()=>{ const ms=(review.rows||[]).map(r=>r.date&&monthKey(r.date)).filter(Boolean).sort(); return ms.length?ms[ms.length-1]:monthKey(todayISO()); },[]);
  const [compMk,setCompMk]=useState(review.meta?.compMk||compDefault);
  const compMes=compMk.slice(5,7), compAno=compMk.slice(0,4);
  const compAnos=Array.from({length:8},(_,i)=>String(new Date().getFullYear()-5+i));
  const pg=usePagination(rows.length, 25);
  const rowsRef=useRef(rows); rowsRef.current=rows;
  // preserva as edições ao trocar de tela e voltar
  useEffect(()=>()=>{ setReview(rv=>rv?{...rv,rows:rowsRef.current}:rv); },[]);
  const upd=(i,patch)=>setRows(rs=>rs.map((r,j)=>j===i?{...r,...patch}:r));

  const included=rows.filter(r=>r._include);
  const sum=round2(included.filter(r=>r.type==='despesa').reduce((s,r)=>s+r.amount,0)
    - included.filter(r=>r.type==='estorno').reduce((s,r)=>s+r.amount,0));
  const declared=review.meta.total;
  const diff= declared!=null? round2(sum-declared):null;
  const ok = diff!=null && Math.abs(diff)<0.05;
  const dupCount=rows.filter(r=>r._dup).length;

  async function reprocessAI(){
    setAiBusy(true);
    db.toast('Reprocessando com IA…');
    const gKey=(db.settings?.geminiKey||'').trim();
    const gModel=db.settings?.geminiModel;
    const cKey=(db.settings?.anthropicKey||'').trim();
    const cModel=db.settings?.anthropicModel;
    const hasImgs=review.images&&review.images.length;
    try{
      let ai=[], used='IA';
      if(cKey){
        try{
          ai = hasImgs ? await aiExtractFromImages(review.images,cKey,cModel)
             : (review.raw ? await aiExtractFromText(review.raw,cKey,cModel) : []);
          if(ai.length) used='Claude';
        }catch(e){ console.warn('Claude:',e.message); if(!gKey) throw e; }
      }
      if(!ai.length && gKey){
        const runG=async(mdl)=> hasImgs ? await geminiExtractFromImages(review.images,gKey,mdl)
                              : (review.raw ? await geminiExtractFromText(review.raw,gKey,mdl) : []);
        try{ ai=await runG(gModel); used='Gemini'; }
        catch(e){
          if(/limit: 0|404|not found/i.test(e.message)){ const wm=await geminiFindModel(gKey,gModel); if(wm!==gModel){ db.setSettings({geminiModel:wm}); ai=await runG(wm); used='Gemini'; } else throw e; }
          else throw e;
        }
      }
      if(ai.length){
        const enriched=ai.map(r=>{const cat=db.applyRules(r);
          return {...r,...cat,cardId:review.rows[0]?.cardId||null,descPad:r.descOrig,_include:true,_dupAction:'importar'};});
        const withDup=findDuplicates(enriched,db.transactions).map(({tx,dup})=>({...tx,_dup:dup,_include:!dup,_dupAction:dup?'ignorar':'importar'}));
        setRows(withDup); db.toast(`✓ Reprocessado com sucesso! ${used} releu ${ai.length} lançamento(s).`);
      } else db.toast('A IA não retornou lançamentos. Configure a chave da Anthropic ou do Gemini em Configurações.','warn');
    }catch(e){
      if(/CLAUDE/i.test(e.message))
        db.toast('Erro do Claude: '+e.message.replace('CLAUDE ','')+'. Verifique a chave em Configurações.','err');
      else if(/GEMINI/i.test(e.message))
        db.toast('Erro do Gemini: '+e.message.replace('GEMINI ','')+'. Verifique a chave em Configurações.','err');
      else if(/Failed to fetch|NetworkError|fetch|API/i.test(e.message))
        db.toast('A leitura por IA não está disponível. Configure a chave da Anthropic ou do Gemini em Configurações, ou ajuste manualmente.','warn');
      else db.toast('Não foi possível reprocessar: '+e.message,'err');
    }
    setAiBusy(false);
  }

  function addRow(){
    setRows(rs=>[{date:todayISO(),descOrig:'(lançamento manual)',descPad:'',amount:0,type:'despesa',
      categoryId:null,subcategory:null,cardId:rs[0]?.cardId||null,
      installmentCurrent:null,installmentTotal:null,confidence:1,_include:true,_dupAction:'importar',_dup:null,_manual:true},...rs]);
  }
  const delRow=i=>setRows(rs=>rs.filter((_,j)=>j!==i));
  function setAllDups(action){
    setRows(rs=>rs.map(r=>r._dup?{...r,_dupAction:action,_include:action!=='ignorar'}:r));
    const label={ignorar:'Ignorar',importar:'Importar assim mesmo',substituir:'Substituir existente'}[action];
    db.toast(`"${label}" aplicado a todas as ${dupCount} duplicatas.`);
  }
  function ignorePayments(){
    const isPay=r=>r.type==='pagamento'||/pagamento|pagto|pag\.\s*receb/i.test(r.descOrig||'');
    const n=rows.filter(r=>isPay(r)&&r._include).length;
    setRows(rs=>rs.map(r=>isPay(r)?{...r,_include:false}:r));
    db.toast(n?`${n} pagamento(s) desconsiderado(s) da importação.`:'Nenhum pagamento encontrado.');
  }
  const payCount=rows.filter(r=>r.type==='pagamento'||/pagamento|pagto|pag\.\s*receb/i.test(r.descOrig||'')).length;
  function openAttachment(){ if(review.fileURL) window.open(review.fileURL,'_blank'); }

  async function doSave(){
    // aviso de divergência de valor (ponto 5)
    if(declared!=null && !ok){
      const ok2=confirmDialog(`O total dos lançamentos selecionados (${BRL(sum)}) está diferente do total da fatura (${BRL(declared)}), com diferença de ${BRL(Math.abs(diff))} ${diff>0?'a mais':'a menos'}.\n\nIsso costuma ocorrer por pagamentos, estornos ou parcelas não incluídos. Deseja importar mesmo assim?`);
      if(!ok2) return;
    }
    // substituições
    const toReplace=rows.filter(r=>r._include&&r._dup&&r._dupAction==='substituir');
    toReplace.forEach(r=>db.deleteTx(r._dup.id));
    const final=rows.filter(r=>r._include).map(r=>{
      const {_include,_dup,_dupAction,_card,_manual,...clean}=r; return {...clean, compMk};
    });
    const fileMeta={name:review.fileName,bank:review.meta.bank,type:review.fileType};
    // anexa o arquivo para abrir depois (limite ~6MB para não inflar o armazenamento)
    try{
      if(review.file && review.file.size<=6*1024*1024){
        const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(review.file);});
        fileMeta.dataUrl=dataUrl; fileMeta.mime=review.file.type||''; fileMeta.size=review.file.size;
      }
    }catch(e){}
    const n=db.addTransactions(final,fileMeta);
    const repl=toReplace.length?` (${toReplace.length} substituído(s))`:'';
    db.toast(`✓ Importação concluída! ${n} lançamento(s) adicionado(s)${repl}.`);
    setReview(null);
  }

  const types=[['despesa','Despesa'],['estorno','Estorno'],['pagamento','Pagamento'],['receita','Receita'],['transferencia','Transferência']];

  return <div className="grid" style={{gap:16}}>
    <div className="card pad">
      <div className="row" style={{justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <b style={{fontSize:15}}>Conferência da importação</b>
          <div className="muted" style={{marginTop:3}}>{review.fileName}</div>
        </div>
        <div className="row" style={{gap:8}}>
          <span className="chip"><Icon name="card" size={13}/> {review.meta.bank}{review.meta.final?` ····${review.meta.final}`:''}</span>
          <span className="tag">{review.meta.method}</span>
          {review.fileURL && <button className="btn ghost sm" onClick={openAttachment} title="Abrir o arquivo original em nova aba"><Icon name="import" size={13}/> Anexo</button>}
        </div>
      </div>

                else if(!e.target.value.trim())upd(i,{installmentCurrent:null,installmentTotal:null});}}/>
          </td>
          <td className="r"><MoneyCell value={r.amount} onChange={v=>upd(i,{amount:v})}/></td>

          <td>

          </td>
          <td className="r"><button className="btn ghost sm" title="Remover esta linha" onClick={()=>delRow(i)}><Icon name="trash" size={14}/></button></td>
        </tr>;})}
        </tbody></table>
      </div>
      <Pagination pg={pg} total={rows.length} label="lançamentos"/>

    <div className="row" style={{justifyContent:'flex-end',gap:10}}>

function exportCSV(rows,db){
  const head=['Data','Descrição original','Descrição','Categoria','Subcategoria','Cartão','Parcela','Valor','Tipo','Fixo','Assinatura'];
  const lines=[head.join(';')];
  rows.forEach(t=>lines.push([ptDate(t.date),t.descOrig,t.descPad,db.catName(t.categoryId),t.subcategory||'',
    (db.cardById(t.cardId)||{}).name||'',t.installmentTotal>1?`${t.installmentCurrent}/${t.installmentTotal}`:'',
    NUM(t.amount),t.type,t.isFixed?'Sim':'',t.isSubscription?'Sim':''].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')));
  const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lancamentos.csv';a.click();
}
function exportXLSX(rows,db){
  const data=rows.map(t=>({Data:ptDate(t.date),'Descrição':t.descPad,Categoria:db.catName(t.categoryId),
    Subcategoria:t.subcategory||'',Cartão:(db.cardById(t.cardId)||{}).name||'',
    Parcela:t.installmentTotal>1?`${t.installmentCurrent}/${t.installmentTotal}`:'',Valor:t.amount,Tipo:t.type}));
  const ws=XLSX.utils.json_to_sheet(data); const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Lançamentos'); XLSX.writeFile(wb,'lancamentos.xlsx');
}

function Lancamentos({drill}){
  const db=useDB();
  const anos=useMemo(()=>{
    const ys=new Set(db.transactions.map(t=>t.date&&t.date.slice(0,4)).filter(Boolean));
    ys.add(String(new Date().getFullYear()));
    return [...ys].sort().reverse();
  },[db.transactions]);
  const [flt,setFlt]=useStickyState('lanc.flt',{mes:'',ano:'',cat:'',card:'',type:'',q:'',min:'',max:'',fixed:'',sub:'',parc:'',status:'',origin:'',onlyCard:''});
  // (§4) origem do lançamento
  const txOrigin=t=>{
    if(t.installmentGroupId && String(t.installmentGroupId).startsWith('reneg:')) return 'reneg';
    if(t.origin==='extrato') return 'extrato';
    if(t.origin==='import') return 'fatura';
    if(t.origin==='demo') return 'demo';
    return 'manual';
  };
  // §4 — origem unificada usa o matchOrigin global (testável)
  const ORIGENS=[['manual','Cadastro manual'],['fatura','Importação de fatura'],['extrato','Importação de extrato'],['parcelamento','Parcelamento'],['gastofixo','Gasto fixo'],['reneg','Renegociação'],['demo','Demonstração']];
  const [sort,setSort]=useStickyState('lanc.sort',{k:'date',dir:-1});
  const [sel,setSel]=useState([]);
  const [edit,setEdit]=useState(null);
  const [bulkCat,setBulkCat]=useState('');
  const [bulkSub,setBulkSub]=useState('');
  const [showNew,setShowNew]=useState(false);

  useEffect(()=>{ if(!drill) return; const dmk = drill.period&&drill.period.mode==='month'?drill.period.mk:'';
    if(drill.clear){ setFlt({mes:dmk?dmk.slice(5,7):'',ano:dmk?dmk.slice(0,4):'',cat:drill.categoryId||'',card:drill.cardId||'',type:'',q:drill.q||'',min:'',max:'',fixed:'',sub:drill.sub||'',parc:'',status:'',origin:drill.origin||'',onlyCard:drill.onlyCard?'1':''}); }
    else setFlt(f=>({...f,cat:drill.categoryId||'',card:drill.cardId||'',q:drill.q||f.q,sub:drill.sub||'',
      origin:drill.origin||f.origin, onlyCard:drill.onlyCard?'1':'', mes: dmk?dmk.slice(5,7):'', ano: dmk?dmk.slice(0,4):''}));
  },[drill]);
  // Centro de eventos: abrir EXATAMENTE o lançamento de origem (abre a ficha do registro).
  useEffect(()=>{ if(drill&&drill.focusTx){ const t=db.transactions.find(x=>x.id===drill.focusTx); if(t) setEdit(t); } },[drill]);

  // quando a origem é "Renegociação", inclui as parcelas virtuais (não estão em db.transactions)
  const base = flt.origin==='reneg' ? db.allTx : db.transactions;
  let list=base.filter(t=>{
    const bm=billMonth(t);
    if(flt.ano && bm.slice(0,4)!==flt.ano) return false;
    if(flt.mes && bm.slice(5,7)!==flt.mes) return false;
    if(flt.cat && t.categoryId!==flt.cat) return false;
    if(flt.sub && (t.subcategory||'')!==flt.sub) return false;
    if(flt.card && t.cardId!==flt.card) return false;
    if(flt.onlyCard==='1' && !t.cardId) return false;
    if(flt.type && t.type!==flt.type) return false;
    if(flt.origin && !matchOrigin(t,flt.origin)) return false;
    if(flt.status && t.confStatus!==flt.status) return false;
    if(flt.min && t.amount<parseMoney(flt.min)) return false;
    if(flt.max && t.amount>parseMoney(flt.max)) return false;
    if(flt.q){ const q=normDesc(flt.q); if(!normDesc(t.descPad+' '+t.descOrig).includes(q)) return false; }
    return true;
  });
  list=[...list].sort((a,b)=>{
    let av,bv;
    if(sort.k==='date'){av=a.date;bv=b.date;}
    else if(sort.k==='amount'){av=a.amount;bv=b.amount;}
    else if(sort.k==='cat'){av=db.catName(a.categoryId);bv=db.catName(b.categoryId);}
    else {av=a.descPad;bv=b.descPad;}
    return (av>bv?1:av<bv?-1:0)*sort.dir;
  });
  const total=round2(list.reduce((s,t)=>s+spendOf(t),0));
  const pg=usePagination(list.length, 25);
  const toggleSort=k=>setSort(s=>({k,dir:s.k===k?-s.dir:-1}));
  const selectable=list.filter(t=>!t._reneg);
  const allSel=selectable.length>0 && sel.length===selectable.length;

  const F=(label,el)=>(<div><label className="lbl">{label}</label>{el}</div>);

  const fltResumo=[
    flt.q&&`busca "${flt.q}"`,
    flt.mes&&`mês ${MESES_PT[(+flt.mes)-1]}`,
    flt.ano&&`ano ${flt.ano}`,
    flt.cat&&`categoria ${db.catName(flt.cat)}`,
    flt.card&&`cartão ${(db.cardById(flt.card)||{}).name||'—'}`,
    flt.onlyCard==='1'&&'somente cartão de crédito',
    flt.type&&`tipo ${flt.type}`,
    flt.fixed==='1'&&'só fixos',
    flt.parc==='1'&&'só parcelados',
    flt.origin&&`origem: ${(ORIGENS.find(o=>o[0]===flt.origin)||[])[1]||flt.origin}`,
    flt.min&&`mín ${BRL(parseMoney(flt.min))}`,
    flt.max&&`máx ${BRL(parseMoney(flt.max))}`,
  ].filter(Boolean).join(' · ')||'todos os lançamentos';

  return <div className="grid" style={{gap:16}}>
    <div className="print-only" style={{marginBottom:4}}>

        {F('Cartão',<select className="input" value={flt.card} onChange={e=>setFlt({...flt,card:e.target.value})}><option value="">Todos</option>{db.cards.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>)}
        {F('Tipo',<select className="input" value={flt.type} onChange={e=>setFlt({...flt,type:e.target.value})}><option value="">Todos</option>{[['despesa','Despesa'],['estorno','Estorno'],['pagamento','Pagamento'],['receita','Receita']].map(([v,l])=><option key={v} value={v}>{l}</option>)}</select>)}

          <option value="">Mudar categoria…</option>{db.categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
        <select className="input" style={{width:'auto'}} value={bulkSub} disabled={!bulkCat} onChange={e=>setBulkSub(e.target.value)} title={bulkCat?'Subcategoria (opcional)':'Escolha a categoria primeiro'}>

        <button className="btn sm" disabled={!bulkCat} onClick={()=>{db.bulkUpdate(sel,{categoryId:bulkCat,...(bulkSub?{subcategory:bulkSub}:{})});db.toast(bulkSub?'Categoria e subcategoria alteradas em massa.':'Categoria alterada em massa.');setSel([]);setBulkCat('');setBulkSub('');}}>Aplicar</button>
        <button className="btn sm" onClick={()=>{db.bulkUpdate(sel,{isFixed:true});db.toast('Marcados como gasto fixo.');setSel([]);}}>Marcar fixo</button>
        <button className="btn sm" onClick={()=>exportCSV(list.filter(t=>sel.includes(t.id)),db)}>Exportar</button>
        <button className="btn danger sm" onClick={()=>{if(confirmDialog(`Excluir ${sel.length} lançamentos?`)){sel.forEach(id=>db.deleteTx(id));setSel([]);}}}>Excluir</button>
      </div>
    </div>}

    <div className="tbl-wrap">
      <table className="tbl"><thead><tr>
        <th><input type="checkbox" checked={allSel} onChange={e=>setSel(e.target.checked?selectable.map(t=>t.id):[])}/></th>
        <th onClick={()=>toggleSort('date')} style={{cursor:'pointer'}}>Data</th>
        <th onClick={()=>toggleSort('desc')} style={{cursor:'pointer'}}>Descrição</th>
        <th onClick={()=>toggleSort('cat')} style={{cursor:'pointer'}}>Categoria</th>
        <th>Cartão</th><th>Parc.</th><th className="r" onClick={()=>toggleSort('amount')} style={{cursor:'pointer'}}>Valor</th><th></th>
      </tr></thead><tbody>
      {list.slice(pg.start,pg.end).map(t=><tr key={t.id}>
        <td>{t._reneg ? <span className="muted" title="Parcela de renegociação (somente leitura)">—</span>
          : <input type="checkbox" checked={sel.includes(t.id)} onChange={e=>setSel(s=>e.target.checked?[...s,t.id]:s.filter(x=>x!==t.id))}/>}</td>
        <td className="num">{ptDate(t.date)}</td>
        <td><div onClick={()=>{ if(!t._reneg) setEdit(t); }} className={t._reneg?'':'editable'}>{t.descPad}</div>
          <div style={{display:'flex',gap:4,marginTop:2}}>
            {t._reneg&&<span className="tag" style={{color:'var(--accent-2)'}}>renegociação</span>}
            {t.isFixed&&!t._reneg&&<span className="tag">fixo</span>}{t.isSubscription&&<span className="tag">assinatura</span>}
            {t.confStatus==='revisar'&&<span className="tag" style={{color:'var(--warn)'}}>revisar</span>}</div></td>
        <td><span className="chip" style={{background:db.catColor(t.categoryId)+'22',color:db.catColor(t.categoryId)}}>{db.catName(t.categoryId)}</span></td>
        <td>{(db.cardById(t.cardId)||{}).name||'—'}</td>
        <td className="num">{t.installmentTotal>1?`${t.installmentCurrent}/${t.installmentTotal}`:'—'}</td>
        <td className={"r num "+(t.type==='estorno'?'pos':t.type==='despesa'?'':'muted')}>{t.type==='estorno'?'+':''}{BRL(t.amount)}</td>
        <td className="r">{t._reneg ? <span className="muted" style={{fontSize:11}}>em Renegociações</span>
          : <React.Fragment><button className="btn ghost sm" onClick={()=>setEdit(t)}><Icon name="edit" size={14}/></button>
          <button className="btn ghost sm" onClick={()=>{if(confirmDialog('Excluir este lançamento?'))db.deleteTx(t.id);}}><Icon name="trash" size={14}/></button></React.Fragment>}</td>
      </tr>)}
      {!list.length&&<tr><td colSpan="8" className="empty">
        Nenhum lançamento encontrado com esses filtros.
        {db.transactions.length>0 && <div style={{marginTop:8}}><button className="btn sm" onClick={()=>setFlt({mes:'',ano:'',cat:'',card:'',type:'',q:'',min:'',max:'',fixed:'',sub:'',parc:'',status:'',origin:'',onlyCard:''})}>Limpar filtros e ver os {db.transactions.length} lançamentos</button></div>}
      </td></tr>}
      </tbody></table>
    </div>
    {list.length>0 && <Pagination pg={pg} total={list.length} label="lançamentos"/>}
    {edit&&<TxModal tx={edit} onClose={()=>setEdit(null)}/>}
    {showNew&&<NewTxForm onClose={()=>setShowNew(false)}/>}
  </div>;
}

/* =========================================================================
   15. GASTOS FIXOS  (detecção automática de recorrência + cadastro manual)
   ========================================================================= */
function detectRecurring(txs){
  // agrupa por descrição normalizada (3 primeiras palavras) e analisa repetição mensal
  const groups={};
  txs.filter(t=>t.type==='despesa').forEach(t=>{
    const key=normDesc(t.descOrig).split(' ').slice(0,3).join(' ')||t.descOrig;
    (groups[key]||(groups[key]={key,desc:t.descOrig,items:[]})).items.push(t);
  });
  const out=[];
  Object.values(groups).forEach(g=>{
    const months=[...new Set(g.items.map(t=>monthKey(t.date)))].sort();
    if(months.length<2 && !g.items.some(t=>t.isFixed||t.isSubscription)) return; // precisa repetir
    const vals=g.items.map(t=>t.amount);
    const avg=round2(vals.reduce((s,v)=>s+v,0)/vals.length);
    const last=[...g.items].sort((a,b)=>a.date<b.date?1:-1)[0];
    const prevSame=g.items.filter(t=>monthKey(t.date)===addMonthKey(monthKey(last.date),-1));
    const prevVal=prevSame.length?round2(prevSame.reduce((s,t)=>s+t.amount,0)/prevSame.length):null;
    const variation= prevVal!=null && prevVal>0 ? round2((last.amount-prevVal)/prevVal*100) : null;
    const cardId=last.cardId;
    const dom=+(last.date.split('-')[2]); // dia do mês típico
    const nextDate=addMonthsISO(last.date,1);
    out.push({ key:g.key, desc:g.desc, categoryId:last.categoryId, current:last.amount, avg,
      occurrences:g.items.length, lastDate:last.date, nextDate, cardId, dom, variation,
      isSubscription:g.items.some(t=>t.isSubscription), confirmed:g.items.some(t=>t.isFixed), months:months.length });
  });
  return out.sort((a,b)=>b.current-a.current);
}

/* =========================================================================
   15b. PAGAMENTOS — confirmação do que já foi pago no mês
   ========================================================================= */
function Pagamentos({go,nav}){
  const db=useDB();
  const anos=useMemo(()=>yearOptions(db.transactions.map(t=>t.date&&t.date.slice(0,4))),[db.transactions]);
  const cur=monthKey(todayISO());
  const [mes,setMes]=useStickyState('pag.mes',cur.slice(5,7));
  const [ano,setAno]=useStickyState('pag.ano',cur.slice(0,4));
  // §1.2 — abertura a partir do Dashboard (mês/ano do período clicado)
  useEffect(()=>{ if(!nav) return; if(nav.mk){ setAno(nav.mk.slice(0,4)); setMes(nav.mk.slice(5,7)); } else if(nav.ano){ setAno(nav.ano); setMes('all'); } },[nav]);
  const {rowProps}=useRowFocus(nav&&nav.focusKey);
  const allMode=(mes==='all'||ano==='all');           // (§5) "Todos"
  const mk=allMode ? cur : `${ano}-${mes}`;            // mês de referência da visão detalhada
  const pays=db.settings?.payments||{};
  const fm=db.settings?.fixedMonthly||{};
  const renegCatId=db.renegCatId;
  const isPaid=key=>!!pays[key];
  const toggle=(key,label)=>{ const now=!isPaid(key); db.setPayment(key,now); db.toast(now?`✓ ${label} marcado como pago.`:`${label} voltou a pendente.`); };
  // (§5) Totais de um mês qualquer — reusa as mesmas fórmulas da visão detalhada.
  const monthTotals=(MK)=>{
    const eff=m=>{const k=`${m.id}:${MK}`; return (k in fm)?fm[k]:(m.amount||0);};
    const cardInv=db.cards.map(c=>({id:c.id,total:round2(db.transactions.filter(t=>t.cardId===c.id&&billMonth(t)===MK).reduce((s,t)=>s+spendOf(t),0))})).filter(x=>x.total>0);
    const man=(db.fixed||[]).filter(m=>fixedVigente(m,MK));
    const fx=man.filter(m=>(m.kind||'fixo')!=='variavel'), vr=man.filter(m=>(m.kind||'fixo')==='variavel');
    const rdue=(db.renegotiations||[]).map(r=>{const tx=renegToTxs(r,renegCatId).find(x=>monthKey(x.date)===MK); return (tx&&tx.amount>0)?{id:r.id,amount:tx.amount}:null;}).filter(Boolean);
    const tCart=round2(cardInv.reduce((s,i)=>s+i.total,0)), tFix=round2(fx.reduce((s,m)=>s+eff(m),0)), tVar=round2(vr.reduce((s,m)=>s+eff(m),0)), tReneg=round2(rdue.reduce((s,d)=>s+d.amount,0));
    const total=round2(tCart+tFix+tVar+tReneg);
    const sumP=arr=>round2(arr.filter(m=>isPaid(`fixed:${m.id}:${MK}`)).reduce((s,m)=>s+eff(m),0));
    const pCart=round2(cardInv.filter(i=>isPaid(`card:${i.id}:${MK}`)).reduce((s,i)=>s+i.total,0));
    const pReneg=round2(rdue.filter(d=>isPaid(`reneg:${d.id}:${MK}`)).reduce((s,d)=>s+d.amount,0));
    const pago=round2(pCart+sumP(fx)+sumP(vr)+pReneg);
    return {total,pago,pendente:round2(total-pago),tCart,tFix,tVar,tReneg};
  };
  // (§5) Meses com qualquer atividade (cartão, renegociação, gasto, pagamento marcado), filtrados pelo período.
  const mesesComuns=useMemo(()=>{
    const set=new Set();
    db.transactions.forEach(t=>{const bm=billMonth(t); if(bm)set.add(bm);});
    (db.renegotiations||[]).forEach(r=>renegToTxs(r,db.renegCatId).forEach(x=>{const m2=monthKey(x.date); if(m2)set.add(m2);}));
    (db.fixed||[]).forEach(m=>{ if(m.startMk)set.add(m.startMk); });
    Object.keys(pays).forEach(k=>{const m2=k.split(':').pop(); if(/^\d{4}-\d{2}$/.test(m2))set.add(m2);});
    Object.keys(fm).forEach(k=>{const m2=k.split(':').pop(); if(/^\d{4}-\d{2}$/.test(m2))set.add(m2);});
    let arr=[...set];
    if(ano!=='all') arr=arr.filter(m2=>m2.slice(0,4)===ano);
    if(mes!=='all') arr=arr.filter(m2=>m2.slice(5,7)===mes);
    return arr.sort().reverse();
  },[db.transactions,db.renegotiations,db.fixed,pays,fm,ano,mes,db.renegCatId]);
  const mesesResumo=allMode?mesesComuns:[mk];
  const agg=mesesResumo.reduce((a,MK)=>{const t=monthTotals(MK); return {total:round2(a.total+t.total),pago:round2(a.pago+t.pago),pendente:round2(a.pendente+t.pendente),tCart:round2(a.tCart+t.tCart),tFix:round2(a.tFix+t.tFix),tVar:round2(a.tVar+t.tVar),tReneg:round2(a.tReneg+t.tReneg)};},{total:0,pago:0,pendente:0,tCart:0,tFix:0,tVar:0,tReneg:0});
  // valor efetivo do gasto neste mês: ajuste manual do mês (se houver) ou o valor padrão
  const effAmt=m=>{ const k=`${m.id}:${mk}`; return (k in fm)? fm[k] : (m.amount||0); };
  const vigente=m=>fixedVigente(m,mk);

  // faturas de cartão = soma das despesas/estornos de cada cartão no mês selecionado
  const cardInvoices=db.cards.map(c=>{
    const txs=db.transactions.filter(t=>t.cardId===c.id && billMonth(t)===mk);
    const total=round2(txs.reduce((s,t)=>s+spendOf(t),0));
    return {card:c, total, count:txs.length};
  }).filter(x=>x.count>0 && x.total>0);

  // gastos recorrentes cadastrados, separados por tipo (apenas os vigentes no mês)
  const manual=(db.fixed||[]).filter(vigente);
  const manualFixos=manual.filter(m=>(m.kind||'fixo')!=='variavel');
  const manualVar=manual.filter(m=>(m.kind||'fixo')==='variavel');

  // renegociações com parcela vencendo neste mês
  const renegDue=(db.renegotiations||[]).map(r=>{
    const tx=renegToTxs(r,renegCatId).find(x=>monthKey(x.date)===mk);
    if(!tx||tx.amount<=0) return null;
    return {reneg:r, amount:tx.amount, current:tx.installmentCurrent, total:tx.installmentTotal};
  }).filter(Boolean);

  const dueDate=(day)=>{ if(!day) return '—'; return `${String(day).padStart(2,'0')}/${mes}/${ano}`; };

  const sumPaid=arr=>round2(arr.filter(m=>isPaid(`fixed:${m.id}:${mk}`)).reduce((s,m)=>s+effAmt(m),0));
  const totalCartoes=round2(cardInvoices.reduce((s,i)=>s+i.total,0));
  const totalFixos=round2(manualFixos.reduce((s,m)=>s+effAmt(m),0));
  const totalVar=round2(manualVar.reduce((s,m)=>s+effAmt(m),0));
  const totalReneg=round2(renegDue.reduce((s,d)=>s+d.amount,0));
  const totalMes=round2(totalCartoes+totalFixos+totalVar+totalReneg);
  const pagoCartoes=round2(cardInvoices.filter(i=>isPaid(`card:${i.card.id}:${mk}`)).reduce((s,i)=>s+i.total,0));
  const pagoReneg=round2(renegDue.filter(d=>isPaid(`reneg:${d.reneg.id}:${mk}`)).reduce((s,d)=>s+d.amount,0));
  const pago=round2(pagoCartoes+sumPaid(manualFixos)+sumPaid(manualVar)+pagoReneg);
  const pendente=round2(totalMes-pago);

  // linhas de gasto recorrente (fixo/variável) — valor editável por mês em ambos (ex.: financiamento)
  const fixRows=items=>items.map(m=>{const key=`fixed:${m.id}:${mk}`; const paid=isPaid(key); const k=`${m.id}:${mk}`; const pc=fixedParcela(m,mk); return <tr key={m.id} {...rowProps(key)}>
    <td><b>{m.desc}</b>{pc&&<span className="tag" style={{marginLeft:6}}>parcela {pc.current}/{pc.total}</span>}</td>
    <td><span className="chip" style={{background:db.catColor(m.categoryId)+'22',color:db.catColor(m.categoryId)}}>{db.catName(m.categoryId)}</span></td>
    <td className="num">{dueDate(m.dom)}</td>
    <td className="r num">
      <span style={{display:'inline-flex',alignItems:'center',gap:6,justifyContent:'flex-end'}}>
        <MoneyInput style={{width:120,padding:'5px 8px',textAlign:'right'}}
          value={(k in fm)?fm[k]:''} placeholder={'R$ '+NUM(m.amount||0)}
          title="Valor real neste mês (deixe vazio para usar o valor previsto)"
          onChange={v=>db.setFixedMonthly(m.id,mk,v||'')}/>
      </span></td>
    <td><span className={"chip "+(paid?'pos':'warn')}>{paid?'pago':'pendente'}</span></td>
    <td className="r"><button className={"btn sm "+(paid?'':'primary')} onClick={()=>toggle(key,m.desc)}>
      <Icon name={paid?'x':'check'} size={14}/> {paid?'Desmarcar':'Marcar pago'}</button></td>
  </tr>;});

  return <div>
    <div className="page-head"><div><h1>Pagamentos</h1>
      <p className="muted">Confirme o que já foi pago no mês. Marcar uma fatura como paga considera todos os lançamentos daquele cartão no mês como quitados.</p></div></div>

    <div className="card pad" style={{marginBottom:16}}>
      <div className="row" style={{gap:10,alignItems:'flex-end',flexWrap:'wrap'}}>
        <div><label className="lbl">Mês</label>
          <select className="input" style={{width:'auto'}} value={mes} onChange={e=>setMes(e.target.value)}>
            <option value="all">Todos</option>
            {MESES_PT.map((nm,i)=>{const mm=String(i+1).padStart(2,'0');return <option key={mm} value={mm}>{nm}</option>;})}
          </select></div>
        <div><label className="lbl">Ano</label>
          <select className="input" style={{width:'auto'}} value={ano} onChange={e=>setAno(e.target.value)}>
            <option value="all">Todos</option>
            {anos.map(y=><option key={y} value={y}>{y}</option>)}
          </select></div>
        <div className="muted" style={{marginLeft:'auto'}}>Referência: <b style={{color:'var(--ink)'}}>{allMode?`Todos (${mesesResumo.length} ${mesesResumo.length===1?'mês':'meses'})`:monthLong(mk)}</b></div>
      </div>
    </div>

    <div className="kpi-row">
      <div className="kpi"><span>{allMode?'Total no período':'Total do mês'}</span><b>{BRL(agg.total)}</b></div>
      <div className="kpi pos"><span>Já pago</span><b>{BRL(agg.pago)}</b></div>
      <div className="kpi neg"><span>Pendente</span><b>{BRL(agg.pendente)}</b></div>
      <div className="kpi"><span>% quitado</span><b>{agg.total>0?PCT(agg.pago/agg.total*100):'—'}</b></div>
    </div>

    <div className="row" style={{gap:10,flexWrap:'wrap',margin:'4px 0 14px'}}>
      <span className="chip">Cartões: <b>{BRL(agg.tCart)}</b></span>
      <span className="chip">Fixos: <b>{BRL(agg.tFix)}</b></span>
      <span className="chip">Variáveis: <b>{BRL(agg.tVar)}</b></span>
      {agg.tReneg>0 && <span className="chip">Renegociações: <b>{BRL(agg.tReneg)}</b></span>}
    </div>

    {allMode && <div className="card">
      <div className="card-head"><h3>Resumo por mês</h3>
        <span className="muted" style={{fontSize:12}}>{mesesResumo.length} {mesesResumo.length===1?'mês':'meses'}</span></div>
      <div className="tbl-wrap"><table className="tbl"><thead><tr>
        <th>Mês</th><th className="r">Total</th><th className="r">Pago</th><th className="r">Pendente</th><th className="num">% quitado</th><th className="r"></th>
      </tr></thead><tbody>
      {mesesResumo.map(MK=>{const t=monthTotals(MK); return <tr key={MK}>
        <td><b style={{textTransform:'capitalize'}}>{monthLong(MK)}</b></td>
        <td className="r num">{BRL(t.total)}</td>
        <td className="r num pos">{BRL(t.pago)}</td>
        <td className="r num neg">{BRL(t.pendente)}</td>
        <td className="num">{t.total>0?PCT(t.pago/t.total*100):'—'}</td>
        <td className="r"><button className="btn ghost sm" title="Abrir este mês" onClick={()=>{setAno(MK.slice(0,4));setMes(MK.slice(5,7));}}><Icon name="search" size={13}/> Abrir</button></td>
      </tr>;})}

          <Icon name={paid?'x':'check'} size={14}/> {paid?'Desmarcar':'Marcar pago'}</button></td>

      </tr></thead><tbody>
      {fixRows(manualFixos)}
      {!manualFixos.length&&<tr><td colSpan="6" className="empty">Nenhum gasto fixo cadastrado. Cadastre em "Gastos fixos".</td></tr>}
