// v92: Modal acessível — role=dialog, aria-modal, trap de foco, Escape, retorno de foco
function Modal({title,onClose,children,wide,foot,titleId,descId}){
  const boxRef=useRef();
  const titleUID=useRef(titleId||uid('mdl-t'));
  const prevFocus=useRef(typeof document!=='undefined'?document.activeElement:null);

  useEffect(()=>{
    // bloqueia scroll do body
    const prev=document.body.style.overflow;
    document.body.style.overflow='hidden';
    // foco automático no primeiro elemento focável
    const t=setTimeout(()=>{
      const el=boxRef.current?.querySelector('button,input,select,textarea,[tabindex]:not([tabindex="-1"])');
      if(el) el.focus();
    },30);
    return ()=>{ document.body.style.overflow=prev; clearTimeout(t); try{ prevFocus.current?.focus(); }catch(e){} };
  },[]);

  useEffect(()=>{
    const h=e=>{
      if(e.key==='Escape'){ onClose(); return; }
      if(e.key==='Tab'&&boxRef.current){
        const focusable=Array.from(boxRef.current.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'));
        if(!focusable.length) return;
        const first=focusable[0], last=focusable[focusable.length-1];
        if(e.shiftKey){ if(document.activeElement===first){ e.preventDefault(); last.focus(); } }
        else { if(document.activeElement===last){ e.preventDefault(); first.focus(); } }
      }
    };
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[onClose]);

  return <div className="overlay modal-scrim" onMouseDown={e=>e.target===e.currentTarget&&onClose()}
    style={{display:'flex',alignItems:'center',justifyContent:'center'}}>
    <div ref={boxRef} role="dialog" aria-modal="true" aria-labelledby={titleUID.current}
      className={'modal modal-box'+(wide?' wide':'')} tabIndex={-1}>
      <div className="modal-head">
        <h3 id={titleUID.current}>{title}</h3>
        <button className="btn ghost sm" onClick={onClose} aria-label="Fechar modal"><Icon name="x" size={16}/></button>
      </div>
      <div className="modal-body" id={descId||undefined}>{children}</div>
      {foot && <div className="modal-foot">{foot}</div>}
    </div>
  </div>;
}
function confirmDialog(msg){ return window.confirm(msg); }

/* ── v92: Modal de pagamento real ── */
function PaymentModal({referenceType, referenceId, originalAmount, label, onClose, onSave}){
  const db=useDB();
  const existing=(db.paymentRecords||[]).filter(r=>r.referenceType===referenceType&&r.referenceId===referenceId);
  const totalPaid=existing.reduce((s,r)=>s+Number(r.amountPaid||0),0);
  const remaining=round2(Math.max(0,(originalAmount||0)-totalPaid));
  const [f,setF]=useState({date:todayISO(),amountPaid:fmtMoneyInput(remaining),interest:'0.00',penalty:'0.00',discount:'0.00',accountId:'',paymentMethod:'',isPartial:remaining<(originalAmount||0),notes:''});
  const set=p=>setF(x=>({...x,...p}));
  const paid=Number(f.amountPaid||0)+Number(f.interest||0)+Number(f.penalty||0)-Number(f.discount||0);
  const accumulatedTotal=round2(totalPaid + paid);
  const isTotal=round2(accumulatedTotal)>=round2(originalAmount||0);
  const isOverpaid=round2(accumulatedTotal)>round2((originalAmount||0)*1.001);
  const remainingAfter=round2(Math.max(0,(originalAmount||0)-accumulatedTotal));

  function handleSave(){
    if(!f.date||!f.amountPaid){ db.toast('Informe a data e o valor pago.','warn'); return; }
    const rec={referenceType,referenceId,date:f.date,amount:originalAmount,amountPaid:Number(f.amountPaid),
      interest:Number(f.interest||0),penalty:Number(f.penalty||0),discount:Number(f.discount||0),
      accountId:f.accountId||null,paymentMethod:f.paymentMethod||'',
      status:isOverpaid?'overpaid':isTotal?'total':'partial',
      accumulatedPaid:round2(accumulatedTotal), remainingAfter,notes:f.notes||''};
    db.addPaymentRecord(rec);
    // gerar bankMovement se conta selecionada
    if(f.accountId){
      db.addBankMovement(makeBankMovement({accountId:f.accountId,date:f.date,description:'Pagamento: '+(label||referenceType),
        amount:paid,direction:'saida',movementType:referenceType==='invoice'?'card_bill_payment':'expense',source:'manual',reconciliationStatus:'reconciled'}));
    }
    db.toast(isOverpaid?'Pagamento registrado com excedente: '+BRL(round2(accumulatedTotal-(originalAmount||0)))+'. Verifique se é juros, adiantamento ou erro.':isTotal?'Pagamento total registrado. Obrigação quitada!':'Pagamento parcial registrado. Saldo restante: '+BRL(remainingAfter),'ok');
    if(onSave) onSave(rec);
    onClose();
  }

  return <Modal title={'Registrar Pagamento'+(label?' — '+label:'')} onClose={onClose}
    foot={<div className="btn-group"><button className="btn primary" onClick={handleSave}>Salvar pagamento</button><button className="btn ghost" onClick={onClose}>Cancelar</button></div>}>
    {existing.length>0&&<div style={{marginBottom:12,padding:'8px 12px',borderRadius:8,background:'var(--green-soft)',fontSize:12.5}}>
      <b>Já pago:</b> {BRL(totalPaid)} · <b>Restante:</b> {BRL(remaining)}
      {existing.map(r=><div key={r.id} style={{color:'var(--muted)',fontSize:11.5,marginTop:2}}>{ptDate(r.date)} — {BRL(r.amountPaid)} ({r.status==='total'?'quitado':'parcial'})</div>)}
    </div>}
    <div className="form-grid-2" style={{marginBottom:10}}>
      <div><label className="lbl" htmlFor="pm-date">Data do pagamento</label>
        <input id="pm-date" className="inp" type="date" value={f.date} onChange={e=>set({date:e.target.value})}/></div>
      <div><label className="lbl" htmlFor="pm-amt">Valor pago</label>
        <MoneyInput id="pm-amt" value={f.amountPaid} onChange={v=>set({amountPaid:v})}/></div>
      <div><label className="lbl" htmlFor="pm-int">Juros</label>
        <MoneyInput id="pm-int" value={f.interest} onChange={v=>set({interest:v})}/></div>
      <div><label className="lbl" htmlFor="pm-pen">Multa</label>
        <MoneyInput id="pm-pen" value={f.penalty} onChange={v=>set({penalty:v})}/></div>
      <div><label className="lbl" htmlFor="pm-disc">Desconto</label>
        <MoneyInput id="pm-disc" value={f.discount} onChange={v=>set({discount:v})}/></div>
      <div><label className="lbl" htmlFor="pm-acct">Conta utilizada</label>
        <select id="pm-acct" className="inp" value={f.accountId} onChange={e=>set({accountId:e.target.value})}>
          <option value="">— Não informar —</option>
          {(db.accounts||[]).filter(a=>!a.archived).map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
        </select></div>
      <div><label className="lbl" htmlFor="pm-method">Forma de pagamento</label>
        <select id="pm-method" className="inp" value={f.paymentMethod} onChange={e=>set({paymentMethod:e.target.value})}>
          <option value="">— Não informar —</option>
          {['Débito','PIX','TED/DOC','Boleto','Dinheiro','Cheque'].map(m=><option key={m} value={m}>{m}</option>)}
        </select></div>
      <div style={{gridColumn:'1/-1'}}><label className="lbl" htmlFor="pm-notes">Observação</label>
        <input id="pm-notes" className="inp" value={f.notes} onChange={e=>set({notes:e.target.value})} placeholder="Opcional"/></div>
    </div>
    <div style={{padding:'8px 12px',borderRadius:8,background:'var(--surface-2)',fontSize:12.5}}>
      <b>Este pagamento:</b> {BRL(round2(paid))} · <b>Total acumulado:</b> {BRL(accumulatedTotal)} · <b>Original:</b> {BRL(originalAmount||0)}
      {remainingAfter>0&&<span> · <b>Restante:</b> <span style={{color:'var(--warn)'}}>{BRL(remainingAfter)}</span></span>}
      · Status: <b style={{color:isOverpaid?'var(--neg)':isTotal?'var(--pos)':'var(--warn)'}}>{isOverpaid?'Pago com excedente':isTotal?'Quitado':'Parcial'}</b>
    </div>
  </Modal>;
}

/* ── v92: Auditoria financeira — 22 verificações ── */
function runFinancialAudit(db) {
  const issues=[];
  const addIssue=(code,desc,impact,ref,id)=>issues.push({id:uid('iss'),code,desc,impact,ref,refId:id,detectedAt:new Date().toISOString(),ignored:false});

  const cardIds=new Set((db.cards||[]).map(c=>c.id));
  const acctIds=new Set((db.accounts||[]).map(a=>a.id));
  const catIds=new Set((db.categories||[]).map(c=>c.id));
  const grpMap={}; // groupId -> [tx]

  (db.transactions||[]).forEach(t=>{
    if(t.cardId&&!cardIds.has(t.cardId)) addIssue('CARD_MISSING','Cartão inexistente','Lançamento vinculado a cartão removido','transaction',t.id);
    if(t.accountId&&!acctIds.has(t.accountId)) addIssue('ACCT_MISSING','Conta inexistente','Saldo pode estar incorreto','transaction',t.id);
    if(t.categoryId&&!catIds.has(t.categoryId)) addIssue('CAT_MISSING','Categoria inexistente','Relatórios podem estar incompletos','transaction',t.id);
    if(t.installmentGroupId){ if(!grpMap[t.installmentGroupId]) grpMap[t.installmentGroupId]=[]; grpMap[t.installmentGroupId].push(t); }
  });

  // parcelas duplicadas / sequência incoerente
  Object.entries(grpMap).forEach(([gid,txs])=>{
    const nums=txs.map(t=>t.installmentCurrent).filter(Boolean);
    const total=txs[0]?.installmentTotal||0;
    const seen=new Set();
    nums.forEach(n=>{ if(seen.has(n)) addIssue('INST_DUP','Parcela duplicada','Projeção pode estar dobrada','installmentGroup',gid); seen.add(n); });
    if(total&&Math.max(...nums)>total) addIssue('INST_SEQ','Parcela atual maior que o total','Sequência incoerente','installmentGroup',gid);
    const cardSet=new Set(txs.map(t=>t.cardId).filter(Boolean));
    if(cardSet.size>1) addIssue('INST_MULTI_CARD','Mesmo grupo com cartões diferentes','Agrupamento incorreto','installmentGroup',gid);
  });

  // pagamentos de fatura duplicados como despesa
  (db.bankMovements||[]).filter(m=>m.movementType==='card_bill_payment').forEach(m=>{
    const dup=(db.transactions||[]).find(t=>t.date===m.date&&Math.abs(Number(t.amount)-Number(m.amount))<0.01&&t.accountId===m.accountId);
    if(dup) addIssue('BILL_PAY_DUP','Pagamento de fatura duplicado como despesa','Despesas infladas','bankMovement',m.id);
  });

  // transferências classificadas como receita/despesa
  (db.bankMovements||[]).filter(m=>m.movementType==='transfer_in'||m.movementType==='transfer_out').forEach(m=>{
    const linked=(db.transactions||[]).find(t=>t.id===m.transactionId);
    if(linked) addIssue('TRANSFER_AS_EXPENSE','Transferência lançada como despesa/receita','Patrimônio distorcido','bankMovement',m.id);
  });

  // pagamentos parciais marcados como quitados
  (db.paymentRecords||[]).filter(r=>r.status==='partial').forEach(r=>{
    const paid=(db.settings?.payments||{})[r.referenceId];
    if(paid?.paid) addIssue('PARTIAL_AS_PAID','Pagamento parcial marcado como quitado','Status incorreto','paymentRecord',r.id);
  });

  // valor pago superior ao devido
  (db.paymentRecords||[]).forEach(r=>{
    if(Number(r.amountPaid||0)>Number(r.amount||0)*1.01)
      addIssue('OVERPAID','Valor pago superior ao valor original','Possível erro de registro','paymentRecord',r.id);
  });

  // v93: bankMovements duplicados (mesmo transactionId + accountId) (item 4)
  const bmByTxAcct = {};
  (db.bankMovements||[]).forEach(m=>{
    if(!m.transactionId||!m.accountId) return;
    const k = m.transactionId+'|'+m.accountId;
    if(!bmByTxAcct[k]) bmByTxAcct[k]=[];
    bmByTxAcct[k].push(m);
  });
  Object.entries(bmByTxAcct).forEach(([k,arr])=>{
    if(arr.length>1) addIssue('BM_TX_DUP','BankMovement duplicado para mesma transação+conta','Saldo pode estar dobrado','bankMovements',arr[0].id);
  });

  // v93: bankMovements duplicados (mesmo transferId + direction + accountId) (item 4)
  const bmByTrfDir = {};
  (db.bankMovements||[]).forEach(m=>{
    if(!m.transferId) return;
    const k = m.transferId+'|'+m.direction+'|'+m.accountId;
    if(!bmByTrfDir[k]) bmByTrfDir[k]=[];
    bmByTrfDir[k].push(m);
  });
  Object.entries(bmByTrfDir).forEach(([k,arr])=>{
    if(arr.length>1) addIssue('BM_TRF_DUP','BankMovement duplicado para mesma transferência','Saldo pode estar errado','bankMovements',arr[0].id);
  });

  // v93: bankMovement.accountId aponta para conta inexistente (item 15)
  (db.bankMovements||[]).forEach(m=>{
    if(m.accountId && !acctIds.has(m.accountId))
      addIssue('BM_ACCT_MISSING','BankMovement vinculado a conta inexistente','Saldo não contabilizado','bankMovement',m.id);
  });

  // v93: Consistência de receitas entre módulos (item 6)
  const curMk = monthKey(todayISO());
  const incDash = getIncomeTotalForMonth(curMk, db.incomes||[]);
  const incBudget = round2((incomeOccurrencesForMonth(curMk, db.incomes||[])||[]).reduce((s,i)=>s+Number(i.amount||0),0));
  if(Math.abs(incDash - incBudget) > 0.01) {
    addIssue('INCOME_DIVERGENCE',`Receitas divergentes no mês atual: Dashboard=${BRL(incDash)}, Orçamento=${BRL(incBudget)}`,'Valores inconsistentes entre módulos','incomes','consistency');
  }

  // v93: grupos de parcelamento — análise de consistência avançada (item 15)
  Object.entries(grpMap).forEach(([gid,txs])=>{
    const cardSet=new Set(txs.map(t=>t.cardId).filter(Boolean));
    const totals=new Set(txs.map(t=>t.installmentTotal).filter(Boolean));
    const amounts=new Set(txs.map(t=>round2(t.amount)));
    const nums=txs.map(t=>t.installmentCurrent).filter(Boolean);
    if(totals.size>1) addIssue('INST_TOTAL_MISMATCH','Grupo com totais de parcelas diferentes','Projeção incorreta','installmentGroup',gid);
    if(amounts.size>1) addIssue('INST_AMOUNT_MISMATCH','Grupo com valores de parcela diferentes','Pode indicar compras distintas agrupadas','installmentGroup',gid);
    const maxCur = nums.length ? Math.max(...nums) : 0;
    const total = txs[0]?.installmentTotal||0;
    if(total && maxCur > total) addIssue('INST_OVER_TOTAL','Parcela atual maior que total declarado','Sequência impossível','installmentGroup',gid);
  });

  // v95: movimentação não classificada sem bankMovement
  (db.bankMovements||[]).filter(m=>m.movementType==='unclassified').forEach(m=>{
    issues.push({type:'unclassified_movement',desc:'Movimentação não classificada: '+(m.description||''),
      accountId:m.accountId,amount:m.amount,date:m.date,impact:'Afeta saldo sem categoria',
      action:'Classificar a movimentação'});
  });

  // v95: receita em auditIncomes sem bankMovement correspondente
  (db.auditIncomes||[]).forEach(ai=>{
    const hasBm=(db.bankMovements||[]).some(m=>m.movementType==='income'&&m.accountId===ai.accountId&&
      Math.abs(m.amount-Number(ai.amount||0))<0.01&&m.date===ai.date);
    if(!hasBm&&ai.accountId){
      issues.push({type:'income_no_bankmovement',desc:'Receita sem movimento bancário: '+(ai.descOrig||''),
        amount:ai.amount,date:ai.date,accountId:ai.accountId,
        impact:'Saldo não reflete esta receita',action:'Criar bankMovement de entrada'});
    }
  });

  // v95: transferência sem par de bankMovements
  (db.transfers||[]).forEach(t=>{
    const out=(db.bankMovements||[]).filter(m=>m.transferId===t.id&&m.direction==='saida').length;
    const inn=(db.bankMovements||[]).filter(m=>m.transferId===t.id&&m.direction==='entrada').length;
    if(out<1||inn<1){
      issues.push({type:'transfer_incomplete',desc:'Transferência sem par de movimentos bancários: '+(t.description||''),
        amount:t.amount,date:t.date,impact:'Saldo incorreto em uma ou ambas as contas',
        action:'Gerar bankMovements de saída e entrada'});
    }
  });

  // v95: bankMovement de pagamento de fatura sem referenceId
  (db.bankMovements||[]).filter(m=>m.movementType==='card_bill_payment'&&!m.referenceId).forEach(m=>{
    issues.push({type:'bill_no_reference',desc:'Pagamento de fatura sem fatura vinculada: '+(m.description||''),
      amount:m.amount,date:m.date,accountId:m.accountId,
      impact:'Fatura não atualizada',action:'Vincular a uma fatura de cartão'});
  });

  // v94: detectar pagamento de fatura lançado como despesa (duplicidade)
  (db.transactions||[]).forEach(t=>{
    if(t.type!=='despesa'||t.isBillPayment) return;
    const conf=cardBillConfidence(t.descOrig||'');
    if(conf==='high'){
      addIssue('BILL_AS_EXPENSE',
        `Possível pagamento de fatura lançado como despesa: ${t.descOrig||''} · ${BRL(t.amount)}`,
        'Pode estar duplicando despesas da fatura importada',
        'transaction',t.id);
    }
  });

  // v94: despesa de extrato com mesmo valor e data próxima de um bankMovement card_bill_payment
  const billBMs=(db.bankMovements||[]).filter(m=>m.movementType==='card_bill_payment');
  (db.transactions||[]).filter(t=>t.type==='despesa'&&!t.isBillPayment&&t.origin==='extrato').forEach(t=>{
    const tDate=new Date((t.date||'')+'T00:00:00');
    const match=billBMs.find(m=>{
      const mDate=new Date((m.date||'')+'T00:00:00');
      const dayDiff=Math.abs((tDate-mDate)/(1000*60*60*24));
      return dayDiff<=5 && Math.abs(Number(t.amount)-Number(m.amount))<0.02 && m.accountId===t.accountId;
    });
    if(match){
      addIssue('BILL_EXTRATO_DUP',
        `Despesa do extrato pode ser duplicata de pagamento de fatura: ${t.descOrig||''} · ${BRL(t.amount)}`,
        `Impacto duplicado: ${BRL(t.amount)} pode estar sendo somado duas vezes`,
        'transaction',t.id);
    }
  });

  return issues;
}

function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function ChartJS({type,data,options={},height=240}){
  const ref=useRef(), inst=useRef();
  const theme=typeof document!=='undefined'?document.documentElement.dataset.theme:'light';
  const hasChart=typeof Chart!=='undefined';
  useEffect(()=>{
    if(!hasChart||!ref.current) return;
    try{
      const grid=cssVar('--line'), text=cssVar('--muted');
      Chart.defaults.color=text; Chart.defaults.font.family="Inter, system-ui, sans-serif";
      const opts={responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:text,boxWidth:12,font:{size:11}}}},
        scales: type==='doughnut'||type==='pie'? undefined : {
          x:{grid:{color:grid},ticks:{color:text,font:{size:10}}},
          y:{grid:{color:grid},ticks:{color:text,font:{size:10}},beginAtZero:true}},
        ...options};
      inst.current=new Chart(ref.current,{type,data,options:opts});
    }catch(e){ console.error('Falha ao renderizar gráfico:',e); }
    return ()=>{ try{ inst.current&&inst.current.destroy(); }catch(e){} };
  },[JSON.stringify(data),type,theme,hasChart]);
  if(!hasChart) return <div className="chart-box" style={{height,display:'grid',placeItems:'center',
    border:'1px dashed var(--line)',borderRadius:10,color:'var(--muted)',fontSize:12,textAlign:'center',padding:12}}>
    Biblioteca de gráficos não carregou.<br/>Verifique sua conexão e recarregue a página.</div>;
  return <div className="chart-box" style={{height}}><canvas ref={ref}/></div>;
}

// (§11) Campo monetário com máscara automática "R$ 0.000,00".
// O usuário digita apenas números; a máscara é aplicada em tempo real e o valor
// é entregue ao onChange SEMPRE como número (reais), nunca como texto.
function MoneyInput({value,onChange,...p}){
  const fmtCents=c=>(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const seed=v=>(v===''||v==null||Number(v)===0)?'':fmtCents(Math.round((Number(v)||0)*100));
  const [txt,setTxt]=useState(()=>seed(value));
  const last=useRef(value);
  useEffect(()=>{ if(value!==last.current){ last.current=value; setTxt(seed(value)); } },[value]);
  function handle(e){
    const digits=e.target.value.replace(/\D/g,'');
    if(!digits){ setTxt(''); last.current=0; onChange(0); return; }
    const cents=parseInt(digits.slice(0,15),10);
    setTxt(fmtCents(cents));
    const reais=round2(cents/100); last.current=reais; onChange(reais);
  }
  return <input className="input num" inputMode="numeric" value={txt?('R$ '+txt):''} placeholder="R$ 0,00"
    onChange={handle} {...p}/>;
}
// Campo de valor que aceita digitação livre de "," e "." e só converte ao confirmar/sair
function MoneyCell({value,onChange,style}){
  const fmt=n=>fmtMoneyInput(n).replace('.',',');
  const [txt,setTxt]=useState(()=>fmt(value));
  const last=useRef(value);
  useEffect(()=>{ if(value!==last.current){ last.current=value; setTxt(fmt(value)); } },[value]);
  function handle(e){
    const s=e.target.value.replace(/[^\d.,-]/g,'');
    setTxt(s);
    const n=parseMoney(s);
    if(n!=null){ last.current=n; onChange(n); }
  }
  function blur(){ const n=parseMoney(txt); if(n!=null){ last.current=n; setTxt(fmt(n)); onChange(n); } else { setTxt(fmt(value)); } }
  return <input className="input num" inputMode="decimal" value={txt} onChange={handle} onBlur={blur}
    style={style||{width:96,padding:'5px 7px',textAlign:'right'}}/>;
}
function Conf({v}){
  const pct=Math.round((v||0)*100);
  const col=pct>=80?'var(--pos)':pct>=60?'var(--warn)':'var(--neg)';
  return <span className="conf" title={"Confiança "+pct+"%"} style={{color:col}}>
    <span className="bar"><i style={{width:pct+'%',background:col}}/></span>{pct}%</span>;
}

/* (§13) Padrão único de filtros + (§2/§3/§6/§8) agrupamento por ano/mês.
   FilterBar = cartão de filtros; Fld = rótulo+controle; MesSelect/AnoSelect = seletores

function FilterBar({children,onClear,active}){

      </div>}

function Fld({label,children,style}){ return <div style={style}><label className="lbl">{label}</label>{children}</div>; }
function MesSelect({value,onChange,allLabel='Todos',width=130}){

    <option value="all">{allLabel}</option>

function AnoSelect({value,onChange,years,allLabel='Todos',width=110}){

// Agrupa por Ano → Mês (mais recentes primeiro). getISO(item) deve retornar 'yyyy-mm-dd' ou ''.
function groupByYM(items,getISO){
  const map={};
  (items||[]).forEach(it=>{ const iso=(getISO(it)||''); const y=iso.slice(0,4)||'—'; const mk=iso.slice(0,7)||'—';
    (map[y]=map[y]||{}); (map[y][mk]=map[y][mk]||[]).push(it); });
  return Object.keys(map).sort().reverse().map(y=>({year:y,
    months:Object.keys(map[y]).sort().reverse().map(mk=>({mk,label:mk==='—'?'Sem data':monthLong(mk),items:map[y][mk]}))}));
}
function GroupHead({title,count,sub}){

    <span className="muted" style={{fontSize:12}}>{count} {count===1?'registro':'registros'}{sub?` · ${sub}`:''}</span>
  </div>;
}

// paginação reutilizável
function usePagination(total, defaultPer){
  const [perPage,setPerPage]=useState(defaultPer||25);
  const [page,setPage]=useState(1);
  const pages = perPage==='all'? 1 : Math.max(1, Math.ceil(total/perPage));
  useEffect(()=>{ if(page>pages) setPage(pages); },[pages,page]);
  const start = perPage==='all'? 0 : (page-1)*perPage;
  const end = perPage==='all'? total : Math.min(total, start+perPage);
  return {page,setPage,perPage,setPerPage,pages,start,end};
}
function Pagination({pg,total,label}){
  if(total===0) return null;
  const {page,setPage,perPage,setPerPage,pages,start,end}=pg;
  const go=p=>setPage(Math.min(pages,Math.max(1,p)));
  // janela de páginas
  const nums=[]; const win=2;
  for(let p=Math.max(1,page-win);p<=Math.min(pages,page+win);p++) nums.push(p);
  return <div className="pager">
    <div className="muted" style={{fontSize:12.5}}>
      Mostrando <b>{total===0?0:start+1}–{end}</b> de <b>{total}</b> {label||'itens'}
    </div>
    <div className="pager-ctrls">
      <span className="muted" style={{fontSize:12.5}}>Por página:</span>
      <select className="input" style={{width:80,padding:'5px 7px'}} value={perPage}
        onChange={e=>{setPerPage(e.target.value==='all'?'all':+e.target.value); setPage(1);}}>
        {[10,25,50,100].map(n=><option key={n} value={n}>{n}</option>)}
        <option value="all">Todos</option>
      </select>
      {perPage!=='all' && pages>1 && <div className="pager-nav">
        <button className="btn ghost sm" disabled={page<=1} onClick={()=>go(1)} title="Primeira">«</button>
        <button className="btn ghost sm" disabled={page<=1} onClick={()=>go(page-1)} title="Anterior">‹</button>

const FILTER_STORE={};
// rota → prefixo das chaves de filtro (em FILTER_STORE) a limpar ao entrar PELO MENU.
// Acesso por submenu/drill preserva; só o menu principal zera os filtros da tela.
const MENU_RESET_PREFIX={

  pagamentos:'pag.', renegociacoes:'reneg.', eventos:'ev.', orcamentos:'orc.',
  relatorios:'analise.', comparativo:'comp.', 'hist-pagamentos':'histpag.'
};
function clearFilterPrefix(pref){ if(!pref) return; Object.keys(FILTER_STORE).forEach(k=>{ if(k.indexOf(pref)===0) delete FILTER_STORE[k]; }); }
function useStickyState(key, initial){
  const [v,setV]=useState(()=> (key in FILTER_STORE) ? FILTER_STORE[key] : (typeof initial==='function'?initial():initial));
  const set=useCallback(next=>{ setV(prev=>{ const nv=(typeof next==='function')?next(prev):next; FILTER_STORE[key]=nv; return nv; }); },[key]);
  return [v,set];
}

function usePeriod(txs){
  const months=useMemo(()=>{
    const s=new Set(txs.map(t=>billMonth(t)).filter(Boolean));
    return [...s].sort().reverse();
  },[txs]);
  const [mode,setMode]=useState('month');
  const initMk=()=>{
    const s=[...new Set(txs.map(t=>billMonth(t)).filter(Boolean))].sort().reverse();
    return s[0]||monthKey(todayISO());
  };
  // mk = mês EXIBIDO (efetivo) · anchor = mês escolhido em "Mês" (lembrado entre as trocas)
  const [mk,setMk]=useState(initMk);
  const [anchor,setAnchor]=useState(initMk);
  const [range,setRange]=useState({from:'',to:''});
  useEffect(()=>{ if(!mk && months.length){ setMk(months[0]); setAnchor(months[0]); } },[months]);

  // troca de modo: "Mês anterior" mostra (âncora − 1) sem perder a âncora; "Mês" volta à âncora
  const setModeSmart=useCallback(m=>{
    setMode(m);
    const base=anchor||months[0]||monthKey(todayISO());
    if(m==='prev') setMk(addMonthKey(base,-1));
    else if(m==='month') setMk(base);
  },[anchor,months]);

  // setter usado pelos seletores de mês/ano: no modo "anterior" mantém a relação âncora = exibido + 1
  const setMkSmart=useCallback(next=>{
    setMk(next);
    if(mode==='prev') setAnchor(addMonthKey(next,1));
    else setAnchor(next);
  },[mode]);

  const test=useCallback(date=>{
    const m=monthKey(date);
    if(mode==='month'||mode==='prev') return m===mk;
    if(mode==='year') return date.slice(0,4)===(mk||'').slice(0,4);
    if(mode==='all') return true;
    if(mode==='range') return (!range.from||date>=range.from)&&(!range.to||date<=range.to);
    return true;
  },[mode,mk,range]);

  const label = (mode==='month'||mode==='prev')?monthLong(mk)
    : mode==='year'?'Ano de '+(mk||'').slice(0,4): mode==='all'?'Todos os meses'
    : `${ptDate(range.from||'—')} a ${ptDate(range.to||'—')}`;

  return {mode,setMode:setModeSmart,mk,setMk:setMkSmart,range,setRange,months,test,label};
}
function PeriodBar({P, extra}){
  const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const ref=(P.mk||todayISO());
  const selY=ref.slice(0,4), selM=ref.slice(5,7);
  // faixa de anos: cobre os anos com dados + uma janela ampla ao redor do ano atual (usuário escolhe qualquer um)
  const nowY=new Date().getFullYear();
  const dataYears=P.months.map(m=>+m.slice(0,4));
  const minY=Math.min(nowY-6, ...(dataYears.length?dataYears:[nowY]));
  const maxY=Math.max(nowY+1, ...(dataYears.length?dataYears:[nowY]));
  const years=[]; for(let y=maxY;y>=minY;y--) years.push(y);
  const showMonth = P.mode==='month'||P.mode==='prev';
  const showYear  = showMonth || P.mode==='year';
  return <div className="row" style={{alignItems:'center',gap:10,justifyContent:'space-between'}}>
    <div className="row" style={{alignItems:'center',gap:10}}>
      <div className="seg">
        {[['prev','Mês anterior'],['month','Mês'],['year','Ano'],['all','Acumulado'],['range','Intervalo']].map(([k,l])=>
          <button key={k} className={P.mode===k?'on':''} onClick={()=>P.setMode(k)}>{l}</button>)}
      </div>
      {showMonth &&
        <select className="input" style={{width:'auto'}} value={selM} onChange={e=>P.setMk(`${selY}-${e.target.value}`)}>
          {MES.map((nm,i)=>{const mm=String(i+1).padStart(2,'0'); return <option key={mm} value={mm}>{nm}</option>;})}
        </select>}
      {showYear &&
        <select className="input" style={{width:'auto'}} value={selY} onChange={e=>P.setMk(`${e.target.value}-${selM}`)}>
          {years.map(y=><option key={y} value={y}>{y}</option>)}
        </select>}
      {P.mode==='range' && <React.Fragment>
        <input type="date" className="input" style={{width:'auto'}} value={P.range.from} onChange={e=>P.setRange({...P.range,from:e.target.value})}/>
        <span className="muted">até</span>
        <input type="date" className="input" style={{width:'auto'}} value={P.range.to} onChange={e=>P.setRange({...P.range,to:e.target.value})}/>
      </React.Fragment>}
    </div>
    {extra}
  </div>;
}

function Dashboard({go}){
  const db=useDB();
  const P=usePeriod(db.transactions);
  const hideTotals=!!db.settings?.dashHideTotals;
  const showTotals=!!db.settings?.dashShowTotals;  // bloco Totais detalhados é opt-in (Configurações)

  const [smartMode,setSmartMode]=useState('macro'); // gráfico inteligente: macro × analítica

  useEffect(()=>{ if(!openHero) setReserve(0); },[openHero]);

  const inP = db.allTx.filter(t=>P.test(billDate(t)));

  // mês anterior p/ comparação
  const prevMk = (P.mode==='month'||P.mode==='prev')? addMonthKey(P.mk,-1) : null;
  const prevTx = prevMk? db.allTx.filter(t=>billMonth(t)===prevMk):[];
  const prevTotal = prevMk? consolidatedSpend(db,[prevMk],prevTx).total : 0;

  // receitas no período — usa fonte centralizada (v93)
  const _incOccs = useMemo(()=>{
    if(P.mode==='month'||P.mode==='prev'){ const mk=P.mk||monthKey(todayISO()); const [y,m]=(mk).split('-').map(Number); const last=new Date(y,m,0).getDate(); return getIncomeOccurrences(`${mk}-01`,`${mk}-${String(last).padStart(2,'0')}`,db.incomes); }
    if(P.mode==='year'){ const yr=(P.mk||todayISO()).slice(0,4); return getIncomeOccurrences(`${yr}-01-01`,`${yr}-12-31`,db.incomes); }
    if(P.mode==='range'&&P.range&&P.range.from&&P.range.to) return getIncomeOccurrences(P.range.from,P.range.to,db.incomes);
    return getIncomeOccurrences('2000-01-01','2099-12-31',db.incomes);
  },[P.mode,P.mk,P.range,db.incomes]);
  const incP = round2(_incOccs.reduce((s,i)=>s+Number(i.amount||0),0));
  const incItems = _incOccs.map(i=>({label:i.name||'Receita',value:BRL(i.amount)})).sort((a,b)=>0);

  // meses abrangidos pelo período (p/ pago × falta pagar, espelhando a aba Pagamentos)
  const periodMonths = useMemo(()=>{
    if(P.mode==='month'||P.mode==='prev') return [P.mk];
    if(P.mode==='year'){ const y=(P.mk||todayISO()).slice(0,4); return Array.from({length:12},(_,i)=>`${y}-${String(i+1).padStart(2,'0')}`); }
    if(P.mode==='range'){ const out=[]; if(P.range.from&&P.range.to){ let [y,m]=P.range.from.slice(0,7).split('-').map(Number); const end=P.range.to.slice(0,7);
      while(out.length<60){ const mk=`${y}-${String(m).padStart(2,'0')}`; out.push(mk); if(mk>=end)break; m++; if(m>12){m=1;y++;} } } return out; }
    return [...new Set(db.transactions.map(t=>billMonth(t)))];
  },[P.mode,P.mk,P.range,db.transactions]);

  const pays=db.settings?.payments||{}; const fm=db.settings?.fixedMonthly||{};
  const fixedAll=db.fixed||[];
  const renegCatId=db.renegCatId;
  let payable=0, paid=0; const paidRows={}, pendRows={};
  periodMonths.forEach(m=>{
    db.cards.forEach(c=>{
      const tot=round2(db.transactions.filter(t=>t.cardId===c.id&&billMonth(t)===m).reduce((s,t)=>s+spendOf(t),0));
      if(tot>0){ payable=round2(payable+tot); const k='card:'+c.id;
        if(pays[`card:${c.id}:${m}`]){ paid=round2(paid+tot); paidRows[k]={label:c.name,color:c.color,v:round2((paidRows[k]?.v||0)+tot)}; }
        else pendRows[k]={label:c.name,color:c.color,v:round2((pendRows[k]?.v||0)+tot)}; }
    });
    fixedAll.filter(f=>fixedVigente(f,m)).forEach(f=>{
      const amt=(`${f.id}:${m}` in fm)?fm[`${f.id}:${m}`]:(f.amount||0);
      if(amt>0){ payable=round2(payable+amt); const k='fix:'+f.id;
        if(pays[`fixed:${f.id}:${m}`]){ paid=round2(paid+amt); paidRows[k]={label:f.desc,v:round2((paidRows[k]?.v||0)+amt)}; }
        else pendRows[k]={label:f.desc,v:round2((pendRows[k]?.v||0)+amt)}; }
    });
    (db.renegotiations||[]).forEach(r=>{
      const tx=renegToTxs(r,renegCatId).find(x=>monthKey(x.date)===m); if(!tx||tx.amount<=0) return;
      payable=round2(payable+tx.amount); const k='reneg:'+r.id;
      if(pays[`reneg:${r.id}:${m}`]){ paid=round2(paid+tx.amount); paidRows[k]={label:r.desc,v:round2((paidRows[k]?.v||0)+tx.amount)}; }
      else pendRows[k]={label:r.desc,v:round2((pendRows[k]?.v||0)+tx.amount)};
    });
  });
  const pending=round2(payable-paid);
  const toRows=o=>Object.values(o).sort((a,b)=>b.v-a.v).map(r=>({label:r.label,color:r.color,value:BRL(r.v)}));

  // §14 (Desenho 1) — despesa consolidada: realizado (allTx) + templates de db.fixed NÃO suprimidos.
  // cardsTotal+renegTotal+avulsosTotal = realizado (= A.total); fixos/variáveis = só templates ainda não realizados.
  const cardItems=db.cards.map(c=>({id:c.id,name:c.name,color:c.color,v:A.byCard[c.id]||0})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const cardsTotal=round2(cardItems.reduce((s,c)=>s+c.v,0));

  const varPct = prevTotal>0? round2((despTotal-prevTotal)/prevTotal*100):null;
  // categorias consolidadas (realizado + templates não suprimidos) — soma fecha com despTotal
