function FixedForm({fixed,onClose,onScopedEdit}){
  const db=useDB();
  const curMk=monthKey(todayISO());
  const [f,setF]=useState(()=>{ const base=fixed||{desc:'',categoryId:'',amount:'',dom:'5',cardId:'',kind:'fixo',startMk:curMk,recorrente:true,parcelas:1}; return {...base,_parc:(+base.parcelas||1)>1}; });
  const set=p=>setF(x=>({...x,...p}));
  const refMk=f.startMk||curMk;
  const sMes=refMk.slice(5,7), sAno=refMk.slice(0,4);
  const anosOpt=Array.from({length:51},(_,i)=>String(2000+i));
  const parcelado=(+f.parcelas||1)>1;
  const nParc=Math.max(2,+f.parcelas||2);
  const endMk=addMonthKey(refMk,nParc-1);
  const isVarKind=(f.kind==='variavel');
  const unitV=parseMoney(f.valorUnit)||0;
  const qtdV=Math.max(1,+f.qtd||1);
  const totalVar=round2(unitV*qtdV);
  function save(){
    if(!f.desc.trim()) return db.toast('Informe a descrição.','warn');
    const isParc=!!f._parc; const parcelas=isParc?Math.max(2,+f.parcelas||2):1;
    const rec=isParc?false:(f.recorrente!==false);
    const variavel=(f.kind==='variavel');
    const amount=variavel ? round2((parseMoney(f.valorUnit)||0)*Math.max(1,+f.qtd||1)) : (parseMoney(f.amount)||0);
    const data={desc:f.desc.trim(),categoryId:f.categoryId,amount,dom:+f.dom||1,
      cardId:f.cardId,kind:f.kind||'fixo',startMk:(f.startMk||curMk),recorrente:rec,parcelas,
      valorUnit:variavel?(parseMoney(f.valorUnit)||0):null, qtd:variavel?Math.max(1,+f.qtd||1):null, obs:(f.obs||'').trim()||null};
    if(fixed&&fixed.id){
      const isRec = data.recorrente!==false && (+data.parcelas||1)<=1;
      if(isRec && onScopedEdit){ onScopedEdit(data); onClose(); return; } // §15: escolher escopo
      db.updateFixed(fixed.id,data); db.toast('Gasto atualizado.');
    }
    else { db.addFixed(data); db.toast('Gasto cadastrado.'); }
    onClose();
  }
  // _parc é só estado de UI (inicializado a partir de parcelas salvas)
  const isParc=!!f._parc;
  return <Modal title={fixed&&fixed.id?'Editar gasto':'Cadastrar gasto'} onClose={onClose} foot={<React.Fragment>
      <button className="btn" onClick={onClose}>Cancelar</button>
      <button className="btn primary" onClick={save}>Salvar</button></React.Fragment>}>
    <div className="grid" style={{gridTemplateColumns:'1fr 1fr',gap:14}}>
      <div style={{gridColumn:'1/3'}}><label className="lbl">Descrição</label><input className="input" value={f.desc} onChange={e=>set({desc:e.target.value})} placeholder="Ex.: Aluguel, Netflix, Taxa extra do condomínio"/></div>

      <div style={{gridColumn:'1/3'}}>
        <label className="lbl">{isParc?'Mês da 1ª parcela':'Mês de referência'}</label>
        <div className="row" style={{gap:8}}>
          <select className="input" style={{width:'auto'}} value={sMes} onChange={e=>set({startMk:`${sAno}-${e.target.value}`})}>
            {MESES_PT.map((nm,i)=>{const mm=String(i+1).padStart(2,'0');return <option key={mm} value={mm}>{nm}</option>;})}
          </select>
          <select className="input" style={{width:'auto'}} value={sAno} onChange={e=>set({startMk:`${e.target.value}-${sMes}`})}>
            {anosOpt.map(y=><option key={y} value={y}>{y}</option>)}
          </select>
        </div>
        <div className="muted" style={{fontSize:11.5,marginTop:5}}>
          {isParc ? `Cobrado de ${monthLong(refMk)} até ${monthLong(endMk)} (${nParc} parcelas).`
            : f.recorrente!==false ? `O gasto passa a valer em ${monthLong(refMk)} e se repete nos meses seguintes.`
            : `O gasto vale apenas em ${monthLong(refMk)}.`}
        </div>
      </div>

      <div style={{gridColumn:'1/3'}}>
        <label className="row" style={{gap:8,alignItems:'center',cursor:'pointer'}}>
          <input type="checkbox" checked={isParc} onChange={e=>set({_parc:e.target.checked, parcelas:e.target.checked?Math.max(2,+f.parcelas||3):1})} style={{width:16,height:16,accentColor:'var(--accent)'}}/>
          <b>Parcelado</b> — cobrança por tempo limitado (nº fixo de meses)
        </label>
        {isParc && <div className="row" style={{gap:8,alignItems:'center',marginTop:8}}>
          <span className="muted" style={{fontSize:12.5}}>Quantidade de parcelas (meses):</span>
          <input className="input num" type="number" min="2" max="240" style={{width:90}} value={f.parcelas} onChange={e=>set({parcelas:e.target.value})}/>
        </div>}
        <div className="muted" style={{fontSize:11.5,marginTop:4}}>Ex.: taxa extra do condomínio em <b>3×</b> de R$ 500 — informe 3 parcelas e o valor de cada uma. Ele aparece só nesses meses.</div>
      </div>

      {!isParc && <div style={{gridColumn:'1/3'}}>
        <label className="row" style={{gap:8,alignItems:'center',cursor:'pointer'}}>
          <input type="checkbox" checked={f.recorrente!==false} onChange={e=>set({recorrente:e.target.checked})} style={{width:16,height:16,accentColor:'var(--accent)'}}/>
          <b>Recorrente</b> — repete automaticamente nos próximos meses
        </label>
        <div className="muted" style={{fontSize:11.5,marginTop:4}}>Cadastre uma vez: ele aparece todo mês na aba <b>Pagamentos</b>. Se o valor mudar (ex.: financiamento), é só ajustar o valor naquele mês.</div>
      </div>}

      <div style={{gridColumn:'1/3'}}>
        <label className="lbl">Tipo</label>
        <div className="seg" style={{width:'fit-content'}}>
          <button className={f.kind!=='variavel'?'on':''} onClick={()=>set({kind:'fixo'})} type="button">Fixo</button>
          <button className={f.kind==='variavel'?'on':''} onClick={()=>set({kind:'variavel'})} type="button">Variável</button>
        </div>
        <div className="muted" style={{fontSize:11.5,marginTop:5}}>
          {f.kind==='variavel'
            ? 'Variável: o valor costuma mudar (ou nem sempre acontece). Você confirma o valor de cada mês na aba Pagamentos.'
            : 'Fixo: valor previsto igual todo mês (pode ajustar pontualmente quando precisar).'}
        </div>
      </div>

      <div><label className="lbl">Categoria</label><select className="input" value={f.categoryId} onChange={e=>set({categoryId:e.target.value})}>
        {db.categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
      {isVarKind && !isParc
        ? <React.Fragment>
            <div><label className="lbl">Valor unitário</label><MoneyInput value={f.valorUnit} onChange={v=>set({valorUnit:v})}/></div>
            <div><label className="lbl">Quantidade no mês</label><input className="input num" type="number" min="1" max="999" value={f.qtd||''} placeholder="1" onChange={e=>set({qtd:e.target.value})}/></div>
            <div style={{gridColumn:'1/3'}} className="chip" >Valor total do mês: <b style={{marginLeft:6}}>{BRL(totalVar)}</b> <span className="muted" style={{marginLeft:8,fontSize:11.5}}>({qtdV}× {BRL(unitV)})</span></div>
            <div style={{gridColumn:'1/3'}}><label className="lbl">Observação (opcional)</label><input className="input" value={f.obs||''} onChange={e=>set({obs:e.target.value})} placeholder="Ex.: diarista 2ª e 5ª"/></div>
          </React.Fragment>
        : <div><label className="lbl">{isParc?'Valor de cada parcela':'Valor mensal'}</label><MoneyInput value={f.amount} onChange={v=>set({amount:v})}/></div>}
      <div><label className="lbl">Dia de vencimento</label><input className="input num" type="number" min="1" max="31" value={f.dom} onChange={e=>set({dom:e.target.value})}/></div>
      <div><label className="lbl">Forma de pagamento</label><select className="input" value={f.cardId} onChange={e=>set({cardId:e.target.value})}>
        <option value="">—</option>{db.cards.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
        <div className="muted" style={{fontSize:11,marginTop:3}}>Pix/débito? Cadastre em "Cartões e contas" → Forma de pagamento.</div></div>
    </div>
  </Modal>;
}

function GastosFixos({go,nav}){
  const db=useDB();
  const [add,setAdd]=useState(false);
  const [edit,setEdit]=useState(null);
  const [scopeAsk,setScopeAsk]=useState(null); // §15 {id,op,desc,patch?}
  const scopeCurMk=monthKey(todayISO());
  const isRecMonthly=m=>(m.recorrente!==false)&&(+m.parcelas||1)<=1;
  const runScope=scope=>{ if(!scopeAsk)return; db.scopeFixed(scopeAsk.id,scopeAsk.op,scope,scopeCurMk,scopeAsk.patch);
    db.toast(scopeAsk.op==='delete'?'Gasto excluído.':'Gasto atualizado.'); setScopeAsk(null); };
  const manual=db.fixed||[];
  // (§6) filtros + agrupamento por mês/ano (mês de referência do gasto)
  const [gAno,setGAno]=useStickyState('fixos.ano','all'),[gMes,setGMes]=useStickyState('fixos.mes','all'),[gCat,setGCat]=useStickyState('fixos.cat',''),
        [gCard,setGCard]=useStickyState('fixos.card',''),[gRec,setGRec]=useStickyState('fixos.rec',''),[gBusca,setGBusca]=useStickyState('fixos.busca',''),[gKind,setGKind]=useStickyState('fixos.kind',''),[gSit,setGSit]=useStickyState('fixos.sit','');
  // (§6) situação = pago/pendente no mês de referência (cruza com Pagamentos)
  const pays=db.settings?.payments||{};
  const sitRefMk = (gMes!=='all'&&gAno!=='all') ? `${gAno}-${gMes}` : monthKey(todayISO());
  const situacaoOf=m=>{ if(!fixedVigente(m,sitRefMk)) return 'na'; return pays[`fixed:${m.id}:${sitRefMk}`] ? 'pago' : 'pendente'; };
  // §1.2 — vindo do Dashboard com foco em "fixos" ou "variáveis"
  useEffect(()=>{ if(nav&&nav.kind) setGKind(nav.kind); },[nav]);
  const {rowProps}=useRowFocus(nav&&nav.focusId);
  const recOf=m=>{const n=+m.parcelas||0; if(n>1)return 'parcelado'; return (m.recorrente!==false)?'mensal':'unico';};
  const startOf=m=>(m.startMk||monthKey(todayISO()));

  const manualFixos=manual.filter(m=>(m.kind||'fixo')!=='variavel');
  const manualVar=manual.filter(m=>(m.kind||'fixo')==='variavel');
  const totalFixoGarantido=round2(manualFixos.reduce((s,m)=>s+(m.amount||0),0));
  const totalVariavel=round2(manualVar.reduce((s,m)=>s+(m.amount||0),0));
  const totalFixed=round2(totalFixoGarantido+totalVariavel);
  const incomeMonth=round2(getIncomeTotalForMonth(monthKey(todayISO()),db.incomes||[]));

  const refTxt=m=>{
    const n=+m.parcelas||0;
    if(n>1){ const end=addMonthKey(m.startMk||monthKey(todayISO()),n-1); return `parcelado · ${n}× (${ptMonth(m.startMk||'')}–${ptMonth(end)})`; }
    const rec=m.recorrente!==false;
    if(!rec) return `apenas ${monthLong(m.startMk||monthKey(todayISO()))}`;
    return m.startMk ? `mensal · desde ${monthLong(m.startMk)}` : 'mensal';
  };

  return <div>
    <div className="page-head"><div><h1>Gastos fixos e recorrentes</h1>
      <p className="muted">Cadastre aqui as despesas que se repetem (aluguel, assinaturas, financiamento, diarista…). As compras de fatura ficam só em <b>Cartões/Lançamentos</b>.</p></div>
      <button className="btn primary" onClick={()=>setAdd(true)}><Icon name="plus" size={15}/> Cadastrar</button></div>

    <div className="kpi-row">
      <div className="kpi"><span>Total mensal estimado</span><b>{BRL(totalFixed)}</b></div>
      <div className="kpi pos"><span>Fixos</span><b>{BRL(totalFixoGarantido)}</b></div>
      <div className="kpi warn"><span>Variáveis (estimativa)</span><b>{BRL(totalVariavel)}</b></div>
      {incomeMonth>0 && <div className="kpi"><span>% da renda mensal</span><b>{PCT(totalFixed/incomeMonth*100)}</b></div>}
    </div>

    {manual.length>0 ? (()=>{
      const filtered=manual.filter(m=>{
        const mk=startOf(m);
        if(gAno!=='all'&&mk.slice(0,4)!==gAno)return false;
        if(gMes!=='all'&&mk.slice(5,7)!==gMes)return false;
        if(gCat&&m.categoryId!==gCat)return false;
        if(gCard&&m.cardId!==gCard)return false;
        if(gRec&&recOf(m)!==gRec)return false;
        if(gSit&&situacaoOf(m)!==gSit)return false;
        if(gKind==='variavel'&&(m.kind||'fixo')!=='variavel')return false;
        if(gKind==='fixo'&&(m.kind||'fixo')==='variavel')return false;
        if(gBusca&&!(m.desc||'').toLowerCase().includes(gBusca.toLowerCase()))return false;
        return true;
      });
      const gActive=(gAno!=='all'?1:0)+(gMes!=='all'?1:0)+(gCat?1:0)+(gCard?1:0)+(gRec?1:0)+(gSit?1:0)+(gKind?1:0)+(gBusca?1:0);
      const groups=groupByYM(filtered, m=>startOf(m)+'-01');
      const fixRow=m=>{const isVar=(m.kind||'fixo')==='variavel'; return <tr key={m.id} {...rowProps(m.id)}>
        <td><b>{m.desc}</b></td>
        <td>{isVar?<span className="chip warn">variável</span>:<span className="chip pos">fixo</span>}{(+m.parcelas||0)>1&&<span className="tag" style={{marginLeft:6}}>parcelado</span>}</td>
        <td><span className="chip" style={{background:db.catColor(m.categoryId)+'22',color:db.catColor(m.categoryId)}}>{db.catName(m.categoryId)}</span></td>
        <td className="r num">{BRL(m.amount)}{isVar&&(m.qtd>1||m.valorUnit)?<span className="muted" style={{fontSize:11}}> ({m.qtd||1}× {BRL(m.valorUnit||m.amount)})</span>:(isVar?<span className="muted" style={{fontSize:11}}> est.</span>:null)}</td>
        <td className="num">dia {m.dom}</td>
        <td className="muted" style={{fontSize:12.5}}>{refTxt(m)}</td>
        <td>{(db.cardById(m.cardId)||{}).name||'—'}</td>
        <td>{(()=>{const s=situacaoOf(m);return s==='pago'?<span className="chip pos">pago</span>:s==='pendente'?<span className="chip warn">pendente</span>:<span className="muted" title={`Não vigente em ${monthLong(sitRefMk)}`}>—</span>;})()}</td>
        <td className="r">
          <button className="btn ghost sm" title="Ver lançamentos" onClick={()=>go('lancamentos',{q:m.desc})}><Icon name="search" size={14}/></button>
          <button className="btn ghost sm" title="Editar" onClick={()=>setEdit(m)}><Icon name="edit" size={14}/></button>
          <button className="btn ghost sm" title="Excluir" onClick={()=>{ if(isRecMonthly(m)){ setScopeAsk({id:m.id,op:'delete',desc:m.desc}); } else if(confirmDialog('Excluir este gasto?')){ db.deleteFixed(m.id); db.toast('Gasto excluído.'); } }}><Icon name="trash" size={14}/></button></td>
      </tr>;};
      const head=<thead><tr><th>Despesa</th><th>Tipo</th><th>Categoria</th><th className="r">Valor</th><th className="num">Vencimento</th><th>Recorrência</th><th>Forma de pagamento</th><th>Situação</th><th></th></tr></thead>;
      return <div className="card pad">
        <div className="row" style={{justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
          <h3 style={{margin:0}}>Gastos cadastrados</h3>
          <span className="muted" style={{fontSize:12}}>{filtered.length} de {manual.length}</span>
        </div>
        <div className="row" style={{gap:10,alignItems:'flex-end',flexWrap:'wrap',marginTop:12}}>
          <Fld label="Ano"><AnoSelect value={gAno} onChange={setGAno} years={yearOptions(manual.map(m=>startOf(m).slice(0,4)))}/></Fld>
          <Fld label="Mês"><MesSelect value={gMes} onChange={setGMes}/></Fld>
          <Fld label="Categoria"><select className="input" style={{width:150}} value={gCat} onChange={e=>setGCat(e.target.value)}><option value="">Todas</option>{db.categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Fld>
          <Fld label="Forma de pagamento"><select className="input" style={{width:150}} value={gCard} onChange={e=>setGCard(e.target.value)}><option value="">Todas</option>{db.cards.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Fld>
          <Fld label="Recorrência"><select className="input" style={{width:130}} value={gRec} onChange={e=>setGRec(e.target.value)}><option value="">Todas</option><option value="mensal">Mensal</option><option value="parcelado">Parcelado</option><option value="unico">Único</option></select></Fld>
          <Fld label="Situação"><select className="input" style={{width:130}} value={gSit} onChange={e=>setGSit(e.target.value)}><option value="">Todas</option><option value="pago">Pago</option><option value="pendente">Pendente</option></select></Fld>
          <Fld label="Tipo"><select className="input" style={{width:120}} value={gKind} onChange={e=>setGKind(e.target.value)}><option value="">Todos</option><option value="fixo">Fixo</option><option value="variavel">Variável</option></select></Fld>
          <Fld label="Favorecido"><input className="input" style={{width:150}} value={gBusca} onChange={e=>setGBusca(e.target.value)} placeholder="descrição"/></Fld>

        </div>
        <div className="muted" style={{fontSize:11.5,marginTop:8}}>
          Situação (pago/pendente) refere-se a <b>{monthLong(sitRefMk)}</b>{(gMes==='all'||gAno==='all')?' (mês atual — selecione mês e ano para ver outro)':''}. As confirmações de pagamento são feitas em <b>Pagamentos</b>.

        {groups.length===0
          ? <div className="muted" style={{padding:'18px 0'}}>Nenhum gasto para os filtros selecionados.</div>

              {groups.map(g=>g.months.map(mo=>{

                    <span className="muted" style={{fontSize:12,marginLeft:10}}>{mo.items.length} {mo.items.length===1?'registro':'registros'} · {BRL(sub)}</span>

      </div>;
    })()
    : <div className="card pad"><div className="empty">Nenhum gasto fixo ou variável cadastrado. Clique em "Cadastrar" para adicionar o primeiro.</div></div>}
    {add&&<FixedForm onClose={()=>setAdd(false)}/>}
    {edit&&<FixedForm fixed={edit} onClose={()=>setEdit(null)} onScopedEdit={patch=>setScopeAsk({id:edit.id,op:'edit',desc:edit.desc,patch})}/>}
    {scopeAsk&&<Modal title={scopeAsk.op==='delete'?'Excluir gasto recorrente':'Alterar gasto recorrente'} onClose={()=>setScopeAsk(null)}>
      <p style={{marginTop:0}}>"<b>{scopeAsk.desc}</b>" é um gasto recorrente. O que deseja {scopeAsk.op==='delete'?'excluir':'alterar'}?</p>
      <p className="muted" style={{fontSize:13}}>Meses já encerrados não são alterados. "Este e os próximos" vale a partir de {monthLong(scopeCurMk)}.</p>
      <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:14}}>
        <button className="btn" onClick={()=>runScope('one')}>{scopeAsk.op==='delete'?`Somente ${monthLong(scopeCurMk)}`:`Alterar somente ${monthLong(scopeCurMk)}`}</button>
        <button className="btn" onClick={()=>runScope('forward')}>{scopeAsk.op==='delete'?'Este mês e os próximos':'Alterar este e os próximos'}</button>
        <button className="btn danger" onClick={()=>runScope('all')}>{scopeAsk.op==='delete'?'Excluir toda a recorrência':'Alterar toda a recorrência'}</button>
        <button className="btn ghost" onClick={()=>setScopeAsk(null)}>Cancelar</button>
      </div>
    </Modal>}
  </div>;
}

// converte uma renegociação no mesmo formato dos grupos de parcelamento
function renegToGroup(r){
  const total=+r.total||1, parcela=round2(+r.parcela||0);
  const billed=Math.min(total, Math.max(0,+r.paid||0));
  // mês da 1ª parcela: startMk informado, ou recuado a partir de hoje pelo nº de parcelas já pagas
  const buyMk=r.startMk||addMonthKey(monthKey(todayISO()),-billed);
  const dom=Math.min(28,Math.max(1,+r.dom||5));
  const buyDate=`${buyMk}-${String(dom).padStart(2,'0')}`;
  const g={groupId:'reneg:'+r.id, desc:r.desc, cardId:null, creditor:r.creditor||'', isReneg:true,
    parcela, total, seen:[billed], lastCur:billed, billed, lastDate:buyDate, buyDate, dom:r.dom};
  return buildInstSchedule(g, null);
}

function RenegForm({reneg,onClose,onScopedEdit}){
  const db=useDB();
  const [f,setF]=useState(reneg||{desc:'',creditor:'',parcela:'',total:'12',paid:'0',dom:'10',
    categoryId:(db.categories.find(c=>/moradia|financ|empr|d[ií]vida/i.test(c.name))||db.categories[0]||{}).id||''});
  const set=p=>setF(x=>({...x,...p}));
  // §15 — uma renegociação "em curso" (tem parcelas pagas E restantes) abre o diálogo de escopo ao salvar.
  const g=(reneg&&reneg.id)?renegToGroup(reneg):null;
  const inProgress=!!(g && g.paid>0 && g.remaining>0);
  function save(){
    if(!f.desc.trim()) return db.toast('Informe a descrição.','warn');
    const total=+f.total||1;
    const paid=Math.min(Math.max(0,+f.paid||0),total);
    const startMk = (reneg&&reneg.startMk) ? reneg.startMk : addMonthKey(monthKey(todayISO()), -paid);
    const data={desc:f.desc.trim(),creditor:(f.creditor||'').trim(),parcela:parseMoney(f.parcela)||0,
      total,paid,dom:+f.dom||1,categoryId:f.categoryId,startMk};
    if(reneg&&reneg.id){
      if(inProgress && onScopedEdit){
        // o patch "forward" leva só os atributos do acordo (não total/paid/startMk, forçados na divisão)
        const fwd={desc:data.desc,creditor:data.creditor,parcela:data.parcela,dom:data.dom,categoryId:data.categoryId};
        onScopedEdit({full:data, fwd}); onClose(); return;
      }
      db.updateReneg(reneg.id,data); db.toast('Renegociação atualizada.');
    }
    else { db.addReneg(data); db.toast('Renegociação cadastrada.'); }
    onClose();
  }
  return <Modal title={reneg&&reneg.id?'Editar renegociação':'Nova renegociação / empréstimo'} onClose={onClose} foot={<React.Fragment>
      <button className="btn" onClick={onClose}>Cancelar</button>
      <button className="btn primary" onClick={save}>Salvar</button></React.Fragment>}>
    <div className="grid" style={{gridTemplateColumns:'1fr 1fr',gap:14}}>
      <div style={{gridColumn:'1/3'}}><label className="lbl">Descrição</label><input className="input" value={f.desc} onChange={e=>set({desc:e.target.value})} placeholder="Ex.: Renegociação empréstimo pessoal"/></div>
      <div><label className="lbl">Credor / banco</label><input className="input" value={f.creditor} onChange={e=>set({creditor:e.target.value})} placeholder="Ex.: Bradesco"/></div>
      <div><label className="lbl">Categoria</label><select className="input" value={f.categoryId} onChange={e=>set({categoryId:e.target.value})}>{db.categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
      <div><label className="lbl">Valor da parcela</label><MoneyInput value={f.parcela} onChange={v=>set({parcela:v})}/></div>
      <div><label className="lbl">Dia de vencimento</label><input className="input num" type="number" min="1" max="31" value={f.dom} onChange={e=>set({dom:e.target.value})}/></div>
      <div><label className="lbl">Total de parcelas</label><input className="input num" type="number" min="1" max="240" value={f.total} onChange={e=>set({total:e.target.value})}/></div>
      <div><label className="lbl">Parcelas já pagas</label><input className="input num" type="number" min="0" max={f.total} value={f.paid} onChange={e=>set({paid:e.target.value})}/></div>
      <div className="muted" style={{gridColumn:'1/3',fontSize:11.5}}>Ex.: 36 parcelas de R$ 333,00, 11 já pagas → o sistema mostra 25 restantes, saldo e previsão mensal, e inclui em Parcelamentos.</div>
      {inProgress && <div className="chip warn" style={{gridColumn:'1/3',fontSize:11.5,alignSelf:'start'}}><Icon name="alert" size={12}/> Renegociação em curso: ao salvar, você escolhe se a mudança vale só daqui para frente (preservando as parcelas já pagas) ou para toda a renegociação.</div>}
    </div>
  </Modal>;
}

      const filtered=list.filter(r=>{

      const head=<thead><tr><th>Descrição</th><th>Credor</th><th className="r">Valor total</th><th className="r">Parcela</th><th className="num">Progresso</th><th className="r">Pago</th><th className="r">Saldo</th><th className="num">Venc.</th><th></th></tr></thead>;

    {add&&<RenegForm onClose={()=>setAdd(false)}/>}
    {edit&&<RenegForm reneg={edit} onClose={()=>setEdit(null)}

              <button className="btn" onClick={()=>runScope('all')}>Alterar toda a renegociação</button>
            </React.Fragment>}
        <button className="btn ghost" onClick={()=>setScopeAsk(null)}>Cancelar</button>
      </div>
    </Modal>}
  </div>;
}

function SplitForm({split,mk,partner,onClose}){

    if(!f.desc.trim()) return db.toast('Informe a descrição.','warn');

    if(split&&split.id){ db.updateSplit(split.id,data); db.toast('Item atualizado.'); }
    else { db.addSplit(data); db.toast('Item adicionado à divisão.'); }
    onClose();

  const div=Math.max(1,+f.divisor||2); const her=round2((parseMoney(f.total)||0)/div);
  return <Modal title={split&&split.id?'Editar item':'Novo item para dividir'} onClose={onClose} foot={<React.Fragment>
      <button className="btn" onClick={onClose}>Cancelar</button>
      <button className="btn primary" onClick={save}>Salvar</button></React.Fragment>}>

function ImportSplitModal({mk,partner,onClose}){
  const db=useDB();
  // fontes: gastos cadastrados vigentes no mês + faturas de cartão do mês
  const fm=db.settings?.fixedMonthly||{};
  const fixedOpts=(db.fixed||[]).filter(f=>fixedVigente(f,mk)).map(f=>{
    const k=`${f.id}:${mk}`; const amt=(k in fm)?fm[k]:(f.amount||0);
    return {key:'fix:'+f.id, desc:f.desc, total:amt, categoryId:f.categoryId||''};
  });
  const cardOpts=db.cards.map(c=>{
    const tot=round2(db.transactions.filter(t=>t.cardId===c.id&&billMonth(t)===mk).reduce((s,t)=>s+spendOf(t),0));
    return tot>0?{key:'card:'+c.id, desc:`Fatura ${c.name}`, total:tot, categoryId:''}:null;
  }).filter(Boolean);
  const opts=[...fixedOpts,...cardOpts];
  const [sel,setSel]=useState({});
  const [divisor,setDivisor]=useState('2');
  const [payer,setPayer]=useState('me');
  const toggle=k=>setSel(s=>({...s,[k]:!s[k]}));
  const chosen=opts.filter(o=>sel[o.key]);
  function confirm(){
    if(!chosen.length) return db.toast('Selecione ao menos um gasto.','warn');
    const div=Math.max(1,+divisor||2);
    chosen.forEach(o=>db.addSplit({mk,desc:o.desc,total:o.total||0,divisor:div,payer,categoryId:o.categoryId||''}));
    db.toast(`${chosen.length} gasto(s) adicionado(s) à divisão.`); onClose();
  }
  return <Modal title="Puxar gastos cadastrados" onClose={onClose} foot={<React.Fragment>
      <button className="btn" onClick={onClose}>Cancelar</button>
      <button className="btn primary" onClick={confirm}>Adicionar {chosen.length>0?`(${chosen.length})`:''}</button></React.Fragment>}>
    {opts.length===0
      ? <div className="empty">Nenhum gasto cadastrado nem fatura para {monthLong(mk)}. Cadastre gastos fixos ou importe faturas primeiro.</div>
      : <React.Fragment>
      <p className="muted" style={{fontSize:12.5,marginTop:0}}>Marque os gastos de {monthLong(mk)} que quer incluir na divisão. Você ainda pode adicionar itens manuais (ex.: outras compras) pelo botão "Adicionar gasto".</p>
      <div className="tbl-wrap" style={{maxHeight:300,overflow:'auto'}}><table className="tbl"><thead><tr>
        <th style={{width:36}}></th><th>Gasto</th><th className="r">Valor</th></tr></thead><tbody>
        {opts.map(o=><tr key={o.key} style={{cursor:'pointer'}} onClick={()=>toggle(o.key)}>
          <td><input type="checkbox" readOnly tabIndex={-1} checked={!!sel[o.key]} style={{width:16,height:16,accentColor:'var(--accent)',pointerEvents:'none'}}/></td>
          <td><b>{o.desc}</b>{o.categoryId&&<span className="chip" style={{marginLeft:6,background:db.catColor(o.categoryId)+'22',color:db.catColor(o.categoryId)}}>{db.catName(o.categoryId)}</span>}</td>
          <td className="r num">{BRL(o.total)}</td></tr>)}
      </tbody></table></div>
      <div className="row" style={{gap:14,marginTop:14,alignItems:'flex-end',flexWrap:'wrap'}}>
        <div><label className="lbl">Dividir cada um por</label><input className="input num" type="number" min="1" max="20" style={{width:90}} value={divisor} onChange={e=>setDivisor(e.target.value)}/></div>
        <div><label className="lbl">Quem pagou</label>
          <div className="seg" style={{width:'fit-content'}}>
            <button type="button" className={payer!=='other'?'on':''} onClick={()=>setPayer('me')}>Eu</button>
            <button type="button" className={payer==='other'?'on':''} onClick={()=>setPayer('other')}>{partner}</button>
          </div></div>
      </div>
    </React.Fragment>}
  </Modal>;
}

function Parcelamentos({go}){
  const db=useDB();
  const allGroups=useMemo(()=>instGroups(db),[db.transactions,db.renegotiations,db.settings]);
  const [scopeAsk,setScopeAsk]=useState(null); // §15 {kind:'card'|'reneg',...}
  const scopeRef=monthKey(todayISO());
  const runCard=action=>{ if(!scopeAsk)return;
    if(action==='settle'){ db.settleInstallment(scopeAsk.groupId,scopeRef); db.toast('Parcelamento encerrado a partir deste mês.'); }
    else if(action==='delete'){ db.deleteInstallmentGroup(scopeAsk.groupId); db.toast('Parcelamento excluído.','warn'); }
    setScopeAsk(null);
  };
  const runReneg=scope=>{ if(!scopeAsk)return;
    db.scopeReneg(scopeAsk.renegId,'delete',scope,scopeRef);
    db.toast(scope==='all'?'Renegociação excluída.':'Renegociação quitada a partir deste mês.');
    setScopeAsk(null);
  };
  // fontes disponíveis para o filtro (cartões com parcelamento + renegociações)
  const cardsWithGroups=useMemo(()=>{
    const ids=new Set(allGroups.filter(g=>g.cardId).map(g=>g.cardId));
    return db.cards.filter(c=>ids.has(c.id));
  },[allGroups,db.cards]);
  const hasReneg=allGroups.some(g=>g.isReneg);
  // §7 — multiseleção de origens (checkboxes). chave = id do cartão | '__reneg__'.
  const availKeys=useMemo(()=>[...cardsWithGroups.map(c=>c.id),...(hasReneg?['__reneg__']:[])],[cardsWithGroups,hasReneg]);
  const [sel,setSel]=useStickyState('parc.sel',()=>new Set(availKeys));
  const knownRef=useRef(availKeys);
  useEffect(()=>{ // some origem removida -> tira da seleção; surge nova -> entra selecionada por padrão
    const known=knownRef.current;
    const appeared=availKeys.filter(k=>!known.includes(k));
    setSel(prev=>{ const next=new Set([...prev].filter(k=>availKeys.includes(k))); appeared.forEach(k=>next.add(k)); return next; });
    knownRef.current=availKeys;
  },[availKeys.join('|')]);
  const keyOf=g=>g.isReneg?'__reneg__':g.cardId;
  const allSelected = availKeys.length>0 && availKeys.every(k=>sel.has(k));
  const toggle=k=>setSel(prev=>{const n=new Set(prev); n.has(k)?n.delete(k):n.add(k); return n;});
  const toggleAll=()=>setSel(allSelected?new Set():new Set(availKeys));
  const groups=allGroups.filter(g=>sel.has(keyOf(g)));
  // rótulo da seleção para títulos: vazio se "todas"; nome único se 1; senão "N origens"
  const selKeys=availKeys.filter(k=>sel.has(k));
  const nameOf=k=>k==='__reneg__'?'Renegociações':((db.cardById(k)||{}).name||'—');
  const selLabel = (allSelected||selKeys.length===0) ? null : selKeys.length===1 ? nameOf(selKeys[0]) : `${selKeys.length} origens`;
  const oneLabel = selLabel;

  const ativos=groups.filter(g=>g.remaining>0);
  const totalSaldo=round2(groups.reduce((s,g)=>s+g.balance,0));
  const totalPago=round2(groups.reduce((s,g)=>s+g.valuePaid,0));

  // filtro Mês/Ano (como em Divisão de gastos): define o centro da janela do gráfico.
  const curMk=monthKey(todayISO());
  const [mes,setMes]=useState(curMk.slice(5,7));
  const [ano,setAno]=useState(curMk.slice(0,4));
  const anosOpt=useMemo(()=>{
    const ys=new Set(); groups.forEach(g=>(g.schedule||[]).forEach(p=>{ if(p.mk) ys.add(p.mk.slice(0,4)); }));
    ys.add(curMk.slice(0,4)); ys.add(String(+curMk.slice(0,4)+1));
    return [...ys].sort();
  },[groups,curMk]);
  const refMk=`${ano}-${mes}`;

  // agenda consolidada por mês: já pagas (retroativo) e a vencer (futuro), a partir da DATA DA COMPRA.
  const byMonth={};
  groups.forEach(g=>(g.schedule||[]).forEach(p=>{ if(!p.mk) return;
    const slot=byMonth[p.mk]||(byMonth[p.mk]={paid:0,fut:0});
    if(p.paid) slot.paid=round2(slot.paid+p.amount); else slot.fut=round2(slot.fut+p.amount); }));
  // janela de 12 meses centrada no mês de referência (5 atrás · ref · 6 à frente) para mostrar o retroativo.
  const winStart=addMonthKey(refMk,-5);
  const winMonths=Array.from({length:12},(_,k)=>addMonthKey(winStart,k));
  const paidVals=winMonths.map(m=>(byMonth[m]&&byMonth[m].paid)||0);
  const futVals=winMonths.map(m=>(byMonth[m]&&byMonth[m].fut)||0);
  const totVals=winMonths.map((m,i)=>round2(paidVals[i]+futVals[i]));
  const hasChart=winMonths.some((m,i)=>totVals[i]>0);
  const refIdx=winMonths.indexOf(refMk);

  return <div>
    <div className="page-head">
      <div><h1>Parcelamentos</h1>
        <p className="muted">Cada mês considera apenas o valor da parcela — nunca o valor total da compra.</p></div>
    </div>

    {(cardsWithGroups.length>0||hasReneg) && <div className="card pad" style={{marginBottom:16}}>
      <div className="row" style={{gap:8,alignItems:'center',flexWrap:'wrap'}}>
        <label className="lbl" style={{marginRight:4}}>Origens</label>
        <label className="chip" style={{cursor:'pointer',display:'flex',alignItems:'center',gap:6,fontWeight:600}}>
          <input type="checkbox" checked={allSelected} onChange={toggleAll}/> Todas</label>
        {cardsWithGroups.map(c=><label key={c.id} className="chip" style={{cursor:'pointer',display:'flex',alignItems:'center',gap:6,background:c.color?c.color+'18':undefined}}>
          <input type="checkbox" checked={sel.has(c.id)} onChange={()=>toggle(c.id)}/> {c.name}</label>)}
        {hasReneg && <label className="chip" style={{cursor:'pointer',display:'flex',alignItems:'center',gap:6}}>
          <input type="checkbox" checked={sel.has('__reneg__')} onChange={()=>toggle('__reneg__')}/> Renegociações</label>}
        <div className="muted" style={{fontSize:12.5,marginLeft:'auto'}}>{groups.length} parcelamento(s){selLabel?` · ${selLabel}`:''}</div>
      </div>
      <div className="row" style={{gap:12,alignItems:'flex-end',flexWrap:'wrap',marginTop:12}}>
        <div><label className="lbl">Mês</label>
          <select className="input" style={{width:'auto'}} value={mes} onChange={e=>setMes(e.target.value)}>
            {MESES_PT.map((nm,i)=>{const mm=String(i+1).padStart(2,'0');return <option key={mm} value={mm}>{nm}</option>;})}</select></div>
        <div><label className="lbl">Ano</label>
          <select className="input" style={{width:'auto'}} value={ano} onChange={e=>setAno(e.target.value)}>
            {anosOpt.map(y=><option key={y} value={y}>{y}</option>)}</select></div>
        <button className="btn ghost sm" onClick={()=>{setMes(curMk.slice(5,7));setAno(curMk.slice(0,4));}} title="Voltar para o mês atual">Hoje</button>
        <div className="muted" style={{fontSize:11.5,flex:'1 1 220px'}}>O gráfico mostra 12 meses em torno do mês escolhido, separando o que já foi pago do que está por vencer. Mude o mês para ver períodos retroativos ou adiante.</div>
      </div>
    </div>}

    <div className="kpi-row">
      <div className="kpi"><span>Compras parceladas</span><b>{groups.length}</b></div>
      <div className="kpi"><span>Em andamento</span><b>{ativos.length}</b></div>
      <div className="kpi neg"><span>Saldo restante</span><b>{BRL(totalSaldo)}</b></div>
      <div className="kpi"><span>Já pago</span><b>{BRL(totalPago)}</b></div>
    </div>

    {hasChart && <div className="card">
      <div className="card-head"><h3>Parcelas por mês{oneLabel?` · ${oneLabel}`:''} · {monthLong(refMk)}</h3></div>
      <ChartJS type="bar" height={240} data={{labels:winMonths.map(m=>monthLong(m)),
        datasets:[
          {label:'Já pagas',data:paidVals,backgroundColor:cssVar('--muted-soft')||'rgba(148,163,178,.28)',
            borderColor:cssVar('--muted')||'#94A3B2',borderWidth:1,borderRadius:6,stack:'p',order:3},
          {label:'A vencer',data:futVals,backgroundColor:cssVar('--accent-soft')||'rgba(14,159,142,.25)',
            borderColor:cssVar('--accent'),borderWidth:1,borderRadius:6,stack:'p',order:2},
          {type:'line',label:'Total do mês',data:totVals,borderColor:cssVar('--accent-2'),
            backgroundColor:cssVar('--accent-2'),tension:.4,borderWidth:2.5,pointRadius:winMonths.map((m,i)=>i===refIdx?6:3),
            pointHoverRadius:6,pointBackgroundColor:winMonths.map((m,i)=>i===refIdx?cssVar('--accent-2'):'#fff'),
            pointBorderColor:cssVar('--accent-2'),pointBorderWidth:2,fill:false,order:1},
        ]}}
        options={{plugins:{legend:{display:true}},scales:{x:{stacked:true},y:{stacked:true}}}}/>
      <div className="muted" style={{fontSize:11.5,padding:'0 14px 12px'}}>Cinza: parcelas já quitadas (retroativo). Verde: parcelas a vencer. A 1ª parcela é contada no mês da compra; cada parcela seguinte avança um mês a partir dela.</div>
    </div>}

    <div className="card" style={{marginTop:18}}>
      <div className="card-head"><h3>Detalhamento</h3></div>
      <div className="tbl-wrap"><table className="tbl"><thead><tr>
        <th>Data da compra</th><th>Descrição</th><th>Cartão</th><th className="r">Valor total</th><th className="r">Parcela</th>
        <th className="num">Progresso</th><th className="r">Pago</th><th className="r">Saldo</th><th>Última parcela</th><th></th>
      </tr></thead><tbody>
      {groups.map(g=>{const pct=Math.round(g.paid/g.total*100);
        const renegId=g.isReneg?String(g.groupId).slice('reneg:'.length):null;
        const renegInProgress=g.isReneg && g.paid>0 && g.remaining>0;
        return <tr key={g.groupId}>
        <td className="num">{g.buyDate?ptDate(g.buyDate):'—'}</td>
        <td><b>{g.desc}</b>{g.settled&&<span className="chip" style={{marginLeft:6,fontSize:10.5}}>encerrado</span>}</td>
        <td>{g.isReneg? <span className="chip">{g.creditor||'Renegociação'}</span> : ((db.cardById(g.cardId)||{}).name||'—')}</td>
        <td className="r num">{BRL(g.totalValue)}</td>
        <td className="r num">{BRL(g.parcela)}</td>
        <td><div style={{display:'flex',alignItems:'center',gap:8}}>
          <div className="progress" style={{flex:1}}><i style={{width:pct+'%'}}/></div>
          <span className="num muted" style={{fontSize:12,whiteSpace:'nowrap'}}>{g.paid}/{g.total}</span></div></td>
        <td className="r num pos">{BRL(g.valuePaid)}</td>
        <td className="r num neg">{BRL(g.balance)}</td>
        <td className="num">{g.settled?<span className="muted">encerrado</span>:(g.remaining?ptDate(g.endDate):'concluído')}</td>
        <td className="r" style={{whiteSpace:'nowrap'}}>
          <button className="btn ghost sm" title="Ver lançamentos" onClick={()=>go('lancamentos',{q:g.desc})}><Icon name="search" size={14}/></button>
          {!g.isReneg && g.settled &&
            <button className="btn ghost sm" title="Reabrir parcelamento" onClick={()=>{ db.settleInstallment(g.groupId,null); db.toast('Parcelamento reaberto.'); }}><Icon name="eye" size={14}/></button>}
          {!g.isReneg && !g.settled &&
            <button className="btn ghost sm" title="Encerrar ou excluir" onClick={()=>setScopeAsk({kind:'card',groupId:g.groupId,desc:g.desc,paid:g.paid,total:g.total})}><Icon name="trash" size={14}/></button>}
          {renegInProgress &&
            <button className="btn ghost sm" title="Quitar ou excluir" onClick={()=>setScopeAsk({kind:'reneg',renegId,desc:g.desc,paid:g.paid,remaining:g.remaining})}><Icon name="trash" size={14}/></button>}
        </td>
      </tr>;})}
      {!groups.length&&<tr><td colSpan="10" className="empty">{allGroups.length?'Nenhum parcelamento nas origens selecionadas.':'Nenhuma compra parcelada registrada.'}</td></tr>}
      </tbody></table></div>
    </div>
    {scopeAsk&&scopeAsk.kind==='card'&&<Modal title="Parcelamento de cartão" onClose={()=>setScopeAsk(null)}>
      <p style={{marginTop:0}}>"<b>{scopeAsk.desc}</b>" tem <b>{scopeAsk.paid}</b> de <b>{scopeAsk.total}</b> parcelas lançadas. O que deseja fazer?</p>
      <p className="muted" style={{fontSize:13}}>As parcelas já lançadas são sempre preservadas.</p>
      <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:14}}>
        <button className="btn" onClick={()=>runCard('settle')}>Encerrar a partir deste mês <span className="muted" style={{fontSize:12}}>(quitei/antecipei o restante; as parcelas futuras deixam de ser projetadas e não comprometem mais o limite)</span></button>
        <button className="btn danger" onClick={()=>{ if(confirmDialog('Excluir este parcelamento? Todas as transações dele serão removidas.')) runCard('delete'); }}>Excluir parcelamento inteiro <span style={{fontSize:12,opacity:.85}}>(remove as transações)</span></button>
        <button className="btn ghost" onClick={()=>setScopeAsk(null)}>Cancelar</button>
      </div>
    </Modal>}
    {scopeAsk&&scopeAsk.kind==='reneg'&&<Modal title="Renegociação" onClose={()=>setScopeAsk(null)}>
      <p style={{marginTop:0}}>"<b>{scopeAsk.desc}</b>" é uma renegociação com <b>{scopeAsk.paid}</b> parcela{scopeAsk.paid===1?'':'s'} paga{scopeAsk.paid===1?'':'s'} e <b>{scopeAsk.remaining}</b> restante{scopeAsk.remaining===1?'':'s'}.</p>
      <p className="muted" style={{fontSize:13}}>Para alterar o valor, edite em Renegociações. Aqui você pode quitar ou excluir.</p>
      <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:14}}>
        <button className="btn" onClick={()=>runReneg('forward')}>Quitar a partir de agora <span className="muted" style={{fontSize:12}}>(mantém as {scopeAsk.paid} pagas; o saldo deixa de ser devido)</span></button>
        <button className="btn danger" onClick={()=>runReneg('all')}>Excluir toda a renegociação</button>
        <button className="btn ghost" onClick={()=>setScopeAsk(null)}>Cancelar</button>
      </div>
    </Modal>}
  </div>;
}
