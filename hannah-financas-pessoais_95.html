/* ---- 12. SIMULADOR DE DECISÕES ---- */
function SimuladorDecisoes({go}){
  const db=useDB();
  const rates=getRates(db);
  const [tipo,setTipo]=useState('parcelamento'); // avista | financiamento | parcelamento
  const [valor,setValor]=useState(3000);
  const [entrada,setEntrada]=useState(0);
  const [parcelas,setParcelas]=useState(12);
  const [taxa,setTaxa]=useState(0);
  const [viraBem,setViraBem]=useState(false);
  const [valorBem,setValorBem]=useState(0);
  const [scen,setScen]=useState('realista');

  const base=useMemo(()=>financialSnapshot(db),[db.accounts,db.bankMovements,db.assets,db.transactions,db.incomes,db.fixed,db.renegotiations,db.cards,db.settings]);
  const baseScore=useMemo(()=>scoreFromSnapshot(base),[base]);

  const calc=useMemo(()=>{
    const v=round2(+valor||0), ent=round2(Math.min(v,+entrada||0));
    const principal=round2(Math.max(0,v-ent));
    const n=clamp(Math.round(+parcelas||1),1,360);
    const i=(+taxa||0)/100;
    let parcela=0;
    if(tipo==='avista') parcela=0;
    else if(tipo==='financiamento') parcela=pmt(principal,i||(rates.parcelamento/100),n);
    else parcela=i>0?pmt(principal,i,n):round2(principal/n); // parcelamento sem juros se taxa 0
    const custoTotal=tipo==='avista'?v:round2(ent+parcela*n);
    const juros=round2(Math.max(0,custoTotal-v));
    const saidaHoje=tipo==='avista'?v:ent;
    const novaDivida=tipo==='avista'?0:principal;
    const bemVal=viraBem?(round2(+valorBem||0)||v):0;
    return {v,ent,principal,n,parcela,custoTotal,juros,saidaHoje,novaDivida,bemVal};
  },[tipo,valor,entrada,parcelas,taxa,viraBem,valorBem,rates]);

  // snapshot perturbado
  const after=useMemo(()=>{
    const PLafter=round2(base.patrimonioLiquido - calc.saidaHoje + calc.bemVal - calc.novaDivida);
    return {...base,
      caixa:round2(base.caixa - calc.saidaHoje),
      bensBruto:round2(base.bensBruto + calc.bemVal),
      comprometimento:round2(base.comprometimento + (tipo==='avista'?0:calc.parcela)),
      dividaTotal:round2(base.dividaTotal + calc.novaDivida),
      patrimonioLiquido:PLafter,
    };
  },[base,calc,tipo]);
  const afterScore=useMemo(()=>scoreFromSnapshot(after),[after]);

  // fluxo de caixa 90d com e sem a decisão
  const cur=monthKey(todayISO());
  const decisionEvents=useMemo(()=>{
    const ev=[];
    if(calc.saidaHoje>0) ev.push({date:todayISO(),desc:'Compra (entrada)',amount:-calc.saidaHoje,kind:'decisao'});
    if(tipo!=='avista' && calc.parcela>0){ for(let k=1;k<=Math.min(calc.n,3);k++){ const mk=addMonthKey(cur,k);
      ev.push({date:`${mk}-10`,desc:`Parcela ${k}/${calc.n}`,amount:-calc.parcela,kind:'decisao'}); } }
    return ev;
  },[calc,tipo,cur]);
  const fcBase=useMemo(()=>projectCashFlow(db,90,scen),[db,scen]);
  const fcAfter=useMemo(()=>projectCashFlow(db,90,scen,{events:decisionEvents}),[db,scen,decisionEvents]);

  const dScore=afterScore.score-baseScore.score;
  const Delta=({a,b,money=true,invert=false})=>{ const d=round2(b-a); const good=invert? d<0 : d>0;
    const col=Math.abs(d)<0.005?'var(--muted)':good?'var(--pos)':'var(--neg)';
    return <b className="num" style={{color:col}}>{d>0?'+':''}{money?BRL(d):Math.round(d)}</b>; };

  const TIPOS=[['avista','À vista'],['parcelamento','Parcelamento'],['financiamento','Financiamento']];
  return <div>
    <div className="page-head"><div><h1>Simulador de decisões</h1>
      <p className="muted">Antes de comprar, parcelar ou financiar, veja o impacto no seu caixa, no patrimônio e no Score Hannah.</p></div></div>

    <div className="card pad" style={{marginBottom:16}}>
      <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:14,alignItems:'flex-end'}}>
        <div style={{gridColumn:'1/-1'}}><label className="lbl">Tipo de decisão</label>
          <div className="seg">{TIPOS.map(([v,l])=><button key={v} className={tipo===v?'on':''} onClick={()=>setTipo(v)}>{l}</button>)}</div></div>
        <Fld label="Valor da compra"><MoneyInput value={valor} onChange={setValor}/></Fld>
        {tipo!=='avista' && <Fld label="Entrada"><MoneyInput value={entrada} onChange={setEntrada}/></Fld>}
        {tipo!=='avista' && <Fld label="Parcelas"><input className="input num" type="number" min="1" max="360" value={parcelas} onChange={e=>setParcelas(e.target.value)}/></Fld>}
        {tipo!=='avista' && <Fld label={tipo==='financiamento'?'Juros (%/mês)':'Juros (%/mês, 0 = sem)'}>
          <input className="input num" type="number" step="0.1" value={taxa} onChange={e=>setTaxa(e.target.value)} placeholder={String(rates.parcelamento)}/></Fld>}
        <div style={{display:'flex',alignItems:'center',gap:8,paddingBottom:8}}>
          <label style={{display:'flex',gap:7,alignItems:'center',fontSize:13}}><input type="checkbox" checked={viraBem} onChange={e=>setViraBem(e.target.checked)}/> Vira um bem</label></div>
        {viraBem && <Fld label="Valor do bem (revenda)"><MoneyInput value={valorBem} onChange={setValorBem} placeholder={BRL(calc.v)}/></Fld>}
      </div>
    </div>

    <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))',gap:12,marginBottom:18}}>
      <div className="kpi"><span>Sai do bolso hoje</span><b className="num">{BRL(calc.saidaHoje)}</b></div>
      {tipo!=='avista' && <div className="kpi"><span>Parcela mensal</span><b className="num">{BRL(calc.parcela)} <span className="muted" style={{fontSize:12}}>× {calc.n}</span></b></div>}
      <div className="kpi"><span>Custo total</span><b className="num">{BRL(calc.custoTotal)}</b></div>
      {calc.juros>0 && <div className="kpi neg"><span>Juros embutidos</span><b className="num">{BRL(calc.juros)}</b></div>}
    </div>

    <div className="grid" style={{gridTemplateColumns:'1fr 1fr',gap:16}}>
      <div className="card pad">
        <div className="card-head" style={{borderBottom:0,padding:'0 0 10px'}}><h3>Impacto — antes × depois</h3></div>
        <table className="tbl" style={{border:0}}><thead><tr><th>Indicador</th><th className="r">Antes</th><th className="r">Depois</th><th className="r">Δ</th></tr></thead><tbody>
          <tr><td>Caixa hoje</td><td className="r num">{BRL(base.caixa)}</td><td className="r num">{BRL(after.caixa)}</td><td className="r"><Delta a={base.caixa} b={after.caixa}/></td></tr>
          <tr><td>Comprometimento/mês</td><td className="r num">{BRL(base.comprometimento)}</td><td className="r num">{BRL(after.comprometimento)}</td><td className="r"><Delta a={base.comprometimento} b={after.comprometimento} invert/></td></tr>
          <tr><td>Dívida total</td><td className="r num">{BRL(base.dividaTotal)}</td><td className="r num">{BRL(after.dividaTotal)}</td><td className="r"><Delta a={base.dividaTotal} b={after.dividaTotal} invert/></td></tr>
          <tr><td>Patrimônio líquido</td><td className="r num">{BRL(base.patrimonioLiquido)}</td><td className="r num">{BRL(after.patrimonioLiquido)}</td><td className="r"><Delta a={base.patrimonioLiquido} b={after.patrimonioLiquido}/></td></tr>
          <tr><td>Menor saldo (90d)</td><td className="r num">{BRL(fcBase.menor.saldo)}</td><td className={"r num "+(fcAfter.menor.saldo<0?'neg':'')}>{BRL(fcAfter.menor.saldo)}</td><td className="r"><Delta a={fcBase.menor.saldo} b={fcAfter.menor.saldo}/></td></tr>
        </tbody></table>
        {fcAfter.menor.saldo<0 && fcBase.menor.saldo>=0 && <div className="reconcile bad" style={{marginTop:10}}><Icon name="alert" size={16}/><div style={{fontSize:12.5}}>Esta decisão faz seu caixa ficar negativo em {ptDate(fcAfter.menor.date)}.</div></div>}
      </div>

      <div className="card pad" style={{textAlign:'center'}}>
        <div className="card-head" style={{borderBottom:0,padding:'0 0 10px',justifyContent:'center'}}><h3>Score Hannah</h3></div>
        <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:18,flexWrap:'wrap'}}>
          <div><div className="muted" style={{fontSize:11.5,marginBottom:4}}>Antes</div><ScoreGauge score={baseScore.score} color={baseScore.grade.color} size={130}/></div>
          <Icon name="income" size={22}/>
          <div><div className="muted" style={{fontSize:11.5,marginBottom:4}}>Depois</div><ScoreGauge score={afterScore.score} color={afterScore.grade.color} size={130}/></div>
        </div>
        <div style={{marginTop:10}}>
          <span className="chip" style={{background:(dScore<0?'var(--neg)':dScore>0?'var(--pos)':'var(--muted)')+'22',color:dScore<0?'var(--neg)':dScore>0?'var(--pos)':'var(--muted)',fontSize:13,padding:'4px 12px'}}>
            {dScore>0?'+':''}{dScore} pontos · {afterScore.grade.label}</span>
        </div>
        <ScenarioSeg value={scen} onChange={setScen}/>
        <p className="muted" style={{fontSize:11,marginTop:10,marginBottom:0}}>O cenário acima ajusta o fluxo de caixa de 90 dias usado na comparação.</p>
      </div>
    </div>
    <p className="muted" style={{fontSize:11.5,marginTop:14,lineHeight:1.5}}>Simulação — nada é gravado. Marque "vira um bem" para compras que entram no patrimônio (carro, imóvel); deixe desmarcado para consumo. Quer guardar a decisão? Cadastre o bem em Patrimônio e o gasto em Gastos fixos/Parcelamentos.</p>
  </div>;
}
/* ===== fim do bloco ETAPA 4 ===== */


/* =========================================================================
   🚨 ETAPA 5 — MODO CRISE — "Estou apertado este mês"
   ========================================================================= */
function CrisisLevel({n,titulo,sub,tone,children}){
  const col = tone==='neg'?'var(--neg)':tone==='warn'?'var(--warn)':'var(--accent)';
  return <div className="card pad" style={{marginBottom:14,borderLeft:`4px solid ${col}`}}>
    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:children?12:0}}>
      <div style={{flex:'0 0 auto',width:34,height:34,borderRadius:10,background:col,color:'#fff',
        display:'grid',placeItems:'center',fontWeight:800,fontSize:16,fontVariantNumeric:'tabular-nums'}}>{n}</div>
      <div style={{minWidth:0}}><b style={{fontSize:15}}>{titulo}</b>
        {sub && <div className="muted" style={{fontSize:12.5,marginTop:2}}>{sub}</div>}</div>
    </div>
    {children}
  </div>;
}

function ModoCrise({go,section}){
  const db=useDB();
  const rates=getRates(db);
  const hoje=new Date(todayISO()+'T00:00:00');
  const fimMes=new Date(hoje.getFullYear(),hoje.getMonth()+1,0);
  const diasFimMes=Math.max(1,Math.round((fimMes-hoje)/86400000));

  const [horizonte,setHorizonte]=useStickyState('crise.horizonte','mes'); // mes | 15 | 30
  const [scen,setScen]=useStickyState('crise.scen','realista');
  const dias = horizonte==='mes'?diasFimMes:(+horizonte||30);

  const inputs=useMemo(()=>crisisInputs(db,dias,scen),
    [db.accounts,db.bankMovements,db.transactions,db.incomes,db.fixed,db.renegotiations,db.cards,db.assets,db.settings,dias,scen]);
  const base=useMemo(()=>financialSnapshot(db),[db.accounts,db.bankMovements,db.assets,db.transactions,db.incomes,db.fixed,db.renegotiations,db.cards,db.settings]);
  const baseScore=useMemo(()=>scoreFromSnapshot(base),[base]);

  // alavanca de cortes — estado interativo
  const [subsOff,setSubsOff]=useState({});           // id -> true = desligada (não cortar)
  const [cuts,setCuts]=useState(null);               // nome -> % de corte
  const cutState = cuts || Object.fromEntries(inputs.reducibles.map(r=>[r.name,Math.round(r.cut*100)]));
  const economiaElim=round2(inputs.subs.filter(s=>!subsOff[s.id]).reduce((a,s)=>a+s.monthly,0));
  const economiaRed=round2(inputs.reducibles.reduce((a,r)=>a+r.monthly*((cutState[r.name]||0)/100),0));

  const plan=useMemo(()=>crisisPlan({
    menorSaldo:inputs.R.menor.saldo, reserva:inputs.reserva, caixaOperacional:inputs.caixaOperacional,
    burnDiario:inputs.burnDiario, diasHorizonte:dias, economiaElim, economiaRed,
    liquidavel:inputs.liquidavel, rendaDiariaAtual:inputs.rendaDiaria,
  }),[inputs,dias,economiaElim,economiaRed]);

  // Nível 3 — renegociação (simulação independente; não entra na recomendação
  // automática porque adiciona custo de dívida)
  const [negVal,setNegVal]=useState(round2(base.faturasAbertas||0));
  const [negN,setNegN]=useState(12);
  const [negI,setNegI]=useState(rates.parcelamento||0);
  const negParcela=pmt(round2(+negVal||0),(+negI||0)/100,clamp(Math.round(+negN||1),1,360));
  const negJuros=round2(Math.max(0,negParcela*clamp(Math.round(+negN||1),1,360)-(+negVal||0)));

  // impacto no Score do cenário recomendado (cortes reduzem a queima → some no
  // comprometimento; renda extra entra como folga de caixa do mês)
  const afterScore=useMemo(()=>{
    const after={...base,
      caixa:round2(base.caixa + plan.cenarios.find(c=>c.id==='D').economia + (plan.rec.id==='D'?plan.cenarios.find(c=>c.id==='D').rendaExtra:0)),
      comprometimento:round2(Math.max(0,base.comprometimento - economiaElim)),
    };
    return scoreFromSnapshot(after);
  },[base,plan,economiaElim]);

  const temContas=(db.accounts||[]).length>0;
  const D=plan.deficit;
  const recObj=plan.cenarios.find(c=>c.id==='D');
  const fmtMeses=m=>m==null?'indefinida':`${m} ${m===1?'dia':'dias'}`;
  /* ETAPA 7 — submenus do Modo crise levam a seções do mesmo motor */
  const CRISE_ANCHOR={'crise-pagar':'crise-plano','crise-renda':'crise-plano','crise-reducao':'crise-plano',
    'crise-reserva':'crise-plano','crise-venda':'crise-plano','crise-renegociacao':'crise-cenarios',
    'crise-parcial':'crise-cenarios','crise-sobrevivencia':'crise-cenarios','crise-cenarios':'crise-cenarios'};
  useEffect(()=>{ const a=CRISE_ANCHOR[section]; if(!a) return;
    const el=document.getElementById(a); if(el){ const t=setTimeout(()=>{ try{el.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){} },80); return ()=>clearTimeout(t); } },[section]);

  const Money=({v,cls})=> <b className={"num "+(cls||'')}>{BRL(v)}</b>;

  return <div>
    <div className="page-head"><div>
      <h1 style={{display:'flex',alignItems:'center',gap:8}}><Icon name="alert" size={22}/> Modo crise</h1>
      <p className="muted">"Estou apertado este mês." O HANNAH calcula o que falta para fechar o período no azul e monta um plano que tenta, nesta ordem, <b>renda extra → cortes → renegociação → reserva</b> e só por último <b>vender patrimônio</b>.</p>
    </div></div>

    {!temContas && <div className="card pad" style={{marginBottom:16}}>
      <p className="muted" style={{margin:0,fontSize:13}}>O diagnóstico parte do saldo das suas <a style={{cursor:'pointer'}} onClick={()=>go('contas')}>contas bancárias</a>. Cadastre-as para um retrato fiel — sem elas, o caixa de partida é zero.</p></div>}

    <div className="card pad" style={{marginBottom:16}}>
      <div className="row" style={{gap:16,alignItems:'center',flexWrap:'wrap'}}>
        <div><label className="lbl">Período</label><div className="seg">
          <button className={horizonte==='mes'?'on':''} onClick={()=>setHorizonte('mes')}>Até o fim do mês</button>
          <button className={horizonte==='15'?'on':''} onClick={()=>setHorizonte('15')}>15d</button>
          <button className={horizonte==='30'?'on':''} onClick={()=>setHorizonte('30')}>30d</button>
        </div></div>
        <div><label className="lbl">Cenário</label><ScenarioSeg value={scen} onChange={setScen}/></div>
        <div className="muted" style={{fontSize:12,alignSelf:'flex-end',paddingBottom:6}}>Analisando os próximos <b style={{color:'var(--ink)'}}>{dias} dias</b>.</div>
      </div>
    </div>

    {/* diagnóstico */}
    <div className="kpi-row">
      <div className="kpi"><span>Caixa operacional hoje</span><b className="num">{BRL(inputs.caixaOperacional)}</b><div className="k-foot">fora da reserva</div></div>
      <div className="kpi"><span>Reserva blindada</span><b className="num">{BRL(inputs.reserva)}</b><div className="k-foot">poupança + investimentos</div></div>
      <div className={"kpi "+(inputs.R.menor.saldo<0?'neg':'warn')}><span>Pior saldo no período</span><b className="num">{BRL(inputs.R.menor.saldo)}</b><div className="k-foot">em {ptDate(inputs.R.menor.date)}</div></div>
      <div className={"kpi "+(D>0?'neg':'pos')}><span>Necessidade de caixa</span><b className="num">{BRL(D)}</b></div>
      <div className={"kpi "+((plan.diasSobrevivencia!=null&&plan.diasSobrevivencia<dias)?'warn':'')}><span>Sobrevivência</span><b className="num">{fmtMeses(plan.diasSobrevivencia)}</b><div className="k-foot">só com o caixa atual</div></div>
    </div>

    {/* veredito */}
    {D>0
      ? <div className="reconcile bad" style={{marginBottom:18}}><Icon name="alert" size={20}/><div>
          <b style={{fontSize:15}}>Falta {BRL(D)} para fechar este período sem déficit.</b>
          <div style={{fontSize:12.5,marginTop:3}}>No cenário {inputs.R.scen.label.toLowerCase()}, seu caixa operacional chega ao fundo em {ptDate(inputs.R.menor.date)}. O plano abaixo cobre essa diferença.</div></div></div>
      : <div className="reconcile" style={{marginBottom:18,background:'var(--accent-soft)',borderColor:'var(--accent)'}}><Icon name="check" size={20}/><div>
          <b style={{fontSize:15}}>Você fecha este período no azul.</b>
          <div style={{fontSize:12.5,marginTop:3}}>Seu caixa operacional sustenta os {dias} dias{plan.diasSobrevivencia!=null?` e ainda dá fôlego de ${plan.diasSobrevivencia} dias no ritmo de gasto atual`:''}. Quer testar o pior caso? Mude o cenário para <b>Pessimista</b> acima.</div></div></div>}

    {D>0 && <React.Fragment>
      <h2 id="crise-plano" style={{fontSize:16,margin:'22px 0 12px',letterSpacing:'-.3px'}}>O plano, nível a nível</h2>

      {/* Nível 1 — renda extra */}
      <CrisisLevel n={1} titulo="Renda extra" tone="accent"
        sub={`A primeira recomendação: gerar caixa novo sem mexer no seu patrimônio. Faltam ${dias} dias.`}>
        <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12}}>
          <div className="kpi pos"><span>Meta necessária</span><b className="num">{BRL(D)}</b></div>
          <div className="kpi"><span>Meta semanal</span><b className="num">{BRL(plan.metaSemanal)}</b></div>
          <div className="kpi"><span>Meta diária</span><b className="num">{BRL(plan.metaDiaria)}</b></div>
        </div>
        {plan.rendaAgressiva && <p className="muted" style={{fontSize:12,marginTop:10,marginBottom:0,color:'var(--warn)'}}><Icon name="alert" size={12}/> Essa meta diária passa de metade da sua renda diária média. Sozinha, é uma aposta arriscada — combine com os cortes do nível 2.</p>}
      </CrisisLevel>

      {/* Nível 2 — cortes */}
      <CrisisLevel n={2} titulo="Redução de gastos" tone="accent"
        sub="Economia que está totalmente sob seu controle. Desmarque o que não dá para cortar e ajuste o quanto reduzir.">
        {(inputs.subs.length>0 || inputs.reducibles.length>0) ? <React.Fragment>
          {inputs.subs.length>0 && <div style={{marginBottom:14}}>
            <div className="lbl" style={{marginBottom:6}}>Elimináveis — assinaturas</div>
            <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:8}}>
              {inputs.subs.map(s=><label key={s.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',
                border:'1px solid var(--line)',borderRadius:10,fontSize:13,cursor:'pointer',background:subsOff[s.id]?'transparent':'var(--accent-soft)'}}>
                <input type="checkbox" checked={!subsOff[s.id]} onChange={e=>setSubsOff(o=>({...o,[s.id]:!e.target.checked}))}/>
                <span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.name}</span>
                <b className="num">{BRL(s.monthly)}</b></label>)}
            </div></div>}
          {inputs.reducibles.length>0 && <div>
            <div className="lbl" style={{marginBottom:6}}>Reduzíveis — quanto cortar de cada</div>
            {inputs.reducibles.map(r=>{ const pct=cutState[r.name]||0; const eco=round2(r.monthly*pct/100);
              return <div key={r.name} style={{display:'flex',alignItems:'center',gap:12,padding:'6px 0',flexWrap:'wrap'}}>
                <span style={{width:120,fontSize:13}}>{r.name}</span>
                <input type="range" min="0" max="100" step="5" value={pct} style={{flex:1,minWidth:120,accentColor:'var(--accent)'}}
                  onChange={e=>setCuts({...cutState,[r.name]:+e.target.value})}/>
                <span className="num" style={{width:44,textAlign:'right',fontSize:13}}>{pct}%</span>
                <span className="muted" style={{fontSize:12,width:150,textAlign:'right'}}>de {BRL(r.monthly)}/mês → <b className="num pos">{BRL(eco)}</b></span>
              </div>; })}
          </div>}
          <div className="reconcile" style={{marginTop:14,background:'var(--accent-soft)',borderColor:'var(--accent)'}}>
            <Icon name="income" size={18}/><div><b>Economia possível: {BRL(plan.economia)}</b>
            <div style={{fontSize:12.5,marginTop:2}}>{plan.economia>=D
              ? `Sozinha, já cobre o déficit e ainda sobra ${BRL(plan.folgaCortes)}.`
              : `Reduz o déficit para ${BRL(plan.deficitAposCortes)}.`}</div></div></div>
        </React.Fragment> : <p className="muted" style={{margin:0,fontSize:13}}>Sem assinaturas ou gastos variáveis identificados nos últimos meses. Cadastre seus gastos em <a style={{cursor:'pointer'}} onClick={()=>go('fixos')}>Gastos fixos</a> e <a style={{cursor:'pointer'}} onClick={()=>go('lancamentos')}>Lançamentos</a> para o HANNAH sugerir cortes.</p>}
      </CrisisLevel>

      {/* Nível 3 — renegociação */}
      <CrisisLevel n={3} titulo="Renegociação" tone="warn"
        sub="Só depois das duas primeiras. Renegociar não cria dinheiro: alivia o mês empurrando a conta para a frente — quase sempre com juros.">
        <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:12,alignItems:'flex-end'}}>
          <Fld label="Valor a renegociar"><MoneyInput value={negVal} onChange={setNegVal}/></Fld>
          <Fld label="Parcelas"><input className="input num" type="number" min="1" max="360" value={negN} onChange={e=>setNegN(e.target.value)}/></Fld>
          <Fld label="Juros (%/mês)"><input className="input num" type="number" step="0.1" value={negI} onChange={e=>setNegI(e.target.value)}/></Fld>
        </div>
        <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,marginTop:12}}>
          <div className="kpi"><span>Nova parcela/mês</span><b className="num">{BRL(negParcela)}</b></div>
          <div className="kpi pos"><span>Alívio neste mês</span><b className="num">{BRL(round2(Math.max(0,(+negVal||0)-negParcela)))}</b></div>
          <div className="kpi neg"><span>Juros que você paga a mais</span><b className="num">{BRL(negJuros)}</b></div>
        </div>
        <p className="muted" style={{fontSize:12,marginTop:10,marginBottom:0}}>Para formalizar uma renegociação de verdade, use <a style={{cursor:'pointer'}} onClick={()=>go('renegociacoes')}>Renegociações</a>. Por adicionar custo de dívida, o HANNAH não inclui esta opção na recomendação automática.</p>
      </CrisisLevel>

      {/* Nível 4 — reserva */}
      {inputs.reserva>0 && <CrisisLevel n={4} titulo="Uso da reserva" tone="warn"
        sub="Existe um cofre. Usar parte dele resolve agora, mas reduz seu fôlego para o próximo aperto.">
        <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12}}>
          <div className="kpi"><span>Reserva disponível</span><b className="num">{BRL(inputs.reserva)}</b></div>
          <div className="kpi warn"><span>Uso recomendado</span><b className="num">{BRL(plan.usoReservaSugerido)}</b><div className="k-foot">o mínimo para zerar o déficit</div></div>
          <div className="kpi"><span>Reserva após o uso</span><b className="num">{BRL(round2(inputs.reserva-plan.usoReservaSugerido))}</b></div>
        </div>
        <p className="muted" style={{fontSize:12,marginTop:10,marginBottom:0}}>Sacar da reserva derruba o pilar de <b>reserva de emergência</b> no seu Score. Prefira repor esse valor assim que o aperto passar.</p>
      </CrisisLevel>}

      {/* Nível 5 — venda */}
      <CrisisLevel n={5} titulo="Venda de patrimônio — última opção" tone="neg"
        sub="As alavancas anteriores devem ser esgotadas primeiro. Vender um bem é definitivo e raramente sai pelo valor cheio.">
        {inputs.liquidavel>0 ? <React.Fragment>
          <div className="tbl-wrap"><table className="tbl"><thead><tr>
            <th>Bem</th><th className="r">Valor líquido</th><th>Liquidez</th><th className="r">Cobre o déficit?</th>
          </tr></thead><tbody>
          {(db.assets||[]).filter(a=>assetNet(a)>0).sort((a,b)=>{const o={alta:0,media:1,baixa:2};return (o[a.liquidity]??3)-(o[b.liquidity]??3);}).map(a=>{
            const k=assetKind(a.kind); const net=assetNet(a); const lq=(LIQUIDEZ.find(x=>x[0]===a.liquidity)||[])[1]||'—';
            return <tr key={a.id}><td><b>{k[2]} {a.name}</b></td>
              <td className="r num pos">{BRL(net)}</td>
              <td><span className="tag">{lq}</span></td>
              <td className="r">{net>=D?<span className="chip" style={{background:'var(--pos)22',color:'var(--pos)'}}>sozinho, sim</span>:<span className="muted" style={{fontSize:12}}>parcial</span>}</td></tr>;
          })}
          </tbody></table></div>
          <p className="muted" style={{fontSize:12,marginTop:10,marginBottom:0}}>Para ver quantos meses de despesa cada venda cobre e o impacto no Score, abra a <a style={{cursor:'pointer'}} onClick={()=>go('patr-liquidacao')}>Simulação de liquidação</a>.</p>
        </React.Fragment> : <p className="muted" style={{margin:0,fontSize:13}}>Nenhum bem com valor líquido positivo cadastrado em <a style={{cursor:'pointer'}} onClick={()=>go('patrimonio')}>Patrimônio</a>.</p>}
      </CrisisLevel>

      {/* cenários inteligentes A–E */}
      <h2 id="crise-cenarios" style={{fontSize:16,margin:'26px 0 12px',letterSpacing:'-.3px'}}>Cenários comparados</h2>
      <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(190px,1fr))',gap:12,marginBottom:18}}>
        {plan.cenarios.map(c=>{ const isRec=c.id===plan.rec.id; const sup=c.resultado>=0;
          const linhas = c.id==='A' ? [['Déficit',BRL(c.deficit),'neg']]
            : c.id==='B' ? [['Meta de renda',BRL(c.meta)],['Por dia',BRL(c.metaDiaria)],['Por semana',BRL(c.metaSemanal)]]
            : c.id==='C' ? [['Economia',BRL(c.economia),'pos'],['Déficit restante',BRL(c.deficitRestante),c.deficitRestante>0?'neg':'pos']]
            : c.id==='D' ? [['Cortes',BRL(c.economia),'pos'],['Renda extra',BRL(c.rendaExtra)],['Meta diária',BRL(c.metaDiaria)]]
            : [['Líquido da venda',BRL(c.liquidavel),'pos']];
          return <div key={c.id} className="card pad" style={{position:'relative',
              borderColor:isRec?'var(--accent)':'var(--line)',borderWidth:isRec?2:1,
              boxShadow:isRec?'0 0 0 3px var(--accent-soft)':'var(--shadow)'}}>
            {isRec && <span className="chip" style={{position:'absolute',top:-10,right:12,background:'var(--accent)',color:'#fff',fontSize:11,fontWeight:700}}>Recomendado</span>}
            <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:8}}>
              <b style={{fontSize:18,color:'var(--accent-2)'}}>{c.id}</b><b style={{fontSize:13.5}}>{c.titulo}</b></div>
            {linhas.map(([l,v,cls],i)=><div key={i} className="cc-row"><span>{l}</span><b className={"num "+(cls||'')}>{v}</b></div>)}
            <div style={{borderTop:'1px solid var(--line)',marginTop:8,paddingTop:8}}>
              <div className="cc-row" style={{fontSize:13}}><span>Resultado</span>
                <b className="num" style={{color:sup?'var(--pos)':'var(--neg)'}}>
                  {c.id==='A'?`déficit ${BRL(Math.abs(c.resultado))}`
                   : c.id==='B'?'equilíbrio'
                   : sup?(c.resultado>0?`superávit ${BRL(c.resultado)}`:'equilíbrio'):`déficit ${BRL(Math.abs(c.resultado))}`}</b></div>
            </div>
          </div>; })}
      </div>

      {/* recomendação do HANNAH */}
      <div className="card pad" style={{borderColor:'var(--accent)',background:'var(--accent-soft)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
          <Icon name="spark" size={20}/><h3 style={{margin:0,fontSize:15}}>O que o HANNAH recomenda</h3></div>
        <p style={{margin:'0 0 10px',fontSize:14,lineHeight:1.55}}>
          {plan.rec.id==='C'
            ? <>Os cortes já resolvem o mês: corte <b>{BRL(plan.economia)}</b> e você fecha com <b>{BRL(plan.folgaCortes)}</b> de folga, sem buscar renda extra, tocar na reserva ou vender nada.</>
            : <>Combine as duas alavancas mais saudáveis: faça <b>{BRL(recObj.economia)}</b> em cortes e busque <b>{BRL(recObj.rendaExtra)}</b> em renda extra (<b>{BRL(recObj.metaDiaria)}/dia</b>). Isso fecha o período sem criar dívida nova, sem usar a reserva e sem vender patrimônio.</>}
        </p>
        <p className="muted" style={{margin:0,fontSize:12,lineHeight:1.5}}>A escolha segue uma ordem fixa: preservar patrimônio e reserva, nunca aumentar a dívida, priorizar renda e cortes. Renegociação, reserva e venda ficam disponíveis acima como planos de contingência, não como primeira saída.</p>

        <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:18,flexWrap:'wrap',marginTop:16}}>
          <div style={{textAlign:'center'}}><div className="muted" style={{fontSize:11.5,marginBottom:4}}>Score hoje</div><ScoreGauge score={baseScore.score} color={baseScore.grade.color} size={120}/></div>
          <Icon name="income" size={20}/>
          <div style={{textAlign:'center'}}><div className="muted" style={{fontSize:11.5,marginBottom:4}}>Após o plano</div><ScoreGauge score={afterScore.score} color={afterScore.grade.color} size={120}/></div>
          <div style={{minWidth:140}}>
            <span className="chip" style={{background:(afterScore.score>=baseScore.score?'var(--pos)':'var(--neg)')+'22',color:afterScore.score>=baseScore.score?'var(--pos)':'var(--neg)',fontSize:13,padding:'4px 12px'}}>
              {afterScore.score-baseScore.score>=0?'+':''}{afterScore.score-baseScore.score} pontos</span>
            <p className="muted" style={{fontSize:11.5,marginTop:8,marginBottom:0}}>Cancelar assinaturas alivia o comprometimento de renda; a renda extra recompõe o caixa do mês.</p>
          </div>
        </div>
      </div>
    </React.Fragment>}

    <p className="muted" style={{fontSize:11.5,marginTop:16,lineHeight:1.5}}>Diagnóstico — nada é gravado. A necessidade de caixa é o quanto seu saldo operacional (fora a reserva) fica negativo no pior dia do período. Cortes e metas são estimativas a partir dos seus últimos meses; ajuste os controles para refletir sua realidade.</p>
  </div>;
}

        <div className="card pad">
          <div className="card-head" style={{borderBottom:0,padding:'0 0 10px'}}><h3>⚠️ Categorias problemáticas</h3></div>

            <div style={{display:'flex',justifyContent:'space-between'}}><b style={{fontSize:13}}>{p.name}</b><b className="num neg">{BRL(p.spent)}</b></div>

    </React.Fragment>}

function HannahIA({go}){
  const db=useDB();
  const [q,setQ]=useState('');
  const [ans,setAns]=useState(null);
  const run=(question)=>{ const text=(question!=null?question:q).trim(); if(!text) return; setQ(text); setAns(hannahQuery(db,text)); };
  const sugestoes=['Quanto gastei com Uber?','Quanto gastei com supermercado?','Qual meu maior gasto?','Quanto gastei com iFood?','Quanto gastei com iFood mês passado?','Quanto gastei este ano?'];
  const temDados=(db.transactions||[]).length>0;

  function render(a){
    if(!a) return null;
    if(a.kind==='maior'){
      return <div className="card pad" style={{borderColor:'var(--accent)'}}>
        {a.max? <React.Fragment>
          <div className="muted" style={{fontSize:12}}>Seu maior gasto {a.win.label}</div>
          <div style={{fontSize:24,fontWeight:800,letterSpacing:'-.5px',margin:'4px 0'}}>{BRL(a.max._spend)}</div>
          <div style={{fontSize:14}}><b>{a.max.descPad||a.max.descOrig}</b> <span className="muted">· {a.max._cat||'Sem categoria'} · {ptDate(a.max.date)}</span></div>
          {a.topCat && <p className="muted" style={{fontSize:12.5,marginTop:10,marginBottom:0}}>A categoria onde mais gastou foi <b style={{color:'var(--ink)'}}>{a.topCat.name}</b>, somando {BRL(a.topCat.value)}.</p>}
        </React.Fragment> : <p className="muted" style={{margin:0}}>Não encontrei gastos {a.win.label}.</p>}
      </div>;
    }
    if(a.kind==='total'){
      return <div className="card pad" style={{borderColor:'var(--accent)'}}>
        <div className="muted" style={{fontSize:12}}>Total de gastos {a.win.label}</div>
        <div style={{fontSize:26,fontWeight:800,letterSpacing:'-.5px',margin:'4px 0'}}>{BRL(a.totalGeral)}</div>
        <div className="muted" style={{fontSize:13}}>{a.count} lançamento(s).</div>
      </div>;
    }
    // termo
    return <div className="card pad" style={{borderColor:'var(--accent)'}}>
      <div className="muted" style={{fontSize:12}}>Gastos com <b style={{color:'var(--ink)'}}>{a.term}</b> {a.win.label}</div>
      <div style={{fontSize:26,fontWeight:800,letterSpacing:'-.5px',margin:'4px 0'}}>{BRL(a.total)}</div>
      <div className="muted" style={{fontSize:13,marginBottom:a.count?10:0}}>{a.count} lançamento(s){a.totalGeral>0?` · ${PCT(a.total/a.totalGeral*100)} do total do período`:''}.</div>
      {a.hits.length>0 && <div className="tbl-wrap"><table className="tbl"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th className="r">Valor</th></tr></thead><tbody>
        {a.hits.map((t,i)=><tr key={i}><td className="num">{ptDate(t.date)}</td><td><b>{t.descPad||t.descOrig}</b></td><td><span className="muted" style={{fontSize:12}}>{t._cat||'—'}</span></td><td className="r num">{BRL(t._spend)}</td></tr>)}
      </tbody></table></div>}
      {a.count===0 && <p className="muted" style={{margin:0,fontSize:13}}>Nenhum lançamento casou com "{a.term}" {a.win.label}. Tente outro termo, ou amplie o período (ex.: "…este ano").</p>}
    </div>;
  }

  return <div>
    <div className="page-head"><div>
      <h1 style={{display:'flex',alignItems:'center',gap:8}}><Icon name="spark" size={20}/> Gerente Inteligente Hannah</h1>
      <p className="muted">Análises inteligentes sobre os seus gastos, calculadas a partir dos seus próprios dados, no seu dispositivo. Faça uma pergunta objetiva sobre valores e períodos. Por padrão considero o mês atual; diga "mês passado", "este ano" ou "últimos 3 meses" para mudar o período.</p>
    </div></div>

    <div className="card pad" style={{marginBottom:16}}>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        <input className="input" style={{flex:1,minWidth:200}} value={q} placeholder="Ex.: Quanto gastei com iFood mês passado?"
          onChange={e=>setQ(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') run(); }}/>
        <button className="btn primary" onClick={()=>run()}><Icon name="search" size={15}/> Perguntar</button>
      </div>
      <div style={{display:'flex',gap:7,flexWrap:'wrap',marginTop:12}}>
        {sugestoes.map(s=><button key={s} className="chip" style={{cursor:'pointer',border:'1px solid var(--line)',background:'var(--surface-2)'}} onClick={()=>run(s)}>{s}</button>)}
      </div>
    </div>

    {!temDados && <div className="card pad"><p className="muted" style={{margin:0,fontSize:13}}>Importe uma fatura ou cadastre lançamentos para que a Gerente Hannah tenha o que analisar.</p></div>}
    {ans && render(ans)}

    <p className="muted" style={{fontSize:11.5,marginTop:16,lineHeight:1.5}}>A Gerente Hannah faz análises determinísticas: reconhece comerciantes e categorias (Uber, iFood, supermercado, farmácia…), perguntas de total e de "maior gasto", e janelas de tempo. Tudo é calculado localmente, sem enviar seus dados para fora.</p>
  </div>;
}

const ACCENTS=[
  {id:'verde', accent:'#19C37D', accent2:'#2E6BFF'},
  {id:'azul',  accent:'#2E6BFF', accent2:'#1FE3C2'},
  {id:'ciano', accent:'#1FE3C2', accent2:'#2E6BFF'},
  {id:'roxo',  accent:'#7C5CFF', accent2:'#19C37D'},
];
const DEFAULT_ACCENT='verde';
function brandColors(settings){
  const id=settings?.accent||DEFAULT_ACCENT;
  return ACCENTS.find(a=>a.id===id)||ACCENTS[0];
}
function applyBrand(settings){
  try{
    const el=document.documentElement;
    const {accent,accent2}=brandColors(settings);
    el.style.setProperty('--accent',accent);
    el.style.setProperty('--accent-soft','color-mix(in srgb, '+accent+' 16%, var(--surface))');
    el.style.setProperty('--accent-2',accent2);
    el.style.setProperty('--accent-2-soft','color-mix(in srgb, '+accent2+' 16%, var(--surface))');
  }catch(e){}
}
function clearBrand(){
  try{
    const el=document.documentElement;
    ['--accent','--accent-soft','--accent-2','--accent-2-soft'].forEach(v=>el.style.removeProperty(v));
  }catch(e){}
}

/* =========================================================================
   ETAPA 9 — Auditoria acionável + recortes de análise (telas próprias).
   Diferente do Centro de eventos (livro de leitura) e do Relatórios
   (agregador genérico): cada tela computa um conjunto específico e oferece
   AÇÃO direta (categorizar, vincular origem, excluir duplicata, conferir).
   ========================================================================= */
const isDespesa = t => !!t && t.type==='despesa';

function auditSemCategoria(db){ return (db.transactions||[]).filter(t=>isDespesa(t) && !t.categoryId); }
function auditSemOrigem(db){ return (db.transactions||[]).filter(t=>!t.cardId && !t.accountId); }
function auditImportRevisao(db){
  return (db.transactions||[]).filter(t=>(t.origin==='extrato'||t.origin==='import') &&
    (t.confStatus==='revisar' || (t.confidence!=null && Number(t.confidence)<0.6)));
}
function auditDuplicidades(db){
  const txs=(db.transactions||[]).filter(isDespesa);
  const m=new Map();
  txs.forEach(t=>{ const k=dupKey(t); if(!m.has(k)) m.set(k,[]); m.get(k).push(t); });
  return [...m.values()].filter(a=>a.length>1).sort((a,b)=> (a[0].date<b[0].date?1:-1));
}
function auditInconsistencias(db){
  const cats=new Set((db.categories||[]).map(c=>c.id));
  const today=todayISO(); const out=[];
  (db.transactions||[]).forEach(t=>{
    const probs=[];
    if(t.amount==null || !(Number(t.amount)>0)) probs.push('Valor ausente ou não positivo');
    if(!t.date || isNaN(new Date(t.date+'T00:00:00'))) probs.push('Data inválida');
    else if(t.date>today) probs.push('Data no futuro');
    if(t.categoryId && !cats.has(t.categoryId)) probs.push('Categoria inexistente');
    if(Number(t.installmentTotal)>1 && (!t.installmentCurrent || Number(t.installmentCurrent)>Number(t.installmentTotal))) probs.push('Parcela incoerente');
    if(probs.length) out.push({tx:t,probs});
  });
  return out;
}
/* Agregador de despesas por uma chave qualquer (estabelecimento, subcategoria…). */
function spendBreakdown(db, keyFn){
  const txs=(db.transactions||[]).filter(isDespesa);
  const m=new Map(); let total=0;
  txs.forEach(t=>{ const k=keyFn(t); if(k==null||k==='') return;
    const e=m.get(k)||{key:k,total:0,count:0,first:null,last:null};
    e.total+=spendOf(t); e.count++;
    if(!e.first||t.date<e.first) e.first=t.date;
    if(!e.last||t.date>e.last) e.last=t.date;
    m.set(k,e); total+=spendOf(t);
  });
  const rows=[...m.values()].map(e=>({...e,total:round2(e.total),avg:e.count?round2(e.total/e.count):0,share:total?e.total/total:0}));
  rows.sort((a,b)=>b.total-a.total);
  return {rows,total:round2(total),count:txs.length};
}

function App(){
  const db=useDB();
  const [route,setRoute]=useState('dashboard');
  const [drill,setDrill]=useState(null);
  const [menuOpen,setMenuOpen]=useState(false);
  const collapsed=!!db.settings?.sidebarCollapsed;
  const theme=db.settings?.theme||'light';

  /* estado expandir/recolher de cada menu principal — memorizado por usuário.
     Default: só o grupo que contém a rota atual nasce aberto. */
  const savedNav=db.settings?.navOpen;
  const navOpen = savedNav && typeof savedNav==='object'
    ? savedNav
    : {[ROUTE_GRP[route]||'dashboard']:true};
  const toggleGrp=id=>db.setSettings({navOpen:{...navOpen,[id]:!navOpen[id]}});

  /* todos os grupos (menus principais com submenus) — base do Expandir/Recolher todos */
  const groupIds=NAV.filter(g=>g.items).map(g=>g.id);
  const allOpen=groupIds.every(id=>!!navOpen[id]);
  const setAllNav=open=>db.setSettings({navOpen:Object.fromEntries(groupIds.map(id=>[id,open]))});

  useEffect(()=>{
    document.documentElement.dataset.theme=theme;
    document.documentElement.dataset.menu=db.settings?.menu||'verde';
  },[theme, db.settings?.menu]);

  /* personalização de cores da marca — aplicada só enquanto o App está montado
     (a tela de login, anterior ao App, fica intacta). */
  const accentId=db.settings?.accent||DEFAULT_ACCENT;
  useEffect(()=>{ applyBrand(db.settings); return ()=>clearBrand(); },[accentId]);

  const [navHist,setNavHist]=useState([]); // pilha p/ "voltar" (drill/submenu empilha; menu zera)
  const _scrollTop=()=>{ try{ const el=document.querySelector('.content'); if(el&&el.scrollTo) el.scrollTo(0,0); if(window.scrollTo) window.scrollTo(0,0); }catch(e){} };
  // navegação por DRILL/submenu — empilha de onde veio (preserva filtros, que vivem em FILTER_STORE)
  const go=useCallback((r,payload=null)=>{
    setNavHist(h=> r!==route ? [...h,{route,drill}].slice(-25) : h);
    setRoute(r); setDrill(payload); setMenuOpen(false); _scrollTop();
  },[route,drill]);
  // voltar à tela anterior EXATAMENTE como estava: restaura a rota e zera o drill
  // (os filtros persistem em FILTER_STORE; drill=null evita que o efeito de drill os sobrescreva)
  const goBack=useCallback(()=>{
    setNavHist(h=>{ if(!h.length) return h; const prev=h[h.length-1];
      setRoute(prev.route); setDrill(null); setMenuOpen(false); _scrollTop();
      return h.slice(0,-1); });
  },[]);
  // navegação pelo MENU PRINCIPAL — zera os filtros da tela e a pilha de "voltar"
  const goMenu=useCallback((r)=>{
    clearFilterPrefix(MENU_RESET_PREFIX[r]);
    const grp=ROUTE_GRP[r]; if(grp && !navOpen[grp]) db.setSettings({navOpen:{...navOpen,[grp]:true}});
    setNavHist([]); setRoute(r); setDrill(null); setMenuOpen(false); _scrollTop();
  },[navOpen]);

  if(!db.ready) return <div className="boot"><BrandIcon size={60}/><p style={{marginTop:14}}>Carregando seus dados…</p></div>;

  let Page;
  switch(route){
    case 'importar': Page=<ImportPage/>; break;
    case 'extrato': Page=<ImportarExtrato go={go}/>; break;
    case 'lancamentos': Page=<Lancamentos drill={drill}/>; break;
    case 'fixos': Page=<GastosFixos go={go} nav={drill}/>; break;
    case 'pagamentos': Page=<Pagamentos go={go} nav={drill}/>; break;
    case 'parcelamentos': Page=<Parcelamentos go={go}/>; break;
    case 'renegociacoes': Page=<Renegociacoes go={go} nav={drill}/>; break;
    case 'divisao': Page=<DivisaoGastos go={go}/>; break;
    case 'anotacoes': Page=<Anotacoes/>; break;
    case 'receitas': Page=<Receitas nav={drill}/>; break;
    case 'orcamentos': Page=<Orcamentos go={go}/>; break;
    case 'cartoes': Page=<CartoesContas go={go} nav={drill}/>; break;
    case 'comparativo': Page=<Comparativo go={go}/>; break;
    case 'relatorios': Page=<Relatorios go={go}/>; break;
    case 'eventos': Page=<CentroEventos go={go} nav={drill}/>; break;
    case 'regras': Page=<Regras/>; break;
    case 'config': Page=<Configuracoes go={go}/>; break;
    case 'contas': Page=<ContasBancarias go={go}/>; break;
    case 'contas-saldos': Page=<ContasSaldos go={go} nav={drill}/>; break;
    case 'contas-transferencias': Page=<Transferencias go={go}/>; break;
    case 'contas-conciliacao': Page=<Conciliacao go={go} nav={drill}/>; break;
    case 'patrimonio': Page=<PatrimonioBens go={go}/>; break;
    case 'patr-financiamentos': Page=<Financiamentos go={go}/>; break;
    case 'patr-valor': Page=<ValorPatrimonial go={go}/>; break;
    case 'patr-liquidacao': Page=<SimulacaoLiquidacao go={go}/>; break;
    case 'faturas': Page=<Faturas go={go} nav={drill}/>; break;
    case 'gestao-faturas': Page=<GestaoFaturas go={go} nav={drill}/>; break;
    case 'juros-rotativo': Page=<JurosRotativo go={go}/>; break;
    case 'hist-pagamentos': Page=<HistoricoPagamentos go={go}/>; break;
    case 'fluxo-futuro': Page=<FluxoFuturo go={go}/>; break;
    case 'metas': Page=<Metas go={go}/>; break;
    case 'projecoes': Page=<Projecoes go={go}/>; break;
    case 'simulador': Page=<SimuladorDecisoes go={go}/>; break;
    case 'score': Page=<ScoreHannah go={go}/>; break;
    case 'diagnostico': Page=<Diagnostico go={go}/>; break;
    case 'hannah-ia': Page=<HannahIA go={go}/>; break;

    /* ---- ETAPA 7: aliases (abrem telas reais já existentes) ---- */
    case 'mov-transferencias': Page=<Transferencias go={go}/>; break;
    case 'hist-financeiro': Page=<Lancamentos drill={drill}/>; break;
    case 'aparencia': Page=<Aparencia/>; break;
    case 'cfg-integracoes': case 'cfg-backup': case 'cfg-tema': case 'cfg-dados':
      Page=<Configuracoes go={go}/>; break;
    case 'imp-pdf': case 'imp-csv': case 'imp-excel': Page=<ImportPage/>; break;
    case 'ia-diagnostico': case 'ia-recomendacoes': case 'ia-insights':
      Page=<Diagnostico go={go}/>; break;
    case 'indicadores': Page=<Dashboard go={go}/>; break;
    case 'an-estabelecimentos': Page=<Estabelecimentos go={go}/>; break;
    case 'an-subcategorias': Page=<Subcategorias go={go}/>; break;
    case 'aud-sem-categoria': Page=<SemCategoria go={go}/>; break;
    case 'aud-sem-origem': Page=<SemOrigem go={go}/>; break;
    case 'aud-duplicidades': Page=<Duplicidades go={go}/>; break;
    case 'aud-inconsistencias': Page=<Inconsistencias go={go}/>; break;
    case 'aud-import-revisao': Page=<ImportRevisao go={go}/>; break;

    /* ---- ETAPA 7: Modo crise vira grupo; submenus levam ao motor único ---- */
    case 'crise':
    case 'crise-pagar': case 'crise-renda': case 'crise-reducao':
    case 'crise-parcial': case 'crise-renegociacao': case 'crise-reserva':
    case 'crise-venda': case 'crise-sobrevivencia': case 'crise-cenarios':
      Page=<ModoCrise go={go} section={route}/>; break;

    /* ---- ETAPA 7: telas dedicadas ainda em construção (não quebram a navegação) ---- */

    default: Page=<Dashboard go={go}/>;
  }

  return <div className={"app-shell"+(collapsed?' collapsed':'')}>
    {menuOpen && <div className="scrim" onClick={()=>setMenuOpen(false)}/>}
    <aside className={"sidebar"+(menuOpen?' open':'')}>
      <div className="brand">
        <HannahIcon size={32}/>
        <div className="txt"><b style={{letterSpacing:'.02em'}}>HANNAH</b><small>Finanças Pessoais</small></div>
      </div>
      <nav className="nav">
        {NAV.map(g=>{
          // MENU FOLHA (navega direto: Dashboard, Contas, Patrimônio)
          if(g.route){
            const on=route===g.route;
            return <button key={g.id} className={"navmain leaf"+(on?' active':'')}
              onClick={()=>goMenu(g.route)} title={g.label}>
              <span className="emo" aria-hidden="true"><Icon name={g.icon} size={18}/></span>
              <span className="lbl">{g.label}</span>
            </button>;
          }
          // MENU GRUPO (expande/recolhe)
          const explicit=navOpen[g.id];
          const open=explicit===undefined ? (ROUTE_GRP[route]===g.id) : !!explicit;
          const hasActive=ROUTE_GRP[route]===g.id;
          return <div key={g.id} className={"navgroup"+(open?' open':'')}>
            <button className={"navmain"+(hasActive?' has-active':'')}
              aria-expanded={open}
              onClick={()=>{ if(collapsed){ db.setSettings({sidebarCollapsed:false,navOpen:{...navOpen,[g.id]:true}}); } else { toggleGrp(g.id); } }}
              title={g.label}>
              <span className="emo" aria-hidden="true"><Icon name={g.icon} size={18}/></span>
              <span className="lbl">{g.label}</span>
              <span className="chev" aria-hidden="true">{open?'▼':'▶'}</span>
            </button>
            {!collapsed && open && <div className="subitems">
              {g.items.map(([id,label,icon])=>
                <a key={id} className={"subitem"+(route===id?' active':'')}
                  onClick={()=>goMenu(id)} title={label}>
                  <Icon name={icon} size={16} className="ic"/> <span className="lbl">{label}</span></a>)}
            </div>}
          </div>;
        })}
      </nav>
      <div className="sidefoot" style={{flexDirection:'column',alignItems:'stretch',gap:8}}>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'flex-start'}}>
          {!collapsed && <button className="btn ghost sm" onClick={()=>setAllNav(!allOpen)} title={allOpen?'Recolher todos os menus':'Expandir todos os menus'}>
            <Icon name={allOpen?'x':'plus'} size={15}/> <span className="lbl">{allOpen?'Recolher todos':'Expandir todos'}</span></button>}
          <button className="btn ghost sm" onClick={()=>db.setTheme(theme==='light'?(db.settings?.darkTheme||'dark'):'light')} title={theme==='light'?'Tema escuro':'Tema claro'}>
            <Icon name={theme==='light'?'moon':'sun'} size={15}/> <span className="lbl">{theme==='light'?'Escuro':'Claro'}</span></button>
          {db.cloudOn && db.session && <button className="btn ghost sm" onClick={()=>{ if(confirmDialog('Sair da sua conta? Seus dados ficam salvos na nuvem.')) db.signOut(); }} title="Sair da conta">
            <Icon name="x" size={15}/> <span className="lbl">Sair</span></button>}
        </div>
        {!collapsed && db.cloudOn && db.session && <div style={{padding:'0 4px',lineHeight:1.35,overflow:'hidden'}}>
          {(db.settings?.userName||'').trim() && <div style={{fontSize:12.5,fontWeight:700,color:'var(--rail-ink)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}} title={'Controle financeiro de '+db.settings.userName}>Controle financeiro de {db.settings.userName.trim()}</div>}
          <div style={{fontSize:11,color:'var(--rail-muted)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}} title={db.session.email}>{db.session.email}</div>
          <div style={{display:'flex',alignItems:'center',gap:4,marginTop:3,fontSize:10.5,flexWrap:'wrap',
            color:db.syncStatus==='error'?'#F08A8A':db.syncStatus==='saving'||db.syncStatus==='pending'?'#E0A444':db.syncStatus==='saved'||db.syncStatus==='idle'?'#19C37D':db.syncStatus==='offline'?'#88ab9c':'#547A67'}}
            title={db.syncErr||(db.lastSyncAt?'Última sync: '+new Date(db.lastSyncAt).toLocaleTimeString('pt-BR'):undefined)}>
            <span style={{fontSize:8,lineHeight:1}}>●</span>
            <span>
              {db.syncStatus==='saving'?`Salvando${db.pendingCount>0?' ('+db.pendingCount+')':''}...`
              :db.syncStatus==='pending'?`${db.pendingCount} alteraç${db.pendingCount===1?'ão':'ões'} pendente${db.pendingCount===1?'':'s'}`
              :db.syncStatus==='error'?'Falha ao sincronizar'
              :db.syncStatus==='offline'?'Sem conexão'
              :db.syncStatus==='local_only'?'Somente local'
              :db.syncStatus==='saved'?'Salvo':'Sincronizado'}
            </span>
            {db.syncStatus==='error'&&<button onClick={()=>{ if(db.syncErr) db.toast('Tentando novamente...'); }}
              style={{fontSize:9,padding:'1px 5px',borderRadius:4,border:'1px solid currentColor',background:'transparent',color:'inherit',cursor:'pointer',marginLeft:2}}>↺</button>}
          </div>
        </div>}
        {!collapsed && <div style={{display:'flex',alignItems:'center',justifyContent:'flex-start',gap:5,padding:'8px 4px 0',marginTop:2,borderTop:'1px solid var(--rail-line)',color:'var(--rail-muted)',fontSize:10.5,letterSpacing:'.05em',textTransform:'uppercase'}}>
          <span>um produto</span><BrandIcon size={14}/><b style={{fontWeight:700,color:'var(--rail-ink)',letterSpacing:'.04em'}}>AC DEV</b>
        </div>}
      </div>
    </aside>

    <div className="main">
      <header className="topbar">
        <button className="btn ghost hamb" onClick={()=>setMenuOpen(true)} title="Abrir menu"><Icon name="menu" size={20}/></button>
        <button className="btn ghost collapse-toggle" onClick={()=>db.setSettings({sidebarCollapsed:!collapsed})} title={collapsed?'Expandir menu':'Recolher menu'}><Icon name="menu" size={20}/></button>
        {navHist.length>0 && <button className="btn ghost sm" onClick={goBack} title="Voltar à tela anterior (mantém os filtros que você fez)" style={{flex:'0 0 auto',marginRight:4}}>
          <span aria-hidden="true" style={{fontSize:17,lineHeight:1,marginRight:2}}>‹</span> Voltar</button>}
        <div style={{minWidth:0}}>
          <nav className="crumbs" aria-label="Trilha de navegação">
            {(CRUMBS[route]||['Dashboard']).map((c,i,arr)=>
              <React.Fragment key={i}>
                <span className={i===arr.length-1?'cur':''}>{c}</span>
                {i<arr.length-1 && <span className="sep" aria-hidden="true">›</span>}
              </React.Fragment>)}
          </nav>
          <h1>{TITLES[route]||'Dashboard'}</h1>
        </div>
      </header>
      <div className="content">{Page}</div>
    </div>
  </div>;
}

   25. MONTAGEM
   ========================================================================= */
class ErrorBoundary extends React.Component{
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err,info){ console.error('Erro na aplicação:',err,info); }
  render(){
    if(this.state.err) return <div style={{maxWidth:620,margin:'60px auto',padding:24,fontFamily:'Inter,system-ui,sans-serif'}}>
      <h2 style={{color:'#D64545'}}>Ocorreu um erro ao renderizar</h2>
      <p style={{color:'#697989'}}>Detalhe técnico:</p>
      <pre style={{background:'#F5F7F9',padding:14,borderRadius:10,overflow:'auto',fontSize:12}}>{String(this.state.err&&this.state.err.message||this.state.err)}</pre>
      <button onClick={()=>{ try{['transactions','cards','accounts','categories','rules','fixed','incomes','budgets','renegotiations','notes','splits','files','settings'].forEach(k=>{ try{window.storage&&window.storage.delete&&window.storage.delete('mcf:'+k);}catch(e){} try{window.localStorage&&window.localStorage.removeItem('mcf:'+k);}catch(e){} });}catch(e){} location.reload(); }}
        style={{padding:'10px 16px',borderRadius:10,border:0,background:'#0E9F8E',color:'#fff',fontWeight:600,cursor:'pointer'}}>
        Limpar dados e recarregar</button>
    </div>;
    return this.props.children;
  }
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><Provider><AuthGate/></Provider></ErrorBoundary>);
