async function geminiFindModel(apiKey, preferred){
  // valida a chave e descobre os modelos suportados (rápido, 1 GET)
  const avail=await geminiListModels(apiKey);
  const fromPref=GEMINI_PREF.filter(m=>avail.includes(m));
  const others=avail.filter(m=>/(flash|pro)/i.test(m) && !/(image|tts|audio|embedding|live|vision-|aqa|learnlm|exp|preview-\d|native-audio|thinking)/i.test(m));
  const ordered=[...new Set([...(preferred&&avail.includes(preferred.trim())?[preferred.trim()]:[]), ...fromPref, ...others])];
  if(!ordered.length) throw new Error('Nenhum modelo compatível foi encontrado para esta chave.');
  // confirma com um ping leve (no máx. alguns candidatos)
  let lastErr=null;
  for(const m of ordered.slice(0,4)){
    try{ await geminiPing(apiKey,m); return m; }
    catch(e){ lastErr=e; if(!MODEL_ERR.test(e.message)) throw e; }
  }
  return ordered[0]; // confia no ListModels se os pings falharem por sobrecarga momentânea
}

// 4.4 — leitura de PDF (texto -> direto; pouco texto -> render p/ imagem + IA)
async function readPDF(file, onProgress, password, opts){
  opts=opts||{};
  if(typeof pdfjsLib==='undefined') throw new Error('A biblioteca de leitura de PDF não carregou. Verifique sua conexão e recarregue a página.');
  const buf=await file.arrayBuffer();
  let pdf;
  try{
    pdf=await pdfjsLib.getDocument({data:buf, password: password||undefined}).promise;
  }catch(e){
    const isPw = e && (e.name==='PasswordException' || /password/i.test(e.message||''));
    if(isPw){
      // code 2 = senha incorreta; code 1 = precisa de senha
      if((e.code===2) || password) throw new Error('PDF_PASSWORD_WRONG');
      throw new Error('PDF_PASSWORD');
    }
    throw e;
  }
  // reconstrução COM detecção de colunas (corredores verticais) — evita misturar
  // colunas diferentes (ex.: fatura Itaú com transações à esquerda e notas à direita)
  const buildLines = items => {
    if(!items.length) return [];
    // modo LINHA (extrato): agrupa por y na largura toda → preserva cada linha visual
    // da tabela (data | descrição | valor | saldo numa só linha). Evita o "embaralhamento"
    // que a detecção por colunas causaria numa tabela de 4 colunas.
    if(opts.rowMode){
      const buckets={};
      items.forEach(it=>{ const y=Math.round(it.y/3)*3; (buckets[y]=buckets[y]||[]).push(it); });
      const lines=[];
      Object.keys(buckets).map(Number).sort((a,b)=>b-a).forEach(y=>{
        const s=buckets[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim();
        if(s) lines.push(s);
      });
      return lines;
    }
    const pageW = Math.ceil(Math.max(...items.map(i=>i.x+(i.w||0))))+2;
    const occ = new Array(pageW+2).fill(false);
    items.forEach(it=>{ const a=Math.max(0,Math.floor(it.x)), b=Math.min(pageW,Math.ceil(it.x+(it.w||0))); for(let k=a;k<=b;k++) occ[k]=true; });
    const minG = Math.max(16, pageW*0.035);            // largura mínima do corredor
    const bounds=[]; let run=-1;
    for(let k=0;k<=pageW;k++){
      if(!occ[k]){ if(run<0) run=k; }
      else { if(run>=0 && (k-run)>=minG && run>pageW*0.12 && k<pageW*0.9) bounds.push((run+k)/2); run=-1; }
    }
    const colOf = x => { let c=0; for(const b of bounds){ if(x>=b) c++; else break; } return c; };
    const cols={};
    items.forEach(it=>{ const c=colOf(it.x); (cols[c]=cols[c]||[]).push(it); });
    const lines=[];
    Object.keys(cols).map(Number).sort((a,b)=>a-b).forEach(c=>{      // esquerda -> direita
      const buckets={};
      cols[c].forEach(it=>{ const y=Math.round(it.y/3)*3; (buckets[y]=buckets[y]||[]).push(it); });
      Object.keys(buckets).map(Number).sort((a,b)=>b-a).forEach(y=>{ // topo -> base
        const s=buckets[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim();
        if(s) lines.push(s);
      });
    });
    return lines;
  };
  let fullText='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const items=tc.items.filter(it=>it.str&&it.str.trim())
      .map(it=>({x:it.transform?.[4]||0, y:it.transform?.[5]||0, w:it.width||0, s:it.str}));
    fullText += buildLines(items).join('\n')+'\n';
    onProgress&&onProgress(`Lendo página ${p}/${pdf.numPages}…`);
  }
  const hasText = fullText.replace(/\s/g,'').length > 80;
  // renderiza páginas em imagem sob demanda (para IA de visão / OCR de fallback)
  async function renderPages(max,scale){
    const imgs=[];
    for(let p=1;p<=Math.min(pdf.numPages,max||4);p++){
      const page=await pdf.getPage(p);
      const vp=page.getViewport({scale:scale||3});
      const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
      const ctx=cv.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); // fundo branco ajuda o OCR
      await page.render({canvasContext:ctx,viewport:vp}).promise;
      imgs.push({media_type:'image/jpeg',data:cv.toDataURL('image/jpeg',0.85).split(',')[1]});
      onProgress&&onProgress(`Preparando imagem da página ${p}…`);
    }
    return imgs;
  }
  const pageImgs = hasText? [] : await renderPages(4);
  return {fullText, hasText, pageImgs, renderPages};
}

// 4.5 — CSV / XLSX → mapeamento por cabeçalho
function mapTabular(rows){ // rows: array de objetos {coluna:valor}
  if(!rows.length) return [];
  const keys=Object.keys(rows[0]).map(k=>({k,low:k.toLowerCase()}));
  const find=(...al)=>{ for(const a of al){ const f=keys.find(x=>x.low.includes(a)); if(f) return f.k; } return null; };
  const kd=find('data','date'), kdesc=find('descri','histó','histo','lançamento','lancamento','estabelec','title'),
        kv=find('valor','value','amount','montante'), kc=find('cart','card'),
        kp=find('parcel'), kt=find('tipo','type');
  return rows.map(r=>{
    const dRaw=String(r[kd]||'').trim();
    let dateISO=todayISO();
    if(/\d{4}-\d{2}-\d{2}/.test(dRaw)) dateISO=dRaw.slice(0,10);
    else if(/\d{2}\/\d{2}\/\d{2,4}/.test(dRaw)) dateISO=isoFromBR(dRaw.match(/\d{2}\/\d{2}\/\d{2,4}/)[0]);
    const v=parseMoney(r[kv]); if(v==null) return null;
    let cur=null,tot=null; if(kp){ const pm=String(r[kp]).match(RE_PARC); if(pm){cur=+pm[1];tot=+pm[2];} }
    let type='despesa'; const tv=String(r[kt]||r[kdesc]||'').toLowerCase();
    if(/pagamento|pgto|pag\.?\s*receb/.test(tv)) type='pagamento';
    else if(/estorno|reembolso|devolu|cr[eé]dito/.test(tv) || v<0) type='estorno';
    else if(/receita|sal[áa]rio/.test(tv)) type='receita';
    return {date:dateISO, descOrig:String(r[kdesc]||'(sem descrição)').trim(),
      amount:Math.abs(v), type, installmentCurrent:cur, installmentTotal:tot,
      isInternational:false, confidence:0.9, _card:kc?String(r[kc]):null};
  }).filter(Boolean);
}
function readCSV(file){
  return new Promise((res,rej)=>{
    if(typeof Papa==='undefined') return rej(new Error('A biblioteca de leitura de CSV não carregou. Recarregue a página.'));
    Papa.parse(file,{header:true,skipEmptyLines:true,delimiter:'',
      complete:r=>res(mapTabular(r.data)), error:rej});
  });
}
// 4.5b — EXTRATO BANCÁRIO (OFX e CSV) — receita = valor positivo, despesa = valor negativo
const BANK_CODES={'001':'Banco do Brasil','237':'Bradesco','341':'Itaú','104':'Caixa','033':'Santander','260':'Nubank','077':'Banco Inter','336':'C6 Bank','212':'Banco Original','341341':'Itaú','745':'Citibank','399':'HSBC','422':'Safra','756':'Sicoob','748':'Sicredi','290':'PagBank','323':'Mercado Pago','380':'PicPay'};
function ofxText(buf){ // OFX pode vir como texto SGML; remove cabeçalho
  let t=String(buf||''); const i=t.search(/<OFX>/i); return i>=0?t.slice(i):t;
}
function parseOFX(raw){
  const t=ofxText(raw);
  const org=(t.match(/<ORG>\s*([^<\r\n]+)/i)||[])[1]||'';
  const bankid=((t.match(/<BANKID>\s*([^<\r\n]+)/i)||[])[1]||'').trim();
  const acct=((t.match(/<ACCTID>\s*([^<\r\n]+)/i)||[])[1]||'').trim();
  const banco=(org&&org.trim())||BANK_CODES[bankid]||(bankid?('Banco '+bankid):'');
  const blocks=t.split(/<STMTTRN>/i).slice(1);
  const rows=blocks.map(b=>{
    let amt=parseFloat(((b.match(/<TRNAMT>\s*([^<\r\n]+)/i)||[])[1]||'0').replace(/\s/g,'').replace(',', '.'));
    const dt=((b.match(/<DTPOSTED>\s*([0-9]{8})/i)||[])[1]||'');
    const memo=((b.match(/<MEMO>\s*([^<\r\n]+)/i)||[])[1]||(b.match(/<NAME>\s*([^<\r\n]+)/i)||[])[1]||'').trim();
    const trtype=((b.match(/<TRNTYPE>\s*([^<\r\n]+)/i)||[])[1]||'').trim();
    if(!dt||!isFinite(amt)||amt===0) return null;
    const date=`${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}`;
    return {date,descOrig:memo||trtype||'(sem descrição)',amount:Math.abs(amt),
      type:amt<0?'despesa':'receita',confidence:0.95,installmentTotal:1};
  }).filter(Boolean);
  return {rows,meta:{banco,acct,bankid}};
}
function parseStatementCSVText(text){
  if(typeof Papa==='undefined') throw new Error('A biblioteca de leitura de CSV não carregou. Recarregue a página.');
  const out=Papa.parse(text,{header:true,skipEmptyLines:true,delimiter:''});
  const data=out.data||[]; if(!data.length) return {rows:[],meta:{banco:''}};
  const keys=Object.keys(data[0]);
  const find=re=>keys.find(k=>re.test(k.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')));
  const kdate=find(/data|date/);
  const kdesc=find(/hist|descr|lancamento|memo|name|detalhe/);
  const kval=find(/valor|amount|montante|value/);
  const kdeb=find(/debito|saida|debit|pagamento/);
  const kcred=find(/credito|entrada|credit|recebi/);
  const parseDate=s=>{ s=String(s||'').trim(); let m;
    if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)) return `${m[1]}-${m[2]}-${m[3]}`;
    if(m=s.match(/^(\d{2})[\/\-.](\d{2})[\/\-.](\d{2,4})/)){ let y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2]}-${m[1]}`; }
    return ''; };
  const num=s=>{ s=String(s==null?'':s).replace(/[R$\s]/g,''); if(!s) return NaN;
    if(s.indexOf(',')>=0){ s=s.replace(/\./g,'').replace(',','.'); } return parseFloat(s); };
  const rows=data.map(r=>{
    const date=parseDate(r[kdate]); if(!date) return null;
    let amt, type;
    if(kval){ amt=num(r[kval]); if(!isFinite(amt)||amt===0) return null; type=amt<0?'despesa':'receita'; amt=Math.abs(amt); }
    else { const d=Math.abs(num(r[kdeb])||0), c=Math.abs(num(r[kcred])||0);
      if(c>0){ amt=c; type='receita'; } else if(d>0){ amt=d; type='despesa'; } else return null; }
    return {date,descOrig:String(r[kdesc]||'(sem descrição)').trim(),amount:amt,type,confidence:0.9,installmentTotal:1};
  }).filter(Boolean);
  return {rows,meta:{banco:''}};
}
// EXTRATO em PDF (Itaú e afins): reusa a esteira PDF→texto/IA do importador de fatura,
// trocando só o perfil (parser de texto de extrato e schema da IA com sinal entrada/saída).
async function readStatementPDF(file, onProgress, aiKeys){
  aiKeys=aiKeys||{};
  const r=await readPDF(file, onProgress, undefined, {rowMode:true});
  const banco=detectBank(r.fullText)||'';
  let rows=[];
  if(r.hasText){ onProgress&&onProgress('Lendo o extrato (camada de texto)…'); rows=parseStatementText(r.fullText); }
  // poucas linhas (PDF digitalizado ou layout atípico) → IA/visão e OCR sobre as páginas
  if(rows.length<3){
    onProgress&&onProgress('Texto insuficiente — lendo as páginas com IA/OCR…');
    const imgs = r.pageImgs.length? r.pageImgs : await r.renderPages(12);
    const out=await extractStatementFromImages(imgs, aiKeys, onProgress);
    if(out.rows.length>rows.length) rows=out.rows;
  }
  return {rows, meta:{banco}};
}
async function readStatement(file, onProgress, aiKeys){
  const name=(file.name||'').toLowerCase();
  if(name.endsWith('.ofx')||name.endsWith('.qfx')){ const txt=await file.text(); return parseOFX(txt); }
  if(name.endsWith('.pdf')||file.type==='application/pdf'){ return readStatementPDF(file, onProgress, aiKeys); }
  if(name.endsWith('.csv')||name.endsWith('.txt')){ const txt=await file.text(); return parseStatementCSVText(txt); }
  // tenta detectar pelo conteúdo
  const txt=await file.text();
  if(/<OFX>/i.test(txt)||/<STMTTRN>/i.test(txt)) return parseOFX(txt);
  return parseStatementCSVText(txt);
}

async function readXLSX(file){
  if(typeof XLSX==='undefined') throw new Error('A biblioteca de leitura de Excel não carregou. Recarregue a página.');
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array',cellDates:false});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return mapTabular(XLSX.utils.sheet_to_json(ws,{defval:''}));
}

// 4.6 — OCR LOCAL (Tesseract, roda no navegador; usado quando a IA/API não está disponível)
let _ocrWorker=null;
async function terminateOCR(){ if(_ocrWorker){ try{ await _ocrWorker.terminate(); }catch(e){} _ocrWorker=null; } }
async function getOCRWorker(onProgress){
  if(typeof Tesseract==='undefined') throw new Error('OCR_INDISPONIVEL');
  if(_ocrWorker) return _ocrWorker;
  onProgress&&onProgress('Preparando OCR local (primeira vez baixa ~5MB)…');
  _ocrWorker=await Tesseract.createWorker('por',1,{
    logger:m=>{ if(m.status==='recognizing text'&&onProgress) onProgress('Lendo com OCR local: '+Math.round((m.progress||0)*100)+'%'); }
  });
  try{ await _ocrWorker.setParameters({ tessedit_pageseg_mode:'6', preserve_interword_spaces:'1' }); }catch(e){}
  return _ocrWorker;
}
async function ocrImagesToText(images,onProgress){  const w=await getOCRWorker(onProgress);
  let text='';
  for(let i=0;i<images.length;i++){
    onProgress&&onProgress(`OCR local — página ${i+1}/${images.length}…`);
    const url='data:'+(images[i].media_type||'image/jpeg')+';base64,'+images[i].data;
    try{ const {data}=await w.recognize(url); text+=(data.text||'')+'\n'; }catch(e){ console.error('OCR página',i+1,e); }
  }
  return text;
}
async function fileImageToOCRText(file,onProgress){
  const data=await fileToBase64(file);
  return ocrImagesToText([{media_type:file.type||'image/jpeg',data}],onProgress);
}

/* =========================================================================
   5. CATEGORIZAÇÃO + DUPLICIDADE
   ========================================================================= */
function applyRules(tx, rules, cats){
  const catByName = n => (cats.find(c=>c.name===n)||{}).id;
  const d=normDesc(tx.descOrig);
  for(const r of rules){
    let hit=false;
    if(r.type==='contains') hit=d.includes(normDesc(r.value));
    else if(r.type==='startsWith') hit=d.startsWith(normDesc(r.value));
    else if(r.type==='amountGt') hit=tx.amount>Number(r.value);
    else if(r.type==='amountLt') hit=tx.amount<Number(r.value);
    if(hit){
      const cid = r.categoryId || catByName(r.categoryName);
      return {categoryId:cid, subcategory:r.subcategory||null,
        isFixed:!!r.markFixed, isSubscription:!!r.markSubscription, _ruleHit:true};
    }
  }
  // tipos especiais
  if(tx.type==='estorno'||tx.type==='pagamento') return {categoryId:null,subcategory:null};
  if(tx.installmentTotal>1) return {categoryId:catByName('Parcelamentos'),subcategory:null};
  return {categoryId:catByName('Outros'),subcategory:null};
}
function seedRulesFor(cats){
  const id=n=>(cats.find(c=>c.name===n)||{}).id;
  return SEED_RULES.map(([v,cat,sub])=>({id:uid('rule'),type:'contains',value:v,
    categoryId:id(cat),subcategory:sub||null,markFixed:false,markSubscription:cat==='Assinaturas'}));
}
// chave de duplicidade
const dupKey = t => [t.date,normDesc(t.descOrig).slice(0,18),round2(t.amount),t.cardId||'',t.installmentCurrent||0].join('|');
function findDuplicates(newTx, existing){
  const exact=new Map(); existing.forEach(t=>exact.set(dupKey(t),t));
  // índice por valor (para correspondência aproximada entre métodos de leitura diferentes)
  const byAmt=new Map(); existing.forEach(t=>{const k=round2(t.amount); if(!byAmt.has(k))byAmt.set(k,[]); byAmt.get(k).push(t);});
  function fuzzy(t){
    const cands=byAmt.get(round2(t.amount))||[];
    if(!cands.length) return null;
    const nd=normDesc(t.descOrig), td=new Date(t.date+'T00:00:00');
    return cands.find(e=>{
      if((e.installmentCurrent||0)!==(t.installmentCurrent||0)) return false;
      const ed=new Date(e.date+'T00:00:00'); if(isNaN(ed)||isNaN(td)) return false;
      if(Math.abs((ed-td)/86400000)>5) return false; // até 5 dias de diferença
      const en=normDesc(e.descOrig);
      return en.slice(0,6)===nd.slice(0,6) || en.startsWith(nd.slice(0,10)) || nd.startsWith(en.slice(0,10));
    })||null;
  }
  return newTx.map(t=>({tx:t, dup: exact.get(dupKey(t)) || fuzzy(t) || null}));
}

const DB = createContext(null);

function Provider({children}){
  const [ready,setReady]=useState(false);
  const [st,setSt]=useState({transactions:[],cards:[],accounts:[],acctMoves:[],transfers:[],assets:[],goals:[],categories:[],rules:[],fixed:[],incomes:[],budgets:[],renegotiations:[],notes:[],splits:[],files:[],auditIncomes:[],bankMovements:[],paymentRecords:[],attachments:[],settings:{theme:'light'},metadata:{}});
  const [toasts,setToasts]=useState([]);
  const [pendingReview,setPendingReview]=useState(null); // importação em andamento (sobrevive à troca de telas)
  const [session,setSession]=useState(CLOUD_ON?undefined:null); // undefined=carregando, null=deslogado, obj=usuário
  const [profile,setProfile]=useState(null);
  const [recovery,setRecovery]=useState(false); // true quando o usuário chega pelo link de redefinição de senha
  const [syncStatus,setSyncStatus]=useState('idle'); // 'idle'|'saving'|'saved'|'pending'|'offline'|'error'|'local_only'
  const [syncErr,setSyncErr]=useState(null);
  const [pendingCount,setPendingCount]=useState(0);
  const [lastSyncAt,setLastSyncAt]=useState(null);

  // registra callback de sync para o store module-level (v92: pendingCount + lastSyncAt)
  useEffect(()=>{
    store.setSyncCallback((s,e,meta)=>{
      setSyncStatus(s);
      setSyncErr(e?e.message||String(e):null);
      if(meta?.pending!=null) setPendingCount(meta.pending);
      if(s==='saved'||s==='idle') { setLastSyncAt(new Date().toISOString()); setPendingCount(0); }
    });
    // aviso antes de fechar com alterações pendentes
    const onBeforeUnload = e => {
      if(pendingCount > 0) { e.preventDefault(); e.returnValue = 'Existem alterações não sincronizadas. Deseja sair mesmo assim?'; }
    };
    window.addEventListener('beforeunload', onBeforeUnload);
    return ()=>{ store.setSyncCallback(null); window.removeEventListener('beforeunload', onBeforeUnload); };
  },[pendingCount]);

  // assinatura da sessão (somente quando a nuvem está ativa)
  useEffect(()=>{ if(!CLOUD_ON) return;
    let sub;
    (async()=>{ const u=await cloud.getSession(); setSession(u||null); sub=cloud.onChange((u2,ev)=>{ setSession(u2||null); if(ev==='PASSWORD_RECOVERY') setRecovery(true); }); })();
    return ()=>{ try{ sub&&sub.unsubscribe&&sub.unsubscribe(); }catch(e){} };
  },[]);

  const toast=useCallback((msg,kind='ok')=>{
    const t={id:uid('t'),msg,kind}; setToasts(x=>[...x,t]);
    const dur=Math.min(14000, Math.max(4200, String(msg).length*70));
    setTimeout(()=>setToasts(x=>x.filter(y=>y.id!==t.id)),dur);
  },[]);

  // carregar (modo local sempre; modo nuvem só após login)
  useEffect(()=>{
    if(CLOUD_ON){ if(session===undefined) return; if(session===null){ setReady(false); store.setUser(null); return; } }
    let cancelled=false;
    (async()=>{
      if(CLOUD_ON && session){ store.setUser(session.id);
        try{ await cloud.pullAll(session.id); }catch(e){ toast('Falha ao baixar seus dados da nuvem. Mostrando o que há localmente.','warn'); }
        try{ const pr=await cloud.getProfile(session.id); setProfile(pr||{status:'pendente'}); }catch(e){ setProfile({status:'pendente'}); }
      } else { store.setUser(null); }
      const loaded={}; for(const k of KEYS){ loaded[k]=await store.get('mcf:'+k); }
      const ensureRenegCat=(cats)=>{ cats=cats||[]; if(!cats.some(c=>/renegocia/i.test(c.name))) cats=[...cats,{id:uid('cat'),name:'Renegociações',color:'#5C7080',subs:[]}]; return cats; };
      if(!loaded.settings){ // primeira execução -> semear com demonstração
        const demo=genDemo();
        const next={...demo,categories:sortCats(ensureRenegCat(demo.categories)),settings:{theme:'light'}};
        next.budgets=migrateBudgets(next.budgets); // §9: orçamentos versionados por competência
        for(const k of KEYS){ await store.set('mcf:'+k, next[k]); }
        if(!cancelled){ setSt(next); }
      } else {
        const defaults={transactions:[],cards:[],accounts:[],acctMoves:[],transfers:[],assets:[],goals:[],categories:[],rules:[],fixed:[],incomes:[],budgets:{},renegotiations:[],notes:[],splits:[],files:[],auditIncomes:[],bankMovements:[],paymentRecords:[],attachments:[],settings:{theme:'light'},metadata:{}};
        const next={...defaults};
        for(const k of KEYS){ if(loaded[k]!==undefined && loaded[k]!==null) next[k]=loaded[k]; }
        if(!next.categories?.length) next.categories=buildCats();
        next.categories=sortCats(ensureRenegCat(next.categories));
        store.set('mcf:categories', next.categories);
        const wasOldShape = next.budgets && !Array.isArray(next.budgets);
        next.budgets=migrateBudgets(next.budgets);
        if(wasOldShape) store.set('mcf:budgets', next.budgets);
        // migração de schema idempotente (v92 → v93)
        try {
          const mig92 = migrateToV92(next);
          if(mig92.schemaVersion===92||mig92.schemaVersion===93) {
            Object.assign(next, mig92);
          }
        } catch(e) { console.error('[HANNAH] Migração v92 falhou:',e); }
        try {
          const mig93 = migrateToV93(next);
          if((mig93.metadata||{}).schemaVersion===93) {
            Object.assign(next, mig93);
            store.set('mcf:bankMovements', next.bankMovements);
            store.set('mcf:paymentRecords', next.paymentRecords);
            store.set('mcf:attachments', next.attachments);
            store.set('mcf:metadata', next.metadata);
          }
        } catch(e) { console.error('[HANNAH] Migração v93 falhou:',e); }
        try {
          const mig94 = migrateToV94(next);
          if((mig94.metadata||{}).schemaVersion===94) {
            Object.assign(next, mig94);
            store.set('mcf:bankMovements', next.bankMovements);
            store.set('mcf:metadata', next.metadata);
          }
        } catch(e) { console.error('[HANNAH] Migração v94 falhou:',e); }
        try {
          const mig95 = migrateToV95(next);
          if((mig95.metadata||{}).schemaVersion===95) {
            Object.assign(next, mig95);
            store.set('mcf:bankMovements', next.bankMovements);
            store.set('mcf:metadata', next.metadata);
            if(next.auditV94Items) store.set('mcf:auditV94Items', next.auditV94Items);
          }
        } catch(e) { console.error('[HANNAH] Migração v95 falhou:',e); }
        if(!cancelled){ setSt(next); }
      }
      if(!cancelled) setReady(true);
    })();
    return ()=>{ cancelled=true; };
  },[session]);

    addStatement:({despesas,billPayments,receitas,patrimonial,transferencias,fileMeta})=>{
      // v95: addStatement suporta 6 payloads separados por tipo de movimentação:
      // despesas → criam transaction + bankMovement (saída)
      // billPayments → somente bankMovement do tipo card_bill_payment (não cria transaction)
      // receitas → auditIncomes + bankMovement entrada (sempre, mesmo sem vínculo com receita)
      // patrimonial → somente bankMovement (aplicacao/saque/estorno/ajuste/nao_classificado)
      // transferencias → par de bankMovements + registro em transfers
      const fileId=uid('file');
      const count=(despesas?.length||0)+(billPayments?.length||0)+(receitas?.length||0)+(patrimonial?.length||0);
      save('files',f=>[{id:fileId,...(fileMeta||{}),kind:'extrato',importedAt:new Date().toISOString(),count},...(f||[])]);
      const now=new Date().toISOString();
      const newMovements=[];

      // --- despesas que criam lançamento ---
      if(despesas&&despesas.length){
        const ready=despesas.map(t=>{
          const txId=uid('tx');
          if(t.accountId){
            newMovements.push(makeBankMovement({accountId:t.accountId,date:t.date,
              description:t.descOrig||'',amount:Math.abs(Number(t.amount)),direction:'saida',
              movementType:t.movementType||'expense',transactionId:txId,
              importId:fileId,source:'import',reconciliationStatus:'pending'}));
          }
          return {id:txId,accountId:t.accountId||null,installmentGroupId:null,currency:'BRL',fxAmount:null,
            origin:'extrato',fileId,confStatus:(t.confidence||0)>=0.6?'ok':'revisar',descPad:t.descOrig,history:[],
            createdAt:now,updatedAt:now,isFixed:false,isSubscription:false,subcategory:null,categoryId:null,
            cardId:null,isBillPayment:false,...t};
        });
        if(ready.length) save('transactions',tx=>[...ready,...(tx||[])]);
      }

      // --- pagamentos de fatura: somente saída bancária, sem transaction ---
      if(billPayments&&billPayments.length){
        billPayments.forEach(t=>{
          if(t.accountId){
            newMovements.push(makeBankMovement({accountId:t.accountId,date:t.date,
              description:t.descOrig||'',amount:Math.abs(Number(t.amount)),direction:'saida',
              movementType:'card_bill_payment',transactionId:null,
              importId:fileId,source:'import',reconciliationStatus:'pending'}));
          }
        });
      }

      // --- movimentações patrimoniais (aplicacao, saque, estorno, ajuste, nao_classificado) ---
      if(patrimonial&&patrimonial.length){
        patrimonial.forEach(t=>{
          const movType=t.movementType||'unclassified';
          const dir=t.direction||((['estorno','ajuste_saldo'].includes(movType))?'entrada':'saida');
          if(t.accountId){
            newMovements.push(makeBankMovement({accountId:t.accountId,date:t.date,
              description:t.descOrig||'',amount:Math.abs(Number(t.amount)),direction:dir,
              movementType:movType,transactionId:null,
              importId:fileId,source:'import',
              reconciliationStatus:movType==='nao_classificado'?'pending':'pending'}));
          }
          // v95: saque com carteira destino gera par de movimentos (preserva patrimônio)
          if(movType==='saque'&&t.destAcctId){
            const cashTrfId=uid('ctrf');
            newMovements[newMovements.length-1].cashTransferId=cashTrfId;
            newMovements[newMovements.length-1].movementType='cash_withdrawal';
            newMovements.push(makeBankMovement({accountId:t.destAcctId,date:t.date,
              description:t.descOrig||'Depósito em espécie',amount:Math.abs(Number(t.amount)),
              direction:'entrada',movementType:'cash_deposit',cashTransferId:cashTrfId,
              importId:fileId,source:'import',reconciliationStatus:'reconciled'}));
          }
          // v95: aplicação com ativo gera movimento de saída bancária (o ativo é atualizado separadamente)
          if(movType==='aplicacao'&&t.destAssetId){
            newMovements[newMovements.length-1].movementType='investment_out';
            newMovements[newMovements.length-1].destAssetId=t.destAssetId;
          }
        });
      }

      // --- receitas: bankMovement entrada SEMPRE + auditoria ---
      if(receitas&&receitas.length){
        receitas.forEach(r=>{
          // v95: receita afeta saldo independentemente de estar vinculada a uma receita financeira
          const acctId=r.accountId||null;
          if(acctId){
            newMovements.push(makeBankMovement({accountId:acctId,date:r.date,
              description:r.descOrig||'',amount:Math.abs(Number(r.amount)),direction:'entrada',
              movementType:'income',importId:fileId,source:'import',reconciliationStatus:'pending'}));
          }
        });
        const inc=receitas.map(r=>({id:uid('air'),date:r.date,descOrig:r.descOrig,amount:r.amount,
          banco:r.banco||fileMeta?.bank||'',accountId:r.accountId||null,importId:fileId,source:'import',
          status:'pendente',matchedIncomeId:null,fileId,createdAt:now}));
        save('auditIncomes',a=>[...inc,...(a||[])]);
      }

      // --- transferências próprias: par de bankMovements + registro em transfers ---
      if(transferencias&&transferencias.length){
        const newTransfers=[];
        transferencias.forEach(t=>{
          if(!t.fromAccountId||!t.toAccountId) return; // sem destino não processa
          const trfId=uid('trf');
          newMovements.push(makeBankMovement({accountId:t.fromAccountId,date:t.date,
            description:t.descOrig||'Transferência entre contas',amount:Math.abs(Number(t.amount)),
            direction:'saida',movementType:'transfer_out',transferId:trfId,
            importId:fileId,source:'import',reconciliationStatus:'reconciled'}));
          newMovements.push(makeBankMovement({accountId:t.toAccountId,date:t.date,
            description:t.descOrig||'Transferência entre contas',amount:Math.abs(Number(t.amount)),
            direction:'entrada',movementType:'transfer_in',transferId:trfId,
            importId:fileId,source:'import',reconciliationStatus:'reconciled'}));
          newTransfers.push({id:trfId,date:t.date,amount:Math.abs(Number(t.amount)),
            fromAccountId:t.fromAccountId,toAccountId:t.toAccountId,
            description:t.descOrig||'Transferência entre contas',importId:fileId,createdAt:now});
        });
        if(newTransfers.length) save('transfers',x=>[...newTransfers,...(x||[])]);
      }

      if(newMovements.length) save('bankMovements',x=>[...newMovements,...(x||[])]);
      return {fileId,count};
    },

        save('files',f=>[{id:fileId,...fileMeta,importedAt:new Date().toISOString(),count:list.length},...(f||[])]); }
      const now=new Date().toISOString();

      const grpIdx={};
      (st.transactions||[]).filter(t=>t.installmentGroupId&&(t.installmentTotal||0)>1).forEach(t=>{
        // cardId OBRIGATÓRIO na chave — evita juntar compras de cartões diferentes
        if(!t.cardId) return; // sem cardId não indexa (será novo grupo)
        const billingMk = monthKey(t.date)||'2000-01';
        const k = buildInstallmentKey(t.cardId, t.descOrig, t.amount, t.installmentTotal, t.installmentCurrent||1, billingMk);
        if(!grpIdx[k]) grpIdx[k]=t.installmentGroupId;
      });
      const ready=list.map(t=>{
        let grpId=t.installmentGroupId;
        if(!grpId&&(t.installmentTotal||0)>1){
          if(t.cardId) { // só agrupa se cardId está definido
            const billingMk = monthKey(t.date)||'2000-01';
            const k = buildInstallmentKey(t.cardId, t.descOrig, t.amount, t.installmentTotal, t.installmentCurrent||1, billingMk);
            grpId=grpIdx[k]||uid('grp');
            if(!grpIdx[k]) grpIdx[k]=grpId;
          } else {
            grpId=uid('grp'); // cartão não identificado → sempre grupo novo
          }
        }
        return { id:uid('tx'),accountId:null,installmentGroupId:grpId,
          currency:t.isInternational?'USD':'BRL',fxAmount:null,origin:'import',fileId,
          confStatus:(t.confidence||0)>=0.6?'ok':'revisar',
          descPad:t.descOrig,history:[],createdAt:now,updatedAt:now,
          isFixed:false,isSubscription:false,subcategory:null,categoryId:null,...t};
      });
      save('transactions',tx=>[...ready,...(tx||[])]);
      return ready.length;
    },
    updateTx:(id,patch,learn)=>{
      save('transactions',tx=>tx.map(t=>{
        if(t.id!==id) return t;
        const h=[...(t.history||[]),{at:new Date().toISOString(),changed:Object.keys(patch)}].slice(-20);
        return {...t,...patch,updatedAt:new Date().toISOString(),history:h};

        const t=st.transactions.find(x=>x.id===id); if(!t) return;
        const token=learnToken(t.descOrig);
        if(token && !st.rules.some(r=>r.type==='contains'&&normDesc(r.value)===normDesc(token))){

          toast(`Aprendi: "${token}" → ${(st.categories.find(c=>c.id===patch.categoryId)||{}).name}`,'ok');
        }
      }

    addSplit:s2=>save('splits',x=>[{id:uid('split'),...s2},...(x||[])]),
    updateSplit:(id,p)=>save('splits',x=>(x||[]).map(s2=>s2.id===id?{...s2,...p}:s2)),
    deleteSplit:id=>save('splits',x=>(x||[]).filter(s2=>s2.id!==id)),

    // pagamentos: marca/desmarca um item (fatura de cartão ou gasto fixo) como pago num mês
    setPayment:(key,paid)=>save('settings',s=>{
      const p={...(s.payments||{})};
      if(paid) p[key]={paid:true,at:new Date().toISOString()}; else delete p[key];
      return {...s,payments:p};
    }),
    // valor real de um gasto (sobretudo variável) num mês específico; '' remove o ajuste
    setFixedMonthly:(id,mk,val)=>save('settings',s=>{
      const fm={...(s.fixedMonthly||{})}; const k=`${id}:${mk}`;
      if(val===null||val===undefined||val==='') delete fm[k]; else fm[k]=round2(+val||0);
      return {...s,fixedMonthly:fm};
    }),

    resetDemo:async()=>{ const demo=genDemo(); const next={...demo,settings:st.settings};
      next.budgets=migrateBudgets(next.budgets); // §9
      for(const k of KEYS) await store.set('mcf:'+k,next[k]); setSt(next); toast('Dados de demonstração recarregados.'); },
    wipe:async()=>{ const cats=buildCats();
      const next={transactions:[],cards:[],accounts:[],acctMoves:[],transfers:[],assets:[],goals:[],categories:cats,rules:seedRulesFor(cats),
        fixed:[],incomes:[],budgets:[],renegotiations:[],notes:[],splits:[],files:[],auditIncomes:[],bankMovements:[],paymentRecords:[],attachments:[],settings:st.settings,metadata:{schemaVersion:94,migratedAt:new Date().toISOString(),migrations:['wipe']}};
      for(const k of KEYS) await store.set('mcf:'+k,next[k]); setSt(next); toast('Todos os dados foram apagados.','warn'); },
    applyRules:(tx)=>applyRules(tx,st.rules,st.categories),
  };

  return <DB.Provider value={api}>
    {children}
    <div className="toasts">
      {toasts.map(t=><div key={t.id} className={'toast '+(t.kind==='err'?'err':t.kind==='warn'?'warn':'')}
        onClick={()=>setToasts(x=>x.filter(y=>y.id!==t.id))} style={{cursor:'pointer'}} title="Clique para fechar">{t.msg}</div>)}
    </div>
  </DB.Provider>;
}

/* =========================================================================
   9. SELETORES / AGREGAÇÕES
   ========================================================================= */
const spendOf = t => t.type==='despesa'? t.amount : t.type==='estorno'? -t.amount : 0;
const isSpend = t => t.type==='despesa'||t.type==='estorno';

// origem canônica de um lançamento (mesma regra do filtro de Lançamentos), em escopo global p/ reuso.
const originKey = t => (t.installmentGroupId && String(t.installmentGroupId).startsWith('reneg:')) ? 'reneg'
  : t.origin==='extrato' ? 'extrato' : t.origin==='import' ? 'fatura' : t.origin==='demo' ? 'demo' : 'manual';

// §4 — casa um lançamento com uma origem unificada: fonte (manual/fatura/extrato/demo)
// + natureza (parcelamento/gasto fixo/renegociação). 'all'/'' não filtra. Função pura.
function matchOrigin(t, o){
  if(!o) return true;
  const isReneg = t.installmentGroupId && String(t.installmentGroupId).startsWith('reneg:');
  switch(o){
    case 'reneg': return !!isReneg;
    case 'parcelamento': return (t.installmentTotal>1) && !isReneg;
    case 'gastofixo': return !!t.isFixed;
    case 'fatura': return t.origin==='import';
    case 'extrato': return t.origin==='extrato';
    case 'demo': return t.origin==='demo';
    case 'manual': return !isReneg && t.origin!=='import' && t.origin!=='extrato' && t.origin!=='demo';
    default: return true;
  }
}

/* §10 — Análise avançada. Casa um lançamento contra os critérios escolhidos (cada campo
   ausente/'all' não filtra). Função pura: só depende dos campos do próprio lançamento. */
function txMatches(t, c){
  c=c||{};
  if(c.type && c.type!=='all' && t.type!==c.type) return false;
  if(c.categoryId && c.categoryId!=='all' && t.categoryId!==c.categoryId) return false;
  if(c.subcategory && c.subcategory!=='all' && (t.subcategory||'')!==c.subcategory) return false;
  if(c.origin && c.origin!=='all' && originKey(t)!==c.origin) return false;
  if(c.accountId && c.accountId!=='all' && (t.accountId||'')!==c.accountId) return false;
  if(c.cardId && c.cardId!=='all' && (t.cardId||'')!==c.cardId) return false;
  if(c.paymentType && c.paymentType!=='all' && (t.paymentType||'')!==c.paymentType) return false;
  if(c.confStatus && c.confStatus!=='all' && (t.confStatus||'')!==c.confStatus) return false;
  if(c.merchant){ const q=normName(c.merchant); if(q && !normName(t.descOrig||t.descPad||'').includes(q)) return false; }
  return true;
}
/* Distribui lançamentos já filtrados nos buckets (meses 'YYYY-MM' ou anos 'YYYY') e calcula
   estatísticas: total, nº de lançamentos, ticket médio, média por bucket ativo e variação %
   (último bucket ativo vs. anterior ativo). keyOf(t)->bucket; valOf(t)->valor. Função pura. */
function analyzeBuckets(txs, buckets, keyOf, valOf){
  const byB={}; buckets.forEach(b=>byB[b]={total:0,count:0});
  let total=0, count=0;
  (txs||[]).forEach(t=>{ const b=keyOf(t); if(!(b in byB)) return; const v=valOf(t);
    byB[b].total=round2(byB[b].total+v); byB[b].count+=1; total=round2(total+v); count+=1; });
  const series=buckets.map(b=>byB[b].total);
  const counts=buckets.map(b=>byB[b].count);
  const active=buckets.filter(b=>byB[b].count>0);
  const avgPerBucket=active.length?round2(total/active.length):0;
  const ticket=count?round2(total/count):0;
  let variation=null;
  if(active.length>=2){ const last=byB[active[active.length-1]].total, prev=byB[active[active.length-2]].total;
    if(prev>0) variation=round2((last-prev)/prev*100); }
  return {byB,series,counts,total,count,ticket,avgPerBucket,active,variation};
}

// gera lançamentos virtuais (uma parcela por mês) para uma renegociação, na categoria informada
function renegToTxs(r, catId){
  const total=+r.total||1, parcela=round2(+r.parcela||0);
  const paid=Math.min(total,Math.max(0,+r.paid||0));
  const startMk = r.startMk || addMonthKey(monthKey(todayISO()), -paid);
  const dom=Math.min(28,Math.max(1,+r.dom||5));
  const out=[];
  for(let k=1;k<=total;k++){
    const mk=addMonthKey(startMk,k-1); if(!mk) continue;
    out.push({ id:'rtx:'+r.id+':'+k, date:`${mk}-${String(dom).padStart(2,'0')}`,
      descOrig:r.desc, descPad:r.desc, amount:parcela, type:'despesa', categoryId:catId, cardId:null,
      installmentCurrent:k, installmentTotal:total, installmentGroupId:'reneg:'+r.id,
      fixed:true, _reneg:true, _renegId:r.id, _creditor:r.creditor||'' });
  }
  return out;
}

// data da parcela i (1-based) a partir do mês de compra: dia preservado e grampeado ao fim do mês
function instDateOf(buyMk, dom, i){ const mk=addMonthKey(buyMk,i-1); if(!mk) return '';
  const last=new Date(+mk.slice(0,4),+mk.slice(5,7),0).getDate();
  return `${mk}-${String(Math.min(Math.max(1,dom||1),last)).padStart(2,'0')}`; }

/* Monta a agenda completa de um grupo de parcelamento ancorada na DATA DA COMPRA.
   Regra do usuário: a parcela 1 pertence ao mês da compra; a parcela i pertence a compra+(i-1).
   A competência de cobrança na fatura (compMk) continua valendo para o Dashboard/relatórios;
   esta agenda é a linha do tempo de amortização da dívida, do mês da compra até a quitação.
   `schedule` traz TODAS as parcelas (passadas e futuras) com flag `paid`, o que dá o retroativo. */
function buildInstSchedule(g, settledMk){
  const buyDate=g.buyDate||g.lastDate||'';
  const buyMk=monthKey(buyDate)||monthKey(todayISO());
  const dom=Math.max(1,+(String(buyDate||'').slice(8,10))||1);
  // posição atual de cobrança = maior nº de parcela visto (ex.: "05/06" => 5 já lançadas).
  // `billed` explícito tem prioridade (renegociações podem ter 0 pagas).
  const billed=Math.min(g.total, (g.billed!=null? g.billed : (g.lastCur||(g.seen&&g.seen.length)||0)));
  const schedule=[];
  for(let i=1;i<=g.total;i++){ schedule.push({i,mk:addMonthKey(buyMk,i-1),date:instDateOf(buyMk,dom,i),amount:g.parcela,paid:i<=billed}); }
  const base={...g,buyDate,buyMk,paid:billed,valuePaid:round2(g.parcela*billed),totalValue:round2(g.parcela*g.total)};
  // §15 — encerrado/antecipado: congela no que já foi cobrado, zera saldo e futuro.
  if(settledMk){
    const pagas=schedule.filter(p=>p.paid);
    return {...base,remaining:0,balance:0,future:{},schedule:pagas,
      endDate:pagas.length?pagas[pagas.length-1].date:buyDate,
      total:billed,totalValue:round2(g.parcela*billed),settled:true,settledMk};
  }
  const remaining=Math.max(0,g.total-billed);
  const future={};
  schedule.filter(p=>!p.paid&&p.mk).forEach(p=>{ future[p.mk]=round2((future[p.mk]||0)+p.amount); });
  return {...base,remaining,balance:round2(g.parcela*remaining),future,schedule,
    endDate: g.total? instDateOf(buyMk,dom,g.total) : buyDate};
}

function projectInstallments(txs, settled){
  settled=settled||{};
  const groups={};
  txs.filter(t=>t.installmentTotal>1 && t.installmentGroupId).forEach(t=>{
    const g=groups[t.installmentGroupId] || (groups[t.installmentGroupId]={
      groupId:t.installmentGroupId,desc:t.descOrig,cardId:t.cardId,categoryId:t.categoryId,
      isReneg:!!t._reneg,creditor:t._creditor||'',
      parcela:t.amount,total:t.installmentTotal,seen:[],lastCur:0,lastDate:t.date,buyDate:t.date});
    g.seen.push(t.installmentCurrent||0);
    g.parcela=t.amount;
    if((t.installmentCurrent||0)>=g.lastCur){g.lastCur=t.installmentCurrent||0;g.lastDate=t.date;}
    // data da compra = menor data do grupo (na fatura todas as parcelas repetem a data da compra)
    if(t.date && (!g.buyDate || t.date<g.buyDate)) g.buyDate=t.date;
  });
  return Object.values(groups).map(g=>buildInstSchedule(g, settled[g.groupId]));
}

// grupos de parcelamento consolidados: cartões (a partir das transações reais) + renegociações
// (estas usam o nº de parcelas pagas informado pelo usuário — nunca as virtuais, que infláam o total).
function instGroups(db){
  return [
    ...projectInstallments((db.transactions||[]).filter(t=>!t._reneg), (db.settings&&db.settings.installmentSettled)||{}),
    ...((db.renegotiations||[]).map(renegToGroup)),
  ];
}

// um gasto cadastrado (db.fixed) está vigente no mês mk?
// parcelado (parcelas>1): vale por N meses a partir do mês de referência.
// recorrente (padrão): vale de startMk em diante (ou sempre). Não-recorrente: vale só no mês de referência.
function fixedVigente(f, mk){
  if(!f) return false;
  if(Array.isArray(f.skip) && f.skip.includes(mk)) return false; // §15: mês excluído ("só este")
  const n=+f.parcelas||0;
  if(n>1){ if(!f.startMk||mk<f.startMk) return false; return mk<=addMonthKey(f.startMk,n-1); }
  if(f.recorrente===false) return f.startMk===mk;
  if(f.startMk && mk<f.startMk) return false;
  if(f.endMk && mk>f.endMk) return false; // §15: recorrência encerrada ("este e os próximos")
  return true;
}

/* §15 — aplica edição/exclusão de um gasto recorrente conforme o escopo escolhido.
   op: 'edit' (usa patch) | 'delete'.  scope: 'one' (só o mês ref) | 'forward' (de ref em
   diante) | 'all' (toda a recorrência).  ref: 'YYYY-MM' de referência.
   Nunca altera meses já encerrados: 'forward' encerra o original em ref-1 e cria um novo a
   partir de ref; 'one' isola o mês ref. Função pura sobre a lista de gastos fixos. */
function applyFixedScope(list, id, op, scope, ref, patch){
  const f=(list||[]).find(x=>x.id===id); if(!f) return list;
  const dedup=a=>a.filter((v,i)=>a.indexOf(v)===i);
  if(scope==='all'){
    return op==='delete' ? list.filter(x=>x.id!==id) : list.map(x=>x.id===id?{...x,...patch}:x);
  }
  const startsInFuture = f.startMk && f.startMk>=ref; // nada no passado a preservar
  if(scope==='forward'){
    if(op==='delete'){
      if(startsInFuture) return list.filter(x=>x.id!==id);
      return list.map(x=>x.id===id?{...x,endMk:addMonthKey(ref,-1)}:x);
    }
    if(startsInFuture) return list.map(x=>x.id===id?{...x,...patch}:x);
    const clone={...f,...patch,id:uid('fix'),startMk:ref,endMk:f.endMk||null,skip:[]};
    return list.map(x=>x.id===id?{...x,endMk:addMonthKey(ref,-1)}:x).concat([clone]);
  }
  // scope==='one'
  if(op==='delete'){
    return list.map(x=>x.id===id?{...x,skip:dedup([...(x.skip||[]),ref])}:x);
  }
  const oneoff={...f,...patch,id:uid('fix'),recorrente:false,startMk:ref,endMk:null,skip:[]};
  return list.map(x=>x.id===id?{...x,skip:dedup([...(x.skip||[]),ref])}:x).concat([oneoff]);
}

// nº de meses de 'a' até 'b' (b - a). Ex.: mkDiff('2024-01','2024-04')=3.
function mkDiff(a,b){ if(!a||!b) return 0; const [ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number); return (by-ay)*12+(bm-am); }

// uma receita está vigente no mês mk? recorrente vale de startMk (ou mês da data) até endMk
// (inclusive) ou para sempre; avulsa vale só no mês da data. skip exclui meses pontuais.
function incomeVigente(i, mk){
  if(!i) return false;
  if(Array.isArray(i.skip) && i.skip.includes(mk)) return false;
  const start = i.startMk || monthKey(i.date);
  if(i.recurring===false) return start===mk;
  if(start && mk < start) return false;
  if(i.endMk && mk > i.endMk) return false;
  return true;
}
const incomeAmount = (i, mk) => incomeVigente(i,mk) ? round2(+i.amount||0) : 0;

// edição/exclusão de receita recorrente por escopo (espelha applyFixedScope).
function applyIncomeScope(list, id, op, scope, ref, patch){
  const f=(list||[]).find(x=>x.id===id); if(!f) return list;
  const dedup=a=>a.filter((v,i)=>a.indexOf(v)===i);
  if(scope==='all'){
    return op==='delete' ? list.filter(x=>x.id!==id) : list.map(x=>x.id===id?{...x,...patch}:x);
  }
  const startMk=f.startMk||monthKey(f.date);
  const startsInFuture = startMk && startMk>=ref;
  if(scope==='forward'){
    if(op==='delete'){
      if(startsInFuture) return list.filter(x=>x.id!==id);
      return list.map(x=>x.id===id?{...x,endMk:addMonthKey(ref,-1)}:x);
    }
    if(startsInFuture) return list.map(x=>x.id===id?{...x,...patch}:x);
    const clone={...f,...patch,id:uid('inc'),recurring:true,startMk:ref,endMk:f.endMk||null,skip:[],date:`${ref}-15`};
    return list.map(x=>x.id===id?{...x,endMk:addMonthKey(ref,-1)}:x).concat([clone]);
  }
  // scope==='one'
  if(op==='delete'){
    return list.map(x=>x.id===id?{...x,skip:dedup([...(x.skip||[]),ref])}:x);
  }
  const oneoff={...f,...patch,id:uid('inc'),recurring:false,startMk:ref,endMk:null,skip:[],date:`${ref}-15`};
  return list.map(x=>x.id===id?{...x,skip:dedup([...(x.skip||[]),ref])}:x).concat([oneoff]);
}

/* §9 — ORÇAMENTOS versionados por competência.
   Modelo (db.budgets agora é um array): {id, categoryId, amount, startMk (null=desde sempre),
   endMk (null=sem fim), recorrente (true=mensal | false=só o mês de startMk), obs, status
   ('ativo'|'pausado'), skip:['YYYY-MM']}. Mesma mecânica de vigência/escopo dos gastos fixos:
   alterar o valor a partir de um mês NUNCA reescreve o histórico (cria uma nova versão). */
function budgetVigente(b, mk){
  if(!b) return false;
  if(b.status==='pausado') return false;
  if(Array.isArray(b.skip) && b.skip.includes(mk)) return false;
  if(b.recorrente===false) return b.startMk===mk;
  if(b.startMk && mk<b.startMk) return false;
  if(b.endMk && mk>b.endMk) return false;
  return true;
}
// orçamento ativo por categoria no mês mk (em sobreposição, vence a versão de início mais recente).
function activeBudgetsFor(budgets, mk){
  const map={};
  (budgets||[]).forEach(b=>{
    if(!budgetVigente(b,mk)) return;
    const cur=map[b.categoryId];
    if(!cur || (b.startMk||'0000-00')>=(cur.startMk||'0000-00')) map[b.categoryId]=b;
  });
  return map;
}
// migração do modelo antigo {categoryId: valor} -> array versionável. Sem perda, retrocompatível.
function migrateBudgets(b){
  if(Array.isArray(b)) return b.map(x=>({recorrente:true,status:'ativo',skip:[],obs:'',startMk:null,endMk:null,...x}));
  if(b && typeof b==='object'){
    return Object.entries(b).filter(([,v])=>typeof v==='number' && v>0).map(([cid,v])=>({
      id:uid('bud'),categoryId:cid,amount:v,startMk:null,endMk:null,recorrente:true,obs:'',status:'ativo',skip:[]}));
  }
  return [];
}
/* §9 — escopo em orçamentos (idêntico em estrutura ao applyFixedScope).
   op: 'edit'|'delete'. scope: 'one'|'forward'|'all'. Função pura; preserva o passado. */
function applyBudgetScope(list, id, op, scope, ref, patch){
  const b=(list||[]).find(x=>x.id===id); if(!b) return list;
  const dedup=a=>a.filter((v,i)=>a.indexOf(v)===i);
  if(scope==='all'){
    return op==='delete' ? list.filter(x=>x.id!==id) : list.map(x=>x.id===id?{...x,...patch}:x);
  }
  const startsInFuture = b.startMk && b.startMk>=ref;
  if(scope==='forward'){
    if(op==='delete'){
      if(startsInFuture) return list.filter(x=>x.id!==id);
      return list.map(x=>x.id===id?{...x,endMk:addMonthKey(ref,-1)}:x);
    }
    if(startsInFuture) return list.map(x=>x.id===id?{...x,...patch}:x);
    const clone={...b,...patch,id:uid('bud'),startMk:ref,endMk:b.endMk||null,skip:[]};
    return list.map(x=>x.id===id?{...x,endMk:addMonthKey(ref,-1)}:x).concat([clone]);
  }
  // scope==='one'
  if(op==='delete'){
    return list.map(x=>x.id===id?{...x,skip:dedup([...(x.skip||[]),ref])}:x);
  }
  const oneoff={...b,...patch,id:uid('bud'),recorrente:false,startMk:ref,endMk:null,skip:[]};
  return list.map(x=>x.id===id?{...x,skip:dedup([...(x.skip||[]),ref])}:x).concat([oneoff]);
}

/* §15 — escopo em RENEGOCIAÇÕES (desenho próprio: dívida finita, não template recorrente).
   A renegociação tem total parcelas, parcela fixa, 'paid' já pagas e startMk (mês da 1ª parcela).
   O "passado" são as parcelas decorridas até o mês de referência (ref = mês atual).
   op: 'edit' (usa patch) | 'delete'.  scope: 'forward' | 'all' (não há "só este mês":
   pular uma parcela não faz sentido numa dívida fechada).
   - all/delete  → remove a renegociação inteira.
   - all/edit    → aplica o patch à renegociação inteira.
   - forward/delete ("quitar a partir de agora") → congela em 'frozen' parcelas (total=frozen),
       preservando as já pagas; o saldo restante deixa de ser devido.
   - forward/edit ("renegociar a partir desta parcela") → congela a parte decorrida no valor
       ORIGINAL (vira quitada) e cria uma NOVA renegociação a partir de ref com o patch (novo
       valor/credor/categoria), paid=0 e total = parcelas restantes.
   Função pura sobre a lista de renegociações. */
function applyRenegScope(list, id, op, scope, ref, patch){
  const r=(list||[]).find(x=>x.id===id); if(!r) return list;
  if(scope==='all'){
    return op==='delete' ? list.filter(x=>x.id!==id) : list.map(x=>x.id===id?{...x,...patch}:x);
  }
  // forward
  const total=Math.max(1,+r.total||1);
  const start=r.startMk||addMonthKey(monthKey(ref),-(+r.paid||0));
  const frozen=Math.max(0, Math.min(total, mkDiff(start, monthKey(ref)))); // parcelas antes de ref
  const remaining=Math.max(0, total-frozen);
  if(op==='delete'){
    if(frozen<=0) return list.filter(x=>x.id!==id);            // nada decorrido → remove
    return list.map(x=>x.id===id?{...x,total:frozen,paid:Math.min(+x.paid||0,frozen)}:x);
  }
  // edit forward (split)
  if(frozen<=0) return list.map(x=>x.id===id?{...x,...patch}:x); // ainda não começou → aplica geral
  const congelada={...r,total:frozen,paid:Math.min(+r.paid||0,frozen)};
  const novo={...r,...patch,id:uid('reneg'),paid:0,startMk:monthKey(ref),total:remaining};
  return list.map(x=>x.id===id?congelada:x).concat(remaining>0?[novo]:[]);
}
// mês/competência em que a transação deve ser contabilizada.
// Para itens de fatura de cartão, usa a competência informada na importação (compMk);
// senão, cai na data da compra (mantém compatibilidade com lançamentos antigos/manuais).
function billMonth(t){ return (t && t.compMk) || monthKey(t&&t.date); }
function billDate(t){ return (t && t.compMk) ? (t.compMk+'-15') : (t&&t.date); }
// número da parcela (atual/total) de um gasto parcelado no mês mk; null se não for parcelado
function fixedParcela(f, mk){
  const n=+f.parcelas||0; if(n<=1||!f.startMk) return null;
  const [ay,am]=f.startMk.split('-').map(Number); const [by,bm]=mk.split('-').map(Number);
  const i=(by-ay)*12+(bm-am); if(i<0||i>=n) return null;
  return {current:i+1, total:n};
}

// valor mensal de um gasto fixo no mês mk (respeita o valor por mês informado na Pagamentos)
function fixedAmount(f, mk, fm){ fm=fm||{}; const k=`${f.id}:${mk}`; return (k in fm)? round2(+fm[k]||0) : round2(+f.amount||0); }

/* §14 — REGRA CANÔNICA DE DESPESA (Desenho 1: "o realizado manda")
   Um gasto fixo cadastrado em db.fixed é apenas planejamento. Quando existe uma
   transação real equivalente no mesmo mês e categoria, o realizado prevalece e a
   ocorrência do template é SUPRIMIDA dos totais (nunca a transação real, que jamais
   se perde). "Equivalente" = mesma categoria, mesmo mês de competência e valor dentro
   de uma tolerância (10% ou R$1, o que for maior). Cada transação real casa com no
   máximo um template, e vice-versa, para não suprimir mais do que o devido.
   Retorna um Set de chaves "fixedId:MK" a ignorar. */
function suppressedFixedOccurrences(db, mks){
  const fm=db.settings?.fixedMonthly||{};
  const supp=new Set();
  (mks||[]).forEach(mk=>{
    const real=(db.allTx||[]).filter(t=>isSpend(t)&&billMonth(t)===mk);
    const used=new Set();
    (db.fixed||[]).filter(f=>fixedVigente(f,mk)).forEach(f=>{
      const p=fixedAmount(f,mk,fm); if(!(p>0)) return;
      const tol=Math.max(1,0.10*p);
      let best=-1,bestDiff=Infinity;
      real.forEach((t,i)=>{
        if(used.has(i)) return;
        if((t.categoryId||null)!==(f.categoryId||null)) return;
        const d=Math.abs(spendOf(t)-p);
        if(d<=tol && d<bestDiff){ best=i; bestDiff=d; }
      });
      if(best>=0){ used.add(best); supp.add(`${f.id}:${mk}`); }
    });
  });
  return supp;
}

// despesa consolidada de um conjunto de meses, já aplicada a regra do Desenho 1.
// realized = transações reais (allTx, inclui parcelas de renegociação).
// templates = ocorrências de db.fixed vigentes e NÃO suprimidas.
// Devolve total, byCat (categoria→valor) e fixos/variáveis projetados, tudo coerente entre si.
function consolidatedSpend(db, mks, realizedTx){
  const fm=db.settings?.fixedMonthly||{};
  const supp=suppressedFixedOccurrences(db,mks);
  const byCat={}; let total=0, fixos=0, variaveis=0;
  (realizedTx||[]).forEach(t=>{ if(!isSpend(t)) return; const v=spendOf(t);
    byCat[t.categoryId]=round2((byCat[t.categoryId]||0)+v); total=round2(total+v); });
  (mks||[]).forEach(mk=>{
    (db.fixed||[]).filter(f=>fixedVigente(f,mk)).forEach(f=>{
      if(supp.has(`${f.id}:${mk}`)) return;
      const v=fixedAmount(f,mk,fm); if(!(v>0)) return;
      byCat[f.categoryId]=round2((byCat[f.categoryId]||0)+v); total=round2(total+v);
      if((f.kind||'fixo')==='variavel') variaveis=round2(variaveis+v); else fixos=round2(fixos+v);
    });
  });
  return {total:round2(total), byCat, fixos:round2(fixos), variaveis:round2(variaveis), supp};
}

function aggregate(txs, cats){
  const total=round2(txs.reduce((s,t)=>s+spendOf(t),0));
  const byCat={}, byCard={}, byDay={}, byMerch={};
  let fixed=0,variable=0,inst=0,subs=0,rev=0,maxT=null;
  txs.forEach(t=>{
    const v=spendOf(t);
    if(t.type==='estorno') rev+=t.amount;
    if(!isSpend(t)) return;
    byCat[t.categoryId]=round2((byCat[t.categoryId]||0)+v);
    byCard[t.cardId]=round2((byCard[t.cardId]||0)+v);
    byDay[t.date]=round2((byDay[t.date]||0)+v);
    const mn=normDesc(t.descOrig).split(' ').slice(0,3).join(' ')||t.descOrig;
    byMerch[mn]=round2((byMerch[mn]||0)+v);
    if(t.isFixed) fixed+=v; else variable+=v;
    if(t.installmentTotal>1) inst+=v;
    if(t.isSubscription) subs+=v;
    if(t.type==='despesa' && (!maxT||t.amount>maxT.amount)) maxT=t;
  });
  const catArr=Object.entries(byCat).filter(([,v])=>v>0)
    .map(([id,v])=>({id,name:(cats.find(c=>c.id===id)||{}).name||'Sem categoria',
      color:(cats.find(c=>c.id===id)||{}).color||'#94A3B2',value:round2(v)}))
    .sort((a,b)=>b.value-a.value);
  const merchArr=Object.entries(byMerch).map(([k,v])=>({name:k,value:v})).sort((a,b)=>b.value-a.value).slice(0,8);
  return {total,byCat,byCard,byDay,catArr,merchArr,fixed:round2(fixed),variable:round2(variable),
    inst:round2(inst),subs:round2(subs),rev:round2(rev),maxT,count:txs.filter(isSpend).length};
}

/* =========================================================================
   9b. CENTRO DE EVENTOS FINANCEIROS
   -------------------------------------------------------------------------
   Camada central de RASTREABILIDADE. NÃO é uma segunda fonte de verdade: os
   eventos são PROJETADOS (derivados) dos registros canônicos a cada leitura,
   então sempre batem com o que o Dashboard, gráficos e relatórios exibem —
   sem risco de divergência (não há gravação dupla).

   Cada valor financeiro do sistema vira um evento com o formato pedido:
     { evento_id, origem, origem_id, modulo_origem, tipo_evento,
       data_evento, status, usuario, valor }
   Campos auxiliares (com prefixo "_") guardam o que o roteador precisa para
   abrir EXATAMENTE o registro de origem — nunca jogando o usuário em
   Lançamentos quando a origem mora em outro módulo.
   ========================================================================= */
// rótulos legíveis das origens e dos módulos (para a tela e os filtros)
const ORIGEM_LABELS={
  manual:'Lançamento manual', fatura:'Importação de fatura', extrato:'Importação de extrato',
  parcelamento:'Parcelamento', gastofixo:'Despesa fixa', demo:'Demonstração',
  receita:'Receita', renegociacao:'Renegociação', pagamento:'Pagamento',
  importacao_fatura:'Importação de fatura', importacao_extrato:'Importação de extrato',
  conta:'Conta bancária', cartao:'Cartão',
};
const MODULO_LABELS={
  lancamento:'Lançamentos', receita:'Receitas', auditoria:'Auditoria de receitas',
  gastofixo:'Gastos fixos', renegociacao:'Renegociações', pagamento:'Pagamentos',
  cartao:'Cartões e contas', importacao:'Importações',
};
/* CLASSIFICAÇÃO VISUAL dos registros (ETAPA 2). Cada evento ganha uma `classe`
   que identifica a natureza do valor para o usuário, com cor própria. */
const CLASSE_LABELS={
  realizado:'Realizado', previsto:'Previsto', projetado:'Projetado',
  recorrente:'Recorrente', importado:'Importado', renegociacao:'Renegociação',
  cartao:'Cartão', fatura:'Fatura',
};
const CLASSE_COLORS={
  realizado:'#0E9F8E', previsto:'#E0A53F', projetado:'#2E6BFF',
  recorrente:'#6C8AA6', importado:'#9A5FE0', renegociacao:'#C2497A',
  cartao:'#2E6BFF', fatura:'#0E9F8E',
};
// Deriva a classe visual de um evento já montado.
function eventClass(e){
  const fut=(e.data_evento||'')>todayISO();
  switch(e.modulo_origem){
    case 'lancamento':
      if(e.origem==='fatura') return 'fatura';
      if(e.origem==='extrato') return 'importado';
      if(e.origem==='renegociacao') return 'renegociacao';
      if(e.origem==='gastofixo') return 'recorrente';
      if(e.origem==='parcelamento') return fut?'projetado':'realizado';
      return 'realizado';
    case 'receita': return e.status==='recorrente'?'recorrente':'realizado';
    case 'auditoria': return 'importado';
    case 'gastofixo': return 'recorrente';
    case 'renegociacao': return 'renegociacao';
    case 'cartao': return 'cartao';
    case 'pagamento': return String(e.origem_id).startsWith('card:')?'fatura':'realizado';
    case 'importacao': return 'importado';
    default: return 'realizado';
  }
}
function ClasseBadge({classe,small}){
  const c=CLASSE_COLORS[classe]||'#6C8AA6';
  return <span title={'Classificação: '+(CLASSE_LABELS[classe]||classe)} style={{display:'inline-flex',alignItems:'center',gap:5,
    fontSize:small?10:11,fontWeight:700,padding:small?'1px 7px':'2px 9px',borderRadius:20,
    color:c,background:c+'22',whiteSpace:'nowrap',lineHeight:1.5}}>
    <span style={{width:6,height:6,borderRadius:'50%',background:c,flex:'0 0 auto'}}/>{CLASSE_LABELS[classe]||classe}</span>;
}
// origem canônica de uma transação real (mesma regra do filtro de Lançamentos)
function txOrigem(t){
  if(t.installmentGroupId && String(t.installmentGroupId).startsWith('reneg:')) return 'renegociacao';
  if(t.isFixed) return 'gastofixo';
  if(t.installmentTotal>1) return 'parcelamento';
  if(t.origin==='extrato') return 'extrato';
  if(t.origin==='import') return 'fatura';
  if(t.origin==='demo') return 'demo';
  return 'manual';
}
// Projeta TODOS os registros do sistema como eventos normalizados. Função pura.
function buildFinancialEvents(db){
  const usuario=(db&&db.session&&db.session.email)||(db&&db.profile&&db.profile.email)||'local';
  const ev=[]; const push=o=>ev.push({usuario,status:'',...o});

  // 1) Lançamentos reais (transações) — exclui as parcelas virtuais de renegociação,
  //    que são representadas pelo próprio registro de renegociação (abaixo).
  (db.transactions||[]).forEach(t=>{
    if(t._reneg) return;
    const origem=txOrigem(t);
    push({
      evento_id:'ev:tx:'+t.id, origem, origem_id:t.id, modulo_origem:'lancamento',
      tipo_evento:t.type||'despesa', data_evento:t.date||'', status:t.confStatus||'ok',
      valor:round2(spendOf(t)), _desc:t.descPad||t.descOrig||'(sem descrição)',
      _mk:billMonth(t), _route:'lancamentos', _focus:{focusTx:t.id},
    });
  });

  // 2) Receitas (manuais/recorrentes)
  (db.incomes||[]).forEach(i=>{
    const rec=i.recurring!==false; const start=i.startMk||monthKey(i.date);
    push({
      evento_id:'ev:inc:'+i.id, origem:'receita', origem_id:i.id, modulo_origem:'receita',
      tipo_evento:'receita', data_evento:i.date||(start?start+'-15':''),
      status:rec?'recorrente':'avulsa', valor:round2(+i.amount||0),
      _desc:i.desc||'Receita', _mk:start, _route:'receitas',
      _focus:{focusId:i.id, ano:start?start.slice(0,4):'', mes:start?start.slice(5,7):''},
    });
  });

  // 3) Auditoria de receitas importadas do extrato
  (db.auditIncomes||[]).forEach(a=>{
    push({
      evento_id:'ev:air:'+a.id, origem:'importacao_extrato', origem_id:a.id, modulo_origem:'auditoria',
      tipo_evento:'receita_importada', data_evento:a.date||'', status:a.status||'pendente',
      valor:round2(+a.amount||0), _desc:a.descOrig||'Receita importada', _mk:monthKey(a.date),
      _route:'receitas', _focus:{tab:'auditoria', focusId:a.id, ano:a.date?a.date.slice(0,4):'', mes:a.date?a.date.slice(5,7):''},
    });
  });

  // 4) Despesas fixas / variáveis cadastradas (definições recorrentes)
  (db.fixed||[]).forEach(f=>{
    const start=f.startMk||monthKey(todayISO());
    push({
      evento_id:'ev:fix:'+f.id, origem:'gastofixo', origem_id:f.id, modulo_origem:'gastofixo',
      tipo_evento:(f.kind||'fixo')==='variavel'?'despesa_variavel':'despesa_fixa',
      data_evento:start?start+'-'+String(f.dom||1).padStart(2,'0'):'',
      status:(f.recorrente!==false)?'recorrente':'avulsa', valor:round2(+f.amount||0),
      _desc:f.desc||'Despesa fixa', _mk:start, _route:'fixos', _focus:{focusId:f.id},
    });
  });

  // 5) Renegociações / empréstimos (parcela fixa mensal)
  (db.renegotiations||[]).forEach(r=>{
    const g=renegToGroup(r); const start=r.startMk||monthKey(todayISO());
    push({
      evento_id:'ev:reneg:'+r.id, origem:'renegociacao', origem_id:r.id, modulo_origem:'renegociacao',
      tipo_evento:'renegociacao', data_evento:start?start+'-'+String(r.dom||5).padStart(2,'0'):'',
      status:g.remaining>0?'ativa':'quitada', valor:round2(+r.parcela||0),
      _desc:r.desc||r.creditor||'Renegociação', _mk:start, _route:'renegociacoes', _focus:{focusId:r.id},
      _extra:{total:round2(g.parcela*g.total), pago:g.valuePaid, saldo:g.balance},
    });
  });

  // 6) Cartões e contas (entidades — limite/saldo de referência)
  (db.cards||[]).forEach(c=>{
    const isCredit=(c.type||'credito')==='credito';
    push({
      evento_id:'ev:card:'+c.id, origem:isCredit?'cartao':'conta', origem_id:c.id, modulo_origem:'cartao',
      tipo_evento:isCredit?'cartao':'conta', data_evento:'', status:c.active?'ativo':'inativo',
      valor:round2(+c.limit||0), _desc:c.name||'Forma de pagamento', _mk:'', _route:'cartoes', _focus:{focusId:c.id},
    });
  });

  // 7) Pagamentos confirmados (settings.payments). A chave codifica a origem do que foi pago:
  //    card:<id>:<mk> | fixed:<id>:<mk> | reneg:<id>:<mk>. O valor é reconstruído do registro referido.
  const pays=(db.settings&&db.settings.payments)||{};
  const fm=(db.settings&&db.settings.fixedMonthly)||{};
  const renegCatId=(db.categories||[]).find(c=>/renegocia/i.test(c.name))||{};
  Object.entries(pays).forEach(([key,meta])=>{
    const parts=String(key).split(':'); const kind=parts[0], rid=parts[1], mk=parts[2];
    if(!mk) return;
    let valor=0, desc='Pagamento';
    if(kind==='card'){
      const c=(db.cards||[]).find(x=>x.id===rid);
      valor=round2((db.transactions||[]).filter(t=>t.cardId===rid&&billMonth(t)===mk).reduce((s,t)=>s+spendOf(t),0));
      desc='Fatura '+((c&&c.name)||'cartão')+' · '+ptMonth(mk);
    } else if(kind==='fixed'){
      const f=(db.fixed||[]).find(x=>x.id===rid);
      const k=rid+':'+mk; valor=round2((k in fm)?fm[k]:((f&&f.amount)||0));
      desc='Pagamento '+((f&&f.desc)||'despesa fixa')+' · '+ptMonth(mk);
    } else if(kind==='reneg'){
      const r=(db.renegotiations||[]).find(x=>x.id===rid);
      const tx=r?renegToTxs(r,renegCatId.id).find(x=>monthKey(x.date)===mk):null;
      valor=round2((tx&&tx.amount)||0);
      desc='Parcela '+((r&&r.desc)||'renegociação')+' · '+ptMonth(mk);
    } else return;
    push({
      evento_id:'ev:pay:'+key, origem:'pagamento', origem_id:key, modulo_origem:'pagamento',
      tipo_evento:'pagamento', data_evento:(meta&&meta.at)?meta.at.slice(0,10):(mk+'-01'),
      status:'pago', valor, _desc:desc, _mk:mk, _route:'pagamentos',
      _focus:{mk, focusKey:key},
    });
  });

  // 8) Importações (arquivos de fatura/extrato)
  (db.files||[]).forEach(f=>{
    push({
      evento_id:'ev:file:'+f.id, origem:f.kind==='extrato'?'importacao_extrato':'importacao_fatura',
      origem_id:f.id, modulo_origem:'importacao', tipo_evento:'importacao',
      data_evento:(f.importedAt||'').slice(0,10), status:'importado', valor:round2(+f.count||0),
      _desc:(f.name||f.bank||'Arquivo')+(f.count?` · ${f.count} itens`:''), _mk:monthKey(f.importedAt),
      _route:f.kind==='extrato'?'extrato':'importar', _focus:{focusFile:f.id},
    });
  });

  // classificação visual (ETAPA 2): toda linha recebe sua classe
  ev.forEach(e=>{ e.classe=eventClass(e); });

  // ordena por data (mais recente primeiro), depois por valor
  ev.sort((a,b)=>{
    const da=a.data_evento||'', dbb=b.data_evento||'';
    if(da!==dbb) return da<dbb?1:-1;
    return (b.valor||0)-(a.valor||0);
  });
  return ev;
}
// Roteia para o registro de origem EXATO. Nunca cai em Lançamentos por padrão:
// só vai para Lançamentos quando a própria origem é um lançamento.
function openOrigin(go, ev){
  if(!ev||!go) return;
  const route=ev._route||'eventos';
  const payload={...(ev._focus||{}), _origin:{origem:ev.origem, origem_id:ev.origem_id, modulo:ev.modulo_origem}};
  go(route, payload);
}
/* ETAPA 2 — A "origem" de um valor AGREGADO (um KPI, uma barra de gráfico, um
   total de relatório) não é um único registro: é o CONJUNTO de eventos que o
   compõem. Por isso, ao clicar num agregado, abrimos o Centro de eventos já
   filtrado exatamente nesse conjunto — de onde cada linha leva, num clique, ao
   seu registro atômico. Assim nenhum valor fica órfão de origem. */
function openAggregate(go, preset){
  if(!go) return;
  go('eventos', {preset:preset||{}});
}
// Converte o período do Dashboard (P) num filtro ano/mês do Centro de eventos.
function periodToPreset(P){
  if(!P) return {ano:'all',mes:'all'};
  if(P.mode==='month'||P.mode==='prev'){ const mk=P.mk||''; return {ano:mk.slice(0,4)||'all',mes:mk.slice(5,7)||'all'}; }
  if(P.mode==='year'){ return {ano:(P.mk||'').slice(0,4)||'all',mes:'all'}; }
  return {ano:'all',mes:'all'};
}
// Hook de foco/realce: rola até a linha de origem e a destaca por alguns segundos.
function useRowFocus(focusId){
  const [active,setActive]=useState(focusId!=null?String(focusId):null);
  useEffect(()=>{
    if(focusId==null){ setActive(null); return; }
    const fid=String(focusId); setActive(fid);
    const t1=setTimeout(()=>{ try{ const el=document.querySelector('[data-focus="'+fid.replace(/"/g,'\\"')+'"]'); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){} },80);
    const t2=setTimeout(()=>setActive(null),3200);
    return ()=>{ clearTimeout(t1); clearTimeout(t2); };
  },[focusId]);
  const isOn=id=>active!=null && String(id)===active;
  const rowProps=id=>({ 'data-focus':String(id),
    style:isOn(id)?{boxShadow:'inset 3px 0 0 0 var(--accent)',background:'rgba(25,195,125,.12)',transition:'background .3s'}:undefined });
  return {rowProps,isOn,active};
}
