<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<style>
:root{
  /* Superfícies (escala de elevação — 4 níveis) */
  --bg:#F1F7F4; --surface-2:#EAF2EC; --surface:#FFFFFF; --raised:#F6FAF8;
  /* Bordas, sombras */
  --line:#dceae3;
  --shadow:0 1px 2px rgba(8,32,24,.04),0 18px 38px -28px rgba(8,32,24,.28);
  --shadow-lg:0 8px 40px rgba(8,32,24,.16);
  /* Texto */
  --ink:#082018; --ink-2:#3C5A4D; --muted:#5d7268; --faint:#82998f;
  /* Verde — acento oficial HANNAH */
  --green:#19C37D; --green-strong:#0F9E66; --green-soft:#E2EFE9; --mint:#7CF0C0;
  /* Compat aliases */
  --accent:#19C37D; --accent-soft:#E2EFE9; --accent-2:#2E6BFF; --accent-2-soft:#E0E9FF;
  --pos:#0F9E66; --neg:#c2452f; --neg-soft:#fbe4de; --warn:#b5790c; --warn-soft:#fbf0d8;
  /* compat surface */
  --surface-3:#dceae3;
  --radius:14px; --radius-sm:10px; --sidebar:260px;
}
[data-theme="dark"]{
  --bg:#06160f; --surface-2:#0a1f17; --surface:#102b20; --raised:#163a2b;
  --line:rgba(124,240,192,.12);
  --shadow:inset 0 1px 0 rgba(255,255,255,.04),0 16px 36px -24px rgba(0,0,0,.7);
  --shadow-lg:0 10px 50px rgba(0,0,0,.6);
  --ink:#EAF5EF; --ink-2:#CFE7DC; --muted:#88ab9c; --faint:#6f9a89;
  --green:#19C37D; --green-strong:#3FE89C; --green-soft:rgba(25,195,125,.16); --mint:#7CF0C0;
  --accent:#19C37D; --accent-soft:rgba(25,195,125,.16); --accent-2:#5B8BFF; --accent-2-soft:#16314F;
  --pos:#19C37D; --neg:#ff6b52; --neg-soft:rgba(210,85,63,.18); --warn:#e0a52a; --warn-soft:rgba(224,150,26,.16);
  --surface-3:#143526;
}
/* variante escura AZUL */
[data-theme="dark-blue"]{
  --bg:#0A1424; --surface-2:#13243F; --surface:#0E1B30; --raised:#1A2F50;
  --line:#22375A;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 28px rgba(0,0,0,.5);
  --shadow-lg:0 10px 50px rgba(0,0,0,.65);
  --ink:#EAF1FB; --ink-2:#C8D6EC; --muted:#8A9CB8; --faint:#6a86a2;
  --green:#19C37D; --green-strong:#3FE89C; --green-soft:rgba(25,195,125,.16); --mint:#7CF0C0;
  --accent:#19C37D; --accent-soft:rgba(25,195,125,.16); --accent-2:#5B8BFF; --accent-2-soft:#16314F;
  --pos:#19C37D; --neg:#ff6b52; --neg-soft:rgba(210,85,63,.18); --warn:#e0a52a; --warn-soft:rgba(224,150,26,.16);
  --surface-3:#1A2F50;
}

/* =====================================================================
   ESTILOS DE MENU — data-menu="verde|branco|uniforme"
   Padrão (sem atributo) = verde
   ===================================================================== */
:root,
[data-menu="verde"]{
  --rail:linear-gradient(180deg,#0e3a28,#06160f);
  --rail-ink:#EAF5EF; --rail-muted:#8fb6a6; --rail-hover:rgba(255,255,255,.07);
  --rail-active-bg:#19C37D; --rail-active-ink:#06160f;
  --rail-line:rgba(124,240,192,.14);
  --logo-pillar:#3FE89C; --logo-peak:#bdf7da;
}
[data-menu="branco"]{
  --rail:#F4F8F6; --rail-ink:#082018; --rail-muted:#5d7268; --rail-hover:#E7F0EB;
  --rail-active-bg:#19C37D; --rail-active-ink:#ffffff;
  --rail-line:#dceae3;
  --logo-pillar:#082018; --logo-peak:#19C37D;
}
[data-menu="uniforme"]{
  --rail:var(--bg); --rail-ink:var(--ink); --rail-muted:var(--muted); --rail-hover:var(--raised);
  --rail-active-bg:var(--green); --rail-active-ink:#ffffff;
  --rail-line:var(--line);
  --logo-pillar:var(--ink); --logo-peak:var(--green);
}
[data-theme="dark"][data-menu="uniforme"]{ --rail-active-ink:#06160f; }
[data-theme="dark-blue"][data-menu="uniforme"]{ --rail-active-ink:#06160f; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.page-head h1{font-family:'Space Grotesk','Manrope',system-ui,sans-serif;letter-spacing:-.02em}
.topbar h1{font-family:'Space Grotesk','Manrope',sans-serif;font-weight:700}
.num{font-family:'JetBrains Mono','Courier New',monospace;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;font-size:.95em}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:14px}
a{color:var(--accent-2); text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---- App shell ---- */
.app{display:flex; min-height:100vh}
.sidebar{
  width:var(--sidebar); background:var(--rail); border-right:1px solid var(--rail-line);
  position:fixed; inset:0 auto 0 0; display:flex; flex-direction:column; z-index:40;
  transition:transform .22s ease, background .2s, border-color .2s;
}
.brand{padding:20px 20px 14px; display:flex; align-items:center; gap:11px}
.brand .mark{
  width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;
  box-shadow:0 4px 12px rgba(14,159,142,.35);
}
.brand b{font-size:15px;letter-spacing:.01em;line-height:1.1;color:var(--rail-ink);
  font-family:'Space Grotesk','Manrope',system-ui,sans-serif;font-weight:700;transition:color .2s}
.brand small{display:block;color:var(--rail-muted);font-weight:500;font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;transition:color .2s}
.nav{padding:10px 12px;overflow-y:auto;flex:1}

/* ---- Barra de ferramentas da navegação (Expandir/Recolher todos) ---- */
.nav-tools{display:flex;justify-content:flex-end;padding:0 2px 6px;margin-bottom:4px;border-bottom:1px solid var(--rail-line)}
.nav-tools .expand-all{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rail-line);
  background:transparent;color:var(--rail-muted);font-weight:700;font-size:11px;
  letter-spacing:.03em;text-transform:uppercase;padding:6px 10px;border-radius:9px;
  cursor:pointer;transition:background .12s,color .12s,border-color .12s;
}
.nav-tools .expand-all:hover{background:var(--rail-hover);color:var(--rail-ink)}
.nav-tools .expand-all svg{width:13px;height:13px}

/* ---- Menus principais ---- */
.nav .navgroup{margin-bottom:10px}
.nav .navgroup:last-child{margin-bottom:0}
.nav .navgroup.open{margin-bottom:14px}
.nav .navmain{
  width:100%;display:flex;align-items:center;gap:11px;
  padding:12px 12px;border:0;border-radius:10px;cursor:pointer;user-select:none;
  background:transparent;color:var(--rail-muted);
  font-size:14px;font-weight:600;letter-spacing:-.1px;
  margin-top:14px;text-align:left;transition:background .16s,color .16s;
}
.nav .navgroup .navmain{margin-top:0}
.nav .navmain:first-child{margin-top:0}
.nav .navmain.leaf{margin-bottom:14px}
.nav .navmain:hover{background:var(--rail-hover);color:var(--rail-ink)}
.nav .navmain .emo{font-size:16px;line-height:1;flex:0 0 auto;width:22px;text-align:center}
.nav .navmain .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .navmain .chev{font-size:10px;color:var(--rail-muted);flex:0 0 auto;transition:transform .15s}
.nav .navmain.has-active{color:var(--rail-active-bg)}
.nav .navmain.leaf.active{background:var(--rail-active-bg);color:var(--rail-active-ink);font-weight:700}

/* ---- Submenus ---- */
.nav .subitems{padding:3px 0 6px 10px;margin-left:11px;border-left:1px solid var(--rail-line)}
.nav .subitem{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;
  color:var(--rail-muted);font-weight:500;font-size:12.8px;margin-bottom:1px;
  cursor:pointer;user-select:none;transition:background .16s,color .16s;
}
.nav .subitem:hover{background:var(--rail-hover);color:var(--rail-ink)}
.nav .subitem.active{background:var(--rail-active-bg);color:var(--rail-active-ink);font-weight:600}
.nav .subitem .ic{width:16px;height:16px;flex:0 0 auto;opacity:.7}
.nav .subitem.active .ic{opacity:1}

.sidefoot{padding:12px;border-top:1px solid var(--rail-line);display:flex;gap:8px;align-items:center}
.sidefoot .btn{color:var(--rail-muted);border-color:var(--rail-line);background:transparent}
.sidefoot .btn:hover{background:var(--rail-hover);color:var(--rail-ink)}

.main{flex:1;margin-left:var(--sidebar);min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:13px 26px;display:flex;align-items:center;gap:14px;
}
.topbar h1{font-size:20px;margin:0;letter-spacing:-.4px;font-weight:800;font-family:'Bricolage Grotesque','Space Grotesk',sans-serif}
.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:1px}
/* ---- Breadcrumb ---- */
.crumbs{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);
  margin-bottom:1px;flex-wrap:wrap;line-height:1.2}
.crumbs .sep{opacity:.6}
.crumbs .cur{color:var(--ink-2);font-weight:600}
.content{padding:24px 26px 60px;max-width:1320px;width:100%}
.btn.hamb{display:none}
.collapse-toggle{display:inline-grid;place-items:center;padding:8px}

/* ---- Sidebar recolhida / modo compacto (só ícones) ---- */
.app-shell.collapsed{--sidebar:72px}
.app-shell.collapsed .sidebar .lbl,
.app-shell.collapsed .sidebar .brand .txt,
.app-shell.collapsed .sidebar .navmain .chev,
.app-shell.collapsed .sidebar .subitems{display:none}
.app-shell.collapsed .sidebar .brand{justify-content:center;padding:20px 0 14px}
.app-shell.collapsed .sidebar .nav{padding:10px 10px}
.app-shell.collapsed .sidebar .navmain{justify-content:center;padding:11px 0;gap:0;position:relative}
.app-shell.collapsed .sidebar .navmain .emo{width:auto}
.app-shell.collapsed .sidebar .sidefoot{justify-content:center}
.app-shell.collapsed .sidebar .sidefoot .btn{padding:8px;gap:0}
.app-shell.collapsed .sidebar .sidefoot .lbl{display:none}
/* tooltip ao passar o mouse no modo compacto */
.app-shell.collapsed .sidebar .navmain:hover::after{
  content:attr(title);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);
  background:#0A2018;color:#EAF5EF;font-size:12px;font-weight:600;white-space:nowrap;
  padding:6px 10px;border-radius:8px;border:1px solid var(--rail-line);
  box-shadow:0 8px 28px rgba(0,0,0,.4);z-index:60;pointer-events:none;
}

/* ---- Generic UI ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
/* Cabeçalho de página — título grande estilo app.html */
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.pad{padding:18px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;transition:.12s;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.blue{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--neg);border-color:var(--neg-soft)}
.btn.danger:hover{background:var(--neg-soft)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input,select.input,textarea.input{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;color:var(--ink);outline:none;transition:border .12s,box-shadow .12s;
}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.lbl{font-size:12px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.chip.pos{background:var(--accent-soft);color:var(--accent)}
.chip.neg{background:var(--neg-soft);color:var(--neg)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);cursor:pointer;transition:.12s}
.chip-btn:hover{border-color:var(--accent-soft)}
.chip-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tag{font-size:11px;padding:2px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.hr{height:1px;background:var(--line);border:0;margin:16px 0}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(192px,1fr));gap:14px}
.dash-head{display:flex;align-items:center;gap:8px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 16px;margin-bottom:14px}
.hero-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.hero-wrap{position:relative}
.hero-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);transition:.15s;outline:none}
.hero-card:hover{box-shadow:var(--shadow-lg);border-color:var(--accent-soft)}
.hero-card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow);z-index:41}
.hero-card .hero-top{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:600}
.hero-card .hero-chev{margin-left:auto;opacity:.5;transition:.18s}
.hero-card:hover .hero-chev{opacity:1}
.hero-card .hero-chev.open{transform:rotate(180deg);opacity:1;color:var(--accent)}
.hero-card .hero-val{font-size:25px;font-weight:800;letter-spacing:-.5px;margin-top:8px}
.hero-card .hero-foot{color:var(--muted);font-size:11.5px;margin-top:5px}
.hero-card .hero-val.pos{color:var(--pos)} .hero-card .hero-val.neg{color:var(--neg)} .hero-card .hero-val.warn{color:var(--warn)}
.hero-pop{position:absolute;top:calc(100% - 2px);left:0;right:0;z-index:40;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-lg);padding:8px;max-height:360px;overflow:auto;animation:popin .12s ease}
@keyframes popin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.hero-pop-head{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 8px 3px;border-top:1px solid var(--line);margin-top:4px}
.hero-pop-head:first-child{border-top:0;margin-top:0}
.hero-pop-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 8px;border-radius:8px;font-size:13px}
.hero-pop-row:hover{background:var(--surface-2)}
.hero-pop-row.strong{font-weight:700;background:var(--surface-2)}
.hero-pop-row .hp-l{display:flex;align-items:center;gap:7px;color:var(--ink)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi.clickable{transition:border-color .12s,box-shadow .12s,transform .12s}
.kpi.clickable:hover{border-color:var(--accent);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.kpi .k-label{color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .k-val{font-size:23px;font-weight:800;letter-spacing:-.5px;margin-top:7px}
.kpi .k-foot{font-size:11.5px;margin-top:5px;color:var(--muted)}
.kpi .k-ic{position:absolute;right:13px;top:13px;width:18px;height:18px;opacity:.5}

/* tables */
.tbl-wrap{overflow:auto;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
table.tbl th{
  text-align:left;padding:10px 12px;background:var(--surface-2);color:var(--ink-2);font-weight:600;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;white-space:nowrap;border-bottom:1px solid var(--line);
}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl td.r,table.tbl th.r{text-align:right}
.editable{cursor:pointer;border-bottom:1px dashed transparent}
.editable:hover{border-bottom-color:var(--muted)}

/* charts */
.chart-box{position:relative;height:240px}
.chart-box.tall{height:300px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,14,22,.5);backdrop-filter:blur(2px);z-index:60;display:grid;place-items:center;padding:18px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 40px 90px -20px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.04);width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal.wide{max-width:880px}
.modal h3{margin:0;font-size:16px}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--surface-2)}

/* toast */
.toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:10px;max-width:340px}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;padding:12px 14px;box-shadow:var(--shadow-lg);animation:slidein .2s ease}
.toast.err{border-left-color:var(--neg)} .toast.warn{border-left-color:var(--warn)}
@keyframes slidein{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* dropzone */
.dropzone{border:2px dashed var(--line);border-radius:16px;padding:42px 24px;text-align:center;transition:.15s;background:var(--surface-2)}
.dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}

/* confidence */
.conf{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700}
.conf .bar{width:34px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.conf .bar > i{display:block;height:100%}
.reconcile{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--line)}
.reconcile.ok{background:var(--accent-soft);border-color:transparent}
.reconcile.bad{background:var(--warn-soft);border-color:transparent}
.reconcile.neutral{background:var(--surface-2)}
.dup-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:9px 13px;margin-bottom:12px;font-size:13px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.pager-ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pager-nav{display:flex;align-items:center;gap:3px}
.pager-nav .btn.sm{min-width:30px;padding:5px 8px}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.progress{height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);transition:width .3s}
.progress.over > i{background:var(--neg)}
.progress.warn > i{background:var(--warn)}

.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:8px}
.boot{min-height:100vh;display:grid;place-items:center;text-align:center;
  background:radial-gradient(120% 120% at 60% 10%,#0f4a34 0%,#0a2f22 40%,#06160f 100%);
  color:#9CC4B4;font-size:14px;font-weight:500}
.spin{width:16px;height:16px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
.spin-lg{width:46px;height:46px;border:4px solid var(--accent);border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== TABLET: sidebar fixa e recolhível (rail via botão recolher) ===== */
@media (max-width:1100px) and (min-width:901px){
  :root{--sidebar:232px}
  .content{padding:20px 18px 60px}
  .topbar{padding:12px 18px}
}
/* ===== MOBILE: menu hambúrguer (sidebar off-canvas) ===== */
@media (max-width:900px){
  :root{--sidebar:264px}
  .app-shell.collapsed{--sidebar:264px}
  .collapse-toggle{display:none!important}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  /* no drawer mobile, sempre mostrar rótulos/submenus mesmo se "recolhido" no desktop */
  .app-shell.collapsed .sidebar .lbl,
  .app-shell.collapsed .sidebar .brand .txt,
  .app-shell.collapsed .sidebar .navmain .chev{display:revert}
  .app-shell.collapsed .sidebar .subitems{display:block}
  .app-shell.collapsed .sidebar .navmain{justify-content:flex-start;padding:11px 12px;gap:11px}
  .app-shell.collapsed .sidebar .navmain .emo{width:22px}
  .main{margin-left:0}
  .btn.hamb{display:inline-grid}
  .content{padding:16px 14px 60px}
  .topbar{padding:11px 14px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
}
/* ── v92: Responsividade de formulários ── */
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:700px){
  .form-grid-2,.form-grid-3,.form-grid-auto{grid-template-columns:1fr}
  .btn-group{flex-direction:column}
  .modal-box{max-width:100vw!important;margin:0!important;border-radius:16px 16px 0 0!important;max-height:92vh;overflow-y:auto}
  .modal-scrim{align-items:flex-end!important}
  table.tbl{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
}
/* ── v92: Acessibilidade de modais ── */
.modal-box:focus{outline:none}
[role="dialog"] *:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media print{
  .sidebar,.topbar,.no-print{display:none!important}
  .main{margin:0}.content{padding:0;max-width:none}
  body{background:#fff}
  .print-only{display:block!important}
  /* relatórios: imprime tabelas largas inteiras (sem corte por rolagem) */
  .tbl-wrap{max-height:none!important;overflow:visible!important}
  .tbl.comp th,.tbl.comp td{position:static!important}
  body.print-wide .tbl.comp{font-size:8.5px}
  body.print-wide .report{font-size:11px}
  /* modo "somente estabelecimento": esconde o relatório geral */
  body.print-estab .report{display:none!important}
}
.print-only{display:none}

<div id="root"></div>
<script>
  // pdf.js worker
  if (window['pdfjsLib']) {

<script type="text/babel" data-presets="react">
const {useState,useEffect,useLayoutEffect,useMemo,useRef,useCallback,createContext,useContext} = React;

/* =========================================================================
   1. UTILITÁRIOS
   ========================================================================= */
const SCHEMA_VERSION = 95;
const uid = (p='id') => p+'_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const round2 = n => Math.round((Number(n)+Number.EPSILON)*100)/100;
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));

const BRL = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const NUM = n => (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const PCT = n => (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';

const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const monthKey = iso => (iso||'').slice(0,7);                 // yyyy-mm
const ptDate = iso => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const ptMonth = mk => { if(!mk) return ''; const [y,m]=mk.split('-');
  const nm=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m-1]||''; return `${nm}/${y}`; };
const monthLong = mk => { if(!mk) return '—'; const [y,m]=mk.split('-');
  const nm=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][+m-1]; return nm?`${nm} de ${y}`:'—'; };
const addMonthsISO = (iso,k)=>{ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return '';
  const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+k);              // dia 1 evita estouro (ex.: 31/jan → 03/mar)
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); // grampeia ao último dia do mês
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }; // sem toISOString (evita desvio de fuso)
const addMonthKey = (mk,k)=>{ if(!mk) return ''; const d=new Date(mk+'-01T00:00:00'); if(isNaN(d)) return ''; d.setMonth(d.getMonth()+k); return d.toISOString().slice(0,7); };

// normaliza descrição p/ regras de aprendizado e dedup
const normDesc = s => (s||'').toUpperCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/\d{2}\/\d{2}/g,' ').replace(/\*+/g,' ')
  .replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
// token mais significativo p/ criar regra automática
const learnToken = s => {
  const stop = new Set(['LTDA','ME','EPP','SA','COM','COMERCIO','DE','DA','DO','BR','BRASIL','PAGAMENTO','COMPRA','PARCELA','EIRELI']);
  const w = normDesc(s).split(' ').filter(x=>x.length>=3 && !stop.has(x) && !/^\d+$/.test(x));
  return w.slice(0,2).join(' ') || normDesc(s).slice(0,12);
};

// parse de valor monetário BR ("1.234,56", "-12,90", "12.90", "1,234.56")
function parseMoney(raw){
  if(raw==null) return null;
  let s=String(raw).trim().replace(/r\$|\s|brl/gi,'');
  const neg=/^-/.test(s)|| /-$/.test(s) || /\(/.test(s);
  s=s.replace(/[()\-]/g,'');
  if(!s) return null;
  if(s.includes(',') && s.includes('.')){ // decide separador decimal pelo último
    if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  } else if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s); if(isNaN(n)) return null;
  return round2(neg?-n:n);
}
const fmtMoneyInput = n => (Number(n)||0).toFixed(2);

/* =========================================================================
   CAMADA DE MOVIMENTAÇÕES BANCÁRIAS — Funções centralizadas (v92)
   ========================================================================= */

// Saldo de conta = saldo inicial + entradas − saídas de bankMovements
function calcAccountBalance(accountId, accounts, bankMovements) {
  const acct = (accounts||[]).find(a=>a.id===accountId);
  const initial = Number(acct?.initialBalance||acct?.openingBalance||acct?.balance||0);
  const movements = (bankMovements||[]).filter(m=>m.accountId===accountId);
  const total = movements.reduce((sum,m)=>{
    return m.direction==='entrada' ? sum+Number(m.amount||0) : sum-Number(m.amount||0);
  }, 0);
  return round2(initial + total);
}

// Cria um objeto bankMovement padronizado
function makeBankMovement(fields) {
  const now = new Date().toISOString();
  return {
    id: uid('bm'),
    accountId: null,
    date: todayISO(),
    description: '',
    amount: 0,
    direction: 'saida',
    movementType: 'unclassified',
    transactionId: null,
    incomeId: null,
    transferId: null,
    cardPaymentId: null,
    importId: null,
    source: 'manual',
    reconciliationStatus: 'pending',
    createdAt: now,
    updatedAt: now,
    ...fields,
  };
}

// Detecta pagamento de fatura de cartão com níveis de confiança (v94)
// ALTA: termo de pagamento/débito + (fatura|cartão) — classifica automaticamente
// MÉDIA: emissor + termo de débito/pagamento mas sem "fatura"/"cartão" — sugere, pede confirmação
// BAIXA: só nome do emissor/banco — não classifica como fatura
const CARD_BILL_PAYMENT_TERMS = ['pagamento','pagto','pgto','pag.','debito','débito','deb.','quitacao','quitação','liquidacao','liquidação','deb automatico','deb automático','débito automático','debito automatico'];
const CARD_BILL_INVOICE_TERMS = ['fatura','cartao','cartão','card'];
const CARD_BILL_ISSUERS = ['nubank','itaucard','itau card','credicard','ourocard','bradescard','c6 bank','banco inter','inter ','santander','bradesco','elo card','hipercard','will bank','neon','next bank','pan bank','bmg','sicoob','sicredi','sofisa','modal','agi bank'];
function cardBillConfidence(desc) {
  const d = (desc||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const hasTerm = CARD_BILL_PAYMENT_TERMS.some(t=>d.includes(t.normalize('NFD').replace(/[\u0300-\u036f]/g,'')));
  const hasInvoice = CARD_BILL_INVOICE_TERMS.some(t=>d.includes(t));
  const hasIssuer = CARD_BILL_ISSUERS.some(t=>d.includes(t.normalize('NFD').replace(/[\u0300-\u036f]/g,'')));
  // v94: PIX recebido / transferência / aplicação / resgate NÃO são fatura
  if(/pix\s*(recebido|entrada|credito)|transfer(encia|ência)|aplicac|resgate|recebimento/i.test(d)) return 'low';
  if(hasTerm && hasInvoice) return 'high';   // pagamento/débito + fatura/cartão → alta confiança
  if(hasTerm && hasIssuer) return 'medium';  // pagamento/débito + emissor mas sem "fatura" → média
  return 'low';                              // só emissor ou nada → não classifica
}
function isCardBillPayment(desc) {
  return cardBillConfidence(desc) === 'high';
}

// Tipos de movimentação bancária (v94)
const MOV_TYPES = {
  pagamento_fatura:    { label:'Pagamento de fatura',        impactaSaldo:true,  criaDespesa:false },
  compra_debito:       { label:'Compra no débito',            impactaSaldo:true,  criaDespesa:true  },
  debito_automatico:   { label:'Débito automático',           impactaSaldo:true,  criaDespesa:true  },
  pix_terceiro:        { label:'PIX para terceiro',           impactaSaldo:true,  criaDespesa:true  },
  boleto:              { label:'Boleto / conta paga',         impactaSaldo:true,  criaDespesa:true  },
  transferencia_propria:{ label:'Transferência entre contas', impactaSaldo:true,  criaDespesa:false },
  saque:               { label:'Saque',                       impactaSaldo:true,  criaDespesa:false },
  aplicacao:           { label:'Aplicação / investimento',    impactaSaldo:true,  criaDespesa:false },
  tarifa:              { label:'Tarifa bancária',              impactaSaldo:true,  criaDespesa:true  },
  imposto:             { label:'Imposto / taxa',              impactaSaldo:true,  criaDespesa:true  },
  estorno:             { label:'Estorno / devolução',         impactaSaldo:true,  criaDespesa:false },
  ajuste_saldo:        { label:'Ajuste de saldo',             impactaSaldo:true,  criaDespesa:false },
  entrada:             { label:'Entrada / receita',           impactaSaldo:true,  criaDespesa:false },
  nao_classificado:    { label:'Não classificada',            impactaSaldo:true,  criaDespesa:false },
};

// Classifica automaticamente uma linha do extrato (v94)
function classifyMovement(desc, rawType) {
  if(rawType === 'receita') return { movType:'entrada', confidence:'high' };
  const d = (desc||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const billConf = cardBillConfidence(desc);
  if(billConf === 'high') return { movType:'pagamento_fatura', confidence:'high' };
  if(billConf === 'medium') return { movType:'pagamento_fatura', confidence:'medium' };
  if(/transfer(encia|ência)/.test(d) && /(propri|conta|cc\b|poupan|invest|ted|doc)/.test(d))
    return { movType:'transferencia_propria', confidence:'medium' };
  if(/\baplic(acao|ação|ar)\b|invest(imento)?\b|\bcdb\b|\blci\b|\blca\b|\brdb\b|tesouro\s+direto|poupan/i.test(d))
    return { movType:'aplicacao', confidence:'high' };
  if(/resgate|retirada\s+(invest|aplic|poupan)/i.test(d))
    return { movType:'estorno', confidence:'medium' };
  if(/\bsaque\b|caixa\s*(eletronico|eletrônico|24h)|\batm\b/i.test(d))
    return { movType:'saque', confidence:'high' };
  if(/tarifa|manut(encao|enção)\s+conta|anuidade|taxa\s+adm/i.test(d))
    return { movType:'tarifa', confidence:'high' };
  if(/\biof\b|imposto|\bicsm\b|\biss\b|\birpj\b/i.test(d))
    return { movType:'imposto', confidence:'high' };
  if(/\bdeb(ito)?\s*auto|\bdebit\s*auto|\bd\.?a\.?\b/i.test(d))
    return { movType:'debito_automatico', confidence:'high' };
  if(/\bpix\b/i.test(d)) return { movType:'pix_terceiro', confidence:'high' };
  if(/boleto|pag(amento)?\s+(de\s+)?bol/i.test(d))
    return { movType:'boleto', confidence:'high' };
  if(/estorno|devolu(cao|ção)|reembolso|credito\s+(em|na)\s+conta/i.test(d))
    return { movType:'estorno', confidence:'high' };
  if(rawType === 'despesa') return { movType:'compra_debito', confidence:'low' };
  return { movType:'nao_classificado', confidence:'low' };
}

// Função centralizada de receitas — usada em TODOS os módulos
// Retorna array de { incomeId, date, monthKey, amount, status, source, name }
function getIncomeOccurrences(startISO, endISO, incomes) {
  const result = [];
  const start = new Date((startISO||'2000-01-01')+'T00:00:00');
  const end   = new Date((endISO  ||'2099-12-31')+'T23:59:59');
  for(const inc of (incomes||[])) {
    if(!inc || inc.inactive) continue;
    const isOneTime = !inc.recorrente && !inc.type || inc.type==='avulsa';
    if(isOneTime) {
      const d = new Date((inc.date||inc.startDate||'')+'T00:00:00');
      if(!isNaN(d) && d>=start && d<=end) {
        result.push({incomeId:inc.id, date:(inc.date||inc.startDate), monthKey:monthKey(inc.date||inc.startDate), amount:Number(inc.amount||0), status:'previsto', source:'avulsa', name:inc.name||inc.desc||''});
      }
    } else {
      let cur = new Date((inc.startDate||inc.date||'')+'T00:00:00');
      if(isNaN(cur)) continue;
      const endInc = inc.endDate ? new Date(inc.endDate+'T23:59:59') : new Date('2099-12-31');
      let safety = 0;
      while(cur<=end && cur<=endInc && safety++<1200) {
        if(cur>=start) {
          const mk = cur.toISOString().slice(0,7);
          const ignore = (inc.ignoredMonths||[]).includes(mk) || (inc.skip||[]).includes(mk);
          if(!ignore) {
            const override = (inc.monthlyOverrides||{})[mk];
            const amount = override!=null ? Number(override) : Number(inc.amount||0);
            const confirmed = (inc.confirmedMonths||{})[mk] || (inc.received||{})[mk];
            result.push({incomeId:inc.id, date:cur.toISOString().slice(0,10), monthKey:mk, amount, status:confirmed?'confirmado':'previsto', source:'recorrente', name:inc.name||inc.desc||''});
          }
        }
        cur = new Date(cur.getFullYear(), cur.getMonth()+1, cur.getDate());
      }
    }
  }
  return result;
}

function incomeOccurrencesForMonth(mk, incomes) {
  const [y,m] = (mk||'').split('-').map(Number);
  if(!y||!m) return [];
  const last = new Date(y, m, 0).getDate();
  return getIncomeOccurrences(`${mk}-01`, `${mk}-${String(last).padStart(2,'0')}`, incomes);
}

// Soma total de receitas num período usando a fonte centralizada (v93)
function getIncomeTotalForPeriod(startISO, endISO, incomes) {
  return round2(getIncomeOccurrences(startISO, endISO, incomes)
    .reduce((sum, item) => sum + Number(item.amount || 0), 0));
}
// Soma total de receitas num mês usando a fonte centralizada (v93)
function getIncomeTotalForMonth(mk, incomes) {
  const [y,m] = (mk||'').split('-').map(Number);
  if(!y||!m) return 0;
  const last = new Date(y, m, 0).getDate();
  return getIncomeTotalForPeriod(`${mk}-01`, `${mk}-${String(last).padStart(2,'0')}`, incomes);
}

// Verifica existência de bankMovement por referência — evita duplicidade (v93)
function findExistingBankMovementReference(bankMovements, refField, refValue, accountId, direction) {
  return (bankMovements||[]).find(m =>
    m[refField] === refValue &&
    (!accountId || m.accountId === accountId) &&
    (!direction || m.direction === direction)
  ) || null;
}

// Matching de cartão por confiança — evita fallback automático em cards[0]
function matchCardConfidence(hint, cards) {
  if(!hint || !(cards||[]).length) return {cardId:null, confidence:0, matchedBy:'none'};
  const h = String(hint).toLowerCase();
  // tenta dígitos finais
  const digits = (hint||'').match(/\d{4}$/)?.[0];
  if(digits) {
    const byDigits = cards.find(c=>(c.lastDigits||c.last||'')===digits && !c.archived);
    if(byDigits) return {cardId:byDigits.id, confidence:0.95, matchedBy:'last4'};
  }
  // tenta nome/banco/apelido
  for(const c of cards.filter(x=>!x.archived)) {
    const names = [c.name||'', c.bank||'', c.nickname||'', c.apelido||''].join(' ').toLowerCase();
    if(names && h && (names.includes(h.slice(0,6)) || h.includes((c.name||'').toLowerCase().slice(0,6)))) {
      return {cardId:c.id, confidence:0.75, matchedBy:'name'};
    }
  }
  return {cardId:null, confidence:0, matchedBy:'none'};
}

// Chave segura para agrupamento de parcelamentos (v92)
function buildInstallmentKey(cardId, desc, amount, total, current, billingMonthKey) {
  const normalDesc = (desc||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,30);
  // mês estimado da primeira parcela = mês da fatura − parcela atual + 1
  const [y,m] = (billingMonthKey||'2000-01').split('-').map(Number);
  const firstMonth = new Date(y, m-1-(current-1), 1);
  const firstMk = `${firstMonth.getFullYear()}-${String(firstMonth.getMonth()+1).padStart(2,'0')}`;
  return `${cardId||''}|${normalDesc}|${round2(amount)}|${total}|${firstMk}`;
}

// Auditoria de vínculos quebrados (registros órfãos)
function auditOrphanLinks(db) {
  const issues = [];
  const cardIds = new Set((db.cards||[]).map(c=>c.id));
  const acctIds = new Set((db.accounts||[]).map(a=>a.id));
  const catIds  = new Set((db.categories||[]).map(c=>c.id));
  const grpIds  = new Set((db.transactions||[]).filter(t=>t.installmentGroupId).map(t=>t.installmentGroupId));

  (db.transactions||[]).forEach(t=>{
    if(t.cardId && !cardIds.has(t.cardId))
      issues.push({type:'cardId_missing', ref:'transaction', id:t.id, desc:t.descOrig||t.descPad, value:t.cardId});
    if(t.accountId && !acctIds.has(t.accountId))
      issues.push({type:'accountId_missing', ref:'transaction', id:t.id, desc:t.descOrig||t.descPad, value:t.accountId});
    if(t.categoryId && !catIds.has(t.categoryId))
      issues.push({type:'categoryId_missing', ref:'transaction', id:t.id, desc:t.descOrig||t.descPad, value:t.categoryId});
  });
  (db.bankMovements||[]).forEach(m=>{
    if(m.accountId && !acctIds.has(m.accountId))
      issues.push({type:'accountId_missing', ref:'bankMovement', id:m.id, desc:m.description, value:m.accountId});
  });
  return issues;
}

// Migração para schema v92
function migrateToV92(data) {
  if((data.schemaVersion||0) >= 92) return data;
  try {
    localStorage.setItem('hannah_backup_pre_v92', JSON.stringify({
      version: data.schemaVersion||0,
      timestamp: new Date().toISOString(),
      partial: true
    }));
  } catch(e) {}

  if(!data.bankMovements) data.bankMovements = [];
  if(!data.paymentRecords) data.paymentRecords = [];
  if(!data.attachments) data.attachments = [];

  (data.accounts||[]).forEach(a=>{ if(a.archived===undefined) a.archived=false; if(a.active===undefined) a.active=true; });
  (data.cards||[]).forEach(c=>{ if(c.archived===undefined) c.archived=false; if(c.active===undefined) c.active=true; });

  const existingTxRefs = new Set((data.bankMovements||[]).filter(m=>m.transactionId).map(m=>m.transactionId));
  (data.transactions||[]).forEach(t=>{
    if(existingTxRefs.has(t.id) || !t.accountId) return;
    if(t.amount && t.date) {
      data.bankMovements.push(makeBankMovement({
        accountId: t.accountId, date: t.date,
        description: t.descOrig||t.descPad||'',
        amount: Math.abs(Number(t.amount)), direction: 'saida',
        movementType: 'expense', transactionId: t.id,
        importId: t.fileId||null, source: 'migration_91_to_92',
        reconciliationStatus: 'reconciled',
      }));
    }
  });

  data.schemaVersion = 92;
  return data;
}

// Migração para schema v93 — idempotente, com backup completo (v93)
function migrateToV93(data) {
  if((data.metadata||{}).schemaVersion >= 93) return data;
  const now = new Date().toISOString();

  // ── Backup completo antes de migrar (item 11) ──
  try {
    const backupKeys = ['transactions','cards','accounts','acctMoves','transfers','assets','goals',
      'categories','rules','fixed','incomes','budgets','renegotiations','notes','splits',
      'auditIncomes','bankMovements','paymentRecords','settings','metadata'];
    const backupData = {};
    backupKeys.forEach(k=>{ if(data[k]!==undefined) backupData[k]=data[k]; });
    const backup = { createdAt:now, sourceVersion:(data.metadata||{}).schemaVersion||data.schemaVersion||92,
      targetVersion:93, data:backupData };
    localStorage.setItem('hannah_backup_pre_v93', JSON.stringify(backup));
  } catch(e) { console.warn('[HANNAH] Backup pre-v93 falhou:', e); }

  if(!data.bankMovements) data.bankMovements = [];
  if(!data.paymentRecords) data.paymentRecords = [];
  if(!data.attachments) data.attachments = [];
  if(!data.metadata) data.metadata = {};

  // ── Migrar acctMoves antigos para bankMovements (item 12) ──
  const existingAcctRefs = new Set((data.bankMovements||[]).filter(m=>m.acctMoveId).map(m=>m.acctMoveId));
  (data.acctMoves||[]).forEach(m=>{
    if(existingAcctRefs.has(m.id)) return;
    const dir = (m.amount||0) >= 0 ? 'entrada' : 'saida';
    data.bankMovements.push(makeBankMovement({
      accountId: m.accountId, date: m.date||now.slice(0,10),
      description: m.desc||(m.kind||'Movimento'),
      amount: Math.abs(Number(m.amount||0)), direction: dir,
      movementType: dir==='entrada'?'income':'expense',
      acctMoveId: m.id, source: 'migration_92_to_93',
      reconciliationStatus: 'reconciled',
    }));
  });

  // ── Migrar transfers sem bankMovements (item 12) ──
  const existingTrfRefs = new Set((data.bankMovements||[]).filter(m=>m.transferId).map(m=>m.transferId+'|'+m.direction));
  (data.transfers||[]).forEach(t=>{
    if(!existingTrfRefs.has(t.id+'|saida') && t.fromId) {
      data.bankMovements.push(makeBankMovement({
        accountId: t.fromId, date: t.date, description: 'Transferência enviada'+(t.desc?' · '+t.desc:''),
        amount: Math.abs(Number(t.amount||0)), direction: 'saida', movementType: 'transfer_out',
        transferId: t.id, source: 'migration_92_to_93', reconciliationStatus: 'reconciled',
      }));
    }
    if(!existingTrfRefs.has(t.id+'|entrada') && t.toId) {
      data.bankMovements.push(makeBankMovement({
        accountId: t.toId, date: t.date, description: 'Transferência recebida'+(t.desc?' · '+t.desc:''),
        amount: Math.abs(Number(t.amount||0)), direction: 'entrada', movementType: 'transfer_in',
        transferId: t.id, source: 'migration_92_to_93', reconciliationStatus: 'reconciled',
      }));
    }
  });

  // ── Migrar transactions com accountId que ainda não têm bankMovement (item 12) ──
  const existingTxRefs = new Set((data.bankMovements||[]).filter(m=>m.transactionId).map(m=>m.transactionId+'|'+m.accountId));
  (data.transactions||[]).forEach(t=>{
    if(!t.accountId || !t.amount || !t.date) return;
    const key = t.id+'|'+t.accountId;
    if(existingTxRefs.has(key)) return;
    const isBill = cardBillConfidence(t.descOrig||'') === 'high';
    data.bankMovements.push(makeBankMovement({
      accountId: t.accountId, date: t.date,
      description: t.descOrig||t.descPad||'',
      amount: Math.abs(Number(t.amount)), direction: 'saida',
      movementType: isBill ? 'card_bill_payment' : (t.type==='receita'?'income':'expense'),
      transactionId: isBill ? null : t.id,
      importId: t.fileId||null, source: 'migration_92_to_93',
      reconciliationStatus: 'reconciled',
    }));
  });

  // ── Metadata persistente (item 10) ──
  const prevMigs = (data.metadata.migrations||[]);
  if(!prevMigs.includes('92_to_93')) prevMigs.push('92_to_93');
  data.metadata = {
    schemaVersion: 93, migratedAt: now,
    migrations: prevMigs,
  };
  data.schemaVersion = 93;
  return data;
}

// Restaurar backup pré-v95
function restoreBackupPreV95() {

    if(!raw) return {ok:false,msg:'Backup pré-v95 não encontrado.'};
    const bk=JSON.parse(raw);
    return {ok:true,data:bk,backedAt:bk._backupAt};

  }
}

function migrateToV94(data) {
  if((data.metadata||{}).schemaVersion >= 94) return data;
  const now = new Date().toISOString();

  if(!data.bankMovements) data.bankMovements = [];
  if(!data.paymentRecords) data.paymentRecords = [];
  if(!data.metadata) data.metadata = {};

  // Identificar possíveis pagamentos de fatura lançados como despesas
  const auditItems = data.auditV94Items || [];
  (data.transactions||[]).forEach(t=>{
    if(t.type!=='despesa') return;
    if(t.isBillPayment) return; // já marcado
    const conf = cardBillConfidence(t.descOrig||'');
    if(conf==='high'||conf==='medium'){
      const alreadyFlagged = auditItems.some(a=>a.transactionId===t.id&&a.type==='possible_bill_payment_as_expense');
      if(!alreadyFlagged){
        auditItems.push({
          id:uid('a94'),type:'possible_bill_payment_as_expense',
          description:'Possível pagamento de fatura lançado como despesa: '+(t.descOrig||'')+'  ·  R$ '+(Number(t.amount||0).toFixed(2)),
          transactionId:t.id,amount:t.amount,date:t.date,confidence:conf,
          status:'pending',createdAt:now,
        });
      }
    }
  });
  data.auditV94Items = auditItems;

  const prevMigs = (data.metadata.migrations||[]);
  if(!prevMigs.includes('93_to_94')) prevMigs.push('93_to_94');
  data.metadata = { ...(data.metadata||{}), schemaVersion:94, migratedAt:now, migrations:prevMigs };
  data.schemaVersion = 94;
  return data;
}

// ── migrateToV95: backup real + correções v95 ──────────────────────────────────
function migrateToV95(data) {
  if((data.metadata||{}).schemaVersion >= 95) return data;
  const now = new Date().toISOString();

  // Backup real antes de migrar
  try {
    const backupKeys = ['transactions','accounts','cards','transfers','bankMovements',
      'paymentRecords','incomes','fixed','renegotiations','budgets','categories',
      'auditIncomes','auditV94Items','settings','metadata'];
    const backup = {};
    backupKeys.forEach(k=>{ if(data[k]!==undefined) backup[k]=JSON.parse(JSON.stringify(data[k])); });
    backup._backupAt = now;
    backup._backupVersion = 94;
    localStorage.setItem('hannah_backup_pre_v95', JSON.stringify(backup));
  } catch(e) {
    console.error('[HANNAH v95] Backup falhou — migracao abortada:', e);
    return data; // abortar se backup falhar
  }

  if(!data.bankMovements) data.bankMovements = [];
  if(!data.paymentRecords) data.paymentRecords = [];
  if(!data.metadata) data.metadata = {};

  // v95: garantir que receitas em auditIncomes com bankMovement ausente sejam auditadas
  const auditItems = data.auditV94Items || [];
  const existingBmRefs = new Set((data.bankMovements||[]).filter(m=>m.movementType==='income'&&m.importId).map(m=>m.importId+'|'+m.accountId));
  (data.auditIncomes||[]).forEach(ai=>{
    if(!ai.accountId) return; // sem conta, não podemos criar movimento
    const key=(ai.fileId||ai.importId||ai.id)+'|'+(ai.accountId||'');
    if(!existingBmRefs.has(key)){
      const alreadyFlagged=auditItems.some(a=>a.auditIncomeId===ai.id&&a.type==='income_without_bankmovement');
      if(!alreadyFlagged){
        auditItems.push({
          id:uid('a95'),type:'income_without_bankmovement',
          description:'Receita importada sem bankMovement: '+(ai.descOrig||'')+'  ·  R$'+(Number(ai.amount||0).toFixed(2)),
          auditIncomeId:ai.id,amount:ai.amount,date:ai.date,accountId:ai.accountId,
          status:'pending',createdAt:now,suggestedAction:'Criar bankMovement de entrada para esta receita',
        });
      }
    }
  });

  // v95: transferências sem par de bankMovements → auditoria
  const bmByTrf={};
  (data.bankMovements||[]).filter(m=>m.transferId).forEach(m=>{
    if(!bmByTrf[m.transferId]) bmByTrf[m.transferId]={in:0,out:0};
    if(m.direction==='entrada') bmByTrf[m.transferId].in++;
    else bmByTrf[m.transferId].out++;
  });
  (data.transfers||[]).forEach(t=>{
    const pair=bmByTrf[t.id];
    if(!pair||pair.in<1||pair.out<1){
      const already=auditItems.some(a=>a.transferId===t.id&&a.type==='transfer_without_bankmovement');
      if(!already){
        auditItems.push({
          id:uid('a95'),type:'transfer_without_bankmovement',
          description:'Transferência exibida sem bankMovement: '+(t.description||'')+'  ·  R$'+(Number(t.amount||0).toFixed(2)),
          transferId:t.id,amount:t.amount,date:t.date,
          status:'pending',createdAt:now,suggestedAction:'Criar par de bankMovements para esta transferência',
        });
      }
    }
  });

  // v95: bankMovement card_bill_payment sem referenceId → auditoria
  (data.bankMovements||[]).filter(m=>m.movementType==='card_bill_payment'&&!m.referenceId).forEach(m=>{
    const already=auditItems.some(a=>a.bankMovementId===m.id&&a.type==='bill_payment_without_reference');
    if(!already){
      auditItems.push({
        id:uid('a95'),type:'bill_payment_without_reference',
        description:'Pagamento de fatura sem fatura vinculada: '+(m.description||'')+'  ·  R$'+(Number(m.amount||0).toFixed(2)),
        bankMovementId:m.id,amount:m.amount,date:m.date,accountId:m.accountId,
        status:'pending',createdAt:now,suggestedAction:'Vincular a uma fatura de cartão',
      });
    }
  });

  data.auditV94Items = auditItems;

  const prevMigs = (data.metadata.migrations||[]);
  if(!prevMigs.includes('94_to_95')) prevMigs.push('94_to_95');
  data.metadata = { ...(data.metadata||{}), schemaVersion:95, migratedAt:now, migrations:prevMigs };
  data.schemaVersion = 95;
  return data;
}

const collatorPT = new Intl.Collator('pt-BR',{sensitivity:'base',numeric:true});
const catCmp = (a,b)=>collatorPT.compare(((a&&a.name)||'').trim(), ((b&&b.name)||'').trim());
const sortCats = list => [...(list||[])].sort(catCmp).map(c=>(c&&c.subs&&c.subs.length)
  ? {...c, subs:[...new Set(c.subs)].sort((x,y)=>collatorPT.compare(x||'',y||''))}
  : c);
// Normaliza nome p/ detecção de duplicidade (sem acento, sem caixa, sem espaços extras).
const normName = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
// (§5) Anos disponíveis: 2000–2050 ∪ ano atual ∪ anos presentes nos dados (mais recentes primeiro).
const yearOptions = (extra)=>{ const ys=new Set(); for(let y=2000;y<=2050;y++) ys.add(String(y)); ys.add(String(new Date().getFullYear())); (extra||[]).forEach(y=>{ if(y) ys.add(String(y)); }); return [...ys].sort().reverse(); };

let _syncCb=null;       // callback para notificar o Provider sobre o status de sincronização
let _user=null;         // uid do usuário logado na nuvem (null = modo local)
let _pendingQueue=0;    // contador de operações de sync pendentes (v92)
const LS_OK = (()=>{ try{ const k='__mcf_probe__'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); return true; }catch(e){ return false; } })();
const lsKey = k => _user ? `u:${_user}:${k}` : k;
const store = {
  setUser(u){ if(u!==_user){ for(const kk in memDB) delete memDB[kk]; } _user=u||null; },
  // grava só localmente (usado ao baixar dados da nuvem, sem reenviar)
  setLocal(k,v){ memDB[lsKey(k)]=v; try{ if(LS_OK) window.localStorage.setItem(lsKey(k), JSON.stringify(v)); }catch(e){} },
  // ordem de leitura: localStorage (cache/local) -> window.storage (ambiente Claude) -> memória
  async get(k){
    try{ if(LS_OK){ const v=window.localStorage.getItem(lsKey(k)); if(v!=null) return JSON.parse(v); } }catch(e){}
    try{ if(!_user && window.storage){ const r=await window.storage.get(k); if(r) return JSON.parse(r.value); } }catch(e){}
    return memDB[lsKey(k)];
  },
  // grava em todas as camadas + nuvem (se logado) — v92: fila com retry
  async set(k,v){
    store.setLocal(k,v);
    try{ if(!_user && window.storage){ await window.storage.set(k, JSON.stringify(v), false); } }catch(e){}
    if(_user){
      _pendingQueue++;
      if(_syncCb) _syncCb('saving',null,{pending:_pendingQueue});
      const attempt = async (retries=3, delay=800) => {
        try {
          await cloud.pushKey(_user,k,v);
          _pendingQueue=Math.max(0,_pendingQueue-1);
          // v93: nunca mostrar 'idle/salvo' se ainda há operações pendentes
          if(_syncCb){ const hasPending=_pendingQueue>0; _syncCb(hasPending?'saving':'saved',null,{pending:_pendingQueue}); if(!hasPending){ const t=setTimeout(()=>{ if(_syncCb&&_pendingQueue===0) _syncCb('idle',null,{pending:0}); },3000); } }

const BANK_SIGS = [

function detectBank(text){
  const t=(text||'').toLowerCase();
  for(const s of BANK_SIGS){ if(s.k.some(w=>t.includes(w))) return s.bank; }
  return 'Desconhecido';
}
function detectFinal(text){
  const m=(text||'').match(/final(?:\s+do\s+cart[aã]o)?\s*[:\-]?\s*(\d{4})/i)
       || (text||'').match(/\b\d{4}\s?\*{2,}\s?\*{2,}\s?(\d{4})\b/)
       || (text||'').match(/\*{4,}\s?(\d{4})\b/);
  return m? m[1]: null;
}
function detectTotals(text){
  const t=text||'';
  const grab = re => { const m=t.match(re); return m? parseMoney(m[1]): null; };
  // prioriza o total REAL da fatura; evita "anterior" e simulações de parcelamento ("Total a pagar" do Nubank)
  const total =
       grab(/total\s+desta\s+fatura[^\d\-]{0,40}?(-?[\d.,]+)/i)
    || grab(/total\s+da\s+fatura\s+atual[^\d\-]{0,40}?(-?[\d.,]+)/i)
    || grab(/valor\s+total\s+desta\s+fatura[^\d\-]{0,40}?(-?[\d.,]+)/i)
    || grab(/fatura[^.\d]{0,30}?no\s+valor\s+de[^\d\-]{0,10}(-?[\d.,]+)/i)   // Nubank cabeçalho
    || grab(/pagamento\s+total\s+da\s+fatura[^\d\-]{0,20}(-?[\d.,]+)/i)       // Nubank opção 1
    || grab(/total\s+da\s+fatura(?!\s+anterior)[^\d\-]{0,40}?(-?[\d.,]+)/i)   // Bradesco/genérico
    || grab(/total\s+de\s+compras\s+de\s+todos[^\d]{0,60}?(-?[\d.,]+)/i)      // Nubank resumo
    || grab(/total\s+a\s+pagar(?![^\n]*ao\s+ano)[^\d\-]{0,20}(-?[\d.,]+)/i)   // por último
    || grab(/valor\s+total(?!\s+da\s+fatura\s+anterior|\s+financiado)[^\d\-]{0,20}(-?[\d.,]+)/i);
  return {
    total,
    venc: (t.match(/vencimento[^\d]*(\d{2}\/\d{2}\/\d{2,4})/i)||[])[1] || null,
    fech: (t.match(/fechamento[^\d]*(\d{2}\/\d{2}\/\d{2,4})/i)||[])[1] || null,
  };
}

// 4.2 — parser genérico de linha de fatura BR
const RE_LINE = /^(\d{2}[\/.]\d{2}(?:[\/.]\d{2,4})?)\s+(.+?)\s+(-?\s?R?\$?\s?[\d.]+,\d{2})\s*-?\s*$/;
const PT_MON={jan:'01',fev:'02',mar:'03',abr:'04',mai:'05',jun:'06',jul:'07',ago:'08',set:'09',out:'10',nov:'11',dez:'12'};
const MESES_PT=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const RE_LINE2 = /^(\d{1,2})\s+(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\.?\s+(.+?)\s+(-?\s?R?\$?\s?[\d.]+,\d{2})\s*-?\s*$/i;
const RE_PARC = /(?:parc(?:ela)?\.?\s*)?(\d{1,2})\s*[\/de]{1,3}\s*(\d{1,2})\b/i;
// extrai parcela "atual/total" com prioridade: palavra-chave > "NN de NN" > "NNxNN" > "NN/NN" (último recurso).
// evita confundir mês de referência (06/2026) e datas; faixa válida 2..72 e atual<=total.
function detectParcela(s){
  if(!s) return [null,null];
  const ok=(c,t)=>{ c=+c; t=+t; return (t>=2 && t<=72 && c>=1 && c<=t) ? [c,t] : null; };
  let m = s.match(/parc(?:ela)?s?\.?\s*(\d{1,2})\s*(?:\/|\s+de\s+|\s*-\s*)\s*(\d{1,2})\b/i) // "parcela 03/10", "parc 3 de 10"
       || s.match(/\b(\d{1,2})\s+de\s+(\d{1,2})\b/i)        // "3 de 10"
       || s.match(/\b(\d{1,2})\s*x\s*(\d{1,2})\b/i)         // "03x10"
       || s.match(/\b(\d{1,2})\s*\/\s*(\d{1,2})(?![\/.\d])/); // "03/10" puro (não colado a /, . ou dígito → não é data/ano)
  if(!m) return [null,null];
  return ok(m[1],m[2]) || [null,null];
}
const RE_PAY  = /(pagamento|pgto).*(fatura|recebido|efetuado)|cr[eé]dito de pagamento|saldo anterior/i;
const RE_REV  = /(estorno|devolu[cç][aã]o|reembolso|cr[eé]dito)/i;
const RE_INTL = /(d[oó]lar|usd|us\$|internacional|iof)/i;

function isoFromBR(d, fallbackYear){
  const p=d.replace(/\./g,'/').split('/');
  let yy = p[2]; if(!yy) yy=fallbackYear; if(yy && yy.length===2) yy='20'+yy;
  return `${yy}-${String(p[1]).padStart(2,'0')}-${String(p[0]).padStart(2,'0')}`;
}

function parseTextLayout(text){
  // ano: prioriza data DD/MM/AAAA; senão um 20xx solto; nunca pega de CNPJ (.../0001-58)
  const year = (text.match(/\d{2}[\/.]\d{2}[\/.](20\d{2})/)||[])[1]
            || (text.match(/\b(20\d{2})\b/)||[])[1]
            || String(new Date().getFullYear());
  const lines = text.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean)
    // separa DUAS transações coladas na mesma linha (layout em colunas): "...,XX 22/05 MP... 17,50"
    .flatMap(l=>l.replace(/(,\d{2})\s+(?=(?:\d{2}[\/.]\d{2}|\d{1,2}\s+(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez))\s+[A-Za-zÀ-ÿ*])/gi,'$1\n').split('\n'));
  const out=[];
  let skipSection=false, pendingDate=null;
  // versão "achatada" (sem espaços/acentos) p/ detectar seções mesmo com extração quebrada ("pr ó ximas")
  const flat=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'');
  const RE_FUTURE_FLAT=/proximasfaturas|demaisfaturas|lancamentosfuturos|parcelasavencer|proximasparcelas|gastosprogramados|comprasparceladas-?proxim/;
  const RE_CURRENT_FLAT=/lancamentos|comprasdoperiodo|comprasnacionais|comprasinternacionais|movimenta|despesasdoper|transacoes/;
  const RE_DATE_NUM=/^(\d{2}[\/.]\d{2}(?:[\/.]\d{2,4})?)(?:\s+(.*))?$/;
  const RE_DATE_TXT=/^(\d{1,2})\s+(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\.?(?:\s+(.*))?$/i;
  const RE_MONEY=/-?\s?(?:R\$|\$)?\s?\d{1,3}(?:\.\d{3})*,\d{2}/g;
  const RE_SKIP=/(^|\s)(limite|total\s+(da|desta|dos|de)\b|saldo\s+(financiado|anterior|devedor|em\s+aberto)|lan[çc]amentos\s+atuais|fatura\s+anterior|cr[eé]dito\s+dispon|pagamento\s+m[ií]nimo|valor\s+total|encargos\s+(cobrados|financeiros)|juros\s+(do\s+rotativo|m[aá]ximos|da\s+compra)|cet\b|i\.?o\.?f\.?\s|vencimento|fechamento)/i;

  for(const line of lines){
    // identifica data no início (data pode vir sem nada após, em coluna separada)
    let dateISO=null, rest=null;
    const dn=line.match(RE_DATE_NUM);
    if(dn){ dateISO=isoFromBR(dn[1], year); rest=dn[2]||''; }
    else { const dt=line.match(RE_DATE_TXT);
      if(dt){ dateISO=`${year}-${PT_MON[dt[2].toLowerCase()]||'01'}-${String(dt[1]).padStart(2,'0')}`; rest=dt[3]||''; } }

    // corta texto de NOTA colado depois do valor (fusão de colunas à direita)
    if(rest) rest=rest.replace(/\s+(%\s*sobre|ao\s+contratar|caso\s+(voc[êe]|queira)|esses\s+s[ãa]o|os\s+juros|limite\s+m[aá]ximo|juros\s+e\s+encargos|simula[çc][ãa]o|fique\s+atento|pr[eé]vis[ãa]o\s+para).*/i,'');

    let monies = rest!=null ? rest.match(RE_MONEY) : null;

    // linha só com DATA (sem valor): guarda para juntar com a próxima linha (layout em colunas)
    if(dateISO && (!monies||!monies.length)){
      // se o "rest" tiver texto (descrição parcial), guarda junto
      pendingDate={iso:dateISO, rest:rest||''};
      continue;
    }
    // linha SEM data mas COM valor, havendo data pendente -> junta (data numa linha, valor em outra)
    if(!dateISO && pendingDate){
      const mm=line.match(RE_MONEY);
      if(mm&&mm.length){ dateISO=pendingDate.iso; rest=(pendingDate.rest?pendingDate.rest+' ':'')+line; monies=mm; }
      pendingDate=null;
    }

    const isTx = !!(dateISO && monies && monies.length);
    if(!isTx){
      const f=flat(line);
      if(RE_FUTURE_FLAT.test(f) && out.length>0) skipSection=true;
      else if(RE_CURRENT_FLAT.test(f)) skipSection=false;
      continue;
    }
    if(skipSection) continue;

    const isFuture=/demaisfaturas|proximasfaturas/.test(flat(rest));
    const valStr = isFuture ? monies[0] : monies[monies.length-1];
    let val=parseMoney(valStr);
    if(val==null) continue;

    // descrição: tudo antes do valor usado, sem rótulos/valores residuais e máscaras de cartão
    let desc=rest.slice(0, rest.indexOf(valStr)).trim();
    if(!desc) desc=rest;
    desc=desc.replace(RE_MONEY,'')
            .replace(/\s*(demais|pr[oó]ximas)\s+faturas.*/i,'')
            .replace(/[•·]{2,}\s*\d{0,4}/g,'')         // máscara "•••• 8540"
            .replace(/\s+/g,' ').trim();

    // descarta linhas de RESUMO/limite e linhas SEM descrição real (ex.: linha do limite R$22.500)
    const letters=(desc.match(/[A-Za-zÀ-ÿ]/g)||[]).length;
    if(RE_SKIP.test(desc) || letters<2) continue;

    let type='despesa', conf=0.8;
    const credit=/-\s*$/.test(rest) || val<0;
    if(/pagamento|pagto|pag\.\s*receb/i.test(rest) || RE_PAY.test(line)){ type='pagamento'; conf=0.7; }
    else if(RE_REV.test(rest) || (credit && /estorno|reembolso|devolu|cr[eé]dito/i.test(rest))){ type='estorno'; conf=0.7; }

    let [cur,tot]=detectParcela(desc); if(tot==null){ [cur,tot]=detectParcela(rest); }

    out.push({
      date:dateISO, descOrig:desc, amount:Math.abs(val), type,
      installmentCurrent:cur, installmentTotal:tot,
      isInternational:RE_INTL.test(line), confidence:conf,
    });
  }
  return out;
}

// 4.2b — parser de EXTRATO (camada de texto / OCR), genérico p/ layout Itaú e afins.
// Cada LINHA visual = um lançamento: data líder dd/mm/aaaa + descrição + valor (com sinal).
// Linhas de SALDO são descartadas; o sinal numérico define entrada(receita)/saída(despesa).
function parseStatementText(text){
  const STMT_DATE=/^(\d{2})[\/.](\d{2})[\/.](\d{2,4})\b\s*(.*)$/;
  const STMT_MONEY=/-?\d{1,3}(?:\.\d{3})*,\d{2}/g;
  const isSaldo=s=>/saldo\s+do\s+dia|saldo\s+em\s+conta|limite\s+da\s+conta/i.test(s);
  const lines=text.split(/\r?\n/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const out=[];
  let pending=null; // p/ layout em colunas: data numa linha, valor em outra
  for(const line of lines){
    const m=line.match(STMT_DATE);
    let dateISO=null, rest=null;
    if(m){ dateISO=isoFromBR(`${m[1]}/${m[2]}/${m[3]}`); rest=m[4]||''; }
    // linha de saldo nunca é movimentação (vale tanto p/ linha com data quanto sem)
    if(isSaldo(line)){ pending=null; continue; }
    const monies = (rest!=null?rest:line).match(STMT_MONEY);
    if(dateISO && (!monies||!monies.length)){ pending={iso:dateISO,rest:rest||''}; continue; }
    if(!dateISO && pending && monies && monies.length){ dateISO=pending.iso; rest=(pending.rest?pending.rest+' ':'')+line; pending=null; }
    if(!dateISO || !monies || !monies.length) continue;
    const valStr=monies[monies.length-1];            // valor da movimentação (coluna "valor")
    const val=parseMoney(valStr);
    if(val==null || val===0) continue;
    let desc=rest.slice(0, rest.lastIndexOf(valStr)).trim();
    if(!desc) desc=rest.replace(STMT_MONEY,'').trim();
    const letters=(desc.match(/[A-Za-zÀ-ÿ]/g)||[]).length;
    if(letters<2) continue;                          // descarta linhas sem descrição real
    out.push({ date:dateISO, descOrig:desc, amount:Math.abs(val),
      type: val<0?'despesa':'receita', confidence:0.95, installmentTotal:1 });
  }
  return out;
}

// Heurística: a linha do extrato parece um PAGAMENTO DE FATURA DE CARTÃO?
// Esses débitos costumam duplicar a fatura importada à parte (as compras já entram
// item a item). Conservador de propósito — só sinaliza casos claros. Função pura.
function looksLikeCardBill(desc){
  const d=String(desc||'');
  if(/pag(amento|to)?\b/i.test(d) && /fatura|cart[aã]o/i.test(d)) return true;       // "pagamento de fatura/cartão"
  if(/\bpag(amento|to)?\s+boleto\b/i.test(d) && /bradescard|itaucard|credicard|nubank|nu\s+pagamentos|c6\b|will\s+bank|ourocard|elocard/i.test(d)) return true; // boleto p/ emissor de cartão
  return false;
}

async function callClaude(content, system, apiKey, model, attempt){
  attempt=attempt||0;
  let res;
  try{
    res = await fetchTimeout("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{
        "content-type":"application/json",
        "x-api-key":(apiKey||'').trim(),
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body: JSON.stringify({
        model:(model||'claude-sonnet-4-6').trim(), max_tokens:8192, temperature:0,
        system: system,
        messages:[{role:"user",content}]
      })
    }, 90000);
  }catch(netErr){ throw new Error(netErr.name==='AbortError'?'CLAUDE 504: tempo-limite excedido':'Failed to fetch'); }
  if(!res.ok){
    let d=''; try{ d=(await res.json()).error?.message||''; }catch(e){}
    if((res.status===429||res.status===529||res.status===500||res.status===503) && attempt<3){ await _sleep(1500*(attempt+1)); return callClaude(content,system,apiKey,model,attempt+1); }
    throw new Error('CLAUDE '+res.status+(d?': '+d:''));
  }
  const data=await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
function safeJSON(txt){
  if(!txt) return null;
  let t=txt.replace(/```json|```/g,'').trim();
  const a=t.indexOf('['), b=t.lastIndexOf(']');
  if(a>=0&&b>a) t=t.slice(a,b+1);
  try{ return JSON.parse(t); }catch(e){ return null; }
}

const _sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function callGemini(parts, apiKey, model, attempt, systemPrompt){
  attempt=attempt||0;
  const sys=systemPrompt||GEMINI_PROMPT;
  const m=(model||'gemini-2.5-flash').trim();

    res=await fetchTimeout(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(apiKey)}`,{
      method:'POST', headers:{'Content-Type':'application/json'},

        generationConfig:{temperature:0,maxOutputTokens:8192,responseMimeType:'application/json'}

  }catch(netErr){ throw new Error(netErr.name==='AbortError'?'GEMINI 504: tempo-limite excedido':'Failed to fetch'); }

    if((res.status===503||res.status===429||res.status===500) && attempt<4){
      await _sleep(1500*(attempt+1));
      return callGemini(parts, apiKey, model, attempt+1, systemPrompt);
    }
    throw new Error('GEMINI '+res.status+(d?': '+d:''));
  }
  const data=await res.json();
  const cand=(data.candidates||[])[0];
  if(cand&&cand.finishReason==='SAFETY') throw new Error('GEMINI bloqueou o conteúdo (SAFETY).');
  return ((cand&&cand.content&&cand.content.parts)||[]).map(p=>p.text||'').join('\n');
}

/* 4.3c — PERFIL "EXTRATO": mesma esteira (Claude→Gemini→OCR), só troca prompt/schema.
   Diferença essencial vs. fatura: o extrato tem ENTRADA e SAÍDA. A IA devolve o
   sinal (natureza) por linha; linhas de SALDO são descartadas; datas embutidas na
   descrição ("...Ma10/06") não devem virar a data da linha. */
const STATEMENT_SYSTEM = `Você extrai movimentações de EXTRATOS de conta corrente brasileiros (conta/lançamentos — NÃO é fatura de cartão).
Responda APENAS com um array JSON válido — sem markdown, sem texto fora do array. Cada item:
{"date":"YYYY-MM-DD","desc":"descrição da linha","amount":numero_positivo,"natureza":"entrada"|"saida"}

REGRAS CRÍTICAS:
- Use SEMPRE a data no INÍCIO da linha (dd/mm/aaaa). NÃO use datas embutidas no meio/fim da descrição (ex.: em "PIX TRANSF Laís Ma10/06", o "10/06" faz parte do texto — ignore-o como data).
- "natureza" vem do SINAL do valor da movimentação: valor NEGATIVO (dinheiro saindo) => "saida"; valor POSITIVO (dinheiro entrando) => "entrada". "amount" é SEMPRE positivo, com ponto decimal.
- IGNORE por completo as linhas de SALDO: "SALDO DO DIA", "saldo em conta", "Limite da Conta…". Elas não são movimentações — o número delas é o saldo acumulado, não um lançamento.
- Em cada linha de movimentação use o valor da coluna "valor (R$)" — NUNCA o da coluna "saldo (R$)".
- IGNORE cabeçalho, rodapé, avisos legais e qualquer linha sem valor monetário.
- Não invente dados. Extraia TODAS as movimentações reais, de TODAS as páginas (extrato de semestre tem muitas).`;

function aiStatementRowToTx(r){
  const amt=Math.abs(parseMoney(r.amount)||0);
  const nat=String(r.natureza||r.tipo||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const type=(nat==='entrada'||nat==='credito'||nat==='receita'||nat==='c') ? 'receita' : 'despesa';
  return { date:r.date||todayISO(), descOrig:(r.desc||'(sem descrição)').trim(),
    amount:amt, type, confidence:0.9, installmentTotal:1 };
}

  const txt=await callClaude(content, STATEMENT_SYSTEM, apiKey, model);

// fetch com tempo-limite (evita ficar "rodando" para sempre)
async function fetchTimeout(url, opts, ms){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(), ms||30000);
  try{ return await fetch(url,{...opts,signal:ctrl.signal}); }
  catch(e){ if(e.name==='AbortError') throw new Error('GEMINI 504: tempo-limite excedido (a conexão demorou demais)'); throw e; }
  finally{ clearTimeout(t); }
}

  }, 25000);
